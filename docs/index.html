/* ========================= 2. SECOND DEGRÉ ========================= */
{
id:"second", n:2, titre:"Second degré",
sous:"La parabole et son discriminant",
desc:"Trinôme, discriminant, racines, forme factorisée, signe et inéquations.",
duree:40,
sections:[
 {titre:"Le trinôme et sa courbe", blocs:[
  {t:"idee", x:"Un **trinôme du second degré**, c'est une expression de la forme $ax^2 + bx + c$ avec $a ≠ 0$. Sa courbe s'appelle une **parabole**."},
  {t:"p", x:"Avant les formules, une question légitime : pourquoi consacrer un chapitre entier à cette forme précise ? Parce qu'elle décrit une quantité étonnante de situations réelles. La trajectoire d'un ballon lancé. L'aire d'un rectangle dont on fixe le périmètre. Le bénéfice d'une entreprise selon la quantité produite — il monte, atteint un maximum, puis redescend quand il faut trop baisser les prix. Chaque fois qu'une grandeur **passe par un maximum ou un minimum** puis repart dans l'autre sens, un trinôme est souvent derrière."},
  {t:"p", x:"C'est ce qui distingue le second degré du premier. Une fonction affine $ax + b$ monte toujours, ou descend toujours : elle ne change jamais d'avis. Un trinôme, lui, fait demi-tour une fois. Ce demi-tour, c'est le **sommet** de la parabole, et c'est presque toujours ce qu'on cherche dans un problème concret."},
  {t:"p", x:"Les trois coefficients ont chacun un rôle. Le plus important est $a$ : c'est lui qui décide de la forme générale."},
  {t:"liste", items:[
   "Si $a > 0$, la parabole est tournée vers le haut (comme un sourire). Elle a un **minimum**.",
   "Si $a < 0$, la parabole est tournée vers le bas (comme une moue). Elle a un **maximum**.",
   "Plus $|a|$ est grand, plus la parabole est resserrée."
  ]},
  {t:"figi", nom:"parabole"},
  {t:"p", x:"Prends le temps de bouger les trois curseurs, un à la fois — c'est le moyen le plus rapide de comprendre à quoi sert chaque coefficient. Fais d'abord varier **a** seul : la parabole se retourne quand il change de signe, et se resserre quand il grandit. Puis **c** seul : la courbe monte et descend en bloc, sans changer de forme, parce que $c$ est simplement la hauteur en $x = 0$. Puis **b** : c'est le plus déroutant, il déplace la parabole en biais."},
  {t:"p", x:"Surveille aussi la ligne « Δ = … » sous la figure pendant que tu bouges les curseurs. Tu verras le nombre de racines changer exactement au moment où Δ passe par zéro — c'est-à-dire quand la parabole vient effleurer l'axe horizontal. C'est toute l'idée du discriminant, vue en direct."},
  {t:"p", x:"Le point le plus bas (ou le plus haut) s'appelle le **sommet**. La parabole est symétrique par rapport à la droite verticale qui passe par ce sommet."},
  {t:"formule", titre:"Coordonnées du sommet", x:"$α = -@f{b}{2a}$ &nbsp;&nbsp;et&nbsp;&nbsp; $β = f(α)$", note:"On calcule d'abord $α$, puis on remplace dans la fonction pour trouver $β$."}
 ]},

 {titre:"Le discriminant : combien de solutions ?", blocs:[
  {t:"idee", x:"Le **discriminant** est un nombre qui répond à une seule question : combien de fois la parabole coupe-t-elle l'axe des abscisses ?"},
  {t:"p", x:"Reformulons, parce que c'est le cœur du chapitre. Résoudre $ax^2 + bx + c = 0$, c'est chercher **où la courbe passe par la hauteur zéro** — c'est-à-dire où elle croise l'axe horizontal. Or une parabole peut le croiser deux fois, l'effleurer une seule fois, ou passer complètement à côté sans jamais le toucher. Trois situations, trois nombres de solutions."},
  {t:"p", x:"Le discriminant est un **détecteur** : un seul calcul, et il dit dans lequel des trois cas on se trouve. Son nom vient d'ailleurs de là — il « discrimine », il sépare les cas. C'est pour ça qu'on le calcule toujours en premier : inutile de se lancer dans la formule des racines si on est dans le cas où il n'y en a aucune."},
  {t:"formule", titre:"Discriminant", x:"$Δ = b^2 - 4ac$", note:"Δ est la lettre grecque « delta ». On la calcule toujours en premier."},
  {t:"p", x:"D'où sort cette expression ? Elle vient de la **forme canonique**, qu'on verra plus loin : en réarrangeant $ax^2+bx+c$, on parvient à l'écrire sous une forme où tout se joue sur le signe de $b^2 - 4ac$. Tu n'as pas à savoir refaire ce calcul, mais retiens que le discriminant n'est pas une invention arbitraire : c'est ce qui reste quand on essaie d'isoler $x$."},
  {t:"tbl", head:["Valeur de $Δ$","Nombre de solutions","Ce qu'on voit"], rows:[
   ["$Δ > 0$","2 solutions","La parabole traverse l'axe en deux points"],
   ["$Δ = 0$","1 solution (double)","La parabole touche l'axe sans le traverser"],
   ["$Δ < 0$","aucune solution","La parabole ne touche jamais l'axe"]
  ]},
  {t:"formule", titre:"Les racines quand $Δ > 0$", x:"$x_1 = @f{-b - @r{Δ}}{2a}$ &nbsp;&nbsp;et&nbsp;&nbsp; $x_2 = @f{-b + @r{Δ}}{2a}$", note:"Quand $Δ = 0$, il y a une seule racine : $x_0 = -@f{b}{2a}$."},
  {t:"exemple", titre:"Exemple guidé — résoudre une équation", enonce:"Résoudre $x^2 - 2x - 3 = 0$.", etapes:[
   {q:"Identifier $a$, $b$ et $c$", r:"$a = 1$ (le coefficient devant $x^2$), $b = -2$, $c = -3$. Attention : le signe fait partie du coefficient."},
   {q:"Calculer $Δ$", r:"$Δ = b^2 - 4ac = (-2)^2 - 4 × 1 × (-3) = 4 + 12 = 16$."},
   {q:"Conclure sur le nombre de solutions", r:"$Δ = 16 > 0$ : il y a deux solutions distinctes."},
   {q:"Calculer les racines", r:"$@r{16} = 4$. Donc $x_1 = @f{2 - 4}{2} = @f{-2}{2} = -1$ et $x_2 = @f{2 + 4}{2} = @f{6}{2} = 3$."},
   {q:"Vérifier", r:"On remplace : $(-1)^2 - 2×(-1) - 3 = 1 + 2 - 3 = 0$. ✓ Et $3^2 - 2×3 - 3 = 9 - 6 - 3 = 0$. ✓"}
  ]},
  {t:"piege", titre:"Les deux erreurs de signe les plus fréquentes", x:"1. Oublier que $-4ac$ devient **plus** quand $c$ est négatif : $-4 × 1 × (-3) = +12$.<br>2. Écrire $x = @f{b ± @r{Δ}}{2a}$ au lieu de $-b$. La formule commence par **moins** $b$."},
  {t:"check", q:"Pour $2x^2 + 3x - 5$, quel est le discriminant ?",
   choix:["49","−31","9","19"], bonne:0,
   expl:["Exact : $3^2 - 4 × 2 × (-5) = 9 + 40 = 49$.",
         "Tu as calculé $9 - 40$. Mais $c = -5$ est négatif, donc $-4ac = -4 × 2 × (-5) = +40$. Deux signes moins donnent un plus.",
         "Tu as calculé $b^2$ et t'es arrêté. Il reste à retirer $4ac$.",
         "Tu as oublié le facteur $a = 2$ dans $4ac$ : $4 × 2 × 5 = 40$, pas 20."]}
 ]},

 {titre:"Factoriser et lire les racines", blocs:[
  {t:"p", x:"Une fois les racines trouvées, on peut réécrire le trinôme sous une forme beaucoup plus lisible."},
  {t:"formule", titre:"Forme factorisée (si $Δ ≥ 0$)", x:"$ax^2 + bx + c = a(x - x_1)(x - x_2)$", note:"Si $Δ = 0$ : $a(x - x_0)^2$. Si $Δ < 0$ : pas de factorisation possible."},
  {t:"p", x:"Exemple : $x^2 - 2x - 3$ a pour racines $-1$ et $3$, donc il se factorise en $(x + 1)(x - 3)$. Remarque le changement de signe : la racine $-1$ donne le facteur $(x - (-1)) = (x + 1)$."},
  {t:"piege", titre:"L'erreur de signe dans la factorisation", x:"Une racine **négative** donne un facteur avec un **plus**. Si $x_1 = -4$, le facteur est $(x + 4)$, pas $(x - 4)$. Pour vérifier : remplace $x$ par la racine, chaque facteur doit s'annuler."},
  {t:"formule", titre:"Forme canonique", x:"$ax^2 + bx + c = a(x - α)^2 + β$", note:"Avec $α$ et $β$ les coordonnées du sommet. Utile pour lire directement le minimum ou le maximum."}
 ]},

 {titre:"Le signe du trinôme", blocs:[
  {t:"idee", x:"Question typique : pour quelles valeurs de $x$ l'expression est-elle positive ? La réponse tient en une phrase — mais il vaut mieux la voir que la croire."},
  {t:"p", x:"« Le signe du trinôme » veut dire : à quelle hauteur se trouve la courbe. **Positif = au-dessus de l'axe. Négatif = en dessous.** Rien de plus. Résoudre une inéquation du second degré, c'est donc lire sur quelle portion de l'axe horizontal la parabole est au-dessus, ou en dessous."},
  {t:"fig", titre:"Le signe se lit directement sur la parabole",
   vue:[-3,-5,5,6], w:400, h:340,
   objets:[
    {t:"courbe", f:"trinome-signe", couleur:"bleu"},
    {t:"point", x:-1, y:0, nom:null, couleur:"rouge"},
    {t:"point", x:3, y:0, nom:null, couleur:"rouge"},
    {t:"texte", x:-2.1, y:3.2, txt:"positif", couleur:"vert"},
    {t:"texte", x:1, y:-2.3, txt:"négatif", couleur:"rouge"},
    {t:"texte", x:4.1, y:3.2, txt:"positif", couleur:"vert"},
    {t:"texte", x:-1, y:-0.9, txt:"−1", couleur:"rouge"},
    {t:"texte", x:3, y:-0.9, txt:"3", couleur:"rouge"}
   ],
   note:"$f(x) = x^2 - 2x - 3$, avec $a > 0$. La courbe est au-dessus de l'axe à l'extérieur des racines, en dessous entre les deux."},
  {t:"p", x:"Cette image explique la règle mieux qu'une phrase. Une parabole tournée vers le haut ne peut plonger sous l'axe **qu'entre ses deux points de traversée** : elle descend, passe dessous, remonte. Partout ailleurs elle est au-dessus. Et si elle est tournée vers le bas, c'est exactement l'inverse."},
  {t:"formule", titre:"La règle d'or", x:"Le trinôme est **du signe de $a$**, sauf entre les racines.", note:"« Signe de a partout, signe contraire à l'intérieur. »"},
  {t:"p", x:"Et quand il n'y a pas de racines ? La parabole ne traverse jamais l'axe : elle reste **entièrement d'un côté**, celui que dicte le signe de $a$. C'est un cas rassurant, pas un cas difficile — le signe est le même partout, il n'y a rien à découper."},
  {t:"tbl", head:["Cas","Signe de $ax^2+bx+c$"], rows:[
   ["$Δ < 0$","Toujours du signe de $a$, jamais nul"],
   ["$Δ = 0$","Toujours du signe de $a$, sauf en $x_0$ où il vaut 0"],
   ["$Δ > 0$","Signe de $a$ à l'extérieur des racines, signe opposé entre les deux"]
  ]},
  {t:"exemple", titre:"Exemple guidé — une inéquation", enonce:"Résoudre $x^2 - 2x - 3 < 0$.", etapes:[
   {q:"Trouver les racines", r:"On l'a déjà fait : $x_1 = -1$ et $x_2 = 3$."},
   {q:"Repérer le signe de $a$", r:"$a = 1 > 0$. Donc le trinôme est positif à l'extérieur, négatif entre les racines."},
   {q:"Répondre à la question posée", r:"On cherche là où l'expression est **négative** : c'est entre les racines."},
   {q:"Écrire la solution", r:"$S = ]-1 ; 3[$. Les crochets sont ouverts car l'inégalité est stricte ($<$ et non $≤$)."}
  ]},
  {t:"astuce", titre:"Le réflexe qui sauve", x:"En cas de doute, teste une valeur. Ici $x = 0$ donne $0 - 0 - 3 = -3 < 0$ : le zéro est bien entre $-1$ et $3$, donc c'est cohérent."}
 ]},

 {titre:"Somme et produit des racines", blocs:[
  {t:"idee", x:"Il existe un raccourci : sans calculer les racines, on connaît déjà **leur somme et leur produit**. C'est très pratique pour vérifier un résultat ou deviner des racines simples."},
  {t:"formule", titre:"Les deux relations", x:"$x_1 + x_2 = -@f{b}{a}$ &nbsp;&nbsp;et&nbsp;&nbsp; $x_1 × x_2 = @f{c}{a}$", note:"Valables dès que $Δ ≥ 0$. La somme porte un signe moins, le produit non."},
  {t:"p", x:"Reprenons $x^2 - 2x - 3$, dont les racines sont $-1$ et $3$. La somme vaut $-1 + 3 = 2$, et effectivement $-@f{b}{a} = -@f{-2}{1} = 2$. Le produit vaut $-1 × 3 = -3$, et $@f{c}{a} = -3$. ✓"},
  {t:"astuce", titre:"Deviner les racines de tête", x:"Quand $a = 1$, cherche deux nombres dont la **somme vaut $-b$** et le **produit vaut $c$**. Pour $x^2 - 7x + 12$ : somme 7, produit 12 → 3 et 4. Trouvé en trois secondes, sans discriminant."},
  {t:"exemple", titre:"Exemple guidé — retrouver une racine cachée", enonce:"On sait que $2x^2 - 10x + c = 0$ admet 1 comme racine. Trouver l'autre racine, puis $c$.", etapes:[
   {q:"Utiliser la somme", r:"$x_1 + x_2 = -@f{b}{a} = -@f{-10}{2} = 5$."},
   {q:"En déduire l'autre racine", r:"Comme $x_1 = 1$, on a $1 + x_2 = 5$, donc $x_2 = 4$."},
   {q:"Utiliser le produit", r:"$x_1 × x_2 = @f{c}{a}$, soit $1 × 4 = @f{c}{2}$."},
   {q:"Conclure", r:"$@f{c}{2} = 4$, donc $c = 8$. Le trinôme est $2x^2 - 10x + 8$."},
   {q:"Vérification", r:"$2 × 1 - 10 + 8 = 0$ ✓ et $2 × 16 - 40 + 8 = 0$ ✓."}
  ]},
  {t:"piege", titre:"Le signe de la somme", x:"C'est $-@f{b}{a}$, avec un moins. Pour $x^2 - 5x + 6$, la somme des racines vaut $+5$ et non $-5$ : les racines sont 2 et 3."}
 ]},

 {titre:"Récapitulatif : un seul réflexe, calculer Δ", blocs:[
  {t:"idee", x:"Presque tout ce chapitre part du même geste : **identifier $a$, $b$, $c$, puis calculer le discriminant**. Ce qui vient ensuite dépend de la question, mais le point de départ ne change jamais."},
  {t:"p", x:"La première erreur, avant tout calcul, c'est de mal lire les coefficients. Rappelle-toi que **le signe fait partie du coefficient** : dans $2x^2 - 7x + 3$, on a $b = -7$, pas 7. Et quand un terme manque, son coefficient vaut zéro : dans $x^2 - 4$, on a $b = 0$ et $c = -4$. Écris les trois valeurs sur une ligne à part avant de te lancer — dix secondes qui évitent la moitié des erreurs."},
  {t:"tbl", head:["La question ressemble à…","Ce qu'il faut faire"], rows:[
   ["« Résoudre $ax^2+bx+c = 0$ »","$Δ$, puis $@f{-b ± @r{Δ}}{2a}$ si $Δ ≥ 0$"],
   ["« Combien de solutions ? »","$Δ$ seul, et son signe. On s'arrête là."],
   ["« Factoriser »","Les racines, puis $a(x - x_1)(x - x_2)$"],
   ["« Résoudre une inéquation »","Les racines, puis la règle du signe de $a$"],
   ["« Maximum ou minimum »","$α = -@f{b}{2a}$, puis $f(α)$ pour la valeur"],
   ["« Une racine est donnée, trouver l'autre »","Somme ou produit des racines"],
   ["Un problème concret (aire, bénéfice…)","Traduire en trinôme, puis chercher le sommet"]
  ]},
  {t:"astuce", titre:"Les contrôles qui rattrapent presque tout", x:"**Remplace tes racines dans l'équation.** Si tu ne tombes pas sur 0, elles sont fausses. Ce test est infaillible et prend vingt secondes.<br><br>**Vérifie le signe de $Δ$ avant de prendre une racine carrée.** Si $Δ$ est négatif, il n'y a rien à extraire : la réponse est « aucune solution », et c'est une réponse complète.<br><br>**Regarde si le résultat est plausible.** Une aire négative, une quantité produite négative, un temps négatif : dans un problème concret, ces réponses sont à écarter même si le calcul est juste."},
  {t:"piege", titre:"Les trois erreurs les plus fréquentes", x:"**1. Le double signe moins.** $-4ac$ devient **plus** quand $a$ ou $c$ est négatif. $-4 × 1 × (-3) = +12$.<br>**2. Le $-b$ oublié.** La formule commence par $-b$ : si $b = -5$, alors $-b = +5$.<br>**3. Le signe dans la factorisation.** Une racine négative donne un facteur avec un plus : $x_1 = -4$ donne $(x + 4)$."},
  {t:"p", x:"Enfin, un conseil de méthode. Ce chapitre récompense la lenteur. Les erreurs ne viennent presque jamais d'une incompréhension — elles viennent de signes recopiés trop vite. Écris chaque étape sur sa propre ligne, garde les parenthèses autour des nombres négatifs, et ne fais jamais deux calculs de tête à la suite."}
 ]}
],
exos:[
 {id:"sd1", niveau:1, type:"num", enonce:"Calculer le discriminant de $x^2 - 5x + 6$.",
  rep:1,
  diag:[{v:49, m:"Tu as calculé $25 + 24$. Mais ici $c = +6$ est positif, donc $-4ac = -4 × 1 × 6 = -24$. On **retire** 24."},
        {v:-1, m:"Erreur de signe : $b^2$ vaut toujours un nombre positif. $(-5)^2 = +25$, pas $-25$. Un carré ne peut pas être négatif."},
        {v:25, m:"Tu t'es arrêté à $b^2$. La formule complète est $Δ = b^2 - 4ac$ : il reste à retirer $4 × 1 × 6 = 24$."}],
  corr:["**Étape 1 — écrire les trois coefficients à part.** $a = 1$ (rien devant $x^2$ signifie 1), $b = -5$ (**le signe moins en fait partie**), $c = 6$. Cette ligne écrite noir sur blanc évite la majorité des erreurs de ce chapitre.",
        "**Étape 2 — recopier la formule avant de calculer.** $Δ = b^2 - 4ac$. Puis je remplace en gardant les parenthèses : $Δ = (-5)^2 - 4 × 1 × 6$. Les parenthèses autour de $-5$ ne sont pas décoratives : sans elles, on écrit $-5^2$ qui vaut $-25$.",
        "**Étape 3 — les deux morceaux séparément.** $(-5)^2 = 25$ : un carré est toujours positif, le moins disparaît. Et $4 × 1 × 6 = 24$.",
        "**Étape 4 — assembler.** $Δ = 25 - 24 = 1$.",
        "**Ce que ce résultat annonce.** $Δ = 1 > 0$, donc il y aura deux solutions distinctes. Et comme $@r{1} = 1$ tombe juste, les racines seront des nombres simples — ici 2 et 3."],
  indice:"$Δ = b^2 - 4ac$. Fais bien attention : $(-5)^2$ est positif."},

 {id:"sd2", niveau:1, type:"qcm", enonce:"L'équation $x^2 + x + 3 = 0$ admet :",
  choix:["aucune solution réelle","deux solutions","une solution double","trois solutions"], bonne:0,
  diag:["", "Le discriminant vaut $1 - 12 = -11$, il est **négatif** : la parabole ne coupe jamais l'axe des abscisses, donc pas de solution.",
        "Une solution double correspondrait à $Δ = 0$. Ici $Δ = -11 ≠ 0$.",
        "Une équation du second degré ne peut jamais avoir plus de deux solutions : c'est le degré qui limite le nombre de racines."],
  corr:["$a = 1$, $b = 1$, $c = 3$.","$Δ = 1^2 - 4 × 1 × 3 = 1 - 12 = -11$.","$Δ < 0$ : l'équation n'a aucune solution dans les réels."],
  indice:"Calcule $Δ$ et regarde uniquement son signe."},

 {id:"sd3", niveau:2, type:"qcm", enonce:"Les racines de $x^2 - 2x - 3$ sont $-1$ et $3$. Sa forme factorisée est :",
  choix:["$(x + 1)(x - 3)$","$(x - 1)(x + 3)$","$(x - 1)(x - 3)$","$(x + 1)(x + 3)$"], bonne:0,
  diag:["", "Tu as inversé les signes. La formule est $a(x - x_1)(x - x_2)$ : avec $x_1 = -1$ cela donne $(x - (-1)) = (x + 1)$.",
        "Tu as recopié les racines telles quelles. Mais la racine $-1$ donne le facteur $(x + 1)$, car $x - (-1) = x + 1$.",
        "Vérifie en remplaçant $x$ par 3 : $(3+1)(3+3) = 24 ≠ 0$. Or 3 est une racine, donc le produit devrait s'annuler."],
  corr:["Forme factorisée : $a(x - x_1)(x - x_2)$ avec $a = 1$.","Pour $x_1 = -1$ : le facteur est $x - (-1) = x + 1$.","Pour $x_2 = 3$ : le facteur est $x - 3$.","Donc $x^2 - 2x - 3 = (x + 1)(x - 3)$."],
  indice:"Chaque facteur doit s'annuler quand on remplace $x$ par la racine correspondante. Teste ta réponse !"},

 {id:"sd4", niveau:2, type:"num", enonce:"Quelle est la plus grande racine de $2x^2 - 7x + 3 = 0$ ?",
  rep:3,
  diag:[{v:0.5, m:"C'est bien une racine, mais c'est la **plus petite**. La question demande la plus grande : $x = 3$."},
        {v:1.75, m:"Tu as calculé $@f{7}{4} = -@f{b}{2a}$ : c'est l'abscisse du sommet, pas une racine. Il faut ajouter et retirer $@r{Δ}$."},
        {v:-3, m:"Erreur de signe : la formule commence par $-b$, et ici $b = -7$, donc $-b = +7$."}],
  corr:["$a = 2$, $b = -7$, $c = 3$.","$Δ = 49 - 4 × 2 × 3 = 49 - 24 = 25$, donc $@r{Δ} = 5$.","$x_1 = @f{7 - 5}{4} = @f{2}{4} = 0{,}5$ et $x_2 = @f{7 + 5}{4} = @f{12}{4} = 3$.","La plus grande racine est 3."],
  indice:"Calcule les deux racines avec $@f{-b ± @r{Δ}}{2a}$, puis compare-les."},

 {id:"sd5", niveau:2, type:"qcm", enonce:"Pour quelles valeurs de $x$ a-t-on $x^2 - 4 > 0$ ?",
  choix:["$x < -2$ ou $x > 2$","$-2 < x < 2$","$x > 2$ seulement","tous les réels"], bonne:0,
  diag:["", "Tu as pris l'intérieur. Comme $a = 1 > 0$, le trinôme est **positif à l'extérieur** des racines et négatif entre elles. Tu as décrit l'ensemble où l'expression est négative.",
        "Tu as oublié la moitié gauche. Pour $x = -3$ : $9 - 4 = 5 > 0$, donc $-3$ convient aussi. La parabole remonte des deux côtés.",
        "Pour $x = 0$ : $0 - 4 = -4$, qui n'est pas positif. Donc tous les réels ne conviennent pas."],
  corr:["$x^2 - 4 = 0$ donne $x^2 = 4$, donc $x = -2$ ou $x = 2$.","Ici $a = 1 > 0$ : le trinôme est positif à l'extérieur des racines.","$S = ]-∞ ; -2[ ∪ ]2 ; +∞[$."],
  indice:"Trouve d'abord les racines, puis applique : signe de $a$ à l'extérieur, signe contraire à l'intérieur."},

 {id:"sd6", niveau:3, type:"num", enonce:"La fonction $f(x) = x^2 - 6x + 5$ admet un minimum. Pour quelle valeur de $x$ est-il atteint ?",
  rep:3,
  diag:[{v:-3, m:"Erreur de signe : $α = -@f{b}{2a}$ avec $b = -6$, donc $α = -@f{-6}{2} = +3$. Le moins de la formule annule le moins de $b$."},
        {v:-4, m:"Tu as donné la valeur du minimum ($β = f(3) = -4$), pas l'endroit où il est atteint. La question porte sur $x$."},
        {v:6, m:"Tu as oublié de diviser par $2a$. La formule est $α = -@f{b}{2a}$, donc ici $@f{6}{2} = 3$."}],
  corr:["Le minimum est atteint au sommet, en $α = -@f{b}{2a}$.","$a = 1$ et $b = -6$.","$α = -@f{-6}{2 × 1} = @f{6}{2} = 3$.","Le minimum est atteint en $x = 3$ (et il vaut $f(3) = 9 - 18 + 5 = -4$)."],
  indice:"L'abscisse du sommet vaut $-@f{b}{2a}$. Attention au double signe moins."},

 {id:"sd7", niveau:3, type:"num", enonce:"Un rectangle a un périmètre de 20 cm. Quelle est son aire maximale, en cm² ?",
  rep:25, unite:"cm²",
  diag:[{v:100, m:"Tu as pris un côté de 10 cm. Mais si le périmètre vaut 20, alors longueur + largeur $= 10$, et non chaque côté $= 10$."},
        {v:24, m:"Tu es proche : $6 × 4 = 24$. Mais l'aire maximale est atteinte pour le **carré**, donc $5 × 5 = 25$."},
        {v:20, m:"Tu as repris le périmètre. L'aire est un produit de deux longueurs, pas la somme des quatre côtés."}],
  corr:["**Étape 1 — nommer l'inconnue.** Un problème concret commence toujours là. J'appelle $x$ la largeur du rectangle. C'est mon choix, il faut juste s'y tenir jusqu'au bout.",
        "**Étape 2 — exprimer l'autre dimension avec la même lettre.** Le périmètre vaut 20, donc $2 × (largeur + longueur) = 20$, soit $largeur + longueur = 10$. Si la largeur est $x$, la longueur est donc $10 - x$. C'est l'étape clé : **une seule inconnue au lieu de deux**.",
        "**Étape 3 — écrire ce qu'on veut maximiser.** L'aire d'un rectangle est le produit des deux dimensions : $A(x) = x(10 - x)$. Je développe pour reconnaître un trinôme : $A(x) = -x^2 + 10x$.",
        "**Étape 4 — reconnaître la situation.** Ici $a = -1$, donc négatif : la parabole est tournée vers le bas et possède un **maximum**. C'est bien ce qu'on cherche.",
        "**Étape 5 — trouver où ce maximum se produit.** $α = -@f{b}{2a} = -@f{10}{2 × (-1)} = -@f{10}{-2} = 5$. Attention au double signe moins : il donne un résultat positif.",
        "**Étape 6 — calculer la valeur du maximum.** La question demande l'aire, pas la largeur : il faut donc calculer $A(5) = 5 × (10 - 5) = 5 × 5 = 25$ cm².",
        "**Interprétation.** La largeur et la longueur valent toutes deux 5 : le rectangle d'aire maximale à périmètre fixé est le **carré**. C'est un résultat qu'il vaut la peine de retenir, il revient souvent."],
  indice:"Appelle $x$ la largeur, exprime la longueur en fonction de $x$, puis écris l'aire. Tu obtiendras un trinôme."},

 {id:"sd8", niveau:3, type:"qcm", enonce:"Une parabole a pour équation $y = -2x^2 + 5x + 1$. Que peut-on affirmer ?",
  choix:["Elle est tournée vers le bas et admet un maximum","Elle est tournée vers le haut et admet un minimum","Elle ne coupe jamais l'axe des abscisses","Son sommet est en $x = 5$"], bonne:0,
  diag:["", "Le coefficient $a$ vaut $-2$, il est **négatif** : la parabole est tournée vers le bas. C'est toujours le signe de $a$ qui décide.",
        "$Δ = 25 - 4 × (-2) × 1 = 25 + 8 = 33 > 0$ : elle coupe l'axe en deux points.",
        "Le sommet est en $α = -@f{b}{2a} = -@f{5}{-4} = 1{,}25$. Le 5 est le coefficient $b$, pas l'abscisse du sommet."],
  corr:["Le sens d'ouverture ne dépend que de $a$.","Ici $a = -2 < 0$.","La parabole est donc tournée vers le bas, et son sommet est un maximum."],
  indice:"Un seul coefficient décide de l'orientation de la parabole. Lequel ?"},

 {id:"sd9", niveau:2, type:"num", enonce:"Les racines de $x^2 - 9x + 20$ sont deux entiers. Quelle est leur somme ?",
  rep:9,
  diag:[{v:-9, m:"Erreur de signe : la somme vaut $-@f{b}{a}$, et ici $b = -9$, donc $-@f{-9}{1} = +9$."},
        {v:20, m:"20 est le **produit** des racines ($@f{c}{a}$), pas leur somme."},
        {v:4, m:"4 est une des deux racines. La question demande leur somme, soit $4 + 5 = 9$."}],
  corr:["Relation : $x_1 + x_2 = -@f{b}{a}$.","Ici $a = 1$ et $b = -9$.","$-@f{-9}{1} = 9$.","(Les racines sont d'ailleurs 4 et 5, dont le produit vaut bien 20.)"],
  indice:"Pas besoin de calculer les racines : la somme se lit directement sur $a$ et $b$."},

 {id:"sd10", niveau:3, type:"num", enonce:"L'équation $3x^2 + bx - 12 = 0$ admet 2 comme racine. Quelle est l'autre racine ?",
  rep:-2,
  diag:[{v:2, m:"Ce serait une racine double, mais alors le produit vaudrait 4, or il vaut $@f{-12}{3} = -4$. L'autre racine est donc négative."},
        {v:-4, m:"Tu as pris directement le produit $-4$ comme réponse. Or le produit vaut $x_1 × x_2 = -4$ avec $x_1 = 2$, donc $x_2 = @f{-4}{2} = -2$."},
        {v:-6, m:"Tu as sans doute divisé $-12$ par 2. Il faut d'abord ramener le produit à $@f{c}{a} = @f{-12}{3} = -4$."}],
  corr:["Relation du produit : $x_1 × x_2 = @f{c}{a} = @f{-12}{3} = -4$.","On sait que $x_1 = 2$.","$2 × x_2 = -4$.","$x_2 = -2$."],
  indice:"Le produit des racines vaut $@f{c}{a}$. Une des deux racines est connue."}
]
}
]);
</script>
<script>
window.COURS = (window.COURS || []).concat([

/* =========================== 3. DÉRIVATION =========================== */
{
id:"derivee", n:3, titre:"Dérivation",
sous:"Mesurer la pente en un point",
desc:"Nombre dérivé, tangente, formules de dérivation et étude des variations.",
duree:45,
sections:[
 {titre:"L'idée : mesurer une pente", blocs:[
  {t:"idee", x:"La dérivée répond à une question simple : **à quelle vitesse la courbe monte-t-elle à cet endroit précis ?**"},
  {t:"p", x:"Commençons par le problème qu'elle résout, sinon la suite paraît gratuite. Tu sais déjà mesurer une **vitesse moyenne** : 120 km parcourus en 2 heures, cela fait 60 km/h. Mais cette moyenne cache tout. Tu as pu rouler à 90 sur autoroute, t'arrêter à un péage, ralentir en ville. La question « quelle était ma vitesse **à l'instant précis** où je passais devant l'église ? » n'a pas de réponse avec une simple moyenne : à un instant précis, le temps écoulé est nul, et on ne peut pas diviser par zéro."},
  {t:"p", x:"C'est exactement le problème que la dérivée résout. L'idée : au lieu de mesurer sur deux heures, mesure sur une minute. Puis sur une seconde. Puis sur un centième de seconde. La valeur trouvée se stabilise autour d'un nombre — et **ce nombre-là est la vitesse instantanée**. La dérivée, c'est ce procédé appliqué à n'importe quelle courbe : on regarde ce qui se passe sur un intervalle qu'on rétrécit jusqu'à le rendre presque nul."},
  {t:"p", x:"Sur une route, une pente de 10 % veut dire : quand j'avance de 100 m, je monte de 10 m. En maths, c'est pareil : on compare ce que $f(x)$ gagne en hauteur à ce que $x$ parcourt en largeur."},
  {t:"formule", titre:"Taux de variation entre deux points", x:"$@f{f(b) - f(a)}{b - a}$", note:"C'est la pente moyenne de la courbe entre $a$ et $b$."},
  {t:"p", x:"Lis cette fraction comme une division très concrète : **ce qu'on a gagné en hauteur, divisé par ce qu'on a parcouru en largeur**. En haut, $f(b) - f(a)$ : la différence d'altitude entre les deux points. En bas, $b - a$ : la distance horizontale franchie. Le résultat est une pente, exactement comme les 10 % d'un panneau routier."},
  {t:"p", x:"Le problème : cette pente est une **moyenne** sur un intervalle. Pour connaître la pente en un point précis, on rapproche $b$ de $a$ jusqu'à ce qu'ils se touchent presque. Le nombre vers lequel on tend s'appelle le **nombre dérivé**, noté $f'(a)$."},
  {t:"figi", nom:"secante"},
  {t:"p", x:"Manipule le curseur avant de continuer, c'est le passage le plus important du chapitre. Tant que $B$ est loin de $A$, la droite rouge traverse la courbe en deux points : c'est une **sécante**, et sa pente n'est qu'une moyenne grossière. À mesure que $B$ se rapproche, la droite bascule et finit par épouser la courbe. Elle devient la **tangente**."},
  {t:"p", x:"Ce basculement est toute l'idée de la dérivation. On ne peut pas calculer directement une pente en un seul point — il faudrait diviser par zéro. Alors on calcule une pente sur un petit intervalle, puis on rétrécit l'intervalle et on regarde vers quel nombre le résultat **se stabilise**. Ce nombre-là existe, même si le calcul direct est impossible."},
  {t:"p", x:"Mettons des chiffres dessus, avec $f(x) = x^2$ au point $a = 1$. On calcule la pente entre $1$ et $1 + h$, pour des $h$ de plus en plus petits :"},
  {t:"tbl", head:["écart $h$","de $1$ à $1+h$","pente obtenue"], rows:[
   ["1","de 1 à 2","3"],
   ["0,5","de 1 à 1,5","2,5"],
   ["0,1","de 1 à 1,1","2,1"],
   ["0,01","de 1 à 1,01","2,01"],
   ["0,001","de 1 à 1,001","2,001"],
   ["→ 0","→ en 1 seul point","**2**"]
  ]},
  {t:"p", x:"Regarde la dernière colonne descendre : 3, puis 2,5, puis 2,1, puis 2,01… Les valeurs se resserrent autour de **2**, sans jamais tout à fait l'atteindre. On dit que la pente **tend vers 2**, et on écrit $f'(1) = 2$. C'est ce que la formule de dérivation $(x^2)' = 2x$ donnera en une seconde — mais tu sais maintenant ce que ce 2 signifie et d'où il sort."},
  {t:"astuce", titre:"Pourquoi on n'écrit jamais $h = 0$", x:"Avec $h = 0$, la fraction devient $@f{0}{0}$ : elle n'a aucun sens. C'est précisément pour contourner cet obstacle qu'on a inventé la notion de limite. On ne pose jamais $h = 0$ ; on regarde ce qui se passe **quand $h$ s'en approche**. La nuance paraît subtile, mais c'est elle qui rend tout le calcul différentiel possible."},
  {t:"formule", titre:"Nombre dérivé", x:"$f'(a) = lim_{h → 0} @f{f(a + h) - f(a)}{h}$", note:"Autrement dit : la pente moyenne entre $a$ et un point tout proche, quand ce point se colle à $a$. En pratique on n'utilise presque jamais cette limite : on applique les formules du tableau plus bas."},
  {t:"astuce", titre:"Traduction en français", x:"$f'(a)$ est un nombre. C'est la pente de la courbe au point d'abscisse $a$. Positif = ça monte. Négatif = ça descend. Nul = c'est plat (sommet ou creux)."},
  {t:"figi", nom:"tangente"},
  {t:"p", x:"Déplace le point $A$ le long de la courbe et regarde la droite rouge : c'est la tangente. Elle change d'inclinaison à mesure que $A$ se déplace, et le nombre $f'(a)$ affiché en dessous suit exactement cette inclinaison."},
  {t:"p", x:"Trois moments valent la peine d'être observés. Quand $A$ est **à gauche**, la courbe descend et la tangente penche vers le bas : $f'(a)$ est négatif. Quand $A$ est **à droite**, la courbe monte et $f'(a)$ devient positif. Et exactement **au creux**, la tangente devient horizontale : $f'(a) = 0$. C'est ce moment précis qu'on cherchera pour trouver un minimum ou un maximum — et c'est pour ça qu'on résoudra l'équation $f'(x) = 0$."},
  {t:"piege", titre:"Deux nombres à ne pas mélanger", x:"Sur la figure, la ligne du bas affiche deux valeurs différentes pour le même point : la **hauteur** $f(a)$ et la **pente** $f'(a)$. Un point haut peut avoir une pente nulle, un point bas une pente énorme. Ces deux nombres ne se déduisent pas l'un de l'autre."}
 ]},

 {titre:"La tangente", blocs:[
  {t:"p", x:"La **tangente** en un point est la droite qui « épouse » la courbe à cet endroit. Sa pente (son coefficient directeur) est exactement $f'(a)$."},
  {t:"formule", titre:"Équation de la tangente au point d'abscisse $a$", x:"$y = f'(a)(x - a) + f(a)$", note:"Trois ingrédients : le nombre dérivé $f'(a)$, l'abscisse $a$, et l'ordonnée $f(a)$."},
  {t:"exemple", titre:"Exemple guidé — écrire une tangente", enonce:"Soit $f(x) = x^2$. Déterminer l'équation de la tangente à la courbe au point d'abscisse $a = 3$.", etapes:[
   {q:"Calculer $f(a)$", r:"$f(3) = 3^2 = 9$. Le point de contact est donc $(3 ; 9)$."},
   {q:"Calculer la dérivée", r:"La dérivée de $x^2$ est $2x$, donc $f'(x) = 2x$."},
   {q:"Calculer $f'(a)$", r:"$f'(3) = 2 × 3 = 6$. La pente de la tangente vaut 6."},
   {q:"Assembler", r:"$y = 6(x - 3) + 9$, soit $y = 6x - 18 + 9 = 6x - 9$."},
   {q:"Contrôle", r:"Pour $x = 3$ : $y = 18 - 9 = 9$. La droite passe bien par le point de contact. ✓"}
  ]},
  {t:"piege", titre:"Ne pas confondre", x:"$f(a)$ est la **hauteur** de la courbe. $f'(a)$ est sa **pente**. Ce sont deux nombres différents, calculés avec deux expressions différentes. Beaucoup d'élèves remplacent $a$ dans la mauvaise formule."}
 ]},

 {titre:"Le tableau des dérivées à connaître", blocs:[
  {t:"tbl", head:["Fonction $f(x)$","Dérivée $f'(x)$","Exemple"], rows:[
   ["$k$ (un nombre)","$0$","$f(x)=7$ → $f'(x)=0$"],
   ["$x$","$1$","—"],
   ["$x^2$","$2x$","—"],
   ["$x^3$","$3x^2$","—"],
   ["$x^n$","$n x^{n-1}$","$x^5$ → $5x^4$"],
   ["$@f{1}{x}$","$-@f{1}{x^2}$","défini pour $x ≠ 0$"],
   ["$@r{x}$","$@f{1}{2@r{x}}$","défini pour $x > 0$"]
  ]},
  {t:"astuce", titre:"La règle de la puissance en une phrase", x:"L'exposant descend en facteur devant, et il diminue de 1. Exemple : $x^7$ → $7x^6$."},
  {t:"p", x:"Vérifions cette règle sur le cas qu'on vient de calculer à la main. Pour $f(x) = x^2$, elle annonce $f'(x) = 2x$, donc $f'(1) = 2$. C'est exactement le nombre vers lequel le tableau des pentes convergeait. **La formule n'est qu'un raccourci** : elle donne d'un coup ce qu'on obtenait péniblement en rétrécissant l'intervalle."},
  {t:"p", x:"C'est important de le voir une fois, sinon les formules de dérivation ressemblent à des règles arbitraires tombées du ciel. Elles ont toutes été établies de cette façon, par le calcul de la limite, une bonne fois pour toutes. On les utilise ensuite sans les redémontrer — comme on utilise une table de multiplication sans recompter."},
  {t:"formule", titre:"Les opérations", x:"$(u + v)' = u' + v'$<br>$(k u)' = k u'$<br>$(uv)' = u'v + uv'$<br>$(@f{u}{v})' = @f{u'v - uv'}{v^2}$", note:"Le produit et le quotient sont au programme ; leur forme se retient par répétition."},
  {t:"exemple", titre:"Exemple guidé — dériver un polynôme", enonce:"Dériver $f(x) = 3x^3 - 5x^2 + 4x - 7$.", etapes:[
   {q:"Traiter chaque morceau séparément", r:"La dérivée d'une somme est la somme des dérivées : je dérive terme par terme."},
   {q:"$3x^3$", r:"L'exposant 3 descend : $3 × 3x^{2} = 9x^2$."},
   {q:"$-5x^2$", r:"$-5 × 2x = -10x$. Le signe moins reste."},
   {q:"$4x$", r:"La dérivée de $x$ est 1, donc celle de $4x$ est 4."},
   {q:"$-7$", r:"C'est une constante : sa dérivée est 0. Une constante ne fait pas varier la pente."},
   {q:"Réponse", r:"$f'(x) = 9x^2 - 10x + 4$."}
  ]},
  {t:"piege", titre:"L'erreur la plus fréquente", x:"Oublier que la dérivée d'un nombre seul est **zéro**, et recopier le $-7$ dans la réponse. Une constante décale la courbe vers le haut ou vers le bas sans jamais changer sa pente."},
  {t:"check", q:"Quelle est la dérivée de $f(x) = 4x^2 + 9$ ?",
   choix:["$8x$","$8x + 9$","$4x + 9$","$8x^2$"], bonne:0,
   expl:["Exact : $4 × 2x = 8x$, et la dérivée de 9 vaut 0.",
         "Tu as recopié le $+9$. Mais 9 est une constante, sa dérivée est 0 : elle disparaît.",
         "Tu as oublié de faire descendre l'exposant. La dérivée de $x^2$ est $2x$, donc celle de $4x^2$ est $8x$.",
         "Tu as multiplié le coefficient sans baisser l'exposant. Il doit passer de 2 à 1."]}
 ]},

 {titre:"Du signe de la dérivée aux variations", blocs:[
  {t:"idee", x:"C'est ici que la dérivée devient vraiment utile : **le signe de $f'$ donne les variations de $f$**, sans avoir besoin de tracer la courbe."},
  {t:"formule", titre:"Le lien fondamental", x:"$f' > 0$ sur un intervalle → $f$ est **croissante**<br>$f' < 0$ sur un intervalle → $f$ est **décroissante**<br>$f'$ s'annule en changeant de signe → **extremum** (max ou min)"},
  {t:"p", x:"Ce lien mérite qu'on s'y arrête, parce que c'est lui qui rend la dérivée utile. Relis les trois lignes : à gauche, on parle du **signe** d'une expression — un simple calcul. À droite, on parle de la **forme** d'une courbe — quelque chose de visuel. La dérivée fait le pont entre les deux. Elle permet de décrire l'allure d'une courbe qu'on n'a jamais tracée."},
  {t:"p", x:"L'intuition est directe si tu penses à une marche. Ta pente est positive : tu montes. Négative : tu descends. Nulle : tu es sur un replat — et si juste avant tu montais et juste après tu descends, ce replat est un **sommet**. C'est tout le contenu du troisième point : un extremum se trouve là où la pente s'annule **en changeant de signe**."},
  {t:"piege", titre:"S'annuler ne suffit pas", x:"La dérivée peut s'annuler sans qu'il y ait de maximum ni de minimum. Pour $f(x) = x^3$ en $x = 0$, la pente vaut zéro — la courbe fait une pause — mais elle continue de monter juste après. C'est un simple palier, pas un sommet.<br><br>Ce qui fait l'extremum, ce n'est pas l'annulation : c'est le **changement de signe** de part et d'autre. Regarde toujours ce qui se passe avant et après, pas seulement au point."},
  {t:"exemple", titre:"Exemple guidé — étude complète", enonce:"Étudier les variations de $f(x) = x^2 - 6x + 5$ sur ℝ.", etapes:[
   {q:"Dériver", r:"$f'(x) = 2x - 6$."},
   {q:"Chercher où la dérivée s'annule", r:"$2x - 6 = 0$ donne $2x = 6$, donc $x = 3$."},
   {q:"Étudier le signe de $f'$", r:"$2x - 6$ est une fonction affine croissante : elle est négative avant 3, positive après 3."},
   {q:"Traduire en variations", r:"$f$ est décroissante sur $]-∞ ; 3]$, puis croissante sur $[3 ; +∞[$."},
   {q:"Conclure", r:"$f$ admet un minimum en $x = 3$, qui vaut $f(3) = 9 - 18 + 5 = -4$."}
  ]},
  {t:"astuce", titre:"Méthode en 4 temps, toujours la même", x:"1. Je dérive. 2. Je résous $f'(x) = 0$. 3. J'étudie le signe de $f'$. 4. J'en déduis le tableau de variations. Cette suite d'étapes marche pour n'importe quelle fonction du programme."},
  {t:"plot", f:"x*x-6*x+5", xmin:-1, xmax:7, titre:"Courbe de $f(x) = x^2 - 6x + 5$", note:"Le creux se situe bien en $x = 3$, là où la dérivée s'annule."}
 ]},

 {titre:"Construire un tableau de variations", blocs:[
  {t:"idee", x:"Le tableau de variations est le **résumé complet** d'une fonction : en trois lignes, il dit tout ce qu'il faut savoir de son allure, sans avoir tracé la courbe."},
  {t:"p", x:"C'est l'aboutissement du chapitre, et l'exercice le plus fréquent en contrôle. Beaucoup d'élèves savent dériver mais butent au moment de présenter le résultat — non par manque de compréhension, mais parce que personne ne leur a montré **la structure du tableau**. La voici."},
  {t:"formule", titre:"Les trois lignes, toujours les mêmes", x:"Ligne 1 : les valeurs de $x$, dans l'ordre croissant<br>Ligne 2 : le signe de $f'(x)$ sur chaque morceau<br>Ligne 3 : les flèches de $f$, montantes ou descendantes", note:"La ligne 2 commande la ligne 3 : un « + » donne une flèche qui monte, un « − » une flèche qui descend."},
  {t:"p", x:"Le point à comprendre, c'est que **les deux dernières lignes disent la même chose de deux façons**. La ligne du signe est le résultat d'un calcul ; la ligne des flèches en est la traduction visuelle. Si tu écris un « + » et une flèche descendante juste en dessous, c'est nécessairement une erreur."},
  {t:"exemple", titre:"Exemple guidé — le tableau complet, étape par étape", enonce:"Dresser le tableau de variations de $f(x) = x^2 - 6x + 5$ sur ℝ.", etapes:[
   {q:"Étape 1 — dériver", r:"$f'(x) = 2x - 6$. C'est une fonction affine, donc son signe sera simple à étudier."},
   {q:"Étape 2 — chercher où la dérivée s'annule", r:"$2x - 6 = 0$ donne $2x = 6$, donc $x = 3$. C'est **la valeur charnière** : c'est là que la fonction va changer de sens. Elle servira de colonne centrale au tableau."},
   {q:"Étape 3 — déterminer le signe de $f'$ de part et d'autre", r:"$f'$ est affine avec un coefficient directeur positif ($+2$) : elle monte, donc elle est négative avant 3 et positive après. En cas de doute, teste une valeur : $f'(0) = -6 < 0$ ✓ et $f'(5) = 4 > 0$ ✓."},
   {q:"Étape 4 — dessiner le tableau", r:"Colonnes : $-∞$, puis 3, puis $+∞$. Ligne du signe de $f'$ : « − » à gauche de 3, un zéro en dessous de 3, « + » à droite. Ligne de $f$ : une flèche qui descend, puis une flèche qui monte."},
   {q:"Étape 5 — calculer la valeur au point charnière", r:"Le tableau doit indiquer la hauteur du creux : $f(3) = 9 - 18 + 5 = -4$. C'est cette valeur qu'on écrit au bas du « V » formé par les deux flèches. **Ne l'oublie pas** : un tableau sans elle est incomplet."},
   {q:"Lecture finale", r:"$f$ décroît sur $]-∞ ; 3]$, croît sur $[3 ; +∞[$, et admet un **minimum** valant $-4$, atteint en $x = 3$. Compare avec la courbe juste au-dessus : le creux est bien à cet endroit et à cette hauteur."}
  ]},
  {t:"astuce", titre:"Le sens de la flèche se lit sur le signe", x:"Un doute permanent chez les élèves : « la flèche monte ou descend ? » La règle ne varie jamais — **le signe de $f'$ commande**. « + » sous la colonne, flèche montante. « − », flèche descendante. Le zéro de $f'$ marque le sommet ou le creux, là où les deux flèches se rejoignent."},
  {t:"piege", titre:"Deux oublis classiques", x:"**Les bornes.** Si l'énoncé demande le tableau sur $[0 ; 10]$ et non sur ℝ, les colonnes extrêmes sont 0 et 10, pas $-∞$ et $+∞$. Et il faut alors calculer $f(0)$ et $f(10)$ pour compléter les extrémités des flèches.<br><br>**Les valeurs aux extrémités.** Un tableau où les flèches ne portent aucun nombre ne vaut presque rien : c'est justement ces valeurs qui permettent de répondre à « quel est le maximum ? »."},
  {t:"p", x:"Une dernière remarque de méthode. Quand la dérivée est un trinôme du second degré — ce qui arrive dès que $f$ est de degré 3 — son signe s'étudie avec le chapitre du second degré : discriminant, racines, puis la règle « du signe de $a$ sauf entre les racines ». Les deux chapitres se combinent constamment, et c'est ce qui rend les exercices de fin d'année plus longs, mais pas plus difficiles."}
 ]},

 {titre:"Produits, quotients, inverses et racines", blocs:[
  {t:"p", x:"Jusqu'ici on n'a dérivé que des sommes. Voici les trois autres situations du programme, dans l'ordre où elles reviennent en contrôle."},
  {t:"formule", titre:"Produit", x:"$(uv)' = u'v + uv'$", note:"On dérive le premier en gardant le second, **plus** le premier en dérivant le second."},
  {t:"formule", titre:"Quotient", x:"$@f{u}{v}$ a pour dérivée $@f{u'v - uv'}{v^2}$", note:"Attention : un **moins** au numérateur, et l'ordre compte. Le dénominateur est mis au carré."},
  {t:"formule", titre:"Inverse et racine", x:"$@f{1}{x}$ → $-@f{1}{x^2}$ &nbsp;&nbsp;·&nbsp;&nbsp; $@r{x}$ → $@f{1}{2@r{x}}$", note:"L'inverse est défini pour $x ≠ 0$, la racine pour $x > 0$ (et sa dérivée pour $x > 0$ strictement)."},
  {t:"astuce", titre:"Retenir le quotient", x:"Le numérateur commence par $u'v$, comme le produit. Puis on **soustrait** $uv'$. Une phrase qui marche : « dérivée du haut fois le bas, moins le haut fois dérivée du bas, le tout sur le bas au carré »."},
  {t:"exemple", titre:"Exemple guidé — dériver un produit", enonce:"Dériver $f(x) = (3x + 1)(x^2 - 2)$.", etapes:[
   {q:"Nommer les deux morceaux", r:"$u = 3x + 1$ et $v = x^2 - 2$."},
   {q:"Dériver chacun", r:"$u' = 3$ et $v' = 2x$."},
   {q:"Appliquer la formule", r:"$f' = u'v + uv' = 3(x^2 - 2) + (3x + 1)(2x)$."},
   {q:"Développer", r:"$3x^2 - 6 + 6x^2 + 2x = 9x^2 + 2x - 6$."},
   {q:"Contrôle", r:"En développant d'abord : $f(x) = 3x^3 + x^2 - 6x - 2$, dont la dérivée est $9x^2 + 2x - 6$. Identique. ✓"}
  ]},
  {t:"exemple", titre:"Exemple guidé — dériver un quotient", enonce:"Dériver $f(x) = @f{2x + 1}{x - 3}$ sur $]3 ; +∞[$.", etapes:[
   {q:"Nommer", r:"$u = 2x + 1$ et $v = x - 3$."},
   {q:"Dériver", r:"$u' = 2$ et $v' = 1$."},
   {q:"Appliquer", r:"$f' = @f{u'v - uv'}{v^2} = @f{2(x - 3) - (2x + 1) × 1}{(x - 3)^2}$."},
   {q:"Développer le numérateur", r:"$2x - 6 - 2x - 1 = -7$. Attention au signe moins qui se distribue sur **tout** $(2x + 1)$."},
   {q:"Résultat", r:"$f'(x) = @f{-7}{(x - 3)^2}$. Le numérateur est négatif et le dénominateur toujours positif : la fonction est décroissante."}
  ]},
  {t:"piege", titre:"Le piège du signe dans le quotient", x:"Le moins porte sur le produit $uv'$ **en entier**. Écrire $2x - 6 - 2x + 1$ au lieu de $2x - 6 - 2x - 1$ est l'erreur la plus fréquente du chapitre. Mets des parenthèses avant de développer."},
  {t:"check", q:"Quelle est la dérivée de $f(x) = @f{1}{x}$ ?",
   choix:["$-@f{1}{x^2}$","$@f{1}{x^2}$","$-@f{1}{2x}$","$1$"], bonne:0,
   expl:["Exact. La fonction inverse est décroissante sur chaque intervalle, donc sa dérivée est bien négative.",
         "Il manque le signe moins. La courbe de $@f{1}{x}$ descend partout : sa dérivée ne peut pas être positive.",
         "Tu as confondu avec la dérivée de $@r{x}$, qui vaut $@f{1}{2@r{x}}$.",
         "La dérivée d'une constante vaut 1 ? Non : c'est la dérivée de $x$. Ici la variable est au dénominateur."]}
 ]},

 {titre:"Récapitulatif : dériver, annuler, conclure", blocs:[
  {t:"idee", x:"Quelle que soit la question, la même séquence revient : **dériver**, chercher où la dérivée **s'annule**, étudier son **signe**, en déduire les variations. Quatre gestes, toujours dans cet ordre."},
  {t:"p", x:"C'est la méthode la plus rentable de toute l'année, parce qu'elle ne dépend pas de la fonction. Que ce soit un polynôme, un quotient ou une exponentielle, les quatre étapes ne changent pas — seule la première demande de connaître la bonne formule de dérivation. Apprends la séquence, pas les cas particuliers."},
  {t:"tbl", head:["La question ressemble à…","Ce qu'il faut faire"], rows:[
   ["« Dériver $f$ »","Terme par terme, avec le tableau des dérivées"],
   ["« Calculer $f'(2)$ »","Dériver **d'abord**, remplacer **ensuite**"],
   ["« Équation de la tangente en $a$ »","$y = f'(a)(x - a) + f(a)$, puis développer"],
   ["« Sens de variation »","$f'(x) = 0$, signe de $f'$, tableau"],
   ["« Maximum / minimum »","Même chose, puis calculer $f$ à l'endroit trouvé"],
   ["Un problème d'optimisation","Traduire en fonction, puis chercher l'extremum"]
  ]},
  {t:"formule", titre:"Les dérivées à savoir sans réfléchir", x:"$k → 0$ &nbsp;·&nbsp; $x → 1$ &nbsp;·&nbsp; $x^n → n x^{n-1}$<br>$@f{1}{x} → -@f{1}{x^2}$ &nbsp;·&nbsp; $@r{x} → @f{1}{2@r{x}}$ &nbsp;·&nbsp; $e^{x} → e^{x}$", note:"Les six lignes qui couvrent l'immense majorité des exercices."},
  {t:"piege", titre:"Les trois confusions qui coûtent le plus", x:"**1. $f(a)$ contre $f'(a)$.** L'un est la hauteur, l'autre la pente. Pour une tangente, il faut les deux — et il faut les calculer séparément.<br>**2. La constante recopiée.** La dérivée d'un nombre seul vaut zéro : le $-7$ disparaît, il ne se recopie pas.<br>**3. Le signe moins du quotient.** Dans $@f{u'v - uv'}{v^2}$, le moins porte sur **tout** le produit $uv'$. Mets les parenthèses avant de développer."},
  {t:"astuce", titre:"Le contrôle qui ne trompe pas", x:"Après avoir trouvé les variations, demande-toi si elles sont cohérentes avec le peu que tu sais de la fonction. Une parabole tournée vers le haut **doit** descendre puis monter — jamais l'inverse. Un bénéfice **doit** monter puis redescendre. Si ton tableau de variations raconte le contraire du bon sens, cherche une erreur de signe dans $f'$."},
  {t:"p", x:"Et pour réviser : reprends la figure de la tangente au début du chapitre, celle où le point glisse. Fais-la bouger en te demandant à chaque position « la pente est-elle positive ou négative ? » avant de lire la valeur affichée. C'est en anticipant, pas en lisant, que le lien entre le signe de $f'$ et l'allure de la courbe devient automatique."}
 ]}
],
exos:[
 {id:"de1", niveau:1, type:"qcm", enonce:"Quelle est la dérivée de $f(x) = 5x^3$ ?",
  choix:["$15x^2$","$5x^2$","$15x^3$","$3x^2$"], bonne:0,
  diag:["", "Tu as bien baissé l'exposant mais oublié de multiplier par 3 : le 3 descend devant, ce qui donne $5 × 3 = 15$.",
        "Tu as multiplié par 3 mais gardé l'exposant 3. L'exposant doit diminuer de 1, donc passer à 2.",
        "Tu as oublié le coefficient 5 de départ. Il reste en facteur : $5 × 3x^2$."],
  corr:["Règle : la dérivée de $x^n$ est $n x^{n-1}$.","Ici $n = 3$, donc la dérivée de $x^3$ est $3x^2$.","Le coefficient 5 reste multiplicateur : $f'(x) = 5 × 3x^2 = 15x^2$."],
  indice:"L'exposant descend devant et diminue de 1. Le coefficient devant reste."},

 {id:"de2", niveau:1, type:"num", enonce:"Soit $f(x) = x^2 - 4x$. Calculer $f'(1)$.",
  rep:-2,
  diag:[{v:2, m:"Erreur de signe. $f'(x) = 2x - 4$, donc $f'(1) = 2 - 4 = -2$. Le résultat est négatif : à cet endroit, la courbe descend."},
        {v:-3, m:"Tu as calculé $f(1) = 1 - 4 = -3$, la **hauteur** de la courbe, pas sa pente. Il faut d'abord dériver, puis remplacer."},
        {v:-4, m:"Tu as oublié le terme $2x$ de la dérivée. $f'(x) = 2x - 4$, il ne reste pas seulement $-4$."}],
  corr:["Je dérive : $f'(x) = 2x - 4$.","Je remplace $x$ par 1 : $f'(1) = 2 × 1 - 4$.","$2 - 4 = -2$."],
  indice:"Deux étapes dans l'ordre : dériver l'expression, **puis** remplacer $x$ par 1."},

 {id:"de3", niveau:2, type:"qcm", enonce:"La tangente à la courbe de $f$ au point d'abscisse 2 a pour équation $y = 3x - 1$. Que vaut $f'(2)$ ?",
  choix:["3","−1","5","2"], bonne:0,
  diag:["", "$-1$ est l'ordonnée à l'origine de la droite, pas sa pente. Le nombre dérivé est le **coefficient directeur**, c'est-à-dire le nombre devant $x$.",
        "5 est la valeur de $f(2)$ : $3 × 2 - 1 = 5$. C'est la hauteur du point de contact, pas la pente.",
        "2 est l'abscisse du point, donnée dans l'énoncé. On te demande la pente à cet endroit."],
  corr:["Le nombre dérivé $f'(a)$ est le coefficient directeur de la tangente en $a$.","La tangente s'écrit $y = 3x - 1$ : son coefficient directeur est 3.","Donc $f'(2) = 3$."],
  indice:"Dans $y = mx + p$, lequel des deux nombres représente la pente ?"},

 {id:"de4", niveau:2, type:"num", enonce:"Soit $f(x) = x^2$. La tangente au point d'abscisse 4 s'écrit $y = mx + p$. Que vaut $p$ ?",
  rep:-16,
  diag:[{v:16, m:"Erreur de signe. On a $y = 8(x - 4) + 16 = 8x - 32 + 16 = 8x - 16$. Le $-32$ l'emporte sur le $+16$."},
        {v:8, m:"8 est la valeur de $m$ (la pente), pas de $p$. La question porte sur l'ordonnée à l'origine."},
        {v:-32, m:"Tu as développé $8(x-4) = 8x - 32$ mais oublié d'ajouter $f(4) = 16$. La formule est $y = f'(a)(x-a) + f(a)$."}],
  corr:["$f(4) = 16$ et $f'(x) = 2x$ donc $f'(4) = 8$.","Tangente : $y = f'(4)(x - 4) + f(4) = 8(x - 4) + 16$.","Je développe : $8x - 32 + 16 = 8x - 16$.","Donc $m = 8$ et $p = -16$."],
  indice:"Écris d'abord la tangente sous la forme $f'(a)(x-a) + f(a)$, puis développe entièrement."},

 {id:"de5", niveau:2, type:"qcm", enonce:"On sait que $f'(x) < 0$ pour tout $x$ de l'intervalle $[0 ; 5]$. Que peut-on dire de $f$ sur cet intervalle ?",
  choix:["$f$ est décroissante","$f$ est croissante","$f$ est négative","$f$ est nulle"], bonne:0,
  diag:["", "Attention : c'est le signe de $f'$ qui donne le sens de variation, et un signe **négatif** correspond à une descente.",
        "Le signe de $f'$ ne dit rien du signe de $f$. Une fonction peut descendre tout en restant très au-dessus de zéro, par exemple de 100 à 50.",
        "Rien n'indique que $f$ vaut zéro. Une dérivée nulle donnerait une fonction constante, mais ici $f'$ est strictement négative."],
  corr:["Le lien : $f' < 0$ sur un intervalle signifie que la pente est négative partout.","Une pente négative correspond à une courbe qui descend.","Donc $f$ est décroissante sur $[0 ; 5]$."],
  indice:"Le signe de la dérivée donne le sens de variation, pas le signe de la fonction."},

 {id:"de6", niveau:3, type:"num", enonce:"Soit $f(x) = x^2 - 8x + 3$. En quelle valeur de $x$ la fonction atteint-elle son minimum ?",
  rep:4,
  diag:[{v:-4, m:"Erreur de signe en résolvant. $2x - 8 = 0$ donne $2x = 8$, donc $x = +4$."},
        {v:8, m:"Tu as oublié de diviser par 2. De $2x - 8 = 0$ on tire $2x = 8$, puis $x = 4$."},
        {v:-13, m:"Tu as donné la valeur du minimum, $f(4) = 16 - 32 + 3 = -13$. La question demande où il est atteint, donc un $x$."}],
  corr:["Je dérive : $f'(x) = 2x - 8$.","Je résous $f'(x) = 0$ : $2x = 8$, donc $x = 4$.","$f'$ est négative avant 4 et positive après : la fonction descend puis remonte.","Le minimum est donc atteint en $x = 4$."],
  indice:"Le minimum se trouve là où la dérivée s'annule. Résous $f'(x) = 0$."},

 {id:"de7", niveau:3, type:"qcm", enonce:"Quelle est la dérivée de $f(x) = (2x + 1)(x - 3)$ ?",
  choix:["$4x - 5$","$2$","$2x - 5$","$4x + 5$"], bonne:0,
  diag:["", "Tu as dérivé chaque facteur séparément et multiplié les dérivées. Cela ne fonctionne pas : la formule du produit est $u'v + uv'$, pas $u'v'$.",
        "Tu as oublié un terme. En développant, $f(x) = 2x^2 - 5x - 3$, donc $f'(x) = 4x - 5$.",
        "Erreur de signe : en développant, $-6x + x = -5x$, ce qui donne bien $-5$ et non $+5$."],
  corr:["Méthode la plus sûre : développer d'abord.","$(2x+1)(x-3) = 2x^2 - 6x + x - 3 = 2x^2 - 5x - 3$.","Je dérive : $f'(x) = 4x - 5$.","(On retrouve la même chose avec $u'v + uv' = 2(x-3) + (2x+1) = 4x - 5$.)"],
  indice:"Deux voies possibles : développer puis dériver, ou appliquer $(uv)' = u'v + uv'$. La première est moins risquée."},

 {id:"de8", niveau:3, type:"num", enonce:"Le bénéfice d'une entreprise, en milliers d'euros, est $B(x) = -x^2 + 40x - 100$ où $x$ est le nombre d'articles produits. Combien faut-il en produire pour un bénéfice maximal ?",
  rep:20, unite:"articles",
  diag:[{v:40, m:"Tu as oublié de diviser par 2. De $-2x + 40 = 0$ on tire $2x = 40$, donc $x = 20$."},
        {v:300, m:"Tu as donné le bénéfice maximal ($B(20) = 300$), pas la quantité à produire. Relis ce qui est demandé."},
        {v:-20, m:"Erreur de signe : $-2x + 40 = 0$ donne $-2x = -40$, puis $x = 20$. Une quantité produite ne peut pas être négative, c'est un bon signal d'alerte."}],
  corr:["**Étape 1 — comprendre ce qu'on cherche.** « Bénéfice maximal » veut dire : le point le plus haut de la courbe. Or au sommet, la courbe est plate — la pente y vaut zéro. On cherche donc où $B'(x) = 0$.",
        "**Étape 2 — dériver.** $B(x) = -x^2 + 40x - 100$. Terme par terme : $-x^2$ donne $-2x$, $40x$ donne $40$, et la constante $-100$ disparaît. Donc $B'(x) = -2x + 40$.",
        "**Étape 3 — résoudre $B'(x) = 0$.** $-2x + 40 = 0$, donc $-2x = -40$, donc $x = @f{-40}{-2} = 20$. Deux nombres négatifs divisés donnent un positif — heureusement, une quantité produite ne peut pas être négative.",
        "**Étape 4 — vérifier que c'est bien un maximum et non un minimum.** Le coefficient de $x^2$ vaut $-1$, il est négatif : la parabole est tournée vers le bas. Le sommet est donc bien un maximum. Cette vérification n'est pas facultative — sans elle, on pourrait présenter un minimum comme la réponse.",
        "**Conclusion.** Il faut produire **20 articles**.",
        "**Contrôle de plausibilité.** Le bénéfice vaut alors $B(20) = -400 + 800 - 100 = 300$ milliers d'euros. Testons juste à côté : $B(19) = -361 + 760 - 100 = 299$, et $B(21) = -441 + 840 - 100 = 299$. Les deux voisins sont plus bas : 20 est bien le sommet. ✓"],
  indice:"Un maximum se trouve là où la dérivée s'annule. Dérive $B$ puis résous $B'(x) = 0$."},

 {id:"de9", niveau:2, type:"qcm", enonce:"Quelle est la dérivée de $f(x) = @f{1}{x}$ ?",
  choix:["$-@f{1}{x^2}$","$@f{1}{x^2}$","$-@f{1}{x}$","$@f{1}{2@r{x}}$"], bonne:0,
  diag:["", "Il manque le signe moins. Regarde la courbe de la fonction inverse : elle descend sur chaque intervalle, donc sa dérivée est négative partout.",
        "L'exposant du dénominateur doit passer de 1 à 2. On peut écrire $@f{1}{x} = x^{-1}$, dont la dérivée est $-1 × x^{-2} = -@f{1}{x^2}$.",
        "C'est la dérivée de $@r{x}$, pas celle de $@f{1}{x}$. Ne mélange pas les deux lignes du tableau."],
  corr:["C'est une dérivée usuelle à connaître par cœur.","$@f{1}{x}$ a pour dérivée $-@f{1}{x^2}$, pour $x ≠ 0$.","Le signe moins traduit le fait que la fonction inverse est décroissante."],
  indice:"La fonction inverse monte-t-elle ou descend-elle ? Le signe de la dérivée doit le refléter."},

 {id:"de10", niveau:3, type:"qcm", enonce:"Quelle est la dérivée de $f(x) = @f{x + 2}{x - 1}$ sur $]1 ; +∞[$ ?",
  choix:["$@f{-3}{(x-1)^2}$","$@f{3}{(x-1)^2}$","$@f{2x+1}{(x-1)^2}$","$1$"], bonne:0,
  diag:["", "Erreur de signe au numérateur : $1 × (x-1) - (x+2) × 1 = x - 1 - x - 2 = -3$. Le moins se distribue sur **tout** $(x + 2)$.",
        "Tu as additionné au lieu de soustraire. La formule est $@f{u'v - uv'}{v^2}$, avec un moins.",
        "Tu as dérivé le haut et le bas séparément, puis divisé. Cela ne fonctionne pas : $@f{u}{v}$ ne se dérive pas en $@f{u'}{v'}$."],
  corr:["$u = x + 2$ et $v = x - 1$, donc $u' = 1$ et $v' = 1$.","$f' = @f{u'v - uv'}{v^2} = @f{1 × (x-1) - (x+2) × 1}{(x-1)^2}$.","Numérateur : $x - 1 - x - 2 = -3$.","$f'(x) = @f{-3}{(x-1)^2}$ : négative, donc $f$ est décroissante."],
  indice:"Mets $(x + 2)$ entre parenthèses avant de distribuer le signe moins."},

 {id:"de11", niveau:3, type:"num", enonce:"Soit $f(x) = (2x - 1)(x + 3)$. Calculer $f'(1)$.",
  rep:9,
  diag:[{v:2, m:"Tu as dérivé chaque facteur puis multiplié les dérivées : $2 × 1 = 2$. La formule du produit est $u'v + uv'$, pas $u'v'$."},
        {v:4, m:"Tu as calculé $f(1) = 1 × 4 = 4$, la valeur de la fonction, pas sa pente."},
        {v:8, m:"Tu as oublié un des deux termes. $f'(x) = 2(x+3) + (2x-1) × 1$, donc $f'(1) = 8 + 1 = 9$."}],
  corr:["$u = 2x - 1$, $v = x + 3$, donc $u' = 2$ et $v' = 1$.","$f'(x) = 2(x + 3) + (2x - 1) × 1 = 2x + 6 + 2x - 1 = 4x + 5$.","$f'(1) = 4 + 5 = 9$.","(En développant d'abord : $f(x) = 2x^2 + 5x - 3$, donc $f'(x) = 4x + 5$. Même résultat.)"],
  indice:"Deux voies : développer puis dériver, ou appliquer $(uv)' = u'v + uv'$. Les deux doivent donner la même chose."}
]
},

/* ====================== 4. FONCTION EXPONENTIELLE ====================== */
{
id:"expo", n:4, titre:"Fonction exponentielle",
sous:"La croissance qui s'emballe",
desc:"Définition, propriétés algébriques, dérivée, variations et équations.",
duree:35,
sections:[
 {titre:"D'où vient cette fonction ?", blocs:[
  {t:"idee", x:"L'exponentielle, c'est la fonction qui **grandit proportionnellement à ce qu'elle vaut déjà**. Plus elle est grande, plus elle grandit vite."},
  {t:"p", x:"Cette phrase mérite d'être creusée, parce qu'elle décrit un mode de croissance très différent de tout ce que tu as vu jusqu'ici. Une fonction affine grandit **d'une quantité fixe** : $+3$ à chaque pas, que la valeur soit 10 ou 10 000. L'exponentielle, elle, grandit **d'une fraction de ce qu'elle vaut** : $+10$ %, ce qui fait $+1$ quand on est à 10, et $+1000$ quand on est à 10 000."},
  {t:"p", x:"C'est exactement la situation d'une population de bactéries : chaque bactérie se divise, donc plus il y en a, plus il en apparaît. Ou d'un capital placé : les intérêts produisent eux-mêmes des intérêts. Dans les deux cas, la croissance s'accélère toute seule, sans que rien ne change dans la règle. C'est ce qui rend l'exponentielle si brutale sur la durée — et si contre-intuitive."},
  {t:"p", x:"Tu l'as déjà rencontrée sans le savoir, au chapitre des suites : une suite géométrique de raison $1{,}05$ fait exactement ça, par paliers annuels. **L'exponentielle est sa version continue** : au lieu de sauter d'année en année, elle décrit la croissance à chaque instant. Le lien entre les deux chapitres est direct, et il vaut la peine d'être vu."},
  {t:"p", x:"On la note $exp(x)$ ou, bien plus souvent, $e^{x}$. Le nombre $e$ vaut environ $2{,}718$. C'est une constante, comme $π$ — et comme $π$, elle n'a pas été choisie : elle s'impose. $π$ apparaît dès qu'on parle de cercle ; $e$ apparaît dès qu'on parle de croissance proportionnelle."},
  {t:"p", x:"Elle sert à décrire tout ce qui croît (ou décroît) par multiplication : une population de bactéries, un capital placé, la radioactivité qui diminue, la propagation d'une rumeur ou d'une épidémie."},
  {t:"formule", titre:"Les valeurs à connaître par cœur", x:"$e^{0} = 1$ &nbsp;&nbsp;·&nbsp;&nbsp; $e^{1} = e ≈ 2{,}718$ &nbsp;&nbsp;·&nbsp;&nbsp; $e^{x} > 0$ pour tout $x$", note:"Le dernier point est capital : l'exponentielle n'est JAMAIS négative ni nulle."},
  {t:"piege", titre:"Le piège du $e^0$", x:"Beaucoup écrivent $e^{0} = 0$. C'est faux : **tout nombre élevé à la puissance 0 vaut 1**. Donc $e^{0} = 1$."},
  {t:"plot", f:"Math.exp(x)", xmin:-3, xmax:3, titre:"Courbe de $f(x) = e^{x}$", note:"Elle reste toujours au-dessus de l'axe des abscisses et s'envole très vite vers la droite."},
  {t:"p", x:"Deux choses à retenir de cette courbe. À **droite**, elle s'envole : elle monte de plus en plus raide, sans limite. À **gauche**, elle s'écrase contre l'axe horizontal sans jamais le toucher — elle devient minuscule, mais reste strictement positive. C'est la traduction graphique de $e^{x} > 0$ pour tout $x$."},
  {t:"fig", titre:"Exponentielle contre ligne droite",
   vue:[-0.3,-1,4.2,20], w:400, h:320, graduations:false,
   objets:[
    {t:"courbe", f:"droite-2x", couleur:"bleu"},
    {t:"courbe", f:"expo", couleur:"rouge"},
    {t:"point", x:1, y:2, nom:null, couleur:"bleu"},
    {t:"point", x:1, y:2.72, nom:null, couleur:"rouge"},
    {t:"texte", x:3.2, y:7.5, txt:"y = 2x", couleur:"bleu"},
    {t:"texte", x:2.35, y:15, txt:"y = eˣ", couleur:"rouge"}
   ],
   note:"Au départ elles se tiennent. Puis l'exponentielle décroche et laisse la droite sur place."},
  {t:"p", x:"Regarde le début : entre 0 et 1, les deux courbes sont presque confondues. Un observateur pressé conclurait qu'elles se valent. Puis, à partir de $x = 2$ environ, l'exponentielle décroche et la droite paraît immobile en comparaison."},
  {t:"p", x:"C'est la raison pour laquelle la croissance exponentielle trompe si souvent le jugement. **On la remarque toujours trop tard.** Elle paraît anodine pendant longtemps, puis devient incontrôlable en peu de temps — sans qu'aucune règle n'ait changé en cours de route. Une épidémie, la propagation d'une rumeur, un compte qui capitalise : le mécanisme est identique."},
  {t:"astuce", titre:"L'anecdote qui fait comprendre", x:"Un nénuphar double de surface chaque jour et couvre l'étang en 30 jours. Au bout de combien de jours en couvre-t-il la moitié ?<br><br>Réponse : **29 jours**. La veille du dernier. Pendant 28 jours, l'étang paraît presque vide — et tout bascule en 48 heures. C'est exactement le comportement de la courbe rouge ci-dessus."}
 ]},

 {titre:"Les règles de calcul", blocs:[
  {t:"p", x:"L'exponentielle transforme les additions en multiplications. C'est sa propriété centrale, et toutes les autres en découlent."},
  {t:"p", x:"Avant de lire les règles, comprends d'où elles viennent — elles ne s'apprennent pas, elles se déduisent. Souviens-toi de ce qu'est une puissance : $e^{3}$, c'est $e × e × e$, trois facteurs. Et $e^{2}$, c'est $e × e$, deux facteurs. Que vaut leur produit ? Cinq facteurs de $e$ mis bout à bout, c'est-à-dire $e^{5}$. **Les exposants s'additionnent parce qu'on compte des facteurs.**"},
  {t:"p", x:"Toutes les autres règles suivent le même raisonnement. Diviser, c'est retirer des facteurs, donc soustraire les exposants. Élever une puissance à une puissance, c'est répéter une répétition, donc multiplier les exposants. Ces règles ne sont pas propres à l'exponentielle : ce sont celles des puissances, que tu connais depuis le collège, appliquées à la base $e$."},
  {t:"formule", titre:"Les quatre règles", x:"$e^{a} × e^{b} = e^{a+b}$<br>$@f{e^{a}}{e^{b}} = e^{a-b}$<br>$(e^{a})^{n} = e^{a n}$<br>$e^{-a} = @f{1}{e^{a}}$", note:"Somme en haut ↔ produit en bas. C'est le fil conducteur."},
  {t:"p", x:"Retiens l'expression « somme en haut, produit en bas » : c'est le résumé de tout. Une **addition** dans les exposants correspond à une **multiplication** dans le résultat. Cette correspondance est ce qui rend l'exponentielle si utile — elle transforme les additions, faciles, en multiplications, difficiles. C'est d'ailleurs le principe des règles à calcul et des tables de logarithmes, qui ont servi aux ingénieurs pendant trois siècles."},
  {t:"exemple", titre:"Exemple guidé — simplifier", enonce:"Simplifier $A = @f{e^{5} × e^{-2}}{e^{4}}$.", etapes:[
   {q:"Traiter le numérateur", r:"Un produit d'exponentielles : on additionne les exposants. $e^{5} × e^{-2} = e^{5 + (-2)} = e^{3}$."},
   {q:"Traiter la division", r:"Un quotient : on soustrait les exposants. $@f{e^{3}}{e^{4}} = e^{3 - 4} = e^{-1}$."},
   {q:"Écrire autrement si besoin", r:"$e^{-1} = @f{1}{e} ≈ 0{,}368$."},
   {q:"Le réflexe", r:"On ne calcule jamais les valeurs numériques en cours de route : on manipule uniquement les exposants."}
  ]},
  {t:"piege", titre:"Deux confusions à éviter", x:"$e^{a} × e^{b}$ ne vaut **pas** $e^{ab}$ : on additionne les exposants, on ne les multiplie pas.<br>$e^{a} + e^{b}$ ne se simplifie **pas** du tout. Une somme d'exponentielles reste une somme."},
  {t:"check", q:"Que vaut $e^{3} × e^{2}$ ?",
   choix:["$e^{5}$","$e^{6}$","$2e^{5}$","$e^{9}$"], bonne:0,
   expl:["Exact : quand on multiplie, on additionne les exposants, donc $3 + 2 = 5$.",
         "Tu as multiplié les exposants. La règle du produit dit d'**additionner** : $3 + 2 = 5$.",
         "Le coefficient 2 n'a pas lieu d'être : il n'y a pas de facteur devant, seulement des exposants à additionner.",
         "Tu as élevé au carré. La règle $(e^{a})^{n} = e^{an}$ concerne une puissance de puissance, pas un produit."]}
 ]},

 {titre:"Dérivée et variations", blocs:[
  {t:"idee", x:"L'exponentielle a une propriété unique : **elle est sa propre dérivée**. C'est même la définition qu'on en donne parfois."},
  {t:"p", x:"Cette propriété paraît étrange, et pourtant c'est exactement la phrase du début, traduite en langage de dérivées. Relis : « elle grandit proportionnellement à ce qu'elle vaut déjà ». Or « à quelle vitesse elle grandit », c'est $f'(x)$. Et « ce qu'elle vaut déjà », c'est $f(x)$. Dire que les deux sont égaux, c'est écrire $f' = f$ — soit exactement $(e^{x})' = e^{x}$."},
  {t:"p", x:"Autrement dit, ce n'est pas une coïncidence bizarre : **c'est la définition même de l'exponentielle**, vue sous un autre angle. C'est d'ailleurs comme ça qu'on la construit proprement en mathématiques : on cherche la fonction dont la dérivée est elle-même et qui vaut 1 en zéro. Il n'y en a qu'une, et c'est celle-là. Le nombre $e ≈ 2{,}718$ n'a pas été choisi : c'est la valeur qu'il **faut** pour que cette égalité fonctionne."},
  {t:"formule", titre:"Dérivées à connaître", x:"$(e^{x})' = e^{x}$<br>$(e^{kx})' = k e^{kx}$<br>$(e^{u})' = u' e^{u}$", note:"Le facteur qui sort devant est la dérivée de l'exposant."},
  {t:"p", x:"Comme $e^{x} > 0$ pour tout $x$, la dérivée de $e^{x}$ est toujours strictement positive. Conclusion : **la fonction exponentielle est strictement croissante sur ℝ**, sans aucune exception."},
  {t:"exemple", titre:"Exemple guidé — dériver un produit avec exponentielle", enonce:"Dériver $f(x) = 3e^{2x}$.", etapes:[
   {q:"Repérer la forme", r:"C'est $3 × e^{u}$ avec $u = 2x$."},
   {q:"Dériver l'exposant", r:"$u' = 2$."},
   {q:"Appliquer la formule", r:"$(e^{u})' = u' e^{u} = 2e^{2x}$."},
   {q:"Ne pas oublier le coefficient", r:"$f'(x) = 3 × 2e^{2x} = 6e^{2x}$."}
  ]},
  {t:"piege", titre:"L'oubli du facteur", x:"Écrire $(e^{2x})' = e^{2x}$ est l'erreur numéro un. Il manque le 2 : la dérivée de l'exposant sort toujours en facteur."},
  {t:"p", x:"Une conséquence utile de « toujours croissante » : pour étudier les variations de $e^{u(x)}$, **on n'a pas à s'occuper de l'exponentielle**. Puisque $(e^{u})' = u' e^{u}$ et que $e^{u}$ est toujours strictement positif, le signe de la dérivée est celui de $u'$ tout seul. Autrement dit : $e^{u}$ varie exactement comme $u$."},
  {t:"exemple", titre:"Exemple guidé — variations d'une exponentielle composée", enonce:"Étudier les variations de $f(x) = e^{-x^2}$ sur ℝ.", etapes:[
   {q:"Étape 1 — repérer la forme", r:"C'est $e^{u}$ avec $u(x) = -x^2$. On ne développe rien, on identifie."},
   {q:"Étape 2 — dériver l'exposant", r:"$u'(x) = -2x$."},
   {q:"Étape 3 — appliquer la formule", r:"$f'(x) = u' e^{u} = -2x e^{-x^2}$."},
   {q:"Étape 4 — le raccourci", r:"$e^{-x^2}$ est **toujours strictement positif**, quel que soit $x$. Il ne peut donc jamais changer le signe du produit. Le signe de $f'$ est celui de $-2x$, et rien d'autre."},
   {q:"Étape 5 — conclure", r:"$-2x$ est positif quand $x < 0$, négatif quand $x > 0$. Donc $f$ **croît** sur $]-∞ ; 0]$ puis **décroît** sur $[0 ; +∞[$, avec un maximum en $x = 0$ valant $f(0) = e^{0} = 1$."},
   {q:"Ce qu'il faut retenir", r:"On n'a jamais eu besoin de calculer une seule valeur de l'exponentielle. Le fait qu'elle soit toujours positive suffit à l'écarter du raisonnement sur les signes — c'est un réflexe qui fait gagner beaucoup de temps."}
  ]}
 ]},

 {titre:"Résoudre avec des exponentielles", blocs:[
  {t:"p", x:"L'exponentielle est strictement croissante, donc elle ne prend jamais deux fois la même valeur. Cela permet de « retirer » les exponentielles des deux côtés d'une égalité."},
  {t:"formule", titre:"Les deux règles de résolution", x:"$e^{A} = e^{B}$ &nbsp;⇔&nbsp; $A = B$<br>$e^{A} < e^{B}$ &nbsp;⇔&nbsp; $A < B$", note:"Le sens de l'inégalité est conservé, car la fonction est croissante."},
  {t:"exemple", titre:"Exemple guidé — une équation", enonce:"Résoudre $e^{2x - 1} = e^{x + 4}$.", etapes:[
   {q:"Comparer les exposants", r:"Les deux membres sont des exponentielles, donc on peut identifier les exposants : $2x - 1 = x + 4$."},
   {q:"Résoudre l'équation obtenue", r:"$2x - x = 4 + 1$, donc $x = 5$."},
   {q:"Conclure", r:"$S = {5}$."},
   {q:"Vérifier", r:"$2 × 5 - 1 = 9$ et $5 + 4 = 9$. Les deux exposants coïncident. ✓"}
  ]},
  {t:"astuce", titre:"Un cas qui revient souvent", x:"Une équation comme $e^{x} = -3$ n'a **aucune solution** : l'exponentielle est toujours strictement positive, elle ne peut jamais valoir un nombre négatif. Repérer cela fait gagner du temps et des points."},
  {t:"p", x:"Pourquoi a-t-on le droit de « retirer les exponentielles » des deux côtés ? Parce que la fonction est **strictement croissante** : elle ne prend jamais deux fois la même valeur. Si deux exponentielles sont égales, elles ne peuvent venir que du même exposant. Ce raisonnement n'est pas valable pour n'importe quelle fonction — avec des carrés, par exemple, $x^2 = 9$ a deux solutions, parce que la fonction carré repasse par les mêmes valeurs."},
  {t:"p", x:"Retiens donc la différence : une équation en exponentielle a **au plus une solution**. Si tu en trouves deux, il y a une erreur."}
 ]},

 {titre:"Récapitulatif : manipuler les exposants, jamais les valeurs", blocs:[
  {t:"idee", x:"Le réflexe central du chapitre : **on travaille sur les exposants, pas sur les nombres**. On ne calcule $e^{quelque chose}$ à la calculatrice qu'à la toute fin, s'il le faut."},
  {t:"p", x:"C'est l'erreur de méthode la plus coûteuse : sortir la calculatrice trop tôt. Devant $@f{e^{5} × e^{-2}}{e^{4}}$, la tentation est de calculer chaque morceau. Mauvaise idée : on obtient des décimales interminables, on arrondit, et on perd la précision. En restant sur les exposants, tout se simplifie : $5 - 2 - 4 = -1$, réponse $e^{-1}$. Une ligne, exacte."},
  {t:"tbl", head:["La question ressemble à…","Ce qu'il faut faire"], rows:[
   ["« Simplifier une expression »","Additionner et soustraire les exposants, sans calculer"],
   ["« Résoudre $e^{A} = e^{B}$ »","Identifier les exposants : $A = B$"],
   ["« Résoudre $e^{A} = $ un nombre négatif »","Aucune solution — l'exponentielle est toujours positive"],
   ["« Dériver $e^{u}$ »","$u' e^{u}$ : la dérivée de l'exposant sort en facteur"],
   ["« Sens de variation »","Toujours croissante ; pour $e^{u}$, c'est le signe de $u'$ qui décide"],
   ["Un problème de croissance","Modéliser par $N_0 e^{kt}$, puis remplacer"]
  ]},
  {t:"formule", titre:"Les valeurs et propriétés à ne jamais oublier", x:"$e^{0} = 1$ &nbsp;·&nbsp; $e^{1} = e ≈ 2{,}718$ &nbsp;·&nbsp; $e^{x} > 0$ **toujours**<br>$(e^{u})' = u' e^{u}$", note:"La troisième est celle qui répond au plus grand nombre de questions."},
  {t:"piege", titre:"Les trois erreurs les plus fréquentes", x:"**1. $e^{0} = 0$.** Non : tout nombre à la puissance zéro vaut 1. C'est l'exposant qui est nul, pas le résultat.<br>**2. $e^{a} × e^{b} = e^{ab}$.** Non : on **additionne** les exposants. La multiplication des exposants correspond à $(e^{a})^{b}$, ce qui est autre chose.<br>**3. Le facteur oublié en dérivant.** $(e^{2x})'$ vaut $2e^{2x}$, pas $e^{2x}$. La dérivée de l'exposant sort toujours devant."},
  {t:"astuce", titre:"Le contrôle qui rattrape tout", x:"L'exponentielle est **toujours strictement positive**. Si un calcul te donne une exponentielle négative ou nulle, il y a une erreur, sans exception. Et si tu obtiens une valeur numérique aberrante — une population de bactéries négative, un capital qui a fondu alors qu'il rapporte des intérêts — reprends le signe de l'exposant."},
  {t:"p", x:"Enfin, garde le lien avec les suites en tête. Une suite géométrique de raison $q$ et une exponentielle décrivent le même phénomène : l'une par paliers, l'autre en continu. Quand un énoncé parle d'évolution par années entières, pense suite ; quand il parle d'évolution à tout instant, pense exponentielle. Les deux chapitres se répondent."}
 ]}
],
exos:[
 {id:"ex1", niveau:1, type:"qcm", enonce:"Que vaut $e^{0}$ ?",
  choix:["1","0","$e$","impossible à calculer"], bonne:0,
  diag:["", "Attention : c'est l'**exposant** qui vaut 0, pas le résultat. Tout nombre non nul élevé à la puissance 0 donne 1.",
        "$e$ correspond à $e^{1}$, pas à $e^{0}$.",
        "C'est parfaitement calculable, et c'est une valeur de référence à connaître : $e^{0} = 1$."],
  corr:["Règle des puissances : $a^{0} = 1$ pour tout $a ≠ 0$.","Donc $e^{0} = 1$."],
  indice:"Rappelle-toi ce que vaut n'importe quel nombre à la puissance 0."},

 {id:"ex2", niveau:1, type:"qcm", enonce:"Simplifier $e^{4} × e^{3}$.",
  choix:["$e^{7}$","$e^{12}$","$e^{4/3}$","$2e^{7}$"], bonne:0,
  diag:["", "Tu as multiplié les exposants. Quand on **multiplie** deux exponentielles, on **additionne** les exposants : $4 + 3 = 7$.",
        "La division correspond à une soustraction d'exposants, mais ici il s'agit d'un produit.",
        "Il n'y a pas de coefficient à faire apparaître : seuls les exposants s'additionnent."],
  corr:["Règle : $e^{a} × e^{b} = e^{a+b}$.","Ici $4 + 3 = 7$.","Donc $e^{4} × e^{3} = e^{7}$."],
  indice:"Produit d'exponentielles → que fait-on des exposants ?"},

 {id:"ex3", niveau:2, type:"qcm", enonce:"Quelle est la dérivée de $f(x) = e^{5x}$ ?",
  choix:["$5e^{5x}$","$e^{5x}$","$5xe^{5x}$","$e^{5}$"], bonne:0,
  diag:["", "Il manque un facteur. La règle $(e^{u})' = u'e^{u}$ fait sortir la dérivée de l'exposant : ici $u = 5x$ donc $u' = 5$.",
        "Tu as sorti $u$ au lieu de $u'$. C'est la **dérivée** de l'exposant qui sort, soit 5, pas $5x$.",
        "L'exposant ne disparaît pas et ne devient pas une constante : il reste $5x$."],
  corr:["Forme $e^{u}$ avec $u = 5x$.","$u' = 5$.","$(e^{u})' = u'e^{u} = 5e^{5x}$."],
  indice:"La dérivée de l'exposant vient se placer en facteur devant l'exponentielle."},

 {id:"ex4", niveau:2, type:"num", enonce:"Résoudre $e^{3x} = e^{12}$. Quelle est la valeur de $x$ ?",
  rep:4,
  diag:[{v:12, m:"Tu t'es arrêté trop tôt. En identifiant les exposants on obtient $3x = 12$, il reste à diviser par 3."},
        {v:36, m:"Tu as multiplié par 3 au lieu de diviser. De $3x = 12$ on tire $x = @f{12}{3} = 4$."},
        {v:9, m:"Tu as soustrait 3 au lieu de diviser. Dans $3x$, le 3 multiplie $x$ : on l'annule par une division."}],
  corr:["Les deux membres sont des exponentielles : on peut identifier les exposants.","$3x = 12$.","$x = @f{12}{3} = 4$."],
  indice:"$e^{A} = e^{B}$ équivaut à $A = B$. Écris l'équation sur les exposants."},

 {id:"ex5", niveau:2, type:"qcm", enonce:"Combien l'équation $e^{x} = -5$ a-t-elle de solutions ?",
  choix:["Aucune","Une seule","Deux","Une infinité"], bonne:0,
  diag:["", "Il n'existe aucun nombre dont l'exponentielle soit négative. La courbe de $e^{x}$ reste entièrement au-dessus de l'axe des abscisses.",
        "Une équation en exponentielle ne peut de toute façon pas avoir deux solutions : la fonction est strictement croissante, donc elle ne repasse jamais par la même valeur.",
        "Non : aucune valeur de $x$ ne convient, ce qui est le contraire d'une infinité."],
  corr:["Propriété fondamentale : $e^{x} > 0$ pour tout réel $x$.","Or $-5$ est négatif.","Aucune valeur de $x$ ne peut donc convenir : $S = ∅$."],
  indice:"Quel est le signe de l'exponentielle, quel que soit $x$ ?"},

 {id:"ex6", niveau:3, type:"qcm", enonce:"Simplifier $@f{e^{7}}{e^{2} × e^{3}}$.",
  choix:["$e^{2}$","$e^{7/6}$","$e^{12}$","$e^{-2}$"], bonne:0,
  diag:["", "Il ne faut pas diviser les exposants entre eux. On additionne d'abord ceux du dénominateur ($2+3 = 5$), puis on soustrait : $7 - 5 = 2$.",
        "Tu as additionné les trois exposants. Le 7 est au numérateur : il faut **retirer** ce qui se trouve en bas.",
        "Erreur de sens dans la soustraction : c'est $7 - 5$, et non $5 - 7$."],
  corr:["Au dénominateur : $e^{2} × e^{3} = e^{5}$.","L'expression devient $@f{e^{7}}{e^{5}}$.","Quotient : on soustrait les exposants, $7 - 5 = 2$.","Résultat : $e^{2}$."],
  indice:"Commence par simplifier le dénominateur, puis applique la règle du quotient."},

 {id:"ex7", niveau:3, type:"num", enonce:"Une population de bactéries suit $N(t) = 500 e^{0,2t}$ où $t$ est en heures. Combien y a-t-il de bactéries au bout de 5 heures ? (arrondir à l'unité)",
  rep:1359, tol:2,
  diag:[{v:500, m:"Tu as pris $t = 0$. Pour $t = 5$, l'exposant vaut $0{,}2 × 5 = 1$, donc $N(5) = 500e ≈ 1359$."},
        {v:1000, m:"Tu as sans doute calculé $500 × 2$. L'exponentielle ne double pas mécaniquement : ici le facteur est $e^{1} ≈ 2{,}718$."},
        {v:2718, m:"Tu as calculé $1000 × e$ ou oublié le coefficient 500. La bonne opération est $500 × e^{1}$."}],
  corr:["Je remplace $t$ par 5 : $N(5) = 500e^{0,2 × 5}$.","$0{,}2 × 5 = 1$, donc $N(5) = 500e^{1} = 500e$.","$e ≈ 2{,}71828$, donc $N(5) ≈ 1359{,}1$.","Il y a environ 1359 bactéries."],
  indice:"Calcule d'abord l'exposant $0{,}2 × 5$ : il tombe sur une valeur très simple."},

 {id:"ex8", niveau:3, type:"num", enonce:"Résoudre $e^{2x + 1} = e^{x - 3}$. Quelle est la solution ?",
  rep:-4,
  diag:[{v:4, m:"Erreur de signe. De $2x + 1 = x - 3$ on tire $x = -3 - 1 = -4$."},
        {v:-2, m:"Tu as fait une erreur en regroupant. Passe les $x$ à gauche et les nombres à droite : $2x - x = -3 - 1$, donc $x = -4$."},
        {v:2, m:"Tu as peut-être divisé quelque part. Ici il n'y a rien à diviser : après regroupement il reste un seul $x$."}],
  corr:["Les deux membres sont des exponentielles : j'identifie les exposants.","$2x + 1 = x - 3$.","Je regroupe : $2x - x = -3 - 1$.","$x = -4$."],
  indice:"Égalise les exposants, puis résous l'équation du premier degré obtenue."}
]
}
]);
