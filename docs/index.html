  {t:"idee", x:"Une droite peut se décrire de deux manières : par **la direction qu'elle suit** (vecteur directeur) ou par **la direction qu'elle fuit** (vecteur normal, perpendiculaire à elle)."},
  {t:"formule", titre:"Équation cartésienne", x:"Toute droite s'écrit $ax + by + c = 0$, avec $a$ et $b$ non tous les deux nuls.", note:"Un point appartient à la droite si et seulement si ses coordonnées vérifient l'égalité."},
  {t:"formule", titre:"Lire les deux vecteurs sur l'équation", x:"Pour $ax + by + c = 0$ :<br>vecteur **normal** $@v{n}(a ; b)$ &nbsp;&nbsp;·&nbsp;&nbsp; vecteur **directeur** $@v{u}(-b ; a)$", note:"Le directeur s'obtient en échangeant les deux coefficients et en changeant un signe."},
  {t:"p", x:"Exemple : la droite $2x - 5y + 7 = 0$ a pour vecteur normal $@v{n}(2 ; -5)$ et pour vecteur directeur $@v{u}(5 ; 2)$. On vérifie qu'ils sont bien perpendiculaires : $2 × 5 + (-5) × 2 = 10 - 10 = 0$. ✓"},
  {t:"astuce", titre:"Comment ne plus les confondre", x:"Le **normal** se lit tel quel dans l'équation : $(a ; b)$, dans l'ordre. Le **directeur** demande une manipulation : on échange et on change un signe. Si tu n'as rien manipulé, tu tiens le normal."},
  {t:"exemple", titre:"Exemple guidé — droite passant par deux points", enonce:"Déterminer une équation cartésienne de la droite passant par $A(1 ; 2)$ et $B(4 ; 8)$.", etapes:[
   {q:"Trouver un vecteur directeur", r:"$@v{AB}(4 - 1 ; 8 - 2) = (3 ; 6)$. On peut le simplifier en $(1 ; 2)$, ce qui allègera les calculs."},
   {q:"En déduire un vecteur normal", r:"Si $@v{u}(1 ; 2)$ est directeur, alors $@v{n}(-2 ; 1)$ est normal (on échange et on change un signe)."},
   {q:"Écrire l'équation", r:"Le normal donne les coefficients : $-2x + y + c = 0$."},
   {q:"Trouver $c$ avec un point", r:"$A(1 ; 2)$ est sur la droite : $-2 × 1 + 2 + c = 0$, donc $c = 0$."},
   {q:"Conclure et vérifier", r:"L'équation est $-2x + y = 0$, ou encore $y = 2x$. Test avec $B$ : $-8 + 8 = 0$ ✓."}
  ]},
  {t:"piege", titre:"Une équation, plusieurs écritures", x:"$-2x + y = 0$, $2x - y = 0$ et $-4x + 2y = 0$ décrivent **la même droite**. Multiplier toute l'équation par un nombre non nul ne change rien. Deux réponses d'aspect différent peuvent donc être toutes les deux justes."}
 ]},

 {titre:"Parallèles ou perpendiculaires ?", blocs:[
  {t:"p", x:"Deux questions reviennent sans arrêt : ces droites se coupent-elles, et si oui à angle droit ? Les deux se tranchent avec les vecteurs."},
  {t:"formule", titre:"Les deux critères", x:"**Parallèles** : leurs vecteurs directeurs sont colinéaires, soit $x y' - y x' = 0$<br>**Perpendiculaires** : leurs vecteurs directeurs sont orthogonaux, soit $x x' + y y' = 0$", note:"Le premier test est un déterminant (produit en croix), le second un produit scalaire. Ne les mélange pas."},
  {t:"astuce", titre:"Retenir lequel est lequel", x:"Le produit **en croix** teste le parallélisme (les vecteurs pointent dans la même direction). Le produit **scalaire** teste la perpendicularité (il vaut zéro quand l'angle est droit)."},
  {t:"exemple", titre:"Exemple guidé — position relative de deux droites", enonce:"Les droites $d : 2x - 3y + 1 = 0$ et $d' : 3x + 2y - 5 = 0$ sont-elles parallèles, perpendiculaires, ou ni l'un ni l'autre ?", etapes:[
   {q:"Vecteurs directeurs", r:"Pour $d$ : $@v{u}(3 ; 2)$. Pour $d'$ : $@v{u'}(-2 ; 3)$."},
   {q:"Test du parallélisme", r:"$3 × 3 - 2 × (-2) = 9 + 4 = 13 ≠ 0$. Elles ne sont pas parallèles : elles se coupent."},
   {q:"Test de la perpendicularité", r:"$3 × (-2) + 2 × 3 = -6 + 6 = 0$."},
   {q:"Conclure", r:"Le produit scalaire est nul : les droites sont **perpendiculaires**."},
   {q:"Contrôle rapide", r:"On pouvait aussi comparer les normales $(2 ; -3)$ et $(3 ; 2)$ : leur produit scalaire vaut $6 - 6 = 0$. Même conclusion."}
  ]},
  {t:"formule", titre:"Point d'intersection", x:"On résout le système formé par les deux équations.", note:"Si le système n'a pas de solution, les droites sont strictement parallèles. S'il en a une infinité, elles sont confondues."}
 ]},

 {titre:"Les cercles", blocs:[
  {t:"formule", titre:"Équation d'un cercle", x:"Centre $Ω(a ; b)$, rayon $R$ : $(x - a)^2 + (y - b)^2 = R^2$", note:"Cette équation dit simplement : « la distance de $M(x ; y)$ au centre vaut $R$ »."},
  {t:"p", x:"C'est le théorème de Pythagore déguisé. La distance de $M$ à $Ω$ vaut $@r{(x-a)^2 + (y-b)^2}$ ; écrire qu'elle vaut $R$ revient à élever les deux membres au carré."},
  {t:"piege", titre:"Les deux signes à surveiller", x:"Le centre est ce qu'on **retranche** : $(x + 3)^2$ correspond à une abscisse de centre égale à $-3$. Et le membre de droite est $R^2$, pas $R$ : si l'équation finit par $= 16$, le rayon vaut 4."},
  {t:"exemple", titre:"Exemple guidé — cercle de diamètre donné", enonce:"Déterminer l'équation du cercle de diamètre $[AB]$ avec $A(1 ; 3)$ et $B(5 ; 1)$.", etapes:[
   {q:"Le centre est le milieu", r:"$Ω(@f{1+5}{2} ; @f{3+1}{2}) = (3 ; 2)$."},
   {q:"Le rayon est la moitié du diamètre", r:"$AB = @r{(5-1)^2 + (1-3)^2} = @r{16 + 4} = @r{20}$, donc $R = @f{@r{20}}{2}$."},
   {q:"Calculer $R^2$ directement", r:"Plus malin : $R^2 = (@f{@r{20}}{2})^2 = @f{20}{4} = 5$. On évite ainsi la racine."},
   {q:"Écrire l'équation", r:"$(x - 3)^2 + (y - 2)^2 = 5$."},
   {q:"Vérifier avec $A$", r:"$(1-3)^2 + (3-2)^2 = 4 + 1 = 5$ ✓. Le point $A$ est bien sur le cercle."}
  ]},
  {t:"astuce", titre:"Tester si un point est sur un cercle", x:"Remplace $x$ et $y$ par les coordonnées du point. Si tu obtiens exactement $R^2$, il est sur le cercle ; si tu obtiens moins, il est à l'intérieur ; si tu obtiens plus, il est à l'extérieur."}
 ]}
],
exos:[
 {id:"gr1", niveau:1, type:"qcm", enonce:"Quel est un vecteur directeur de la droite d'équation $3x + 4y - 1 = 0$ ?",
  choix:["$@v{u}(-4 ; 3)$","$@v{u}(3 ; 4)$","$@v{u}(4 ; 3)$","$@v{u}(3 ; -4)$"], bonne:0,
  diag:["", "$(3 ; 4)$ est le vecteur **normal** : il se lit tel quel dans l'équation, mais il est perpendiculaire à la droite, pas parallèle.",
        "Tu as échangé les coefficients sans changer de signe. Il faut faire les deux : $(-b ; a)$, soit $(-4 ; 3)$.",
        "Tu as changé un signe sans échanger les coefficients. Vérifie : $3 × 3 + 4 × (-4) = 9 - 16 = -7 ≠ 0$, donc ce vecteur n'est pas orthogonal au normal."],
  corr:["Pour $ax + by + c = 0$, le normal est $@v{n}(a ; b) = (3 ; 4)$.","Le directeur s'obtient par $@v{u}(-b ; a) = (-4 ; 3)$.","Contrôle : $@v{n} · @v{u} = 3 × (-4) + 4 × 3 = 0$ ✓ — ils sont bien perpendiculaires."],
  indice:"Le normal se lit tel quel. Pour le directeur : échange les coefficients **et** change un signe."},

 {id:"gr2", niveau:1, type:"qcm", enonce:"Le point $A(2 ; -1)$ appartient-il à la droite $x + 3y + 1 = 0$ ?",
  choix:["Oui","Non, on obtient 6","Non, on obtient 4","On ne peut pas savoir"], bonne:0,
  diag:["", "Refais le calcul en respectant le signe de $y$ : $2 + 3 × (-1) + 1 = 2 - 3 + 1 = 0$. Le résultat est bien nul.",
        "Tu as sans doute oublié le signe moins de $y = -1$ : $3 × (-1)$ vaut $-3$, pas $+3$.",
        "Il suffit de remplacer $x$ et $y$ par les coordonnées du point : c'est un test immédiat."],
  corr:["Je remplace $x$ par 2 et $y$ par $-1$ dans l'équation.","$2 + 3 × (-1) + 1 = 2 - 3 + 1$.","$= 0$.","Le résultat est nul : le point appartient à la droite."],
  indice:"Remplace les coordonnées dans l'équation. Si tu tombes sur 0, le point est dessus."},

 {id:"gr3", niveau:2, type:"qcm", enonce:"Les droites $d : x - 2y + 3 = 0$ et $d' : 2x - 4y - 1 = 0$ sont :",
  choix:["strictement parallèles","perpendiculaires","confondues","sécantes en un seul point"], bonne:0,
  diag:["", "Teste le produit scalaire des directeurs : $@v{u}(2 ; 1)$ et $@v{u'}(4 ; 2)$ donnent $8 + 2 = 10 ≠ 0$. Elles ne sont pas perpendiculaires.",
        "Les coefficients de $d'$ sont bien le double de ceux de $d$… sauf la constante : $2 × 3 = 6 ≠ -1$. Les droites sont donc parallèles mais distinctes.",
        "Leurs directions sont identiques : $@v{u}(2 ; 1)$ et $@v{u'}(4 ; 2)$ sont colinéaires. Elles ne peuvent pas se couper."],
  corr:["Directeurs : $@v{u}(2 ; 1)$ pour $d$, $@v{u'}(4 ; 2)$ pour $d'$.","Produit en croix : $2 × 2 - 1 × 4 = 0$ → les vecteurs sont colinéaires, donc les droites sont parallèles.","Sont-elles confondues ? En multipliant $d$ par 2 : $2x - 4y + 6 = 0$, alors que $d'$ finit par $-1$.","Les constantes diffèrent : les droites sont strictement parallèles."],
  indice:"Compare d'abord les directions, puis regarde si l'une des équations est un multiple exact de l'autre."},

 {id:"gr4", niveau:2, type:"num", enonce:"La droite $d$ passe par $A(0 ; 3)$ et $B(2 ; 7)$. Son équation réduite s'écrit $y = mx + p$. Que vaut $m$ ?",
  rep:2,
  diag:[{v:3, m:"3 est l'ordonnée à l'origine ($p$), lisible directement puisque $A$ a une abscisse nulle. On demande le coefficient directeur."},
        {v:0.5, m:"Tu as divisé à l'envers. Le coefficient directeur est $@f{y_B - y_A}{x_B - x_A}$ : l'écart des **ordonnées** au numérateur."},
        {v:4, m:"Tu t'es arrêté à l'écart des ordonnées ($7 - 3 = 4$). Il reste à diviser par l'écart des abscisses ($2 - 0 = 2$)."},
        {v:7, m:"Tu as recopié une coordonnée de $B$. Le coefficient directeur se calcule à partir des deux points."}],
  corr:["$m = @f{y_B - y_A}{x_B - x_A}$.","$= @f{7 - 3}{2 - 0} = @f{4}{2}$.","$m = 2$.","(Et comme $A$ a pour abscisse 0, on lit directement $p = 3$ : la droite est $y = 2x + 3$.)"],
  indice:"Le coefficient directeur mesure la montée divisée par l'avancée."},

 {id:"gr5", niveau:2, type:"qcm", enonce:"Quel est le rayon du cercle d'équation $(x + 1)^2 + (y - 4)^2 = 36$ ?",
  choix:["6","36","18","$@r{6}$"], bonne:0,
  diag:["", "36 est $R^2$, pas $R$. Le membre de droite est toujours le **carré** du rayon : il faut prendre la racine.",
        "Tu as divisé par 2. Le rayon s'obtient par une racine carrée, pas par une division.",
        "Tu as pris la racine une fois de trop. $R^2 = 36$ donne $R = @r{36} = 6$, un nombre entier."],
  corr:["Forme générale : $(x - a)^2 + (y - b)^2 = R^2$.","Ici $R^2 = 36$.","$R = @r{36} = 6$.","(Le centre est $(-1 ; 4)$, avec les signes inversés.)"],
  indice:"Le nombre à droite de l'égalité est le carré du rayon."},

 {id:"gr6", niveau:3, type:"num", enonce:"Le cercle de centre $Ω(2 ; -1)$ passe par le point $A(5 ; 3)$. Quel est son rayon ?",
  rep:5,
  diag:[{v:25, m:"Tu t'es arrêté à $R^2 = 25$. Il reste la racine carrée : $R = 5$."},
        {v:7, m:"Tu as additionné les écarts ($3 + 4$). Il faut appliquer Pythagore : $@r{3^2 + 4^2}$, pas une somme."},
        {v:12, m:"Tu as multiplié les écarts. La formule fait intervenir la somme des carrés, sous une racine."}],
  corr:["Le rayon est la distance $ΩA$.","$@v{ΩA}(5 - 2 ; 3 - (-1)) = (3 ; 4)$.","$ΩA = @r{3^2 + 4^2} = @r{9 + 16} = @r{25}$.","$R = 5$."],
  indice:"Le rayon est la distance entre le centre et un point du cercle. Attention au $-(-1)$."},

 {id:"gr7", niveau:3, type:"qcm", enonce:"Quelle droite est perpendiculaire à $d : 2x + y - 3 = 0$ et passe par l'origine ?",
  choix:["$x - 2y = 0$","$2x + y = 0$","$x + 2y = 0$","$2x - y = 0$"], bonne:0,
  diag:["", "Cette droite est **parallèle** à $d$ (mêmes coefficients devant $x$ et $y$), pas perpendiculaire.",
        "Vérifie avec les directeurs : $d$ a pour directeur $(-1 ; 2)$, et $x + 2y = 0$ a pour directeur $(-2 ; 1)$. Leur produit scalaire vaut $2 + 2 = 4 ≠ 0$.",
        "Directeur de cette droite : $(1 ; 2)$. Produit scalaire avec $(-1 ; 2)$ : $-1 + 4 = 3 ≠ 0$. Pas perpendiculaire."],
  corr:["Directeur de $d$ : $@v{u}(-1 ; 2)$.","Une droite perpendiculaire à $d$ a pour directeur un vecteur orthogonal à $@v{u}$, par exemple $(2 ; 1)$.","Son équation est alors de la forme $x - 2y + c = 0$ (dont le directeur est bien $(2 ; 1)$).","Elle passe par l'origine $(0 ; 0)$ : $0 - 0 + c = 0$, donc $c = 0$. Réponse : $x - 2y = 0$."],
  indice:"Cherche la droite dont le vecteur directeur est orthogonal à celui de $d$, puis impose le passage par $(0 ; 0)$."},

 {id:"gr8", niveau:3, type:"qcm", enonce:"Le point $B(1 ; 1)$ et le cercle d'équation $(x - 2)^2 + (y - 3)^2 = 16$. Où se situe $B$ ?",
  choix:["À l'intérieur du cercle","Sur le cercle","À l'extérieur du cercle","Au centre du cercle"], bonne:0,
  diag:["", "En remplaçant, on obtient 5, alors que le cercle correspond à 16. Ce n'est pas égal, donc $B$ n'est pas dessus.",
        "On obtient 5, qui est **inférieur** à 16 : $B$ est plus près du centre que le rayon, donc à l'intérieur.",
        "Le centre est $(2 ; 3)$, pas $(1 ; 1)$. Au centre, le calcul donnerait 0."],
  corr:["Je remplace $x$ par 1 et $y$ par 1 : $(1 - 2)^2 + (1 - 3)^2$.","$= (-1)^2 + (-2)^2 = 1 + 4 = 5$.","Or le cercle correspond à $R^2 = 16$.","$5 < 16$ : le point est plus proche du centre que le rayon, il est donc à l'intérieur."],
  indice:"Remplace les coordonnées et compare le résultat à $R^2$ : plus petit, égal ou plus grand ?"}
]
},

/* ================== 10. ALGORITHMIQUE ET PYTHON ================== */
{
id:"algo", n:10, titre:"Algorithmique et Python",
sous:"Faire calculer la machine",
desc:"Variables, boucles, fonctions, recherche de seuil sur les suites et simulation en probabilités.",
duree:35,
sections:[
 {titre:"Ce que fait un programme", blocs:[
  {t:"idee", x:"Un programme, c'est une **recette exécutée dans l'ordre**, ligne après ligne. Rien de magique : la machine fait exactement ce qui est écrit, y compris les erreurs."},
  {t:"p", x:"En Première, Python sert d'outil : on l'utilise pour explorer des suites, chercher un seuil, ou simuler une expérience aléatoire des milliers de fois. Il n'y a pas d'examen de programmation, mais des questions de lecture et de complétion de code."},
  {t:"formule", titre:"Une variable, c'est une boîte étiquetée", code:true, x:"<b>u = 5</b> range la valeur 5 dans la boîte nommée <b>u</b><br><b>u = u + 3</b> lit le contenu (5), ajoute 3, et range 8 à la place", note:"Le signe = n'est pas une égalité mathématique : c'est un ordre de rangement."},
  {t:"piege", titre:"Le piège du signe égal", x:"En maths, $u = u + 3$ est une équation impossible. En Python, c'est parfaitement normal : cela veut dire « prends la valeur actuelle de u, ajoute 3, et remets le résultat dans u ». La ligne se lit **de droite à gauche**."},
  {t:"exemple", titre:"Exemple guidé — suivre l'exécution", enonce:"Que contient la variable $u$ à la fin de ce programme ?<br><b>u = 2</b><br><b>u = u * 3</b><br><b>u = u + 1</b>", etapes:[
   {q:"Ligne 1", r:"On range 2 dans $u$. Donc $u$ vaut 2."},
   {q:"Ligne 2", r:"On lit $u$ (soit 2), on multiplie par 3, on obtient 6, et on le range dans $u$. Donc $u$ vaut 6."},
   {q:"Ligne 3", r:"On lit $u$ (soit 6), on ajoute 1, on obtient 7, et on le range dans $u$."},
   {q:"Résultat", r:"À la fin, $u$ vaut 7. La méthode sûre : dessine un tableau avec une colonne par variable, et une ligne par instruction."}
  ]}
 ]},

 {titre:"Les boucles : répéter sans se répéter", blocs:[
  {t:"p", x:"Deux boucles suffisent pour tout le programme de Première. La première répète un nombre de fois **connu à l'avance**, la seconde répète **tant qu'une condition est vraie**."},
  {t:"formule", titre:"Boucle « pour » — nombre de tours connu", code:true, x:"<b>for i in range(5):</b><br>&nbsp;&nbsp;&nbsp;&nbsp;<b>u = u + 3</b>", note:"range(5) donne 0, 1, 2, 3, 4 : cinq tours, mais le compteur s'arrête à 4."},
  {t:"formule", titre:"Boucle « tant que » — condition d'arrêt", code:true, x:"<b>while u &lt; 100:</b><br>&nbsp;&nbsp;&nbsp;&nbsp;<b>u = u * 2</b><br>&nbsp;&nbsp;&nbsp;&nbsp;<b>n = n + 1</b>", note:"On répète tant que la condition est vraie. Elle doit finir par devenir fausse, sinon le programme tourne indéfiniment."},
  {t:"piege", titre:"range(5) ne va pas jusqu'à 5", x:"<b>range(5)</b> produit 0, 1, 2, 3, 4 : cinq valeurs, mais la dernière est 4. Pour aller de 1 à 5 inclus, il faut écrire <b>range(1, 6)</b>. C'est la source d'erreur numéro un en lecture de code."},
  {t:"piege", titre:"L'indentation fait partie du code", x:"Les lignes décalées vers la droite sont **à l'intérieur** de la boucle : elles se répètent. Une ligne revenue à gauche s'exécute une seule fois, après la boucle. En Python, ce décalage n'est pas de la décoration."},
  {t:"exemple", titre:"Exemple guidé — une suite arithmétique en Python", enonce:"Que vaut $u$ après ce programme ?<br><b>u = 7</b><br><b>for i in range(4):</b><br>&nbsp;&nbsp;&nbsp;&nbsp;<b>u = u + 3</b>", etapes:[
   {q:"Combien de tours ?", r:"range(4) donne 0, 1, 2, 3 : la boucle tourne **4 fois**."},
   {q:"Que fait chaque tour ?", r:"Il ajoute 3 à $u$. C'est exactement une suite arithmétique de raison 3."},
   {q:"Dérouler", r:"7 → 10 → 13 → 16 → 19."},
   {q:"Résultat", r:"$u$ vaut 19. On le retrouve avec la formule du cours : $u_4 = 7 + 4 × 3 = 19$. ✓"}
  ]}
 ]},

 {titre:"Chercher un seuil", blocs:[
  {t:"idee", x:"C'est **l'exercice type** du programme : « à partir de quelle année la population dépasse-t-elle un million ? ». On ne connaît pas le nombre de tours à l'avance, donc on utilise une boucle « tant que »."},
  {t:"formule", titre:"Le squelette à connaître", code:true, x:"<b>u = 1000</b><br><b>n = 0</b><br><b>while u &lt; 5000:</b><br>&nbsp;&nbsp;&nbsp;&nbsp;<b>u = u * 1.1</b><br>&nbsp;&nbsp;&nbsp;&nbsp;<b>n = n + 1</b><br><b>print(n)</b>", note:"Deux variables : $u$ suit la valeur, $n$ compte les étapes. La réponse est dans $n$."},
  {t:"exemple", titre:"Exemple guidé — comprendre la sortie de boucle", enonce:"Un capital de 1000 € augmente de 10 % par an. Le programme ci-dessus affiche 17. Que signifie ce nombre ?", etapes:[
   {q:"Que compte $n$ ?", r:"Il augmente de 1 à chaque passage dans la boucle, donc il compte le nombre d'années écoulées."},
   {q:"Quand la boucle s'arrête-t-elle ?", r:"Dès que la condition $u < 5000$ devient fausse, c'est-à-dire dès que $u$ atteint ou dépasse 5000."},
   {q:"Interpréter", r:"Il faut 17 ans pour que le capital dépasse 5000 €."},
   {q:"Le point délicat", r:"À la sortie de la boucle, $u$ a **déjà dépassé** le seuil. La valeur affichée est la première année où le dépassement a lieu, pas la dernière année en dessous."}
  ]},
  {t:"piege", titre:"L'oubli du compteur", x:"Si tu oublies la ligne <b>n = n + 1</b> à l'intérieur de la boucle, le programme calcule bien mais n'a rien à afficher. Et si tu la places **en dehors** (non indentée), elle ne s'exécute qu'une fois : $n$ vaudra 1 quel que soit le résultat."},
  {t:"astuce", titre:"Vérifier un seuil sans ordinateur", x:"Fais tourner le programme à la main sur 2 ou 3 tours seulement, dans un tableau. Si les premières valeurs sont bonnes, la logique l'est aussi."}
 ]},

 {titre:"Fonctions et simulation", blocs:[
  {t:"p", x:"Une **fonction** en Python est un bloc de code réutilisable, à qui on donne des valeurs d'entrée et qui renvoie un résultat. C'est la même idée qu'une fonction mathématique."},
  {t:"formule", titre:"Définir et utiliser une fonction", code:true, x:"<b>def terme(u0, r, n):</b><br>&nbsp;&nbsp;&nbsp;&nbsp;<b>return u0 + n * r</b><br><br><b>terme(7, 3, 10)</b> renvoie <b>37</b>", note:"<b>def</b> définit, <b>return</b> renvoie la valeur. Sans return, la fonction ne rend rien."},
  {t:"piege", titre:"print n'est pas return", x:"<b>print</b> affiche une valeur à l'écran ; <b>return</b> la renvoie pour qu'on puisse la réutiliser dans un autre calcul. Une fonction qui fait seulement <b>print</b> ne peut pas être utilisée dans une expression."},
  {t:"formule", titre:"Simuler le hasard", code:true, x:"<b>from random import randint</b><br><b>randint(1, 6)</b> tire un entier au hasard entre 1 et 6 **inclus**", note:"Contrairement à range, randint inclut les deux bornes."},
  {t:"exemple", titre:"Exemple guidé — estimer une probabilité", enonce:"Que fait ce programme ?<br><b>s = 0</b><br><b>for i in range(10000):</b><br>&nbsp;&nbsp;&nbsp;&nbsp;<b>if randint(1, 6) == 6:</b><br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<b>s = s + 1</b><br><b>print(s / 10000)</b>", etapes:[
   {q:"Que fait la boucle ?", r:"Elle lance un dé 10 000 fois."},
   {q:"Que compte $s$ ?", r:"Le double signe <b>==</b> teste l'égalité. À chaque fois que le dé tombe sur 6, $s$ augmente de 1. Donc $s$ compte les 6 obtenus."},
   {q:"Que vaut l'affichage ?", r:"$s ÷ 10000$ est la **fréquence** d'apparition du 6."},
   {q:"Résultat attendu", r:"Environ 0,167, c'est-à-dire $@f{1}{6}$. Le programme estime la probabilité par l'expérience."},
   {q:"À retenir", r:"Une fréquence observée s'approche de la probabilité théorique quand le nombre d'essais est grand. C'est ce qui justifie les simulations."}
  ]},
  {t:"piege", titre:"Un seul égal ou deux ?", x:"<b>=</b> range une valeur dans une variable. <b>==</b> pose une question : « est-ce égal ? ». Dans un test <b>if</b>, il en faut toujours **deux**."}
 ]}
],
exos:[
 {id:"al1", niveau:1, type:"num", enonce:"Que vaut $u$ à la fin ? <br><b>u = 4</b><br><b>u = u * 5</b><br><b>u = u - 2</b>",
  rep:18,
  diag:[{v:20, m:"Tu t'es arrêté à la deuxième ligne. La troisième s'exécute aussi : $20 - 2 = 18$."},
        {v:12, m:"Tu as fait $4 × 5 - 2$ dans le désordre, ou $(4-2) × ...$. Les lignes s'exécutent strictement dans l'ordre : d'abord la multiplication, puis la soustraction."},
        {v:4, m:"Tu as gardé la valeur initiale. Les lignes suivantes modifient bien $u$ : chaque affectation remplace l'ancien contenu."}],
  corr:["Ligne 1 : $u = 4$.","Ligne 2 : $u = 4 × 5 = 20$.","Ligne 3 : $u = 20 - 2 = 18$.","À la fin, $u$ vaut 18."],
  indice:"Exécute ligne par ligne en notant la valeur de $u$ après chacune."},

 {id:"al2", niveau:1, type:"qcm", enonce:"Combien de fois la boucle <b>for i in range(6):</b> s'exécute-t-elle ?",
  choix:["6 fois","5 fois","7 fois","1 fois"], bonne:0,

 {id:"al4", niveau:2, type:"qcm", enonce:"Dans le programme <b>u = 100</b> / <b>n = 0</b> / <b>while u &lt; 500:</b> / <b>&nbsp;&nbsp;&nbsp;u = u * 2</b> / <b>&nbsp;&nbsp;&nbsp;n = n + 1</b>, que représente $n$ à la fin ?",

        "500 est le seuil écrit dans la condition, il ne change jamais. $n$ est un compteur qui part de 0.",
        "La boucle s'arrête précisément quand $u$ n'est plus inférieur à 500 : après la boucle, cela n'arrive plus jamais."],
  corr:["$n$ part de 0 et augmente de 1 à chaque passage dans la boucle.","La boucle se répète tant que $u$ est strictement inférieur à 500.","Chaque passage double $u$.","Donc $n$ compte le nombre de doublements nécessaires pour que $u$ atteigne ou dépasse 500 (ici 3 : 100 → 200 → 400 → 800)."],
  indice:"Regarde ce qui fait varier $n$ : une seule ligne le modifie. Que compte-t-elle ?"},

 {id:"al5", niveau:2, type:"num", enonce:"Pour le programme précédent ($u = 100$, doublement, seuil 500), quelle valeur $n$ affiche-t-il à la fin ?",
  rep:3,
  diag:[{v:4, m:"Tu as fait un tour de trop. Après trois doublements, $u = 800$, qui n'est plus inférieur à 500 : la boucle s'arrête là."},
        {v:2, m:"Après deux tours, $u = 400$, encore inférieur à 500 : la boucle continue. Il faut un troisième tour."},
        {v:800, m:"800 est la valeur finale de $u$, pas celle de $n$. Le compteur $n$ compte les tours."}],
  corr:["Départ : $u = 100$, $n = 0$.","Tour 1 : $u = 200$, $n = 1$. Comme $200 < 500$, on continue.","Tour 2 : $u = 400$, $n = 2$. Comme $400 < 500$, on continue.","Tour 3 : $u = 800$, $n = 3$. Cette fois $800 ≥ 500$ : la boucle s'arrête. On affiche 3."],
  indice:"Fais un tableau à deux colonnes, $u$ et $n$, et arrête-toi dès que la condition devient fausse."},

 {id:"al6", niveau:3, type:"qcm", enonce:"On veut compléter <b>def terme(u0, r, n): return ____</b> pour qu'elle donne le terme de rang $n$ d'une suite **arithmétique**. Que faut-il écrire ?",
  choix:["u0 + n * r","u0 * r ** n","u0 + r","n * r"], bonne:0,
  diag:["", "C'est la formule d'une suite **géométrique** ($u_0 × q^n$). Pour une arithmétique, on additionne la raison, on ne la multiplie pas.",

        "Tu as oublié le terme de départ $u_0$. La formule complète est $u_0 + n × r$."],

 {id:"al7", niveau:3, type:"num", enonce:"Ce programme lance 6000 dés et compte les 6. La valeur affichée par <b>print(s / 6000)</b> sera proche de quel nombre ? (arrondir au centième)",

  corr:["Sur un dé équilibré, la probabilité d'obtenir 6 vaut $@f{1}{6}$.","Sur 6000 lancers, on attend donc environ 1000 succès.","Le programme affiche $s ÷ 6000$, soit environ $@f{1000}{6000} = @f{1}{6}$.","$@f{1}{6} ≈ 0{,}17$."],

 {id:"al8", niveau:3, type:"qcm", enonce:"Dans une boucle <b>while</b>, qu'arrive-t-il si la condition ne devient jamais fausse ?",
  choix:["Le programme tourne indéfiniment",

  diag:["", "Il n'existe aucune limite automatique de tours. C'est au programme de prévoir sa propre sortie.",
        "Python n'a aucun moyen de savoir qu'une boucle est infinie : il exécute simplement ce qu'on lui demande. Aucune erreur n'est signalée.",
        "Une boucle ne s'exécute pas si la condition est fausse **dès le départ**. Ici c'est le contraire : elle est toujours vraie."],
  corr:["Une boucle while répète son bloc tant que la condition est vraie.","Si rien à l'intérieur ne fait évoluer la condition vers le faux, elle reste vraie pour toujours.","Le programme ne s'arrête jamais de lui-même.","C'est pourquoi il faut toujours vérifier qu'une variable de la condition est bien modifiée à l'intérieur de la boucle."],

</script>
<script>
(function(){
"use strict";
var A = window.APP, COURS = window.COURS || [];
var T=A.T, M=A.M, el=A.el, $=A.$, $$=A.$$, S=A.S;

/* fonctions traçables (pas d'eval : compatible avec la politique de sécurité) */
var PLOTS = {
  "x*x-2*x-3": function(x){ return x*x-2*x-3; },
  "x*x-6*x+5": function(x){ return x*x-6*x+5; },
  "Math.exp(x)": function(x){ return Math.exp(x); },
  "Math.cos(x)": function(x){ return Math.cos(x); },
  "Math.sin(x)": function(x){ return Math.sin(x); }
};

/* les chapitres s'affichent dans l'ordre du programme, pas dans l'ordre
   où les fichiers de contenu ont été chargés */
COURS.sort(function(a,b){ return a.n - b.n; });

var route = { page:"accueil", chap:null, onglet:"cours", fiche:null };

/* ===================================================================
   Totaux et progression
   =================================================================== */
function totalSections(c){ return c.sections.length; }
function nbLu(c){ return A.chapState(c.id).lu.length; }
function nbExoOk(c){
  var e=A.chapState(c.id).exos, n=0;
  c.exos.forEach(function(x){ if(e[x.id] && e[x.id].ok) n++; });
  return n;
}
function progChap(c){
  var tot = totalSections(c) + c.exos.length;
  return A.pct(nbLu(c) + nbExoOk(c), tot);
}
function progGlobale(){
  var f=0,t=0;
  COURS.forEach(function(c){ t += totalSections(c)+c.exos.length; f += nbLu(c)+nbExoOk(c); });
  return { fait:f, total:t, pct:A.pct(f,t) };
}
/* cartes de révision espacée, résolues en couples chapitre/exercice */
function carteVersExo(c){
  var ch = COURS.filter(function(x){ return x.id===c.chapId; })[0];
  if(!ch){
    var f = (S.perso||[]).filter(function(p){ return "perso:"+p.id===c.chapId; })[0];
    if(!f) return null;
    ch = { id:c.chapId, n:0, titre:f.titre, exos:f.fiche.exercices };
  }
  var ex = ch.exos.filter(function(x){ return x.id===c.exoId; })[0];
  return ex ? { chap:ch, exo:ex, carte:c } : null;
}
function dues(){ return A.srsDues().map(carteVersExo).filter(Boolean); }
function planifiees(){ return A.srsCartes().map(carteVersExo).filter(Boolean); }

/* ===================================================================
   Rendu des blocs de cours
   =================================================================== */
function bloc(b){
  switch(b.t){
    case "p":     return '<p>'+T(b.x)+'</p>';
    case "idee":  return callout("co-idee","L'idée en une phrase",b.x);
    case "piege": return callout("co-piege",b.titre||"Attention",b.x);
    case "astuce":return callout("co-astuce",b.titre||"Astuce",b.x);
    case "formule":
      return '<div class="formula'+(b.code?" fcode":"")+'"><div class="ft">'+T(b.titre||"À retenir")+'</div>'+
             '<div class="mblock">'+T(b.x)+'</div>'+
             (b.note?'<div class="fn2">'+T(b.note)+'</div>':'')+'</div>';
    case "liste":
      return '<ul class="ul">'+b.items.map(function(i){return '<li>'+T(i)+'</li>';}).join("")+'</ul>';
    case "tbl":
      return '<div class="tblWrap"><table class="tbl"><thead><tr>'+
        b.head.map(function(x){return '<th>'+T(x)+'</th>';}).join("")+'</tr></thead><tbody>'+
        b.rows.map(function(r){return '<tr>'+r.map(function(x){return '<td>'+T(x)+'</td>';}).join("")+'</tr>';}).join("")+
        '</tbody></table></div>';
    case "mb":    return '<div class="mblock">'+T(b.x)+'</div>';
    default:      return "";
  }
}
function callout(cls,titre,x){
  return '<div class="callout '+cls+'"><div class="ct">'+T(titre)+'</div><p>'+T(x)+'</p></div>';
}

/* exemple guidé : les étapes se dévoilent une par une */
function demoNode(b){
  var box = el("div","demo");
  box.innerHTML = '<div class="demoHead"><div class="dt">'+T(b.titre||"Exemple guidé")+'</div>'+
                  '<div style="margin-top:4px">'+T(b.enonce)+'</div></div>';
  var body = el("div","demoBody");
  var revealed = 0;
  b.etapes.forEach(function(e,i){
    var st = el("div","step hidden");
    st.innerHTML = '<div class="sn">'+(i+1)+'</div><div><div class="sq">'+T(e.q)+'</div>'+
                   '<div class="sr">'+T(e.r)+'</div></div>';
    body.appendChild(st);
  });
  var act = el("div","row");
  var bNext = el("button","btn pri","Montrer l'étape 1");
  var bAll  = el("button","btn gho","Tout afficher");
  act.appendChild(bNext); act.appendChild(bAll);
  body.appendChild(act);
  function show(n){
    var steps = $$(".step", body);
    for(var i=0;i<n;i++){ steps[i].classList.remove("hidden"); steps[i].classList.add("on"); }
    revealed = n;
    if(revealed >= b.etapes.length){ bNext.remove(); bAll.remove(); }
    else bNext.textContent = "Montrer l'étape "+(revealed+1);
  }
  bNext.onclick=function(){ show(revealed+1); };
  bAll.onclick =function(){ show(b.etapes.length); };
  box.appendChild(body);
  return box;
}

/* mini-question intégrée au cours */
function checkNode(b){
  var box = el("div","card pad");
  box.innerHTML = '<div class="row" style="margin-bottom:8px"><span class="tag b">Vérification rapide</span></div>'+
                  '<div class="enonce">'+T(b.q)+'</div>';
  var ch = el("div","choices");
  b.choix.forEach(function(c,i){
    var btn = el("button","choice");
    btn.innerHTML = '<span class="k">'+"ABCD".charAt(i)+'</span><span>'+T(c)+'</span>';
    btn.onclick = function(){
      $$(".choice",ch).forEach(function(x){ x.disabled=true; });
      btn.dataset.state = (i===b.bonne) ? "good" : "bad";
      if(i!==b.bonne) $$(".choice",ch)[b.bonne].dataset.state="good";
      var fb = el("div","fb "+(i===b.bonne?"good":"bad"));
      fb.innerHTML = '<div class="fbt">'+(i===b.bonne ? "✓ C’est ça" : "✗ Pas tout à fait")+'</div><p>'+T(b.expl[i])+'</p>';
      box.appendChild(fb);
    };
    ch.appendChild(btn);
  });
  box.appendChild(ch);
  return box;
}

/* petite courbe tracée au canvas */
function plotNode(b){
  var wrap = el("div","card pad");
  wrap.innerHTML = '<div class="eyebrow" style="margin-bottom:10px">'+T(b.titre||"Courbe")+'</div>';
  var cv = el("canvas","plot");
  var W=460, H=300; cv.width=W*2; cv.height=H*2; cv.style.height=H+"px";
  wrap.appendChild(cv);
  if(b.note) wrap.appendChild(el("div","small muted",'<div style="text-align:center;margin-top:10px">'+T(b.note)+'</div>'));
  var f = PLOTS[b.f];
  if(!f) return wrap;
  var cs = getComputedStyle(document.body);
  var cLine = cs.getPropertyValue("--line2").trim() || "#ccc";
  var cInk  = cs.getPropertyValue("--ink3").trim()  || "#888";
  var cAcc  = cs.getPropertyValue("--bleu").trim()  || "#2B49CF";
  var ctx = cv.getContext("2d"); ctx.scale(2,2);
  var x0=b.xmin, x1=b.xmax, ys=[], i;
  for(i=0;i<=200;i++){ var v=f(x0+(x1-x0)*i/200); if(isFinite(v)) ys.push(v); }
  var y0=Math.min.apply(null,ys), y1=Math.max.apply(null,ys);
  var pad=(y1-y0)*0.15||1; y0-=pad; y1+=pad;
  function px(x){ return 30+(x-x0)/(x1-x0)*(W-45); }
  function py(y){ return H-28-(y-y0)/(y1-y0)*(H-45); }
  ctx.strokeStyle=cLine; ctx.lineWidth=1;
  for(i=Math.ceil(x0);i<=x1;i++){ ctx.beginPath(); ctx.moveTo(px(i),8); ctx.lineTo(px(i),H-20); ctx.stroke(); }
  ctx.strokeStyle=cInk; ctx.lineWidth=1.5;
  if(y0<0&&y1>0){ ctx.beginPath(); ctx.moveTo(px(x0),py(0)); ctx.lineTo(px(x1),py(0)); ctx.stroke(); }
  if(x0<0&&x1>0){ ctx.beginPath(); ctx.moveTo(px(0),py(y0)); ctx.lineTo(px(0),py(y1)); ctx.stroke(); }
  ctx.strokeStyle=cAcc; ctx.lineWidth=2.6; ctx.beginPath();
  for(i=0;i<=300;i++){
    var x=x0+(x1-x0)*i/300, y=f(x);
    if(!isFinite(y)) continue;
    if(i===0) ctx.moveTo(px(x),py(y)); else ctx.lineTo(px(x),py(y));
  }
  ctx.stroke();
  ctx.fillStyle=cInk; ctx.font="11px system-ui";
  ctx.fillText(String(x0), px(x0)-4, H-8); ctx.fillText(String(x1), px(x1)-8, H-8);
  return wrap;
}

function sectionNode(c, sec, idx){
  var wrap = el("section");
  var head = el("div","secHead");
  head.innerHTML = '<span class="n">'+(idx+1)+'</span><h2>'+T(sec.titre)+'</h2>';
  wrap.appendChild(head);
  var body = el("div","lesson"); body.style.marginTop="14px";
  sec.blocs.forEach(function(b){
    if(b.t==="exemple") body.appendChild(demoNode(b));
    else if(b.t==="check") body.appendChild(checkNode(b));
    else if(b.t==="plot") body.appendChild(plotNode(b));
    else { var d=el("div"); d.innerHTML=bloc(b); if(d.firstChild) body.appendChild(d.firstChild); }
  });
  wrap.appendChild(body);
  // marquer la section comme comprise
  var st = A.chapState(c.id);
  var done = st.lu.indexOf(idx)>=0;
  var b2 = el("button","btn "+(done?"":"pri"), done? "✓ Section comprise" : "Marquer comme comprise");
  b2.style.marginTop="20px";
  b2.onclick=function(){
    var k=st.lu.indexOf(idx);
    if(k>=0){ st.lu.splice(k,1); b2.className="btn pri"; b2.textContent="Marquer comme comprise"; }
    else { st.lu.push(idx); b2.className="btn"; b2.textContent="✓ Section comprise"; A.toast("Section validée"); }
    A.save(); paintRail();
  };
  wrap.appendChild(b2);
  return wrap;
}

/* ===================================================================
   Moteur d'exercices
   =================================================================== */
function diagnostic(exo, saisie){
  // 1. diagnostic précis prévu par le cours
  if(exo.type==="num"){
    var v = A.parseNum(saisie);
    if(isNaN(v)) return "Je n'ai pas réussi à lire ce nombre. Écris-le en chiffres, par exemple <b>3,5</b> ou <b>7/2</b>.";
    if(exo.diag) for(var i=0;i<exo.diag.length;i++){
      if(Math.abs(v - exo.diag[i].v) < (exo.tol||0.0005)) return exo.diag[i].m;
    }
    // 2. diagnostics génériques
    var r = exo.rep;
    if(Math.abs(v + r) < 0.001 && r!==0) return "Ton résultat est le bon nombre, mais avec le mauvais signe. Reprends ton calcul en surveillant chaque « moins » : c'est presque toujours là que ça se joue.";
    if(r!==0 && Math.abs(v - 2*r) < 0.001) return "Ton résultat est exactement le double de la bonne réponse. Tu as probablement oublié une division par 2 quelque part.";
    if(r!==0 && Math.abs(v - r/2) < 0.001) return "Ton résultat est la moitié de la bonne réponse. Il manque un facteur 2 dans ton calcul.";
    if(r!==0 && Math.abs(v - r) < Math.abs(r)*0.05) return "Tu es tout près : l'erreur vient d'un arrondi ou d'une petite imprécision de calcul. Refais la dernière étape sans arrondir en cours de route.";
    return "Ce n'est pas la bonne valeur. Reprends la correction ci-dessous étape par étape et compare avec ton propre calcul : repère la première ligne où vous divergez.";
  }
  if(exo.type==="txt"){
    var n = A.norm(saisie);
    if(exo.diag) for(var j=0;j<exo.diag.length;j++){
      if(n.indexOf(A.norm(exo.diag[j].r))>=0) return exo.diag[j].m;
    }
    return "Ce n'est pas la réponse attendue. Regarde la correction : la formulation exacte compte ici.";
  }
  return "";
}

function exoNode(c, exo, onDone, onResult){
  var box = el("div","card pad");
  var st = A.chapState(c.id);
  var etat = st.exos[exo.id] || { ok:false, tries:0 };
  var essais = 0, fini = false;

  var top = el("div","exoTop");
  top.innerHTML = '<span class="tag b">Exercice</span>'+
    '<span class="pill">Niveau '+exo.niveau+'</span>'+
    (etat.ok?'<span class="tag v">✓ Déjà réussi</span>':'');
  box.appendChild(top);
  box.appendChild(el("div","enonce", T(exo.enonce)));

  var zone = el("div");
  box.appendChild(zone);
  var actions = el("div","row"); actions.style.marginTop="14px";
  var bIndice = el("button","btn gho sm","Un indice ?");
  actions.appendChild(bIndice);
  box.appendChild(actions);

  bIndice.onclick = function(){
    if($(".hint",box)) return;
    var hn = el("div","hint");
    hn.innerHTML = '<div class="ct">Indice</div><p>'+T(exo.indice)+'</p>';
    box.insertBefore(hn, actions);
  };

  function fin(ok, message){
    fini = true;
    etat = { ok:ok, tries:essais, ts:A.nowISO() };
    st.exos[exo.id] = etat;
    // Les exercices générés à la volée ne sont pas rejouables : leurs nombres
    // sont tirés au hasard et l'énoncé n'existe plus après coup. Les mettre en
    // révision espacée créerait des cartes impossibles à retrouver.
    if(c.id !== "entrainement") A.srsMaj(c.id, exo.id, ok, { titre:c.titre });
    A.save(); paintRail();
    var fb = el("div","fb "+(ok?"good":"bad"));
    fb.innerHTML = '<div class="fbt">'+(ok ? "✓ Bonne réponse" : "✗ Ce n’est pas ça")+'</div><p>'+T(message)+'</p>';
    box.insertBefore(fb, actions);
    var corr = el("div","corr");
    corr.innerHTML = '<div class="ct">La méthode, étape par étape</div><ol>'+
      exo.corr.map(function(s){ return '<li>'+T(s)+'</li>'; }).join("")+'</ol>';
    box.insertBefore(corr, actions);
    actions.innerHTML="";
    var bRe = el("button","btn sm","Refaire cet exercice");
    bRe.onclick=function(){ var p=box.parentNode, nb=exoNode(c,exo,onDone); p.replaceChild(nb,box); };
    actions.appendChild(bRe);
    if(onDone){ var bN=el("button","btn pri sm","Exercice suivant →"); bN.onclick=onDone; actions.appendChild(bN); }
    // point d'accroche pour la couche IA (présente seulement en version connectée)
    if(window.IA_BOUTON) window.IA_BOUTON(exo, actions, box, ok);
    if(onResult) onResult(ok, actions);
  }

  function faux(msg){
    var fb = el("div","fb bad");
    fb.innerHTML = '<div class="fbt">✗ Regarde de plus près</div><p>'+T(msg)+'</p>'+
      '<p class="small" style="margin-top:8px;opacity:.85">Il te reste un essai. Corrige et retente.</p>';
    box.insertBefore(fb, actions);
    setTimeout(function(){ fb.scrollIntoView({behavior:"smooth", block:"nearest"}); },60);
  }

  if(exo.type==="qcm"){
    var ch = el("div","choices");
    exo.choix.forEach(function(cx,i){
      var btn = el("button","choice");
      btn.innerHTML='<span class="k">'+"ABCD".charAt(i)+'</span><span>'+T(cx)+'</span>';
      btn.onclick=function(){
        if(fini) return;
        essais++;
        if(i===exo.bonne){
          $$(".choice",ch).forEach(function(x){x.disabled=true;});
          btn.dataset.state="good";
          fin(true, essais===1 ? "Du premier coup, et avec la bonne méthode." : "C'est la bonne réponse. Relis la méthode ci-dessous pour la retrouver plus vite la prochaine fois.");
        } else {
          btn.dataset.state="bad"; btn.disabled=true;
          var msg = exo.diag[i] || "Ce choix ne convient pas.";
          if(essais>=2){
            $$(".choice",ch).forEach(function(x){x.disabled=true;});
            $$(".choice",ch)[exo.bonne].dataset.state="good";
            fin(false, msg);
          } else faux(msg);
        }
      };
      ch.appendChild(btn);
    });
    zone.appendChild(ch);
  } else {
    var rowIn = el("div","inputRow");
    var inp = el("input","inp");
    inp.type="text";
    inp.placeholder = exo.type==="num" ? "Ta réponse en chiffres…" : "Ta réponse…";
    inp.setAttribute("aria-label","Ta réponse");
    var bOk = el("button","btn pri","Vérifier");
    rowIn.appendChild(inp); rowIn.appendChild(bOk);
    if(exo.unite) rowIn.appendChild(el("span","muted small",A.esc(exo.unite)));
    zone.appendChild(rowIn);
    function verifier(){
      if(fini) return;
      var val = inp.value.trim();
      if(!val){ inp.focus(); return; }
      essais++;
      var ok;
      if(exo.type==="num"){
        var v=A.parseNum(val);
        ok = !isNaN(v) && Math.abs(v-exo.rep) <= (exo.tol!=null?exo.tol:0.0005);
      } else {
        var n=A.norm(val);
        ok = exo.reps.some(function(r){ return A.norm(r)===n || n.indexOf(A.norm(r))>=0; });
      }
      if(ok){
        inp.className="inp good"; inp.disabled=true; bOk.disabled=true;
        fin(true, essais===1 ? "Exact, du premier coup." : "C'est la bonne réponse.");
      } else {
        inp.className="inp bad";
        var msg = diagnostic(exo, val);
        if(essais>=2){ inp.disabled=true; bOk.disabled=true; fin(false, msg); }
        else faux(msg);
      }
    }
    bOk.onclick=verifier;
    inp.addEventListener("keydown",function(e){ if(e.key==="Enter") verifier(); });
  }
  return box;
}

<script>
/* =====================================================================
   Import de cours personnels : texte, PDF, image
   + passerelle vers Claude pour produire une fiche complète
   ===================================================================== */
(function(){
"use strict";
var A = window.APP, T=A.T, el=A.el, $=A.$, S=A.S;

/* ---------- brouillon en cours d'import ---------- */
var draft = { titre:"", source:"texte", texte:"", image:null, qualite:null };

/* ---------- extraction PDF (sans bibliothèque externe) ---------- */
function latin1(u8){
  var s="", CH=8192;
  for(var i=0;i<u8.length;i+=CH) s+=String.fromCharCode.apply(null,u8.subarray(i,i+CH));
  return s;
}
function unesc(s){
  return s.replace(/\\([nrtbf()\\]|[0-7]{1,3})/g,function(m,g){
    if(g==="n") return "\n"; if(g==="r") return "\n"; if(g==="t") return " ";
    if(g==="b"||g==="f") return "";
    if(g==="("||g===")"||g==="\\") return g;
    return String.fromCharCode(parseInt(g,8));
  });
}
function opsToText(s){
  var res="", re=/\[((?:\\.|[^\]\\])*)\]\s*TJ|\(((?:\\.|[^\\()])*)\)\s*Tj|(T\*|Td|TD|ET)/g, m;
  while((m=re.exec(s))!==null){
    if(m[1]!=null){
      var r2=/\(((?:\\.|[^\\()])*)\)|(-?\d+(?:\.\d+)?)/g, m2;
      while((m2=r2.exec(m[1]))!==null){
        if(m2[1]!=null) res+=unesc(m2[1]);
        else if(parseFloat(m2[2]) < -130) res+=" ";
      }
    } else if(m[2]!=null){ res+=unesc(m[2]); }
    else res+="\n";
  }
  return res;
}
function inflate(u8){
  if(typeof DecompressionStream==="undefined") return Promise.reject();
  function go(fmt){
    var ds=new DecompressionStream(fmt);
    return new Response(new Blob([u8]).stream().pipeThrough(ds)).arrayBuffer();
  }
  return go("deflate").catch(function(){ return go("deflate-raw"); })
    .then(function(ab){ return latin1(new Uint8Array(ab)); });
}
function extrairePdf(buf){
  var bytes=new Uint8Array(buf), raw=latin1(bytes);
  var jobs=[], idx=0;
  while(true){
    var s=raw.indexOf("stream", idx); if(s<0) break;
    var e=raw.indexOf("endstream", s); if(e<0) break;
    var st=s+6;
    if(raw.charAt(st)==="\r") st++;
    if(raw.charAt(st)==="\n") st++;
    jobs.push(bytes.subarray(st,e));
    idx=e+9;
    if(jobs.length>900) break;
  }
  return Promise.all(jobs.map(function(sl){
    return inflate(sl).catch(function(){ return latin1(sl); });
  })).then(function(parts){
    var out=[];
    parts.forEach(function(p){
      if(p && (p.indexOf("Tj")>=0 || p.indexOf("TJ")>=0)) out.push(opsToText(p));
    });
    return nettoyer(out.join("\n"));
  });
}
function nettoyer(t){
  var s = String(t);
  s = s.split("").filter(function(ch){
    var c = ch.charCodeAt(0);
    return c > 31 || c === 9 || c === 10 || c === 13;
  }).join("");
  return s.replace(/\r/g,"\n").replace(/[ \t]+/g," ").replace(/\n{3,}/g,"\n\n").trim();
}
/* qualité de l'extraction : lisible ou charabia ? */
function qualite(t){
  if(!t || t.length<40) return "vide";
  var lettres=(t.match(/[a-zA-ZÀ-ÿ]/g)||[]).length;
  var espaces=(t.match(/ /g)||[]).length;
  if(lettres/t.length < 0.45) return "faible";
  if(espaces/t.length < 0.06) return "faible";
  return "ok";
}

/* ---------- résumé automatique local (fonctionne sans IA) ---------- */
var MOTS_CLES = ["definition","théorème","theoreme","propriété","propriete","remarque",
                 "exemple","méthode","methode","formule","démonstration","demonstration","attention"];
function ficheLocale(texte, titre){
  var lignes = texte.split(/\n+/).map(function(l){return l.trim();}).filter(Boolean);
  var sections=[], cur=null;
  lignes.forEach(function(l){
    var court = l.length<70;
    var numerote = /^([IVX]+[\.\)]|\d+[\.\)]|[A-Z][\.\)])\s/.test(l);
    var majuscules = court && l===l.toUpperCase() && /[A-ZÀ-Ý]/.test(l);
    if((court && numerote) || majuscules){
      cur = { titre:l.replace(/^[IVX\d A-Z]+[\.\)]\s*/,"") || l, paras:[] };
      sections.push(cur);
    } else {
      if(!cur){ cur={ titre:"Contenu du cours", paras:[] }; sections.push(cur); }
      cur.paras.push(l);
    }
  });
  if(!sections.length) sections=[{titre:"Contenu du cours", paras:lignes}];
  var pointsCles=[];
  lignes.forEach(function(l){
    var bas=l.toLowerCase();
    for(var i=0;i<MOTS_CLES.length;i++){
      if(bas.indexOf(MOTS_CLES[i])===0 || bas.indexOf(MOTS_CLES[i]+" ")>=0){
        if(l.length>15 && l.length<320 && pointsCles.length<10) pointsCles.push(l);
        break;
      }
    }
  });
  return {
    resume: sections[0].paras.slice(0,2).join(" ").slice(0,420) || "Fiche construite à partir du document importé.",
    prerequis: [],
    auto: true,
    sections: sections.slice(0,12).map(function(s){
      return { titre:s.titre, idee:"", explication:s.paras.join("\n\n").slice(0,2600),
               formules:[], exemple:null, piege:"" };
    }),
    pointsCles: pointsCles,
    exercices: []
  };
}

/* ---------- lecture d'une réponse de Claude ---------- */
function lireReponse(txt){
  var t = String(txt||"").trim();
  t = t.replace(/^```(?:json)?\s*/i,"").replace(/```\s*$/,"").trim();
  var i=t.indexOf("{"), j=t.lastIndexOf("}");
  if(i>=0 && j>i){
    try{
      var o=JSON.parse(t.slice(i,j+1));
      if(o && (o.sections || o.exercices)) return normaliser(o);
    }catch(e){}
  }
  return markdownVersFiche(t);
}
function normaliser(o){
  var f = {
    resume:o.resume||"", prerequis:o.prerequis||[], auto:false,
    sections:(o.sections||[]).map(function(s){
      return { titre:s.titre||"Partie", idee:s.idee||"", explication:s.explication||"",
               formules:s.formules||[], exemple:s.exemple||null, piege:s.piege||"" };
    }),
    exercices:(o.exercices||[]).map(function(x,i){
      var e = {
        id:"p"+i+"_"+Math.random().toString(36).slice(2,6),
        type:x.type==="num"?"num":(x.type==="txt"?"txt":"qcm"),
        niveau:x.niveau||1, enonce:x.enonce||"",
        corr:x.corr||["Reprends l’énoncé et applique la méthode du cours."],
        indice:x.indice||"Relis la partie du cours qui traite de cette notion."
      };
      if(e.type==="qcm"){
        e.choix=x.choix||[]; e.bonne=(typeof x.bonne==="number")?x.bonne:0;
        e.diag=x.diag||e.choix.map(function(){return "Ce choix ne convient pas.";});
      } else if(e.type==="num"){
        e.rep=Number(x.rep); e.tol=(x.tol!=null)?Number(x.tol):0.001; e.diag=x.diag||[];
      } else {
        e.reps=x.reps||[x.rep||""]; e.diag=x.diag||[];
      }
      return e;
    })
  };
  if(o.titre) f.titreSuggere=o.titre;
  return f;
}
function markdownVersFiche(t){
  var secs=[], cur=null;
  t.split(/\n/).forEach(function(l){
    var m=l.match(/^#{1,4}\s+(.*)/);
    if(m){ cur={titre:m[1].trim(), idee:"", explication:"", formules:[], exemple:null, piege:""}; secs.push(cur); }
    else if(cur){ cur.explication += l+"\n"; }
  });
  if(!secs.length) secs=[{titre:"Fiche", idee:"", explication:t, formules:[], exemple:null, piege:""}];
  return { resume:"Fiche importée depuis une réponse en texte libre.", prerequis:[],
           auto:false, sections:secs, exercices:[] };
}

/* ---------- presse-papiers ---------- */
function copier(txt, ok){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ A.toast(ok); },
      function(){ A.toast("Copie impossible — sélectionne le texte à la main."); });
  } else A.toast("Copie impossible — sélectionne le texte à la main.");
}

/* ---------- sauvegarde du cahier ---------- */
function exporter(){
  var data = JSON.stringify({ version:1, exporte:A.nowISO(), etat:S }, null, 2);
  if(!window.claude || !window.claude.use){
    copier(data,"Sauvegarde copiée dans le presse-papiers."); return;
  }
  window.claude.use("downloads").then(function(dl){
    if(!dl){ copier(data,"Sauvegarde copiée dans le presse-papiers."); return; }
    return dl.save({ filename:"cahier-premiere-sauvegarde.json", data:data })
      .then(function(){ A.toast("Sauvegarde enregistrée."); })
      .catch(function(err){
        if(err && err.code==="declined") return;
        copier(data,"Sauvegarde copiée dans le presse-papiers.");
      });
  }).catch(function(){ copier(data,"Sauvegarde copiée dans le presse-papiers."); });
}
function importerSauvegarde(txt){
  try{
    var o=JSON.parse(txt);
    var e=o.etat||o;
    if(e.chap)      S.chap=e.chap;
    if(e.perso)     S.perso=e.perso;
    if(e.srs)       S.srs=e.srs;              // révision espacée
    if(e.controles) S.controles=e.controles;  // historique des contrôles
    if(e.entrain)   S.entrain=e.entrain;      // statistiques d'entraînement
    if(e.theme)     S.theme=e.theme;
    A.applyTheme();
    A.save(); A.toast("Sauvegarde restaurée."); window.RENDER();
  }catch(err){ A.toast("Ce fichier n’est pas une sauvegarde valide."); }
}
