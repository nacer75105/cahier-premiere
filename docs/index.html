window.COURS = (window.COURS || []).concat([

/* ========================= 5. TRIGONOMÉTRIE ========================= */
{
id:"trigo", n:5, titre:"Trigonométrie",
sous:"Tourner autour du cercle",
desc:"Radians, cercle trigonométrique, cosinus et sinus, angles associés et équations.",
duree:35,
sections:[
 {titre:"Une nouvelle unité d'angle : le radian", blocs:[
  {t:"idee", x:"Le radian mesure un angle par la **longueur d'arc** qu'il découpe sur un cercle de rayon 1. Un tour complet mesure $2π$ radians."},
  {t:"p", x:"D'abord, à quoi sert toute la trigonométrie. Elle décrit **ce qui se répète**. Les marées qui montent et descendent deux fois par jour. Le courant alternatif de la prise électrique, qui change de sens cinquante fois par seconde. Un son, qui n'est qu'une vibration régulière de l'air. Le balancement d'une balançoire. Chaque fois qu'un phénomène revient au même état à intervalles réguliers, ce sont le cosinus et le sinus qui le décrivent."},
  {t:"p", x:"Et pourquoi un **cercle** pour étudier ça ? Parce qu'un cercle est la forme du « ça recommence » : quand on a fait un tour, on est revenu au point de départ. Enrouler un phénomène périodique autour d'un cercle, c'est le moyen le plus naturel de le représenter."},
  {t:"p", x:"Reste la question des degrés. Pourquoi 360 ? C'est un héritage des Babyloniens, un choix arbitraire — 360 se divise bien, voilà tout. Le radian, lui, n'est pas arbitraire : il mesure l'angle par **la longueur de l'arc parcouru sur un cercle de rayon 1**. Faire un tour complet, c'est parcourir la circonférence, soit $2π$. L'unité vient de la géométrie elle-même, pas d'une convention."},
  {t:"p", x:"Ce n'est pas qu'une question d'élégance : en radians, les formules de dérivation des fonctions trigonométriques deviennent simples. En degrés, elles traîneraient un facteur $@f{π}{180}$ partout. C'est pour cette raison très pratique que les mathématiciens ont changé d'unité."},
  {t:"tbl", head:["Degrés","0°","30°","45°","60°","90°","180°","360°"], rows:[
   ["Radians","0","$@f{π}{6}$","$@f{π}{4}$","$@f{π}{3}$","$@f{π}{2}$","$π$","$2π$"]
  ]},
  {t:"formule", titre:"Conversion", x:"degrés → radians : multiplier par $@f{π}{180}$<br>radians → degrés : multiplier par $@f{180}{π}$", note:"Repère fixe : $180° = π$ radians. Tout le reste se déduit par proportionnalité."},
  {t:"astuce", titre:"Mémoriser sans effort", x:"$π$ = un demi-tour. Donc $@f{π}{2}$ = un quart de tour (90°), $@f{π}{4}$ = un huitième de tour (45°). Le dénominateur indique en combien de parts on découpe le demi-tour."}
 ]},

 {titre:"Le cercle trigonométrique", blocs:[
  {t:"p", x:"On trace un cercle de rayon 1 centré à l'origine. On part du point $(1 ; 0)$ et on tourne dans le sens inverse des aiguilles d'une montre : c'est le **sens direct**."},
  {t:"formule", titre:"Définition de cos et sin", x:"Si on tourne d'un angle $x$, on arrive au point de coordonnées $(cos x ; sin x)$", note:"Le cosinus est l'abscisse, le sinus est l'ordonnée. C'est tout."},
  {t:"figi", nom:"cercle-trigo"},
  {t:"p", x:"Fais tourner le point $M$ et observe les deux segments colorés. Le **bleu**, couché sur l'axe horizontal, c'est le cosinus. Le **vert**, dressé sur l'axe vertical, c'est le sinus. Tu vois immédiatement trois choses que les tableaux de valeurs cachent : aucun des deux ne dépasse jamais 1 ni ne descend sous $-1$ ; quand l'un est grand, l'autre est petit ; et quand $M$ passe à gauche de l'axe vertical, le cosinus devient négatif."},
  {t:"astuce", titre:"Ne plus jamais les confondre", x:"**Cos** comme **c**ouché → horizontal → abscisse. **Sin** monte vers le ciel → vertical → ordonnée."},
  {t:"tbl", head:["$x$","0","$@f{π}{6}$","$@f{π}{4}$","$@f{π}{3}$","$@f{π}{2}$","$π$"], rows:[
   ["$cos x$","1","$@f{@r{3}}{2}$","$@f{@r{2}}{2}$","$@f{1}{2}$","0","−1"],
   ["$sin x$","0","$@f{1}{2}$","$@f{@r{2}}{2}$","$@f{@r{3}}{2}$","1","0"]
  ]},
  {t:"astuce", titre:"Astuce pour retenir ce tableau", x:"Écris sous la racine : 0, 1, 2, 3, 4 pour le sinus (dans l'ordre croissant), et divise par 2. Cela donne $@f{@r{0}}{2}, @f{@r{1}}{2}, @f{@r{2}}{2}, @f{@r{3}}{2}, @f{@r{4}}{2}$, soit $0, @f{1}{2}, @f{@r{2}}{2}, @f{@r{3}}{2}, 1$. Pour le cosinus, c'est la même chose à l'envers."},
  {t:"formule", titre:"La relation fondamentale", x:"$cos^2 x + sin^2 x = 1$", note:"C'est le théorème de Pythagore appliqué au cercle de rayon 1. Elle sert à retrouver l'un connaissant l'autre."},
  {t:"fig", titre:"Cette relation, c'est Pythagore",
   vue:[-1.35,-0.5,1.35,1.35], w:370, h:270, grille:false, graduations:false,
   objets:[
    {t:"cercle", c:[0,0], r:1, couleur:"line2"},
    {t:"seg", de:[0,0], a:[0.8,0.6], couleur:"rouge", epais:2.8},
    {t:"seg", de:[0,0], a:[0.8,0], couleur:"bleu", epais:4},
    {t:"seg", de:[0.8,0], a:[0.8,0.6], couleur:"vert", epais:4},
    {t:"angle", en:[0.8,0], de:[0,0], a:[0.8,0.6], droit:true},
    {t:"point", x:0.8, y:0.6, nom:"M"},
    {t:"texte", x:0.4, y:-0.22, txt:"cos x", couleur:"bleu"},
    {t:"texte", x:1.08, y:0.3, txt:"sin x", couleur:"vert"},
    {t:"texte", x:0.3, y:0.45, txt:"1", couleur:"rouge", taille:15}
   ],
   note:"Le rayon vaut 1. Les deux autres côtés valent $cos x$ et $sin x$. Pythagore donne directement $cos^2 x + sin^2 x = 1$."},
  {t:"p", x:"Voilà pourquoi cette relation est vraie, et pourquoi elle n'est pas à apprendre par cœur. Le point $M$, son projeté sur l'axe horizontal et le centre forment un **triangle rectangle**. Ses deux côtés de l'angle droit mesurent $cos x$ et $sin x$ ; son hypoténuse est le rayon, qui vaut 1. Pythagore s'écrit alors $cos^2 x + sin^2 x = 1^2$."},
  {t:"p", x:"À quoi sert-elle concrètement ? À **retrouver l'un des deux quand on connaît l'autre**. C'est une question classique : « on sait que $cos x = 0{,}6$, combien vaut $sin x$ ? » On isole : $sin^2 x = 1 - 0{,}36 = 0{,}64$, donc $sin x = ±0{,}8$. Attention au **±** : la relation donne le carré, donc deux possibilités. Il faut une information supplémentaire — le quart où se trouve l'angle — pour choisir le signe."},
  {t:"formule", titre:"Encadrement à connaître", x:"$-1 ≤ cos x ≤ 1$ &nbsp;&nbsp;et&nbsp;&nbsp; $-1 ≤ sin x ≤ 1$", note:"Une équation comme $cos x = 2$ n'a donc aucune solution."}
 ]},

 {titre:"Les angles associés", blocs:[
  {t:"idee", x:"Plutôt que d'apprendre des dizaines de valeurs, on utilise les **symétries du cercle** pour tout ramener aux angles connus du premier quart."},
  {t:"p", x:"Voici l'économie que cela représente. Le tableau des valeurs remarquables ne contient que six angles, tous situés dans le premier quart du cercle. Mais un contrôle peut demander $cos@f{5π}{6}$, $sin@f{7π}{4}$, $cos@f{4π}{3}$… Faut-il apprendre les valeurs des quatre quarts ? Non : **les trois autres quarts sont les reflets du premier**. Une seule série de valeurs, plus trois symétries, suffit à tout couvrir."},
  {t:"fig", titre:"Les quatre points sont des reflets du premier",
   vue:[-1.5,-1.5,1.5,1.5], w:360, h:340, grille:false, graduations:false,
   objets:[
    {t:"cercle", c:[0,0], r:1, couleur:"line2"},
    {t:"seg", de:[0,0], a:[0.71,0.71], couleur:"ink3"},
    {t:"seg", de:[0,0], a:[-0.71,0.71], couleur:"ink3", pointille:true},
    {t:"seg", de:[0,0], a:[-0.71,-0.71], couleur:"ink3", pointille:true},
    {t:"seg", de:[0,0], a:[0.71,-0.71], couleur:"ink3", pointille:true},
    {t:"point", x:0.71, y:0.71, nom:"x", couleur:"vert"},
    {t:"point", x:-0.71, y:0.71, nom:"π−x", couleur:"bleu"},
    {t:"point", x:-0.71, y:-0.71, nom:"π+x", couleur:"rouge", dessous:true},
    {t:"point", x:0.71, y:-0.71, nom:"−x", couleur:"ambre", dessous:true}
   ],
   note:"Les quatre points ont les **mêmes coordonnées au signe près**. Il suffit de savoir dans quel quart on est pour retrouver les deux signes."},
  {t:"p", x:"Regarde la figure et raisonne sur les coordonnées, pas sur les formules. Le point $-x$ est le reflet de $x$ **par rapport à l'axe horizontal** : il est à la même abscisse (le cosinus ne change pas) mais à l'ordonnée opposée (le sinus change de signe). Le point $π - x$ est le reflet **par rapport à l'axe vertical** : ordonnée conservée, abscisse opposée. Et $π + x$ est le point diamétralement opposé : les deux coordonnées changent de signe."},
  {t:"formule", titre:"Les quatre symétries utiles", x:"$cos(-x) = cos x$ &nbsp;·&nbsp; $sin(-x) = -sin x$<br>$cos(π - x) = -cos x$ &nbsp;·&nbsp; $sin(π - x) = sin x$<br>$cos(π + x) = -cos x$ &nbsp;·&nbsp; $sin(π + x) = -sin x$", note:"Le cosinus est pair, le sinus est impair."},
  {t:"astuce", titre:"Ne pas apprendre ces six lignes par cœur", x:"Elles se retrouvent en dessinant le cercle et en plaçant le point — dix secondes, sans risque d'erreur de mémoire. La méthode fiable en contrôle : trace un cercle à main levée, place l'angle demandé, regarde **dans quel quart** il tombe, et lis les signes. En haut à gauche : cosinus négatif, sinus positif. En bas à droite : l'inverse. C'est tout."},
  {t:"exemple", titre:"Exemple guidé — ramener à un angle connu", enonce:"Calculer $cos@f{2π}{3}$.", etapes:[
   {q:"Repérer une forme connue", r:"$@f{2π}{3} = π - @f{π}{3}$, car $π = @f{3π}{3}$ et $@f{3π}{3} - @f{π}{3} = @f{2π}{3}$."},
   {q:"Appliquer la symétrie", r:"$cos(π - x) = -cos x$, avec $x = @f{π}{3}$."},
   {q:"Utiliser le tableau", r:"$cos@f{π}{3} = @f{1}{2}$."},
   {q:"Conclure", r:"$cos@f{2π}{3} = -@f{1}{2}$."},
   {q:"Contrôle visuel", r:"$@f{2π}{3}$ correspond à 120°, donc un point situé à gauche de l'axe vertical : son abscisse doit bien être négative. ✓"}
  ]},
  {t:"formule", titre:"Périodicité", x:"$cos(x + 2π) = cos x$ &nbsp;&nbsp;et&nbsp;&nbsp; $sin(x + 2π) = sin x$", note:"Un tour complet ramène au même point : on peut ajouter ou retirer $2π$ autant de fois qu'on veut."}
 ]},

 {titre:"Résoudre des équations trigonométriques", blocs:[
  {t:"p", x:"Une équation comme $cos x = @f{1}{2}$ n'a pas une seule solution : le cercle repasse indéfiniment par le même point."},
  {t:"p", x:"C'est la grande différence avec les équations que tu connais. $2x + 3 = 7$ a une réponse, une seule. Ici, la question « pour quel angle le cosinus vaut-il $@f{1}{2}$ ? » en a une **infinité**, parce qu'on peut toujours ajouter un tour complet et retomber au même endroit. C'est pour cela que les énoncés précisent presque toujours un intervalle : « sur $[0 ; 2π[$ », c'est-à-dire sur un seul tour."},
  {t:"fig", titre:"Pourquoi il y a deux solutions par tour",
   vue:[-1.4,-1.4,1.4,1.4], w:360, h:330, grille:false, graduations:false,
   objets:[
    {t:"cercle", c:[0,0], r:1, couleur:"line2"},
    {t:"seg", de:[0.5,-1.3], a:[0.5,1.3], couleur:"ambre", pointille:true},
    {t:"seg", de:[0,0], a:[0.5,0.866], couleur:"ink3"},
    {t:"seg", de:[0,0], a:[0.5,-0.866], couleur:"ink3"},
    {t:"point", x:0.5, y:0.866, nom:"π/3", couleur:"vert"},
    {t:"point", x:0.5, y:-0.866, nom:"5π/3", couleur:"rouge", dessous:true},
    {t:"texte", x:0.5, y:1.22, txt:"cos x = 1/2", couleur:"ambre"}
   ],
   note:"La verticale d'abscisse $@f{1}{2}$ coupe le cercle en **deux** points : un au-dessus, un en dessous. D'où deux solutions."},
  {t:"p", x:"Cette figure explique tout. Chercher les $x$ tels que $cos x = @f{1}{2}$, c'est chercher les points du cercle dont **l'abscisse vaut $@f{1}{2}$** — donc les points situés sur la verticale orange. Elle traverse le cercle en deux endroits, symétriques par rapport à l'axe horizontal. Voilà pourquoi la réponse comporte deux angles, et pas un."},
  {t:"astuce", titre:"Le réflexe qui évite l'oubli", x:"Avant de répondre, **trace la droite** : verticale pour une équation en cosinus, horizontale pour une équation en sinus. Compte les points d'intersection avec le cercle. Deux points → deux solutions. Un seul point (aux extrêmes $1$ ou $-1$) → une solution. Aucun point (valeur hors de $[-1 ; 1]$) → aucune solution. Cette vérification prend cinq secondes et supprime l'erreur la plus fréquente du chapitre."},
  {t:"formule", titre:"Solutions sur un tour", x:"$cos x = cos a$ &nbsp;⇔&nbsp; $x = a$ ou $x = -a$ (modulo $2π$)<br>$sin x = sin a$ &nbsp;⇔&nbsp; $x = a$ ou $x = π - a$ (modulo $2π$)"},
  {t:"exemple", titre:"Exemple guidé — résoudre sur $[0 ; 2π[$", enonce:"Résoudre $cos x = @f{1}{2}$ sur l'intervalle $[0 ; 2π[$.", etapes:[
   {q:"Trouver une solution évidente", r:"D'après le tableau, $cos@f{π}{3} = @f{1}{2}$. Donc $a = @f{π}{3}$ convient."},
   {q:"Utiliser la symétrie du cosinus", r:"Le cosinus est pair : $cos(-x) = cos x$. Donc $-@f{π}{3}$ est aussi solution."},
   {q:"Ramener dans l'intervalle demandé", r:"$-@f{π}{3}$ n'est pas dans $[0 ; 2π[$. On ajoute un tour : $-@f{π}{3} + 2π = @f{5π}{3}$."},
   {q:"Conclure", r:"$S = @f{π}{3}$ et $@f{5π}{3}$."},
   {q:"Vérification géométrique", r:"Deux points du cercle ont pour abscisse $@f{1}{2}$ : un au-dessus, un en dessous de l'axe horizontal. On en attend bien deux. ✓"}
  ]},
  {t:"piege", titre:"L'oubli de la seconde solution", x:"Donner une seule solution est l'erreur la plus courante. Réflexe : dessine le cercle, place la valeur sur l'axe concerné, et compte les points d'intersection. Il y en a presque toujours deux par tour."},
  {t:"p", x:"Une équation en **sinus** se traite exactement de la même façon, à un détail près : c'est une droite **horizontale** qu'on trace, puisque le sinus se lit sur l'axe vertical. Les deux solutions sont alors symétriques par rapport à l'axe vertical, ce qui correspond à la formule $x = a$ ou $x = π - a$."},
  {t:"exemple", titre:"Exemple guidé — une équation en sinus", enonce:"Résoudre $sin x = @f{@r{2}}{2}$ sur l'intervalle $[0 ; 2π[$.", etapes:[
   {q:"Étape 1 — vérifier que c'est possible", r:"$@f{@r{2}}{2} ≈ 0{,}707$, donc bien entre $-1$ et $1$. Il y aura des solutions. (Si la valeur avait été 1,5, on se serait arrêté là.)"},
   {q:"Étape 2 — trouver l'angle évident du tableau", r:"$sin@f{π}{4} = @f{@r{2}}{2}$. Donc $a = @f{π}{4}$ est une première solution. C'est le rôle du tableau des valeurs remarquables : fournir cet angle de départ."},
   {q:"Étape 3 — placer la droite horizontale", r:"Je trace la horizontale à la hauteur $0{,}707$. Elle coupe le cercle en deux points : un dans le premier quart (en haut à droite), un dans le deuxième (en haut à gauche). Les deux ont bien la même hauteur."},
   {q:"Étape 4 — trouver le second angle", r:"Le point de gauche est le symétrique du premier par rapport à l'axe vertical, ce qui correspond à $π - a = π - @f{π}{4} = @f{4π}{4} - @f{π}{4} = @f{3π}{4}$."},
   {q:"Étape 5 — vérifier qu'ils sont dans l'intervalle", r:"$@f{π}{4}$ et $@f{3π}{4}$ sont tous deux entre $0$ et $2π$. ✓ Rien à ajouter ni à retirer un tour."},
   {q:"Conclusion", r:"$S = @f{π}{4}$ et $@f{3π}{4}$. Contrôle visuel : les deux points sont dans la moitié haute du cercle, ce qui est cohérent avec un sinus positif."}
  ]},
  {t:"piege", titre:"Cosinus et sinus n'ont pas la même seconde solution", x:"Pour le **cosinus**, la seconde solution est $-a$ (ou $2π - a$) : symétrie par rapport à l'axe **horizontal**.<br>Pour le **sinus**, c'est $π - a$ : symétrie par rapport à l'axe **vertical**.<br><br>Inutile de retenir laquelle va avec laquelle : trace la droite sur le cercle, la bonne symétrie apparaît d'elle-même."}
 ]},

 {titre:"Les fonctions cosinus et sinus", blocs:[
  {t:"idee", x:"Jusqu'ici, $cos$ et $sin$ étaient des coordonnées sur un cercle. On peut aussi les voir comme des **fonctions** : à chaque réel $x$ on associe le nombre $cos x$. Et une fonction, ça se trace."},
  {t:"plot", f:"Math.cos(x)", xmin:-6.3, xmax:6.3, titre:"Courbe de $f(x) = cos x$", note:"Le motif se répète tous les $2π$, et la courbe reste coincée entre $-1$ et $1$."},
  {t:"formule", titre:"Périodicité", x:"$cos(x + 2π) = cos x$ &nbsp;&nbsp;et&nbsp;&nbsp; $sin(x + 2π) = sin x$", note:"On dit que ces fonctions sont **périodiques de période $2π$** : la courbe se reproduit à l'identique tous les $2π$."},
  {t:"p", x:"Cela veut dire qu'il suffit d'étudier la fonction sur un intervalle de longueur $2π$ — par exemple $[-π ; π]$ — puis de recopier le motif à l'infini, à droite comme à gauche."},
  {t:"formule", titre:"Parité", x:"$cos(-x) = cos x$ → **fonction paire**<br>$sin(-x) = -sin x$ → **fonction impaire**", note:"Paire = courbe symétrique par rapport à l'axe des ordonnées. Impaire = symétrique par rapport à l'origine."},
  {t:"plot", f:"Math.sin(x)", xmin:-6.3, xmax:6.3, titre:"Courbe de $f(x) = sin x$", note:"Même forme que le cosinus, décalée de $@f{π}{2}$ vers la droite, et symétrique par rapport à l'origine."},
  {t:"tbl", head:["","$cos$","$sin$"], rows:[
   ["Ensemble de définition","ℝ","ℝ"],
   ["Valeurs prises","$[-1 ; 1]$","$[-1 ; 1]$"],
   ["Période","$2π$","$2π$"],
   ["Parité","paire","impaire"],
   ["Vaut 0 en","$@f{π}{2} + kπ$","$kπ$"],
   ["Maximum 1 en","$0 + 2kπ$","$@f{π}{2} + 2kπ$"]
  ]},
  {t:"astuce", titre:"À quoi ça sert", x:"Tout ce qui se répète se décrit avec ces fonctions : les marées, le courant alternatif, un son, le mouvement d'un pendule. C'est pour ça qu'on les étudie comme fonctions et pas seulement comme des angles."},
  {t:"exemple", titre:"Exemple guidé — lire les variations sur un tour", enonce:"Décrire les variations de $f(x) = cos x$ sur $[0 ; 2π]$.", etapes:[
   {q:"Partir du cercle", r:"Quand $x$ va de 0 à $π$, le point tourne du côté droit vers la gauche : son abscisse passe de 1 à $-1$."},
   {q:"Première moitié", r:"Le cosinus **décroît** de 1 à $-1$ sur $[0 ; π]$."},
   {q:"Seconde moitié", r:"De $π$ à $2π$, le point revient vers la droite : l'abscisse remonte de $-1$ à 1. Le cosinus **croît** sur $[π ; 2π]$."},
   {q:"Conclusion", r:"Un maximum en $x = 0$ et en $x = 2π$ (valeur 1), un minimum en $x = π$ (valeur $-1$). Puis tout recommence."}
  ]},
  {t:"piege", titre:"Période ne veut pas dire amplitude", x:"La **période** ($2π$) est la largeur du motif horizontalement. Les **valeurs** restent entre $-1$ et $1$ verticalement. Ce sont deux informations différentes qu'on confond souvent."}
 ]},

 {titre:"Récapitulatif : tout ramener au cercle", blocs:[
  {t:"idee", x:"Une seule habitude fait la différence dans ce chapitre : **dessiner le cercle**. Presque toutes les questions se résolvent en plaçant un point dessus, et presque toutes les erreurs viennent de l'avoir évité."},
  {t:"p", x:"C'est contre-intuitif, parce qu'on a l'impression de perdre du temps. En réalité, le croquis remplace la mémoire. Tu n'as plus besoin de te rappeler si $sin(π - x)$ garde son signe : tu places les deux points, tu regardes leurs hauteurs, et tu vois qu'elles sont égales. Un cercle tracé à main levée, avec les deux axes, prend quinze secondes."},
  {t:"tbl", head:["La question ressemble à…","Ce qu'il faut faire"], rows:[
   ["« Convertir en radians »","Proportionnalité à partir de $180° = π$"],
   ["« Calculer $cos$ ou $sin$ d'un angle du tableau »","Lire le tableau des valeurs remarquables"],
   ["« … d'un angle hors du premier quart »","Écrire l'angle sous la forme $π - x$, $π + x$ ou $-x$"],
   ["« On connaît $cos x$, trouver $sin x$ »","$cos^2 x + sin^2 x = 1$, puis choisir le signe"],
   ["« Résoudre $cos x = $ une valeur »","Une solution évidente, puis sa symétrique. **Deux** réponses par tour"],
   ["« Combien de solutions ? »","Vérifier d'abord si la valeur est entre $-1$ et $1$"],
   ["« Période, parité »","Les propriétés des fonctions cosinus et sinus"]
  ]},
  {t:"formule", titre:"Les trois choses à connaître absolument", x:"$cos^2 x + sin^2 x = 1$<br>$-1 ≤ cos x ≤ 1$ et $-1 ≤ sin x ≤ 1$<br>Le tableau des six valeurs remarquables", note:"Le reste se reconstruit sur un croquis du cercle."},
  {t:"piege", titre:"Les trois erreurs les plus fréquentes", x:"**1. Oublier la seconde solution.** $cos x = @f{1}{2}$ a **deux** réponses par tour, pas une. Réflexe : place la valeur sur l'axe et compte les points d'intersection avec le cercle.<br>**2. Se tromper de signe hors du premier quart.** Le croquis règle la question en une seconde.<br>**3. Confondre cosinus et sinus.** Cos comme **c**ouché : horizontal, abscisse. Sin monte : vertical, ordonnée."},
  {t:"astuce", titre:"Le contrôle de plausibilité", x:"Avant d'écrire une réponse, demande-toi si le signe est cohérent avec la position du point. Un angle de 150° pointe en haut à gauche : son sinus **doit** être positif et son cosinus **doit** être négatif. Si ton calcul dit le contraire, il y a une erreur — inutile de chercher plus loin, reprends le signe."},
  {t:"p", x:"Pour réviser, reviens sur la figure du cercle manipulable au début du chapitre. Fais tourner le point et, à chaque quart, annonce à voix haute les signes du cosinus et du sinus **avant** de lire les valeurs affichées. Quand tu ne te trompes plus, ce chapitre est acquis."}
 ]}
],
exos:[
 {id:"tr1", niveau:1, type:"qcm", enonce:"À combien de radians correspond un angle de 90° ?",
  choix:["$@f{π}{2}$","$π$","$@f{π}{4}$","$2π$"], bonne:0,
  diag:["", "$π$ correspond à 180°, un demi-tour. Le quart de tour vaut la moitié : $@f{π}{2}$.",
        "$@f{π}{4}$ correspond à 45°, la moitié de 90°.",
        "$2π$ est le tour complet, soit 360°."],
  corr:["On sait que $180° = π$ radians.","Un angle de 90° est la moitié de 180°.","Donc $90° = @f{π}{2}$ radians."],
  indice:"Pars de la référence $180° = π$ et raisonne par proportionnalité."},

 {id:"tr2", niveau:1, type:"qcm", enonce:"Sur le cercle trigonométrique, le cosinus d'un angle correspond à :",
  choix:["l'abscisse du point","l'ordonnée du point","la longueur de l'arc","le rayon du cercle"], bonne:0,
  diag:["", "C'est le sinus qui donne l'ordonnée. Le cosinus est « couché » : il se lit horizontalement.",
        "La longueur de l'arc, c'est la mesure de l'angle en radians, pas son cosinus.",
        "Le rayon vaut toujours 1 sur le cercle trigonométrique, quel que soit l'angle."],
  corr:["Sur le cercle de rayon 1, l'angle $x$ mène au point de coordonnées $(cos x ; sin x)$.","Le cosinus est donc la première coordonnée : l'abscisse."],
  indice:"Coordonnées d'un point : (abscisse ; ordonnée). Dans quel ordre viennent cos et sin ?"},

 {id:"tr3", niveau:2, type:"qcm", enonce:"Combien vaut $sin(-x)$ ?",
  choix:["$-sin x$","$sin x$","$cos x$","$1 - sin x$"], bonne:0,
  diag:["", "C'est la propriété du **cosinus** ($cos(-x) = cos x$). Le sinus, lui, change de signe : la symétrie par rapport à l'axe horizontal inverse les ordonnées.",
        "Le sinus ne se transforme jamais en cosinus par un simple changement de signe de l'angle.",
        "Cette écriture ne correspond à aucune formule du cours."],
  corr:["Changer $x$ en $-x$ revient à faire une symétrie par rapport à l'axe des abscisses.","L'abscisse est inchangée : $cos(-x) = cos x$.","L'ordonnée change de signe : $sin(-x) = -sin x$."],
  indice:"Dessine le cercle : que devient l'ordonnée d'un point quand on le reflète sous l'axe horizontal ?"},

 {id:"tr4", niveau:2, type:"num", enonce:"On sait que $cos x = 0{,}6$ et que $sin x > 0$. Que vaut $sin x$ ?",
  rep:0.8, tol:0.001,
  diag:[{v:0.4, m:"Tu as calculé $1 - 0{,}6$. La relation est $cos^2 x + sin^2 x = 1$ : elle porte sur les **carrés**, pas sur les nombres eux-mêmes."},
        {v:-0.8, m:"La valeur absolue est juste, mais l'énoncé précise que $sin x > 0$ : il faut garder la solution positive."},
        {v:0.64, m:"Tu t'es arrêté à $sin^2 x = 0{,}64$. Il reste à prendre la racine carrée : $@r{0,64} = 0{,}8$."}],
  corr:["Relation fondamentale : $cos^2 x + sin^2 x = 1$.","$0{,}6^2 = 0{,}36$, donc $sin^2 x = 1 - 0{,}36 = 0{,}64$.","$sin x = ±@r{0,64} = ±0{,}8$.","L'énoncé impose $sin x > 0$, donc $sin x = 0{,}8$."],
  indice:"Utilise $cos^2 x + sin^2 x = 1$, puis n'oublie pas la racine carrée à la fin."},

 {id:"tr5", niveau:2, type:"qcm", enonce:"Combien de solutions l'équation $cos x = 3$ admet-elle ?",
  choix:["Aucune","Une","Deux","Une infinité"], bonne:0,
  diag:["", "Aucune valeur ne convient : le cosinus reste toujours compris entre $-1$ et $1$, il ne peut jamais atteindre 3.",
        "Deux solutions, ce serait le cas pour une valeur située entre $-1$ et $1$, comme $0{,}5$. Mais 3 est hors de portée.",
        "L'équation n'a pas de solution du tout."],
  corr:["Le cosinus est l'abscisse d'un point du cercle de rayon 1.","Cette abscisse est nécessairement comprise entre $-1$ et $1$.","Or $3 > 1$ : aucune solution. $S = ∅$."],
  indice:"Entre quelles valeurs le cosinus est-il toujours compris ?"},

 {id:"tr6", niveau:3, type:"qcm", enonce:"Que vaut $cos(π - x)$ ?",
  choix:["$-cos x$","$cos x$","$-sin x$","$sin x$"], bonne:0,
  diag:["", "Le signe change. La symétrie par rapport à l'axe vertical conserve l'ordonnée mais inverse l'abscisse, donc le cosinus devient son opposé.",
        "Une symétrie ne transforme pas un cosinus en sinus : elle change au plus le signe.",
        "Le sinus, lui, est conservé : $sin(π - x) = sin x$. Mais la question porte sur le cosinus."],
  corr:["$π - x$ correspond au symétrique du point par rapport à l'axe des ordonnées.","Cette symétrie inverse l'abscisse et conserve l'ordonnée.","Donc $cos(π - x) = -cos x$ et $sin(π - x) = sin x$."],
  indice:"Place un point puis son symétrique par rapport à l'axe vertical : quelle coordonnée change de signe ?"},

 {id:"tr7", niveau:3, type:"qcm", enonce:"Sur $[0 ; 2π[$, quelles sont les solutions de $cos x = 0$ ?",
  choix:["$@f{π}{2}$ et $@f{3π}{2}$","$0$ et $π$","$@f{π}{2}$ seulement","$π$ seulement"], bonne:0,
  diag:["", "En $x = 0$ et $x = π$, le cosinus vaut $1$ et $-1$ : ce sont les extrêmes, pas les zéros. C'est le **sinus** qui s'annule en 0 et $π$.",
        "Tu as trouvé la bonne première solution mais oublié la seconde. Un tour complet donne deux points d'abscisse nulle : en haut et en bas du cercle.",
        "En $π$, le cosinus vaut $-1$, pas 0."],
  corr:["Le cosinus est l'abscisse : il s'annule quand le point est sur l'axe vertical.","Cela se produit en haut du cercle, en $@f{π}{2}$, et en bas, en $@f{3π}{2}$.","$S = @f{π}{2}$ et $@f{3π}{2}$."],
  indice:"Où se trouvent les points du cercle dont l'abscisse vaut zéro ?"},

 {id:"tr8", niveau:3, type:"qcm", enonce:"Combien vaut $sin@f{5π}{6}$ ?",
  choix:["$@f{1}{2}$","$-@f{1}{2}$","$@f{@r{3}}{2}$","$-@f{@r{3}}{2}$"], bonne:0,
  diag:["", "Le signe est faux. $@f{5π}{6}$ correspond à 150°, un point situé **au-dessus** de l'axe horizontal : son ordonnée est positive.",
        "C'est la valeur de $cos@f{π}{6}$, pas celle du sinus. Attention à ne pas intervertir les deux lignes du tableau.",
        "Double erreur : mauvaise valeur et mauvais signe."],
  corr:["$@f{5π}{6} = π - @f{π}{6}$.","Or $sin(π - x) = sin x$.","Donc $sin@f{5π}{6} = sin@f{π}{6} = @f{1}{2}$.","Contrôle : 150° place le point en haut à gauche, donc une ordonnée positive. ✓"],
  indice:"Écris $@f{5π}{6}$ sous la forme $π - $ quelque chose, puis applique la formule des angles associés."},

 {id:"tr9", niveau:1, type:"qcm", enonce:"Quelle est la période de la fonction $f(x) = sin x$ ?",
  choix:["$2π$","$π$","$@f{π}{2}$","1"], bonne:0,

/* ====================== 6. PRODUIT SCALAIRE ====================== */
{
id:"scalaire", n:6, titre:"Produit scalaire",
sous:"Multiplier des vecteurs, mesurer des angles",
desc:"Vecteurs en coordonnées, produit scalaire, orthogonalité et applications.",
duree:40,
sections:[
 {titre:"Un vecteur, c'est un déplacement", blocs:[
  {t:"idee", x:"Un vecteur ne dit pas **où** on est, il dit **comment on se déplace** : de combien à droite, et de combien vers le haut."},
  {t:"p", x:"C'est la différence essentielle avec un point. Un point $A(1 ; 2)$ est une adresse : il est quelque part et il y reste. Un vecteur $@v{AB}$ est un trajet : « avance de 3, monte de 4 ». Ce trajet, on peut le faire depuis n'importe où — c'est pour ça qu'on peut déplacer un vecteur sur une figure sans le changer, alors qu'on ne peut pas déplacer un point."},
  {t:"fig", titre:"Le vecteur AB se lit sur le quadrillage",
   vue:[-0.5,-0.5,6,7], w:380, h:340,
   objets:[
    {t:"point", x:1, y:2, nom:"A"},
    {t:"point", x:4, y:6, nom:"B"},
    {t:"vec", de:[1,2], a:[4,6], couleur:"bleu"},
    {t:"seg", de:[1,2], a:[4,2], couleur:"vert", pointille:true},
    {t:"seg", de:[4,2], a:[4,6], couleur:"ambre", pointille:true},
    {t:"texte", x:2.5, y:1.5, txt:"+3 vers la droite", couleur:"vert"},
    {t:"texte", x:5.1, y:4, txt:"+4 vers le haut", couleur:"ambre"},
    {t:"angle", en:[4,2], de:[1,2], a:[4,6], droit:true}
   ],
   note:"Pour aller de $A$ à $B$ : 3 à droite, 4 en haut. D'où $@v{AB}(3 ; 4)$."},
  {t:"formule", titre:"Coordonnées d'un vecteur", x:"Si $A(x_A ; y_A)$ et $B(x_B ; y_B)$, alors $@v{AB}(x_B - x_A ; y_B - y_A)$", note:"Toujours l'arrivée moins le départ."},
  {t:"p", x:"Pourquoi une soustraction ? Parce qu'on cherche **l'écart** entre les deux positions. Sur la figure, l'abscisse passe de 1 à 4 : l'écart vaut $4 - 1 = 3$. L'ordonnée passe de 2 à 6 : l'écart vaut $6 - 2 = 4$. Une soustraction mesure toujours un écart, jamais une position."},
  {t:"piege", titre:"L'erreur de sens", x:"$@v{AB}$ et $@v{BA}$ ne sont pas le même vecteur : ils ont la même longueur mais des sens opposés. $@v{AB}(3 ; 4)$ tandis que $@v{BA}(-3 ; -4)$. Réflexe : la **première lettre est le départ**. Si tu écris $@v{AB}$, tu pars de $A$, donc tu retranches les coordonnées de $A$."},
  {t:"formule", titre:"Norme : la longueur du vecteur", x:"Si $@v{u}(x ; y)$, alors $||@v{u}|| = @r{x^2 + y^2}$", note:"Deux barres de chaque côté : c'est une longueur, donc un nombre positif."},
  {t:"p", x:"Cette formule n'est pas à apprendre bêtement : **c'est Pythagore**. Regarde la figure : le déplacement horizontal (3), le déplacement vertical (4) et le vecteur lui-même forment un triangle rectangle. L'angle droit est marqué en rouge. Le vecteur est l'hypoténuse, donc son carré vaut la somme des carrés des deux côtés : $3^2 + 4^2 = 25$, et la longueur vaut $@r{25} = 5$."},
  {t:"exemple", titre:"Exemple guidé — coordonnées et longueur", enonce:"Soit $A(1 ; 2)$ et $B(4 ; 6)$. Calculer les coordonnées de $@v{AB}$ puis sa longueur.", etapes:[
   {q:"Je repère le départ et l'arrivée", r:"On écrit $@v{AB}$ : le départ est $A$, l'arrivée est $B$. Je vais donc calculer « $B$ moins $A$ »."},
   {q:"Coordonnées", r:"$@v{AB}(4 - 1 ; 6 - 2)$, soit $@v{AB}(3 ; 4)$. Je retrouve bien les deux déplacements lus sur la figure."},
   {q:"Longueur", r:"$||@v{AB}|| = @r{3^2 + 4^2} = @r{9 + 16} = @r{25} = 5$."},
   {q:"Contrôle de bon sens", r:"La longueur doit être plus grande que chacun des deux déplacements (3 et 4) mais plus petite que leur somme (7). Ici 5 : c'est cohérent. Si tu trouves 25, tu as oublié la racine ; si tu trouves 7, tu as additionné au lieu d'appliquer Pythagore."}
  ]},
  {t:"check", q:"Soit $C(5 ; 1)$ et $D(2 ; 3)$. Quelles sont les coordonnées de $@v{CD}$ ?",
   choix:["$(-3 ; 2)$","$(3 ; -2)$","$(7 ; 4)$","$(-3 ; -2)$"], bonne:0,
   expl:["Exact : $2 - 5 = -3$ et $3 - 1 = 2$. On recule de 3 et on monte de 2.",
         "C'est $@v{DC}$, le vecteur inverse. Tu as calculé « départ moins arrivée » au lieu de l'inverse.",
         "Tu as additionné les coordonnées. Un vecteur mesure un écart : c'est une soustraction.",
         "L'abscisse est juste, mais pour l'ordonnée : $3 - 1 = +2$, on monte. Attention au signe."]}
 ]},

 {titre:"Trois façons de calculer un produit scalaire", blocs:[
  {t:"idee", x:"Le produit scalaire de deux vecteurs est un **nombre** (pas un vecteur). Il mesure à quel point les deux vecteurs « vont dans le même sens »."},
  {t:"p", x:"Avant les formules, comprenons ce que ce nombre raconte. Imagine que tu tires une luge avec une corde. Si tu tires bien dans l'axe de la marche, tout ton effort sert à avancer. Si tu tires en biais, une partie de l'effort est perdue à soulever la luge. Et si tu tirais perpendiculairement, à angle droit, tu ne la ferais pas avancer du tout."},
  {t:"p", x:"Le produit scalaire mesure exactement ça : **la part d'un vecteur qui va dans la direction de l'autre**. Deux vecteurs alignés dans le même sens → grand nombre positif. Perpendiculaires → zéro. Sens opposés → nombre négatif. C'est pour cette raison qu'un produit scalaire nul signifie « angle droit » : c'est la situation où l'un n'apporte rien à l'autre."},
  {t:"figi", nom:"produit-scalaire"},
  {t:"p", x:"Pourquoi trois formules pour une seule notion ? Parce qu'on ne dispose pas toujours des mêmes informations. Parfois l'énoncé donne des coordonnées, parfois des longueurs et un angle. Les trois formules calculent **exactement le même nombre** ; on choisit celle qui correspond à ce qu'on a sous la main. Ce n'est pas trois choses à apprendre, c'est une seule chose vue par trois portes différentes."},
  {t:"formule", titre:"Avec les coordonnées — la plus utilisée", x:"Si $@v{u}(x ; y)$ et $@v{v}(x' ; y')$, alors $@v{u} · @v{v} = x x' + y y'$", note:"On multiplie les abscisses entre elles, les ordonnées entre elles, et on additionne."},
  {t:"p", x:"Cette formule paraît sortir de nulle part. Voici comment la comprendre. Un déplacement se décompose toujours en deux morceaux indépendants : ce qui se passe **horizontalement** et ce qui se passe **verticalement**. Le produit scalaire compare les deux vecteurs séparément dans chaque direction — $x x'$ pour l'horizontale, $y y'$ pour la verticale — puis additionne les deux comparaisons."},
  {t:"p", x:"Et pourquoi une multiplication dans chaque direction ? Parce qu'elle porte le signe. Si les deux vecteurs vont vers la droite, $x$ et $x'$ sont tous deux positifs : le produit est positif, ils « s'accordent ». Si l'un va à droite et l'autre à gauche, le produit devient négatif : ils se contrarient. Le total dit qui l'emporte. Un produit scalaire nul, c'est donc un **équilibre exact** entre ce qui s'accorde et ce qui se contrarie — et cet équilibre, géométriquement, c'est l'angle droit."},
  {t:"formule", titre:"Avec l'angle", x:"$@v{u} · @v{v} = ||@v{u}|| × ||@v{v}|| × cos θ$", note:"$θ$ est l'angle entre les deux vecteurs. Utile pour trouver un angle."},
  {t:"p", x:"Celle-ci rend visible ce que la première cachait. Les deux longueurs disent « quelle est la taille des vecteurs », et le $cos θ$ dit « à quel point ils pointent dans la même direction » : il vaut 1 s'ils sont parfaitement alignés, 0 s'ils sont perpendiculaires, $-1$ s'ils sont opposés. Le produit scalaire, c'est donc **la taille multipliée par l'accord**. Retiens le cas central : quand l'angle est droit, $cos(90°) = 0$, et tout le produit s'effondre à zéro quelles que soient les longueurs."},
  {t:"formule", titre:"Avec les normes", x:"$@v{u} · @v{v} = @f{1}{2}(||@v{u}||^2 + ||@v{v}||^2 - ||@v{u} - @v{v}||^2)$", note:"Réservée aux situations où on ne dispose que de longueurs."},
  {t:"p", x:"Celle-là est la moins fréquente, et il ne faut surtout pas s'y accrocher. Elle sert quand un énoncé ne donne que des distances — trois longueurs d'un triangle, par exemple — sans coordonnées ni angle. Si tu as des coordonnées, n'y touche pas : la première formule est dix fois plus rapide."},
  {t:"tbl", head:["Ce que donne l'énoncé","Formule à prendre"], rows:[
   ["Des coordonnées de points ou de vecteurs","$x x' + y y'$ — presque toujours celle-ci"],
   ["Des longueurs et un angle","$||@v{u}|| × ||@v{v}|| × cos θ$"],
   ["Un angle à trouver","La même, réarrangée pour isoler $cos θ$"],
   ["Uniquement des longueurs","Celle avec les normes, ou Al-Kashi"]
  ]},
  {t:"astuce", titre:"Le réflexe à prendre en contrôle", x:"Avant de choisir, regarde l'énoncé et demande-toi : « qu'est-ce qu'on me donne ? » Des parenthèses avec deux nombres dedans → coordonnées → première formule. Un angle en degrés → deuxième formule. Ce seul réflexe évite la moitié des blocages."},
  {t:"piege", titre:"Le résultat est un nombre", x:"Écrire « $@v{u} · @v{v} = (6 ; 8)$ » n'a pas de sens. Un produit scalaire donne toujours **un seul nombre**, éventuellement négatif. C'est d'ailleurs de là que vient son nom : « scalaire » veut dire « simple nombre », par opposition à « vectoriel ». Si ta réponse a deux coordonnées, tu as fait autre chose qu'un produit scalaire."},
  {t:"exemple", titre:"Exemple guidé — calcul en coordonnées", enonce:"Soit $@v{u}(3 ; -2)$ et $@v{v}(4 ; 5)$. Calculer $@v{u} · @v{v}$.", etapes:[
   {q:"Choisir la formule", r:"L'énoncé donne des coordonnées. C'est donc $x x' + y y'$, sans hésiter."},
   {q:"Identifier qui est qui", r:"Pour $@v{u}$ : $x = 3$ et $y = -2$. Pour $@v{v}$ : $x' = 4$ et $y' = 5$. **Le signe moins fait partie de la coordonnée** : $y$ vaut $-2$, pas 2. C'est là que la moitié des erreurs se produisent."},
   {q:"Appliquer la formule", r:"$@v{u} · @v{v} = 3 × 4 + (-2) × 5$. J'écris les parenthèses autour de $-2$ : elles ne servent à rien mathématiquement, mais elles m'empêchent d'oublier le signe."},
   {q:"Calculer chaque produit", r:"$3 × 4 = 12$ et $(-2) × 5 = -10$."},
   {q:"Additionner", r:"$12 + (-10) = 12 - 10 = 2$."},
   {q:"Interpréter", r:"Le résultat est positif, donc l'angle est aigu : les deux vecteurs pointent globalement du même côté. Un contrôle utile — si tu traces rapidement les deux vecteurs et qu'ils t'apparaissent nettement opposés alors que tu as trouvé un nombre positif, c'est qu'il y a une erreur de signe quelque part."}
  ]},
  {t:"p", x:"Passons maintenant au cas où l'énoncé donne un angle plutôt que des coordonnées. La démarche change complètement, et c'est justement pour ça qu'il faut savoir reconnaître la situation."},
  {t:"exemple", titre:"Exemple guidé — quand on connaît l'angle", enonce:"Deux vecteurs $@v{u}$ et $@v{v}$ ont pour longueurs $||@v{u}|| = 4$ et $||@v{v}|| = 6$, et l'angle entre eux mesure 60°. Calculer $@v{u} · @v{v}$.", etapes:[
   {q:"Repérer ce qu'on a", r:"Deux longueurs et un angle : aucune coordonnée. C'est donc la deuxième formule."},
   {q:"Écrire la formule", r:"$@v{u} · @v{v} = ||@v{u}|| × ||@v{v}|| × cos θ = 4 × 6 × cos(60°)$."},
   {q:"Remplacer le cosinus", r:"$cos(60°) = @f{1}{2}$. C'est une valeur du tableau du chapitre Trigonométrie, à connaître par cœur."},
   {q:"Calculer", r:"$4 × 6 × @f{1}{2} = 24 × @f{1}{2} = 12$."},
   {q:"Ce que ça raconte", r:"Le produit maximal possible pour ces deux longueurs serait $4 × 6 = 24$, atteint si les vecteurs étaient parfaitement alignés. On obtient 12, soit la moitié : à 60°, les vecteurs ne « s'accordent » qu'à moitié."}
  ]},
  {t:"astuce", titre:"Retrouver un angle", x:"La même formule sert dans l'autre sens. Si tu connais les coordonnées, tu peux calculer $@v{u} · @v{v}$ **et** les deux longueurs, puis en déduire $cos θ = @f{@v{u} · @v{v}}{||@v{u}|| × ||@v{v}||}$. C'est la seule méthode du programme pour trouver un angle dans un repère."},
  {t:"check", q:"Soit $@v{u}(2 ; 3)$ et $@v{v}(5 ; -1)$. Combien vaut $@v{u} · @v{v}$ ?",
   choix:["7","13","10","$(10 ; -3)$"], bonne:0,
   expl:["Exact : $2 × 5 + 3 × (-1) = 10 - 3 = 7$.",
         "Tu as additionné $10 + 3$ en oubliant le signe moins de la deuxième coordonnée de $@v{v}$.",
         "Tu t'es arrêté au premier produit. Il faut ajouter le produit des ordonnées.",
         "Le produit scalaire donne un nombre, pas un couple de coordonnées."]}
 ]},

 {titre:"Orthogonalité : le critère qui sert tout le temps", blocs:[
  {t:"idee", x:"C'est l'application reine du produit scalaire : il permet de tester si deux directions sont perpendiculaires, sans rapporteur."},
  {t:"p", x:"Prends la mesure de ce que ça change. Avant, pour prouver qu'un angle est droit, il fallait Pythagore : calculer trois longueurs, souvent avec des racines carrées, puis vérifier une égalité. Maintenant, deux multiplications et une addition suffisent, et le résultat est un nombre entier la plupart du temps. C'est **l'outil le plus rentable de tout le chapitre**, et il tombe à presque tous les contrôles."},
  {t:"formule", titre:"Critère d'orthogonalité", x:"$@v{u} ⊥ @v{v}$ &nbsp;⇔&nbsp; $@v{u} · @v{v} = 0$", note:"Produit scalaire nul = vecteurs perpendiculaires. C'est une équivalence : ça marche dans les deux sens."},
  {t:"p", x:"Le petit symbole ⇔ se lit « équivaut à », et il compte. Il signifie que la propriété fonctionne **dans les deux sens** : si tu sais que l'angle est droit, tu peux affirmer que le produit scalaire est nul ; et si tu trouves un produit scalaire nul, tu peux affirmer que l'angle est droit. C'est ce qui en fait un outil de **démonstration** : trouver zéro n'est pas un indice, c'est une preuve."},
  {t:"p", x:"D'où vient ce zéro ? De la deuxième formule. Le produit scalaire vaut $||@v{u}|| × ||@v{v}|| × cos θ$. Les deux longueurs ne sont jamais nulles (sinon il n'y aurait pas de vecteur). Donc le seul moyen d'obtenir zéro, c'est que $cos θ = 0$ — et le cosinus ne s'annule qu'à 90°. Le critère n'est pas une règle arbitraire à mémoriser : c'est une conséquence directe."},
  {t:"p", x:"Le signe du produit scalaire renseigne aussi sur l'allure de l'angle, ce qui donne un contrôle rapide."},
  {t:"tbl", head:["Signe de $@v{u} · @v{v}$","Angle entre les vecteurs"], rows:[
   ["Positif","Aigu — les vecteurs pointent globalement dans la même direction"],
   ["Nul","Droit — ils sont perpendiculaires"],
   ["Négatif","Obtus — ils pointent dans des directions opposées"]
  ]},
  {t:"fig", titre:"Le triangle de l'exemple ci-dessous",
   vue:[0,0,5.5,6], w:380, h:340,
   objets:[
    {t:"poly", pts:[[1,1],[4,2],[3,5]], couleur:"bleu", remplir:true},
    {t:"vec", de:[4,2], a:[1,1], couleur:"vert", nom:"BA"},
    {t:"vec", de:[4,2], a:[3,5], couleur:"ambre", nom:"BC"},
    {t:"angle", en:[4,2], de:[1,1], a:[3,5], droit:true},
    {t:"point", x:1, y:1, nom:"A", dessous:true},
    {t:"point", x:4, y:2, nom:"B", dessous:true},
    {t:"point", x:3, y:5, nom:"C"}
   ],
   note:"Pour tester l'angle en $B$, on part **de $B$** : les vecteurs utiles sont $@v{BA}$ et $@v{BC}$."},
  {t:"exemple", titre:"Exemple guidé — prouver un angle droit", enonce:"Les points $A(1 ; 1)$, $B(4 ; 2)$ et $C(3 ; 5)$ forment-ils un triangle rectangle en $B$ ?", etapes:[
   {q:"Choisir les bons vecteurs", r:"L'angle droit supposé est en $B$, donc on part de $B$ : il faut $@v{BA}$ et $@v{BC}$."},
   {q:"Calculer les coordonnées", r:"$@v{BA}(1 - 4 ; 1 - 2) = (-3 ; -1)$ et $@v{BC}(3 - 4 ; 5 - 2) = (-1 ; 3)$."},
   {q:"Produit scalaire", r:"$(-3) × (-1) + (-1) × 3 = 3 - 3 = 0$."},
   {q:"Conclure", r:"Le produit scalaire est nul, donc $@v{BA} ⊥ @v{BC}$ : le triangle est bien rectangle en $B$."}
  ]},
  {t:"piege", titre:"Partir du bon sommet", x:"Pour un angle droit en $B$, il faut les vecteurs **issus de $B$** : $@v{BA}$ et $@v{BC}$. Utiliser $@v{AB}$ et $@v{BC}$ mélange les origines et fausse le raisonnement.<br><br>Pour ne plus s'y tromper : l'angle se trouve **au sommet où les deux traits se rejoignent**. Les deux vecteurs doivent donc partir de ce sommet-là, comme deux bras écartés depuis une même épaule. Le nom du sommet est toujours la **première lettre** des deux vecteurs : angle en $B$ → $@v{B}$… et $@v{B}$…"},
  {t:"astuce", titre:"La méthode complète, à réutiliser telle quelle", x:"1. Repérer le sommet où l'angle est supposé droit.<br>2. Écrire les deux vecteurs qui **partent** de ce sommet.<br>3. Calculer leurs coordonnées (arrivée moins départ, pour chacun).<br>4. Faire le produit scalaire.<br>5. Conclure : nul → rectangle en ce sommet ; non nul → pas rectangle là.<br><br>Ces cinq lignes se recopient à l'identique dans n'importe quel exercice de ce type. Apprends la démarche, pas l'exemple."},
  {t:"p", x:"Une variante revient souvent : au lieu de vérifier un angle droit, on demande de **trouver une valeur inconnue** pour que l'angle le devienne. La méthode ne change pas — on écrit le produit scalaire, sauf qu'il contient une lettre, et on résout l'équation « = 0 »."},
  {t:"exemple", titre:"Exemple guidé — trouver la valeur qui rend perpendiculaire", enonce:"Pour quelle valeur de $m$ les vecteurs $@v{u}(2 ; m)$ et $@v{v}(6 ; -3)$ sont-ils orthogonaux ?", etapes:[
   {q:"Traduire la question", r:"« Orthogonaux » veut dire « produit scalaire nul ». La question devient donc : pour quel $m$ a-t-on $@v{u} · @v{v} = 0$ ?"},
   {q:"Écrire le produit scalaire avec la lettre", r:"$@v{u} · @v{v} = 2 × 6 + m × (-3) = 12 - 3m$. La lettre se manipule comme un nombre ordinaire."},
   {q:"Poser l'équation", r:"$12 - 3m = 0$."},
   {q:"Résoudre", r:"$12 = 3m$, donc $m = @f{12}{3} = 4$."},
   {q:"Vérifier — toujours", r:"Avec $m = 4$ : $@v{u}(2 ; 4)$ et $@v{v}(6 ; -3)$, donc $2 × 6 + 4 × (-3) = 12 - 12 = 0$ ✓. Cette vérification prend dix secondes et attrape toutes les erreurs de signe."}
  ]},
  {t:"check", q:"Dans un triangle $RST$, on veut prouver l'angle droit en $S$. Quels vecteurs faut-il utiliser ?",
   choix:["$@v{SR}$ et $@v{ST}$","$@v{RS}$ et $@v{ST}$","$@v{RS}$ et $@v{RT}$","$@v{TR}$ et $@v{TS}$"], bonne:0,
   expl:["Exact : les deux vecteurs partent bien de $S$, le sommet de l'angle.",
         "$@v{RS}$ part de $R$, pas de $S$. Les deux vecteurs doivent avoir la **même** première lettre.",
         "Ces deux-là partent de $R$ : ils testeraient l'angle en $R$, pas en $S$.",
         "Ceux-ci partent de $T$ : ils testeraient l'angle en $T$."]}
 ]},

 {titre:"Applications : droites et cercles", blocs:[
  {t:"formule", titre:"Vecteur normal et équation de droite", x:"Une droite d'équation $ax + by + c = 0$ admet $@v{n}(a ; b)$ comme vecteur normal (perpendiculaire à la droite).", note:"Les coefficients devant $x$ et $y$ se lisent directement comme les coordonnées du vecteur normal."},
  {t:"formule", titre:"Équation d'un cercle", x:"Cercle de centre $Ω(a ; b)$ et de rayon $R$ : $(x - a)^2 + (y - b)^2 = R^2$", note:"Attention aux signes : un centre en $(-2 ; 3)$ donne $(x + 2)^2 + (y - 3)^2 = R^2$."},
  {t:"astuce", titre:"Lire un cercle en une seconde", x:"Dans $(x - 5)^2 + (y + 1)^2 = 9$, le centre est $(5 ; -1)$ — signes inversés — et le rayon vaut $@r{9} = 3$, pas 9."}
 ]},

 {titre:"Projeté orthogonal et formule d'Al-Kashi", blocs:[
  {t:"idee", x:"Le produit scalaire a une lecture géométrique : il mesure **ce qui reste d'un vecteur quand on l'écrase sur la direction de l'autre**. C'est le projeté orthogonal."},
  {t:"p", x:"Imagine le soleil exactement au-dessus de la droite $(AB)$, à la verticale. L'ombre du point $C$ tombe sur cette droite en un point qu'on note $H$ : c'est le **projeté orthogonal** de $C$ sur $(AB)$. C'est aussi le point de la droite le plus proche de $C$."},
  {t:"fig", titre:"L'ombre de C sur la droite (AB)",
   vue:[-0.5,-0.5,6.5,5], w:400, h:300,
   objets:[
    {t:"droite", de:[0,1], a:[1,1], couleur:"line2"},
    {t:"vec", de:[1,1], a:[5,1], couleur:"bleu", nom:"AB"},
    {t:"vec", de:[1,1], a:[3.5,4], couleur:"vert", nom:"AC"},
    {t:"seg", de:[3.5,4], a:[3.5,1], couleur:"rouge", pointille:true},
    {t:"angle", en:[3.5,1], de:[1,1], a:[3.5,4], droit:true},
    {t:"seg", de:[1,1], a:[3.5,1], couleur:"ambre", epais:5},
    {t:"point", x:1, y:1, nom:"A", dessous:true},
    {t:"point", x:5, y:1, nom:"B", dessous:true},
    {t:"point", x:3.5, y:4, nom:"C"},
    {t:"point", x:3.5, y:1, nom:"H", dessous:true},
    {t:"texte", x:2.25, y:0.4, txt:"AH : la part utile", couleur:"ambre"}
   ],
   note:"Le segment orange $AH$ est **la part de $@v{AC}$ qui va dans la direction de $@v{AB}$**. Le trait rouge, perpendiculaire, ne compte pas."},
  {t:"formule", titre:"Produit scalaire et projeté", x:"Si $H$ est le projeté orthogonal de $C$ sur $(AB)$, alors $@v{AB} · @v{AC} = @v{AB} · @v{AH}$", note:"On peut remplacer un vecteur par son projeté sans changer le produit scalaire."},
  {t:"p", x:"Cette formule dit quelque chose de simple sur la figure : pour calculer $@v{AB} · @v{AC}$, on a le droit de **remplacer $C$ par son ombre $H$**. Toute la partie verticale de $@v{AC}$ — le trait rouge — disparaît du calcul, parce qu'elle est perpendiculaire à $@v{AB}$ et n'apporte rien dans cette direction. C'est la traduction géométrique de l'histoire de la luge."},
  {t:"liste", items:[
   "Si $H$ est **du même côté** que $B$ : $@v{AB} · @v{AC} = AB × AH$, un nombre positif.",
   "Si $H$ est **de l'autre côté** de $A$ : $@v{AB} · @v{AC} = -AB × AH$, un nombre négatif.",
   "Si $H$ **est confondu avec $A$** : le produit scalaire est nul, les vecteurs sont perpendiculaires."
  ]},
  {t:"astuce", titre:"Le projeté sert aussi à mesurer une distance", x:"La distance d'un point à une droite se mesure toujours **le long de la perpendiculaire**, c'est-à-dire jusqu'au projeté orthogonal. C'est le trajet le plus court, et c'est ce qu'on demande quand un énoncé dit « distance du point $C$ à la droite »."},
  {t:"formule", titre:"Formule d'Al-Kashi", x:"$a^2 = b^2 + c^2 - 2bc × cos Â$", note:"C'est Pythagore généralisé à un triangle quelconque. Si $Â = 90°$, alors $cos Â = 0$ et on retrouve $a^2 = b^2 + c^2$."},
  {t:"fig", titre:"Les notations d'Al-Kashi",
   vue:[-0.5,-0.5,6,4.5], w:400, h:290, grille:false, axes:false, graduations:false,
   objets:[
    {t:"poly", pts:[[0.6,0.6],[5.2,0.6],[2.2,3.6]], couleur:"bleu", remplir:true},
    {t:"angle", en:[0.6,0.6], de:[5.2,0.6], a:[2.2,3.6]},
    {t:"point", x:0.6, y:0.6, nom:"A", dessous:true},
    {t:"point", x:5.2, y:0.6, nom:"B", dessous:true},
    {t:"point", x:2.2, y:3.6, nom:"C"},
    {t:"texte", x:3.8, y:2.5, txt:"a", couleur:"rouge", taille:16},
    {t:"texte", x:1.1, y:2.3, txt:"b", couleur:"ink2", taille:16},
    {t:"texte", x:2.9, y:0.25, txt:"c", couleur:"ink2", taille:16},
    {t:"texte", x:1.35, y:0.95, txt:"Â", couleur:"ambre", taille:14}
   ],
   note:"Chaque côté porte la lettre **minuscule** du sommet qui lui fait face. Le côté cherché $a$ (en rouge) est opposé à l'angle $Â$ (en orange) qu'on connaît."},
  {t:"p", x:"Cette convention n'est pas un caprice : elle rend la formule lisible. On cherche le côté $a$, celui qui est **en face** de l'angle connu $Â$. Les deux autres côtés, $b$ et $c$, sont ceux qui **encadrent** cet angle. La formule dit donc : « le carré du côté d'en face = la somme des carrés des deux côtés qui encadrent l'angle, moins un terme de correction qui dépend de cet angle »."},
  {t:"p", x:"Ce terme de correction, $-2bc × cos Â$, est ce qui manquait à Pythagore. Quand l'angle est droit, $cos(90°) = 0$ : la correction disparaît et on retombe exactement sur $a^2 = b^2 + c^2$. Al-Kashi n'est donc pas une nouvelle formule à empiler, c'est **Pythagore avec un rattrapage** pour les triangles qui ne sont pas rectangles."},
  {t:"exemple", titre:"Exemple guidé — calculer un côté manquant", enonce:"Dans un triangle, $AB = 5$, $AC = 7$ et l'angle en $A$ mesure 60°. Calculer $BC$.", etapes:[
   {q:"Identifier ce qu'on cherche", r:"$BC$ est le côté opposé à $A$ : c'est le « $a$ » de la formule. Les deux côtés qui encadrent l'angle sont $AB = 5$ et $AC = 7$."},
   {q:"Écrire la formule", r:"$BC^2 = AB^2 + AC^2 - 2 × AB × AC × cos Â$."},
   {q:"Remplacer", r:"$BC^2 = 5^2 + 7^2 - 2 × 5 × 7 × cos(60°) = 25 + 49 - 70 × 0{,}5$."},
   {q:"Calculer", r:"$= 74 - 35 = 39$."},
   {q:"Ne pas oublier la racine", r:"$BC = @r{39} ≈ 6{,}24$."},
   {q:"Contrôle", r:"$BC$ doit être compris entre $7 - 5 = 2$ et $7 + 5 = 12$ (inégalité triangulaire). C'est le cas. ✓"}
  ]},
  {t:"piege", titre:"L'angle doit être entre les deux côtés", x:"Al-Kashi n'utilise que l'angle **encadré par les deux côtés connus**. Si l'énoncé donne un autre angle, la formule ne s'applique pas directement : il faut d'abord passer par la somme des angles du triangle."}
 ]},

 {titre:"Récapitulatif : que faire selon la question posée", blocs:[
  {t:"idee", x:"Le chapitre entier tient dans une seule idée : **le produit scalaire transforme une question sur des angles en un simple calcul de nombres**. Tout le reste n'est que la façon de s'en servir selon ce que l'énoncé fournit."},
  {t:"p", x:"En contrôle, la difficulté n'est presque jamais le calcul lui-même — c'est de savoir quelle porte ouvrir. Ce tableau relie chaque question type à sa méthode. Relis-le la veille : il vaut mieux qu'une relecture complète du chapitre."},
  {t:"tbl", head:["La question ressemble à…","Ce qu'il faut faire"], rows:[
   ["« Calculer $@v{u} · @v{v}$ » avec des coordonnées","$x x' + y y'$, en surveillant les signes"],
   ["« Montrer que le triangle est rectangle en $B$ »","Les deux vecteurs partant de $B$, produit scalaire, montrer qu'il vaut 0"],
   ["« Pour quelle valeur de $m$… orthogonaux »","Produit scalaire avec la lettre, puis résoudre « = 0 »"],
   ["« Calculer la longueur $AB$ »","$@r{x^2 + y^2}$ sur le vecteur $@v{AB}$"],
   ["« Calculer l'angle »","$cos θ = @f{@v{u} · @v{v}}{||@v{u}|| × ||@v{v}||}$"],
   ["« Calculer un côté » avec un angle donné","Al-Kashi"],
   ["« Distance d'un point à une droite »","Passer par le projeté orthogonal"]
  ]},
  {t:"formule", titre:"Les trois lignes à savoir écrire sans réfléchir", x:"$@v{AB}(x_B - x_A ; y_B - y_A)$<br>$@v{u} · @v{v} = x x' + y y'$<br>$@v{u} ⊥ @v{v} ⇔ @v{u} · @v{v} = 0$", note:"Si tu ne devais retenir que trois choses de ce chapitre, ce serait celles-là."},
  {t:"astuce", titre:"Les trois erreurs qui coûtent le plus de points", x:"**1. Le sens du vecteur** — arrivée moins départ, jamais l'inverse.<br>**2. Le mauvais sommet** — pour un angle en $B$, les deux vecteurs partent de $B$.<br>**3. Les signes négatifs** — écris les parenthèses autour des coordonnées négatives, systématiquement.<br><br>Ces trois-là représentent l'essentiel des points perdus sur ce chapitre. Aucune n'est une erreur de compréhension : ce sont des erreurs d'inattention, donc entièrement évitables en ralentissant."},
  {t:"p", x:"Un dernier mot sur la méthode de travail. Ce chapitre se révise **avec un crayon et du papier quadrillé**, pas en relisant. Reprends deux ou trois exercices déjà faits, refais-les en traçant la figure à chaque fois — même quand l'énoncé ne le demande pas. La figure ne sert pas à trouver la réponse, elle sert à repérer quand la réponse trouvée est absurde."}
 ]}
],
exos:[
 {id:"ps1", niveau:1, type:"num", enonce:"Soit $@v{u}(2 ; 3)$ et $@v{v}(4 ; 1)$. Calculer $@v{u} · @v{v}$.",
  rep:11,
  diag:[{v:8, m:"Tu as multiplié uniquement les abscisses. Il faut ajouter aussi le produit des ordonnées : $3 × 1 = 3$."},
        {v:10, m:"Tu as fait la somme des coordonnées ($2+3+4+1$) ou un mélange. La formule est $x x' + y y'$ : deux produits, puis une somme."},
        {v:24, m:"Tu as multiplié les quatre nombres entre eux. Le produit scalaire n'est pas un produit de tout : c'est $2×4$ **plus** $3×1$."}],
  corr:["Formule : $@v{u} · @v{v} = x x' + y y'$.","$2 × 4 = 8$ et $3 × 1 = 3$.","$8 + 3 = 11$."],
  indice:"Multiplie les abscisses ensemble, les ordonnées ensemble, puis additionne les deux résultats."},

 {id:"ps2", niveau:1, type:"qcm", enonce:"Deux vecteurs non nuls ont un produit scalaire égal à 0. Que peut-on en conclure ?",
  choix:["Ils sont perpendiculaires","Ils sont égaux","Ils sont colinéaires","L'un des deux est nul"], bonne:0,
  diag:["", "Des vecteurs égaux auraient un produit scalaire égal au carré de leur norme, donc strictement positif.",
        "Des vecteurs colinéaires de même sens donnent un produit scalaire positif, de sens opposé un produit négatif — jamais nul s'ils sont non nuls.",
        "L'énoncé précise justement qu'ils sont non nuls."],
  corr:["Le critère du cours : $@v{u} · @v{v} = 0$ équivaut à $@v{u} ⊥ @v{v}$ (pour des vecteurs non nuls).","Les deux vecteurs sont donc perpendiculaires."],
  indice:"Un produit scalaire nul correspond à un angle bien particulier. Lequel ?"},

 {id:"ps3", niveau:2, type:"num", enonce:"Soit $A(1 ; 2)$ et $B(5 ; 5)$. Quelle est la longueur $AB$ ?",
  rep:5,
  diag:[{v:7, m:"Tu as additionné les écarts ($4 + 3$). Il faut appliquer Pythagore : $@r{4^2 + 3^2}$, pas une simple somme."},
        {v:25, m:"Tu t'es arrêté avant la racine carrée. $16 + 9 = 25$, puis $@r{25} = 5$."},
        {v:12, m:"Tu as multiplié les écarts. La formule fait intervenir la somme des **carrés**, sous une racine."}],
  corr:["$@v{AB}(5 - 1 ; 5 - 2) = (4 ; 3)$.","$AB = @r{4^2 + 3^2}$.","$= @r{16 + 9} = @r{25}$.","$AB = 5$."],
  indice:"Trouve d'abord les coordonnées du vecteur, puis applique $@r{x^2 + y^2}$."},

 {id:"ps4", niveau:2, type:"qcm", enonce:"Les vecteurs $@v{u}(3 ; -2)$ et $@v{v}(4 ; 6)$ sont-ils orthogonaux ?",
  choix:["Oui, car leur produit scalaire vaut 0","Non, car leur produit scalaire vaut 24","Non, car ils n'ont pas la même norme","Impossible à dire sans l'angle"], bonne:0,
  diag:["", "Recalcule en respectant les signes : $3 × 4 + (-2) × 6 = 12 - 12 = 0$. Le résultat est bien nul.",
        "L'orthogonalité ne dépend pas des normes. Deux vecteurs de longueurs très différentes peuvent parfaitement être perpendiculaires.",
        "Le produit scalaire en coordonnées permet justement de conclure sans connaître l'angle : c'est tout son intérêt."],
  corr:["$@v{u} · @v{v} = 3 × 4 + (-2) × 6$.","$= 12 - 12 = 0$.","Le produit scalaire est nul : les vecteurs sont orthogonaux."],

 {id:"ps5", niveau:2, type:"num", enonce:"Soit $@v{u}(1 ; k)$ et $@v{v}(3 ; -6)$. Pour quelle valeur de $k$ ces vecteurs sont-ils orthogonaux ?",
  rep:0.5, tol:0.001,

        {v:2, m:"Tu as sans doute résolu $3k = 6$. Attention : le $k$ est multiplié par $-6$, pas par 3. L'équation est $1 × 3 + k × (-6) = 0$."},
        {v:6, m:"Tu as recopié un coefficient de l'énoncé. Il faut poser l'équation du produit scalaire puis la résoudre."}],
  corr:["Orthogonalité : $@v{u} · @v{v} = 0$.","$1 × 3 + k × (-6) = 0$, soit $3 - 6k = 0$.","$6k = 3$.","$k = @f{3}{6} = 0{,}5$."],
  indice:"Écris le produit scalaire en fonction de $k$, puis résous l'équation « = 0 »."},

 {id:"ps6", niveau:3, type:"qcm", enonce:"Quel est le centre du cercle d'équation $(x - 3)^2 + (y + 4)^2 = 25$ ?",
  choix:["$(3 ; -4)$","$(-3 ; 4)$","$(3 ; 4)$","$(-3 ; -4)$"], bonne:0,
  diag:["", "Tu as inversé les deux signes. La formule est $(x - a)^2 + (y - b)^2$ : le centre est ce qu'on **retranche**, donc $a = 3$ et $b = -4$.",
        "Attention au $+4$ : $(y + 4)^2$ s'écrit $(y - (-4))^2$, donc l'ordonnée du centre est $-4$.",

  corr:["Forme générale : $(x - a)^2 + (y - b)^2 = R^2$ avec $Ω(a ; b)$.","Ici $(x - 3)^2$ donne $a = 3$.","$(y + 4)^2 = (y - (-4))^2$ donne $b = -4$.","Le centre est $(3 ; -4)$, et le rayon vaut $@r{25} = 5$."],
  indice:"Réécris $(y + 4)$ sous la forme $(y - ?)$ pour lire l'ordonnée du centre."},

 {id:"ps7", niveau:3, type:"num", enonce:"Soit $A(0 ; 0)$, $B(4 ; 0)$ et $C(4 ; 3)$. Calculer $@v{AB} · @v{AC}$.",
  rep:16,
  diag:[{v:0, m:"Tu as peut-être supposé un angle droit en $A$. Or l'angle droit est en $B$ : les vecteurs $@v{AB}(4 ; 0)$ et $@v{AC}(4 ; 3)$ ne sont pas perpendiculaires."},
        {v:12, m:"Tu as utilisé les mauvais vecteurs, sans doute $@v{BA}$ ou $@v{BC}$. Repars des coordonnées : $@v{AB}(4 ; 0)$ et $@v{AC}(4 ; 3)$."},
        {v:28, m:"Tu as ajouté quelque chose en trop. $4 × 4 = 16$ et $0 × 3 = 0$, la somme vaut donc 16."}],
  corr:["$@v{AB}(4 - 0 ; 0 - 0) = (4 ; 0)$.","$@v{AC}(4 - 0 ; 3 - 0) = (4 ; 3)$.","$@v{AB} · @v{AC} = 4 × 4 + 0 × 3 = 16 + 0$.","Le produit scalaire vaut 16."],
  indice:"Calcule les deux vecteurs à partir de $A$ (arrivée moins départ), puis applique la formule des coordonnées."},

 {id:"ps8", niveau:3, type:"qcm", enonce:"Une droite a pour équation $2x - 5y + 7 = 0$. Quel vecteur lui est normal (perpendiculaire) ?",
  choix:["$@v{n}(2 ; -5)$","$@v{n}(5 ; 2)$","$@v{n}(-5 ; 2)$","$@v{n}(2 ; 7)$"], bonne:0,
  diag:["", "$(5 ; 2)$ est un vecteur **directeur** de la droite, c'est-à-dire parallèle à elle. Le vecteur normal se lit directement sur les coefficients de $x$ et $y$.",
        "Comme le précédent, celui-ci est directeur et non normal.",
        "Le 7 est la constante de l'équation : il ne fait pas partie des coordonnées du vecteur normal, qui ne retient que les coefficients de $x$ et $y$."],
  corr:["Pour une droite $ax + by + c = 0$, le vecteur $@v{n}(a ; b)$ est normal à la droite.","Ici $a = 2$ et $b = -5$.","Donc $@v{n}(2 ; -5)$ convient."],
  indice:"Les coordonnées du vecteur normal se lisent directement dans l'équation. Quels coefficients ?"},

 {id:"ps9", niveau:2, type:"num", enonce:"Dans un triangle, $AB = 4$, $AC = 6$ et l'angle en $A$ mesure 60°. Calculer $BC^2$.",
  rep:28,
  diag:[{v:52, m:"Tu as oublié le terme $-2bc × cos Â$. Il vaut $-2 × 4 × 6 × 0{,}5 = -24$, donc $52 - 24 = 28$."},
        {v:76, m:"Tu as ajouté le dernier terme au lieu de le retrancher. La formule contient un **moins** : $a^2 = b^2 + c^2 - 2bc × cos Â$."},

 {id:"ps10", niveau:3, type:"qcm", enonce:"$H$ est le projeté orthogonal de $C$ sur la droite $(AB)$, et $H$ se trouve entre $A$ et $B$. Que vaut $@v{AB} · @v{AC}$ ?",

  diag:["", "Ce serait le cas si $C$ était **sur** la droite $(AB)$. Dès qu'il y a un angle, seul le projeté $AH$ intervient, et $AH < AC$.",

]
}

<script>
window.COURS = (window.COURS || []).concat([

/* ================= 7. PROBABILITÉS CONDITIONNELLES ================= */
{
id:"proba", n:8, titre:"Probabilités conditionnelles",
sous:"Réviser son jugement quand on apprend quelque chose",
desc:"Probabilité conditionnelle, arbre pondéré, probabilités totales et indépendance.",
duree:40,
sections:[
 {titre:"Une information change tout", blocs:[
  {t:"idee", x:"Une probabilité conditionnelle répond à la question : **sachant que tel événement s'est produit, quelle est maintenant la probabilité de tel autre ?**"},
  {t:"p", x:"Exemple concret : la probabilité qu'une personne prise au hasard mesure plus d'1,80 m n'est pas la même si l'on sait déjà qu'il s'agit d'un joueur de basket professionnel. L'information reçue **rétrécit l'univers** dans lequel on compte."},
  {t:"p", x:"Prenons un exemple chiffré pour voir l'effet. Dans un lycée de 1000 élèves, 100 font de l'allemand : la probabilité qu'un élève au hasard en fasse est donc $@f{100}{1000} = 0{,}1$. Maintenant on vous dit que l'élève tiré au sort est en série littéraire — et qu'il n'y a que 200 littéraires, dont 60 germanistes. La probabilité passe à $@f{60}{200} = 0{,}3$. **Le même événement, trois fois plus probable**, simplement parce qu'on a reçu une information."},
  {t:"p", x:"Regarde ce qui a changé dans le calcul : le dénominateur. On est passé de 1000 (tous les élèves) à 200 (les littéraires seulement). L'information a **rétréci l'univers** dans lequel on compte. C'est toute l'idée, et c'est exactement ce que dit la formule."},
  {t:"formule", titre:"Définition", x:"$P_A(B) = @f{P(A ∩ B)}{P(A)}$ &nbsp;&nbsp;(avec $P(A) ≠ 0$)", note:"Se lit « probabilité de B sachant A ». Le dénominateur est la probabilité de ce qu'on sait déjà."},
  {t:"p", x:"Relis la formule avec l'exemple en tête. En haut, $P(A ∩ B)$ : les élèves qui sont **à la fois** littéraires et germanistes — les 60. En bas, $P(A)$ : tous les littéraires — les 200. Le petit $A$ écrit en indice désigne toujours **le nouvel univers**, celui qui passe au dénominateur."},
  {t:"astuce", titre:"Comment lire cette formule", x:"En haut : les cas où **les deux** se réalisent. En bas : le nouvel univers, c'est-à-dire ce dont on est déjà sûr. On ne compte plus que dans la partie du monde où $A$ est vrai."},
  {t:"formule", titre:"La formule des probabilités composées", x:"$P(A ∩ B) = P(A) × P_A(B)$", note:"C'est la même relation, réécrite. C'est celle qu'on utilise sur un arbre."},
  {t:"piege", titre:"Deux notations à ne pas confondre", x:"$P(A ∩ B)$ : les deux se produisent, mesuré sur **tout** l'univers.<br>$P_A(B)$ : $B$ se produit, mesuré **uniquement** parmi les cas où $A$ est vrai.<br>La seconde est presque toujours plus grande que la première."}
 ]},

 {titre:"L'arbre pondéré : l'outil qui fait tout", blocs:[
  {t:"p", x:"Presque tous les exercices de ce chapitre se résolvent en dessinant un arbre. C'est un investissement de deux minutes qui évite dix minutes d'erreurs."},
  {t:"p", x:"Pourquoi un arbre ? Parce qu'une situation à deux étapes se décrit mal par une phrase, mais très bien par un schéma qui **sépare les cas**. La première fourche représente le premier choix du hasard ; chaque branche se subdivise ensuite selon ce qui peut arriver **sachant** qu'on a pris ce chemin-là. L'arbre matérialise exactement ce que veut dire « conditionnel »."},
  {t:"fig", titre:"L'arbre de l'usine à deux machines",
   vue:[0,0,10,6], w:400, h:270, grille:false, axes:false, graduations:false,
   objets:[

   note:"Première fourche : de quelle machine vient la pièce. Seconde : est-elle défectueuse, **sachant** d'où elle vient."},
  {t:"p", x:"Lis la figure de gauche à droite, comme un trajet. Une pièce part du tronc, choisit d'abord sa machine (60 % de chances d'être une pièce de A), puis se révèle défectueuse ou non — avec des probabilités **différentes selon la branche empruntée** : 5 % du côté de A, seulement 2 % du côté de B. Ce sont exactement les probabilités conditionnelles $P_A(D)$ et $P_B(D)$."},
  {t:"p", x:"Remarque un détail qui compte : sur la seconde fourche du haut, $0{,}05$ et $0{,}95$ font 1. Sur celle du bas, $0{,}02$ et $0{,}98$ font 1 aussi. Chaque fourche est un petit monde complet où toutes les possibilités sont couvertes. C'est la première règle ci-dessous, et elle sert de contrôle permanent."},
  {t:"formule", titre:"Les trois règles de l'arbre", x:"1. La somme des probabilités partant d'un même nœud vaut **1**<br>2. Sur un chemin, on **multiplie** les probabilités<br>3. Pour un événement atteint par plusieurs chemins, on **additionne** les chemins", note:"Multiplier le long d'une branche, additionner entre les branches."},
  {t:"p", x:"Ces trois règles se comprennent si on pense en termes de proportions. **Multiplier** le long d'un chemin : sur les 60 % de pièces venant de A, on ne garde que les 5 % défectueuses — soit 5 % de 60 %, donc $0{,}05 × 0{,}6$. « Un pourcentage d'un pourcentage » se calcule toujours par une multiplication.<br><br>**Additionner** entre les chemins : les pièces défectueuses viennent soit de A, soit de B, jamais des deux. Ce sont des cas séparés, donc on cumule leurs effectifs."},
  {t:"exemple", titre:"Exemple guidé — une usine à deux machines", enonce:"Une usine produit des pièces avec deux machines. La machine A fabrique 60 % des pièces, la machine B le reste. 5 % des pièces de A sont défectueuses, contre 2 % de celles de B. On prend une pièce au hasard : quelle est la probabilité qu'elle soit défectueuse ?", etapes:[
   {q:"Nommer les événements", r:"$A$ : « la pièce vient de A ». $B$ : « la pièce vient de B ». $D$ : « la pièce est défectueuse »."},
   {q:"Traduire l'énoncé", r:"$P(A) = 0{,}6$ et $P(B) = 0{,}4$ (le reste). Puis $P_A(D) = 0{,}05$ et $P_B(D) = 0{,}02$."},
   {q:"Premier chemin : A puis défectueuse", r:"On multiplie le long de la branche : $0{,}6 × 0{,}05 = 0{,}03$."},
   {q:"Deuxième chemin : B puis défectueuse", r:"$0{,}4 × 0{,}02 = 0{,}008$."},
   {q:"Additionner les chemins", r:"$P(D) = 0{,}03 + 0{,}008 = 0{,}038$, soit 3,8 %."},
   {q:"Contrôle de bon sens", r:"Le résultat doit être compris entre 2 % et 5 % (les deux taux de départ), et plus proche de 5 % puisque A produit la majorité. C'est cohérent."}
  ]},
  {t:"formule", titre:"Formule des probabilités totales", x:"$P(B) = P(A) × P_A(B) + P(Ā) × P_{Ā}(B)$", note:"C'est exactement le calcul de l'exemple ci-dessus, écrit en toutes lettres. $Ā$ désigne le contraire de $A$ (« non A »)."},
  {t:"check", q:"Sur un arbre, deux branches partent du premier nœud. La première porte 0,7. Que porte la seconde ?",
   choix:["0,3","0,7","1","impossible à savoir"], bonne:0,
   expl:["Exact : la somme des branches issues d'un même nœud vaut 1, donc $1 - 0{,}7 = 0{,}3$.",
         "Les deux branches ne portent la même valeur que si elles valent chacune 0,5.",
         "1 serait la somme des deux branches, pas la valeur de l'une d'elles.",
         "On peut tout à fait le savoir : c'est la première règle de l'arbre."]}
 ]},

 {titre:"Renverser le conditionnement", blocs:[
  {t:"idee", x:"Question typique : « la pièce est défectueuse, quelle est la probabilité qu'elle vienne de A ? » On remonte l'arbre à contre-courant."},
  {t:"formule", titre:"La méthode", x:"$P_D(A) = @f{P(A ∩ D)}{P(D)}$", note:"En haut : le chemin qui nous intéresse. En bas : tous les chemins menant à D."},
  {t:"exemple", titre:"Exemple guidé — remonter l'arbre", enonce:"Avec les données de l'usine précédente, une pièce défectueuse est prélevée. Quelle est la probabilité qu'elle provienne de la machine A ?", etapes:[
   {q:"Écrire ce qu'on cherche", r:"On cherche $P_D(A)$ : la machine sachant le défaut. Attention, ce n'est pas $P_A(D) = 0{,}05$, qui est l'inverse."},
   {q:"Numérateur", r:"$P(A ∩ D) = 0{,}6 × 0{,}05 = 0{,}03$."},
   {q:"Dénominateur", r:"$P(D) = 0{,}038$, calculé précédemment."},
   {q:"Diviser", r:"$P_D(A) = @f{0,03}{0,038} ≈ 0{,}789$."},
   {q:"Interpréter", r:"Environ 79 % des pièces défectueuses viennent de la machine A. C'est logique : elle produit plus, et avec un taux de défaut plus élevé."}
  ]},
  {t:"piege", titre:"L'inversion illégitime", x:"$P_A(D)$ et $P_D(A)$ sont deux nombres complètement différents. Ici l'un vaut 0,05 et l'autre 0,79. Confondre les deux est l'erreur de raisonnement la plus classique — y compris chez les adultes, en médecine ou en justice."}
 ]},

 {titre:"Indépendance", blocs:[
  {t:"idee", x:"Deux événements sont **indépendants** si savoir que l'un s'est produit ne change rien à la probabilité de l'autre."},
  {t:"formule", titre:"Les deux tests équivalents", x:"$A$ et $B$ indépendants &nbsp;⇔&nbsp; $P(A ∩ B) = P(A) × P(B)$<br>&nbsp;⇔&nbsp; $P_A(B) = P(B)$", note:"En pratique on vérifie presque toujours le premier."},
  {t:"p", x:"Attention : indépendant ne veut pas dire « incompatible ». Deux événements incompatibles ne peuvent pas se produire ensemble ($P(A ∩ B) = 0$), ce qui est au contraire une forme très forte de dépendance."},
  {t:"exemple", titre:"Exemple guidé — tester l'indépendance", enonce:"On a $P(A) = 0{,}4$, $P(B) = 0{,}5$ et $P(A ∩ B) = 0{,}2$. Les événements $A$ et $B$ sont-ils indépendants ?", etapes:[
   {q:"Calculer le produit", r:"$P(A) × P(B) = 0{,}4 × 0{,}5 = 0{,}2$."},
   {q:"Comparer", r:"On a bien $P(A ∩ B) = 0{,}2$, égal au produit."},
   {q:"Conclure", r:"Les événements sont indépendants."},
   {q:"Vérification par l'autre test", r:"$P_A(B) = @f{0,2}{0,4} = 0{,}5 = P(B)$. Savoir que $A$ s'est produit ne change effectivement rien. ✓"}
  ]},
  {t:"p", x:"Une confusion à dissiper, parce qu'elle revient sans cesse : **indépendants** et **incompatibles** ne veulent pas du tout dire la même chose, alors que les deux mots évoquent une idée de séparation."},
  {t:"tbl", head:["","Incompatibles","Indépendants"], rows:[
   ["Définition","ne peuvent pas arriver ensemble","l'un n'informe pas sur l'autre"],
   ["Traduction","$P(A ∩ B) = 0$","$P(A ∩ B) = P(A) × P(B)$"],
   ["Exemple","tirer un roi et tirer un as","tirer un roi et obtenir pile"],
   ["Lien entre eux","savoir que $A$ arrive **exclut** $B$","savoir que $A$ arrive ne change rien"]
  ]},
  {t:"p", x:"La dernière ligne montre que ce sont presque des contraires. Si deux événements sont incompatibles, apprendre que l'un s'est produit est une information **énorme** : elle rend l'autre impossible. C'est le maximum de dépendance, pas l'indépendance."},
  {t:"piege", titre:"Ne jamais supposer l'indépendance", x:"L'indépendance ne se devine pas, elle **se vérifie** ou elle est **annoncée par l'énoncé**. Beaucoup d'élèves multiplient $P(A) × P(B)$ par réflexe alors que rien ne l'autorise. Si l'énoncé ne dit pas « indépendants » et que tu n'as pas fait le test, passe par l'arbre."}
 ]},

 {titre:"Récapitulatif : lire l'énoncé, puis dessiner", blocs:[
  {t:"idee", x:"Toute la difficulté de ce chapitre est de **traduire les phrases en notations**. Une fois l'arbre dessiné et les probabilités placées dessus, les calculs sont élémentaires."},
  {t:"p", x:"Le point qui bloque le plus est de reconnaître si une phrase décrit une probabilité conditionnelle ou une intersection. Ce tableau donne les tournures les plus fréquentes et leur traduction."},
  {t:"tbl", head:["Ce que dit l'énoncé","Ce que ça veut dire"], rows:[
   ["« … sachant que … »","$P_A(B)$ — conditionnelle"],
   ["« Parmi les A, la proportion de B »","$P_A(B)$ — conditionnelle"],
   ["« 5 % des pièces de A sont défectueuses »","$P_A(D) = 0{,}05$ — conditionnelle"],
   ["« et », « à la fois », « les deux »","$P(A ∩ B)$ — intersection"],
   ["« 3 % des pièces sont de A et défectueuses »","$P(A ∩ D) = 0{,}03$ — intersection"],
   ["« ou », « au moins un des deux »","une réunion, souvent par l'événement contraire"],
   ["Une probabilité donnée sans condition","$P(A)$ — sur tout l'univers"]
  ]},
  {t:"astuce", titre:"La méthode en quatre temps", x:"1. **Nommer** les événements par une lettre, et l'écrire noir sur blanc.<br>2. **Traduire** chaque phrase de l'énoncé en une probabilité, en repérant les conditionnelles.<br>3. **Dessiner** l'arbre et y placer toutes les valeurs connues ; compléter par la règle « la somme fait 1 ».<br>4. **Répondre** : multiplier le long d'un chemin, additionner entre les chemins."},
  {t:"piege", titre:"L'erreur qui coûte le plus : inverser le conditionnement", x:"$P_A(B)$ et $P_B(A)$ sont deux nombres différents, souvent très différents. Dans l'exemple de l'usine, l'un vaut 0,05 et l'autre 0,79.<br><br>C'est l'erreur de raisonnement la plus répandue, et pas seulement chez les élèves : « 99 % des malades ont un test positif » ne signifie **pas** « 99 % des tests positifs sont des malades ». Si la maladie est rare, les faux positifs peuvent être bien plus nombreux que les vrais. Avant tout calcul, demande-toi toujours : **qu'est-ce qu'on sait déjà ?** C'est ça qui va au dénominateur."},
  {t:"p", x:"Pour réviser, refais deux exercices en dessinant l'arbre **avant** de lire les questions. Tu constateras que la plupart des questions se répondent alors en lisant simplement le schéma, sans réfléchir davantage."}
 ]}
],

 {id:"pr3", niveau:2, type:"num", enonce:"Une urne contient 3 boules rouges et 7 boules noires. On tire deux boules successivement **sans remise**. Quelle est la probabilité d'obtenir deux rouges ?",

 {id:"pr4", niveau:2, type:"num", enonce:"Une maladie touche 2 % de la population. Un test est positif chez 90 % des malades et chez 5 % des personnes saines. Quelle est la probabilité qu'un test pris au hasard soit positif ?",

 {id:"pr5", niveau:2, type:"qcm", enonce:"On a $P(A) = 0{,}5$, $P(B) = 0{,}6$ et $P(A ∩ B) = 0{,}3$. Les événements sont-ils indépendants ?",

 {id:"pr6", niveau:3, type:"num", enonce:"Reprends l'usine : 60 % des pièces viennent de A (5 % de défauts), 40 % de B (2 % de défauts). Une pièce est défectueuse. Quelle est la probabilité qu'elle vienne de A ? (arrondir au millième)",

 {id:"pr7", niveau:3, type:"qcm", enonce:"Un test de dépistage est positif chez 99 % des malades. Julie a un test positif. Peut-on dire qu'elle a 99 % de risque d'être malade ?",
