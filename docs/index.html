<script>
/* =====================================================================
   Moteur de figures géométriques
   ---------------------------------------------------------------------
   Deux types de blocs :
     {t:"fig",  ...}  figure fixe, décrite en coordonnées mathématiques
     {t:"figi", nom:"..."}  figure manipulable (le nom désigne un modèle)
   Les couleurs viennent des jetons CSS : les figures suivent le thème.
   ===================================================================== */
(function(){
"use strict";
var A = window.APP, T = A.T, el = A.el;
var NS = "http://www.w3.org/2000/svg";

function n(tag, attrs){
  var e = document.createElementNS(NS, tag);
  for(var k in attrs) if(attrs[k]!=null) e.setAttribute(k, attrs[k]);
  return e;
}
function coul(nom){
  return "var(--"+(nom||"ink")+")";
}

/* ---- repère : coordonnées maths -> pixels ---- */
function repere(vue, w, h, marge){
  var m = marge==null ? 26 : marge;
  var x0=vue[0], y0=vue[1], x1=vue[2], y1=vue[3];
  var kx = (w-2*m)/(x1-x0), ky = (h-2*m)/(y1-y0);
  var k = Math.min(kx, ky);                   // repère orthonormé
  var cx = m + ((w-2*m) - k*(x1-x0))/2;
  var cy = m + ((h-2*m) - k*(y1-y0))/2;
  return {
    X: function(x){ return cx + (x-x0)*k; },
    Y: function(y){ return h - cy - (y-y0)*k; },
    x: function(px){ return x0 + (px-cx)/k; },
    y: function(py){ return y0 + (h-cy-py)/k; },
    k: k, vue: vue
  };
}

/* ---- fond : grille et axes ---- */
function fond(svg, R, opts){
  var v = R.vue, i;
  if(opts.grille !== false){
    var g = n("g", {"stroke":coul("line"), "stroke-width":1, "opacity":.75});
    for(i=Math.ceil(v[0]); i<=v[2]; i++)
      g.appendChild(n("line",{x1:R.X(i), y1:R.Y(v[1]), x2:R.X(i), y2:R.Y(v[3])}));
    for(i=Math.ceil(v[1]); i<=v[3]; i++)
      g.appendChild(n("line",{x1:R.X(v[0]), y1:R.Y(i), x2:R.X(v[2]), y2:R.Y(i)}));
    svg.appendChild(g);
  }
  if(opts.axes !== false){
    var a = n("g", {"stroke":coul("ink3"), "stroke-width":1.6});
    if(v[1]<=0 && v[3]>=0) a.appendChild(n("line",{x1:R.X(v[0]),y1:R.Y(0),x2:R.X(v[2]),y2:R.Y(0)}));
    if(v[0]<=0 && v[2]>=0) a.appendChild(n("line",{x1:R.X(0),y1:R.Y(v[1]),x2:R.X(0),y2:R.Y(v[3])}));
    svg.appendChild(a);
    if(opts.graduations !== false){
      var t = n("g", {"fill":coul("ink3"), "font-size":10, "font-family":"system-ui"});
      for(i=Math.ceil(v[0]); i<=v[2]; i++) if(i!==0 && v[1]<=0 && v[3]>=0)
        t.appendChild(txt(R.X(i), R.Y(0)+13, String(i), "middle"));
      for(i=Math.ceil(v[1]); i<=v[3]; i++) if(i!==0 && v[0]<=0 && v[2]>=0)
        t.appendChild(txt(R.X(0)-7, R.Y(i)+4, String(i), "end"));
      svg.appendChild(t);
    }
  }
}
function txt(x, y, s, ancre){
  var e = n("text", {x:x, y:y, "text-anchor":ancre||"start"});
  e.textContent = s;
  return e;
}

/* ---- flèche de vecteur ---- */
function fleche(svg, R, de, a, couleur, nom){
  var x1=R.X(de[0]), y1=R.Y(de[1]), x2=R.X(a[0]), y2=R.Y(a[1]);
  var dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy) || 1;
  var ux=dx/L, uy=dy/L, t=9;
  var g = n("g", {stroke:coul(couleur), fill:coul(couleur), "stroke-width":2.4,
                  "stroke-linecap":"round"});
  g.appendChild(n("line",{x1:x1,y1:y1,x2:x2-ux*t*0.8,y2:y2-uy*t*0.8}));
  g.appendChild(n("polygon",{ points:
    (x2)+","+(y2)+" "+
    (x2-ux*t-uy*t*0.45)+","+(y2-uy*t+ux*t*0.45)+" "+
    (x2-ux*t+uy*t*0.45)+","+(y2-uy*t-ux*t*0.45), stroke:"none"}));
  svg.appendChild(g);
  if(nom){
    var e = txt(x1+dx/2 - uy*14, y1+dy/2 + ux*14 + 4, nom, "middle");
    e.setAttribute("fill", coul(couleur));
    e.setAttribute("font-size", 14);
    e.setAttribute("font-style", "italic");
    e.setAttribute("font-family", "Source Serif 4, Georgia, serif");
    svg.appendChild(e);
  }
}

/* ---- angle droit / angle marqué ---- */
function marqueAngle(svg, R, en, v1, v2, droit){
  var a1 = Math.atan2(R.Y(en[1])-R.Y(v1[1]), R.X(v1[0])-R.X(en[0]));
  var a2 = Math.atan2(R.Y(en[1])-R.Y(v2[1]), R.X(v2[0])-R.X(en[0]));
  var px = R.X(en[0]), py = R.Y(en[1]);
  if(droit){
    var t = 13;
    var c1x = px + Math.cos(a1)*t, c1y = py - Math.sin(a1)*t;
    var c2x = px + Math.cos(a2)*t, c2y = py - Math.sin(a2)*t;
    svg.appendChild(n("polyline", {
      points: c1x+","+c1y+" "+(c1x+c2x-px)+","+(c1y+c2y-py)+" "+c2x+","+c2y,
      fill:"none", stroke:coul("rouge"), "stroke-width":2 }));
  } else {
    var r = 22;
    var d = "M "+(px+Math.cos(a1)*r)+" "+(py-Math.sin(a1)*r)+
            " A "+r+" "+r+" 0 0 "+((a2-a1+2*Math.PI)%(2*Math.PI) > Math.PI ? 1 : 0)+
            " "+(px+Math.cos(a2)*r)+" "+(py-Math.sin(a2)*r);
    svg.appendChild(n("path",{d:d, fill:"none", stroke:coul("ambre"), "stroke-width":2}));
  }
}

/* ---- point nommé ---- */
function point(svg, R, x, y, nom, couleur, dessous){
  var px=R.X(x), py=R.Y(y);
  svg.appendChild(n("circle",{cx:px, cy:py, r:4.5, fill:coul(couleur||"ink")}));
  if(nom){
    var e = txt(px+8, py + (dessous ? 18 : -9), nom);
    e.setAttribute("fill", coul(couleur||"ink"));
    e.setAttribute("font-size", 15);
    e.setAttribute("font-family", "Source Serif 4, Georgia, serif");
    e.setAttribute("font-weight", 600);
    svg.appendChild(e);
  }
}

/* =====================================================================
   Figure fixe
   ===================================================================== */
function figure(b){
  var w = b.w || 380, h = b.h || 300;
  var boite = el("div","figBoite");
  if(b.titre) boite.appendChild(el("div","figTitre", T(b.titre)));
  var svg = n("svg", {viewBox:"0 0 "+w+" "+h, class:"fig", role:"img"});
  svg.setAttribute("aria-label", b.alt || b.titre || "figure géométrique");
  var R = repere(b.vue || [-1,-1,6,5], w, h, b.marge);
  fond(svg, R, b);
  (b.objets||[]).forEach(function(o){ dessiner(svg, R, o); });
  boite.appendChild(svg);
  if(b.note) boite.appendChild(el("div","figNote", T(b.note)));
  return boite;
}

function dessiner(svg, R, o){
  switch(o.t){
    case "point": point(svg,R,o.x,o.y,o.nom,o.couleur,o.dessous); break;
    case "seg":
      svg.appendChild(n("line",{x1:R.X(o.de[0]),y1:R.Y(o.de[1]),
        x2:R.X(o.a[0]),y2:R.Y(o.a[1]), stroke:coul(o.couleur||"ink"),
        "stroke-width":o.epais||2.2, "stroke-linecap":"round",
        "stroke-dasharray": o.pointille ? "5 5" : null}));
      break;
    case "droite": {
      var v=R.vue, dx=o.a[0]-o.de[0], dy=o.a[1]-o.de[1];
      var t1=-50, t2=50;
      svg.appendChild(n("line",{
        x1:R.X(o.de[0]+dx*t1), y1:R.Y(o.de[1]+dy*t1),
        x2:R.X(o.de[0]+dx*t2), y2:R.Y(o.de[1]+dy*t2),
        stroke:coul(o.couleur||"bleu"), "stroke-width":o.epais||2.2,
        "stroke-dasharray": o.pointille ? "5 5" : null}));
      break;
    }
    case "vec": fleche(svg,R,o.de,o.a,o.couleur||"bleu",o.nom); break;
    case "cercle":
      svg.appendChild(n("circle",{cx:R.X(o.c[0]), cy:R.Y(o.c[1]), r:o.r*R.k,
        fill: o.remplir ? coul(o.couleur||"bleu") : "none",
        "fill-opacity": o.remplir ? .1 : null,
        stroke:coul(o.couleur||"bleu"), "stroke-width":2.2,
        "stroke-dasharray": o.pointille ? "5 5" : null}));
      break;
    case "poly":
      svg.appendChild(n("polygon",{
        points:o.pts.map(function(p){ return R.X(p[0])+","+R.Y(p[1]); }).join(" "),
        fill: o.remplir ? coul(o.couleur||"bleu") : "none",
        "fill-opacity": o.remplir ? .12 : null,
        stroke:coul(o.couleur||"bleu"), "stroke-width":2.2}));
      break;
    case "angle": marqueAngle(svg,R,o.en,o.de,o.a,o.droit); break;
    case "texte": {
      var e = txt(R.X(o.x), R.Y(o.y), o.txt, o.ancre||"middle");
      e.setAttribute("fill", coul(o.couleur||"ink2"));
      e.setAttribute("font-size", o.taille||13);
      e.setAttribute("font-family", "system-ui");
      svg.appendChild(e);
      break;
    }
    case "courbe": {
      var f = window.COURBES && window.COURBES[o.f];
      if(!f) break;
      var d="", vv=R.vue, i;
      for(i=0;i<=240;i++){
        var x = vv[0] + (vv[2]-vv[0])*i/240, y = f(x);
        if(!isFinite(y) || y<vv[1]-5 || y>vv[3]+5){ d += ""; continue; }
        d += (d ? " L " : "M ") + R.X(x) + " " + R.Y(y);
      }
      svg.appendChild(n("path",{d:d, fill:"none", stroke:coul(o.couleur||"bleu"),
        "stroke-width":2.6}));
      break;
    }
  }
}

/* =====================================================================
   Figures manipulables
   ===================================================================== */
var MODELES = {};

/* -- cercle trigonométrique -- */
MODELES["cercle-trigo"] = function(){
  var w=360, h=340, ang = Math.PI/6;
  var boite = el("div","figBoite");
  var svg = n("svg",{viewBox:"0 0 "+w+" "+h, class:"fig figManip"});
  var R = repere([-1.45,-1.45,1.45,1.45], w, h, 18);
  var lecture = el("div","figLecture");
  var aide = el("div","figNote","Fais glisser le point <b>M</b> sur le cercle.");
  function redessine(){
    while(svg.firstChild) svg.removeChild(svg.firstChild);
    fond(svg, R, {grille:false, graduations:false});
    var c = Math.cos(ang), s = Math.sin(ang);
    svg.appendChild(n("circle",{cx:R.X(0),cy:R.Y(0),r:R.k,fill:"none",
      stroke:coul("line2"),"stroke-width":2}));
    // projections
    svg.appendChild(n("line",{x1:R.X(c),y1:R.Y(s),x2:R.X(c),y2:R.Y(0),
      stroke:coul("bleu"),"stroke-width":1.8,"stroke-dasharray":"4 4"}));
    svg.appendChild(n("line",{x1:R.X(c),y1:R.Y(s),x2:R.X(0),y2:R.Y(s),
      stroke:coul("vert"),"stroke-width":1.8,"stroke-dasharray":"4 4"}));
    // cosinus sur l'axe des abscisses, sinus sur celui des ordonnées
    svg.appendChild(n("line",{x1:R.X(0),y1:R.Y(0),x2:R.X(c),y2:R.Y(0),
      stroke:coul("bleu"),"stroke-width":4.5,"stroke-linecap":"round"}));
    svg.appendChild(n("line",{x1:R.X(0),y1:R.Y(0),x2:R.X(0),y2:R.Y(s),
      stroke:coul("vert"),"stroke-width":4.5,"stroke-linecap":"round"}));
    marqueAngle(svg,R,[0,0],[1,0],[c,s],false);
    svg.appendChild(n("line",{x1:R.X(0),y1:R.Y(0),x2:R.X(c),y2:R.Y(s),
      stroke:coul("ink2"),"stroke-width":1.6}));
    point(svg,R,c,s,"M","ink");
    var t = Math.round(ang*180/Math.PI);
    lecture.innerHTML =
      '<span style="color:var(--ambre)">angle '+t+'° = '+fracPi(ang)+'</span> &nbsp; '+
      '<span style="color:var(--bleu)">cos = '+c.toFixed(2).replace(".",",")+'</span> &nbsp; '+
      '<span style="color:var(--vert)">sin = '+s.toFixed(2).replace(".",",")+'</span>';
  }
  function fracPi(a){
    var v = a/Math.PI, den=[1,2,3,4,6,12], i;
    for(i=0;i<den.length;i++){
      var num = v*den[i];
      if(Math.abs(num-Math.round(num))<0.02){
        var nu=Math.round(num);
        if(nu===0) return "0";
        return (den[i]===1 ? (nu===1?"π":nu+"π") : (nu===1?"π":nu+"π")+"/"+den[i]);
      }
    }
    return (Math.round(v*100)/100)+"π";
  }
  function local(ev){
    var r = svg.getBoundingClientRect();
    var p = ev.touches ? ev.touches[0] : ev;
    return { x:(p.clientX-r.left)*w/r.width, y:(p.clientY-r.top)*h/r.height };
  }
  function pointe(ev){
    var q = local(ev);
    ang = Math.atan2(-(q.y-R.Y(0)), q.x-R.X(0));
    if(ang<0) ang += 2*Math.PI;
    redessine();
  }
  var actif = false;
  svg.addEventListener("pointerdown", function(e){
    // on ne prend la main que si le doigt part près du point M : ailleurs,
    // le geste doit rester un défilement de page (indispensable sur mobile)
    var q = local(e);
    if(Math.hypot(q.x-R.X(Math.cos(ang)), q.y-R.Y(Math.sin(ang))) > 34) return;
    actif = true; svg.setPointerCapture(e.pointerId); e.preventDefault(); pointe(e);
  });
  svg.addEventListener("pointermove", function(e){ if(actif){ e.preventDefault(); pointe(e); } });
  svg.addEventListener("pointerup", function(){ actif = false; });
  svg.addEventListener("pointercancel", function(){ actif = false; });
  svg.style.touchAction = "pan-y";
  redessine();
  boite.appendChild(el("div","figTitre","Le cercle trigonométrique"));
  boite.appendChild(svg);
  boite.appendChild(lecture);
  boite.appendChild(aide);
  return boite;
};

/* -- produit scalaire de deux vecteurs -- */
MODELES["produit-scalaire"] = function(){
  var w=380, h=330;
  var u=[3,1], v=[1,3], glisse=null;
  var boite = el("div","figBoite");
  var svg = n("svg",{viewBox:"0 0 "+w+" "+h, class:"fig figManip"});
  var R = repere([-4,-4,4,4], w, h, 18);
  var lecture = el("div","figLecture");
  function redessine(){
    while(svg.firstChild) svg.removeChild(svg.firstChild);
    fond(svg, R, {});
    fleche(svg,R,[0,0],u,"bleu","u");
    fleche(svg,R,[0,0],v,"vert","v");
    var ps = u[0]*v[0]+u[1]*v[1];
    marqueAngle(svg,R,[0,0],u,v,Math.abs(ps)<0.15);
    point(svg,R,u[0],u[1],null,"bleu");
    point(svg,R,v[0],v[1],null,"vert");
    var mot = ps>0.15 ? "aigu" : (ps<-0.15 ? "obtus" : "droit");
    var col = ps>0.15 ? "vert" : (ps<-0.15 ? "rouge" : "ambre");
    lecture.innerHTML =
      '<span style="color:var(--bleu)">u ('+u[0].toFixed(1).replace(".",",")+' ; '+u[1].toFixed(1).replace(".",",")+')</span> &nbsp;·&nbsp; '+
      '<span style="color:var(--vert)">v ('+v[0].toFixed(1).replace(".",",")+' ; '+v[1].toFixed(1).replace(".",",")+')</span><br>'+
      '<b>u · v = '+(u[0]*v[0]).toFixed(1).replace(".",",")+' + '+(u[1]*v[1]).toFixed(1).replace(".",",")+
      ' = '+ps.toFixed(1).replace(".",",")+'</b> → angle <span style="color:var(--'+col+')">'+mot+'</span>';
  }
  function maths(ev){
    var r = svg.getBoundingClientRect();
    var p = ev.touches ? ev.touches[0] : ev;
    return { x:R.x((p.clientX-r.left)*w/r.width), y:R.y((p.clientY-r.top)*h/r.height) };
  }
  function pointe(ev){
    var q = maths(ev);
    var cible = glisse==="u" ? u : v;
    cible[0] = Math.max(-3.5, Math.min(3.5, Math.round(q.x*2)/2));
    cible[1] = Math.max(-3.5, Math.min(3.5, Math.round(q.y*2)/2));
    redessine();
  }
  svg.addEventListener("pointerdown", function(e){
    // le glissement ne démarre qu'à proximité d'une des deux pointes ;
    // partout ailleurs le geste reste un défilement de page
    var q = maths(e);
    var du = Math.hypot(q.x-u[0], q.y-u[1]), dv = Math.hypot(q.x-v[0], q.y-v[1]);
    if(Math.min(du,dv) > 0.9){ glisse = null; return; }
    glisse = du < dv ? "u" : "v";
    svg.setPointerCapture(e.pointerId); e.preventDefault(); pointe(e);
  });
  svg.addEventListener("pointermove", function(e){ if(glisse){ e.preventDefault(); pointe(e); } });
  svg.addEventListener("pointerup", function(){ glisse=null; });
  svg.addEventListener("pointercancel", function(){ glisse=null; });
  svg.style.touchAction = "pan-y";
  redessine();
  boite.appendChild(el("div","figTitre","Déplace les deux vecteurs"));
  boite.appendChild(svg);
  boite.appendChild(lecture);
  boite.appendChild(el("div","figNote","Cherche la position où le produit scalaire s’annule : les vecteurs deviennent perpendiculaires."));
  return boite;
};

/* -- parabole pilotée par ses coefficients -- */
MODELES["parabole"] = function(){
  var w=380, h=320, a=1, b=-2, c=-3;
  var boite = el("div","figBoite");
  var svg = n("svg",{viewBox:"0 0 "+w+" "+h, class:"fig"});
  var R = repere([-4,-6,6,6], w, h, 18);
  var lecture = el("div","figLecture");
  function redessine(){
    while(svg.firstChild) svg.removeChild(svg.firstChild);
    fond(svg, R, {});
    var d="", i, vv=R.vue;
    for(i=0;i<=300;i++){
      var x = vv[0]+(vv[2]-vv[0])*i/300, y = a*x*x+b*x+c;
      if(y<vv[1]-2||y>vv[3]+2){ continue; }
      d += (d?" L ":"M ")+R.X(x)+" "+R.Y(y);
    }
    svg.appendChild(n("path",{d:d,fill:"none",stroke:coul("bleu"),"stroke-width":2.8}));
    var D = b*b-4*a*c;
    if(D>=0 && a!==0){
      var r1=(-b-Math.sqrt(D))/(2*a), r2=(-b+Math.sqrt(D))/(2*a);
      point(svg,R,r1,0,null,"rouge"); point(svg,R,r2,0,null,"rouge");
    }
    if(a!==0){
      var al=-b/(2*a);
      point(svg,R,al,a*al*al+b*al+c,"S","ambre");
    }
    lecture.innerHTML =
      '<b>f(x) = '+a+'x² '+(b<0?"− ":"+ ")+Math.abs(b)+'x '+(c<0?"− ":"+ ")+Math.abs(c)+'</b><br>'+
      'Δ = '+(b*b-4*a*c)+' → '+
      (D>0 ? '<span style="color:var(--vert)">deux racines</span>'
           : (D===0 ? '<span style="color:var(--ambre)">une racine double</span>'
                    : '<span style="color:var(--rouge)">aucune racine</span>'));
  }
  var ctr = el("div","figCurseurs");
  [["a",-3,3,1],["b",-6,6,1],["c",-6,6,1]].forEach(function(o){
    var lig = el("label","figCurseur");
    var val = el("span",null, o[0]+" = "+({a:a,b:b,c:c})[o[0]]);
    var s = document.createElement("input");
    s.type="range"; s.min=o[1]; s.max=o[2]; s.step=o[3];
    s.value = ({a:a,b:b,c:c})[o[0]];
    s.oninput=function(){
      var x=parseFloat(s.value);
      if(o[0]==="a"){ if(x===0) x = (a>0?-1:1); a=x; } else if(o[0]==="b") b=x; else c=x;
      val.textContent = o[0]+" = "+x;
      redessine();
    };
    lig.appendChild(val); lig.appendChild(s);
    ctr.appendChild(lig);
  });
  redessine();
  boite.appendChild(el("div","figTitre","Fais varier les coefficients"));
  boite.appendChild(svg);
  boite.appendChild(lecture);
  boite.appendChild(ctr);
  boite.appendChild(el("div","figNote","Regarde le signe de <b>a</b> : il décide du sens d’ouverture. Et le signe de Δ : il décide du nombre de racines."));
  return boite;
};

/* -- la sécante qui devient tangente : le cœur de la dérivation -- */
MODELES["secante"] = function(){
  var w=380, h=330, hh=1.5;                 // hh = écart entre A et B
  var f = function(x){ return x*x; }, a = 1;
  var boite = el("div","figBoite");
  var svg = n("svg",{viewBox:"0 0 "+w+" "+h, class:"fig"});
  var R = repere([-0.6,-0.6,3.4,6.4], w, h, 20);
  var lecture = el("div","figLecture");
  function redessine(){
    while(svg.firstChild) svg.removeChild(svg.firstChild);
    fond(svg, R, {});
    var d="", i, vv=R.vue;
    for(i=0;i<=240;i++){
      var x=vv[0]+(vv[2]-vv[0])*i/240, y=f(x);
      if(y<vv[1]-1||y>vv[3]+1) continue;
      d += (d?" L ":"M ")+R.X(x)+" "+R.Y(y);
    }
    svg.appendChild(n("path",{d:d,fill:"none",stroke:coul("bleu"),"stroke-width":2.8}));
    var b = a + hh;
    var pente = (f(b)-f(a))/(b-a);
    // la sécante, prolongée
    var p0 = f(a) - pente*(a-vv[0]), p1 = f(a) + pente*(vv[2]-a);
    svg.appendChild(n("line",{x1:R.X(vv[0]),y1:R.Y(p0),x2:R.X(vv[2]),y2:R.Y(p1),
      stroke:coul("rouge"),"stroke-width":2.4}));
    // le triangle des accroissements
    svg.appendChild(n("line",{x1:R.X(a),y1:R.Y(f(a)),x2:R.X(b),y2:R.Y(f(a)),
      stroke:coul("vert"),"stroke-width":2,"stroke-dasharray":"4 4"}));
    svg.appendChild(n("line",{x1:R.X(b),y1:R.Y(f(a)),x2:R.X(b),y2:R.Y(f(b)),
      stroke:coul("ambre"),"stroke-width":2,"stroke-dasharray":"4 4"}));
    point(svg,R,a,f(a),"A","ink");
    point(svg,R,b,f(b),"B","rouge");
    lecture.innerHTML =
      'écart <b>h = '+hh.toFixed(2).replace(".",",")+'</b><br>'+
      'pente de la sécante (AB) = <b>'+pente.toFixed(3).replace(".",",")+'</b>'+
      (hh<0.12 ? ' &nbsp;→&nbsp; <span style="color:var(--vert)">on tend vers f\'(1) = 2</span>' : '');
  }
  var lig = el("label","figCurseur");
  var s = document.createElement("input");
  s.type="range"; s.min=0.02; s.max=1.6; s.step=0.02; s.value=hh;
  // on inverse la lecture : pousser vers la droite rapproche B de A
  s.oninput=function(){ hh = 1.62 - parseFloat(s.value); redessine(); };
  hh = 1.62 - parseFloat(s.value);
  lig.appendChild(el("span",null,"rapprocher B")); lig.appendChild(s);
  redessine();
  boite.appendChild(el("div","figTitre","Rapproche B de A et regarde la pente"));
  boite.appendChild(svg);
  boite.appendChild(lecture);
  boite.appendChild(lig);
  boite.appendChild(el("div","figNote", T(
    "Tant que $B$ est loin, la droite rouge est une **sécante** : elle coupe la courbe en deux points, "+
    "et sa pente n’est qu’une moyenne. Quand $B$ se colle à $A$, elle devient la **tangente**, "+
    "et sa pente est le nombre dérivé.")));
  return boite;
};

/* -- tangente qui se déplace le long d'une courbe -- */
MODELES["tangente"] = function(){
  var w=380, h=320, a=1.5;
  var f = function(x){ return 0.5*x*x - 1; }, fp = function(x){ return x; };
  var boite = el("div","figBoite");
  var svg = n("svg",{viewBox:"0 0 "+w+" "+h, class:"fig"});
  var R = repere([-4,-3,4,5], w, h, 18);
  var lecture = el("div","figLecture");
  function redessine(){
    while(svg.firstChild) svg.removeChild(svg.firstChild);
    fond(svg, R, {});
    var d="", i, vv=R.vue;
    for(i=0;i<=300;i++){
      var x=vv[0]+(vv[2]-vv[0])*i/300, y=f(x);
      if(y<vv[1]-2||y>vv[3]+2) continue;
      d += (d?" L ":"M ")+R.X(x)+" "+R.Y(y);
    }
    svg.appendChild(n("path",{d:d,fill:"none",stroke:coul("bleu"),"stroke-width":2.8}));
    var m=fp(a), p=f(a)-m*a;
    svg.appendChild(n("line",{x1:R.X(vv[0]),y1:R.Y(m*vv[0]+p),
      x2:R.X(vv[2]),y2:R.Y(m*vv[2]+p), stroke:coul("rouge"),"stroke-width":2.4}));
    point(svg,R,a,f(a),"A","rouge");
    lecture.innerHTML =
      'point d’abscisse <b>a = '+a.toFixed(1).replace(".",",")+'</b> &nbsp;·&nbsp; '+
      'hauteur <b>f(a) = '+f(a).toFixed(2).replace(".",",")+'</b> &nbsp;·&nbsp; '+
      '<span style="color:var(--rouge)">pente f\'(a) = '+m.toFixed(2).replace(".",",")+'</span>';
  }
  var lig = el("label","figCurseur");
  var s = document.createElement("input");
  s.type="range"; s.min=-3.5; s.max=3.5; s.step=0.1; s.value=a;
  s.oninput=function(){ a=parseFloat(s.value); redessine(); };
  lig.appendChild(el("span",null,"déplacer A")); lig.appendChild(s);
  redessine();
  boite.appendChild(el("div","figTitre","La tangente suit la courbe"));
  boite.appendChild(svg);
  boite.appendChild(lecture);
  boite.appendChild(lig);
  boite.appendChild(el("div","figNote","Là où la courbe descend, la pente est négative. Au creux, elle vaut exactement 0 : c’est là que la dérivée s’annule."));
  return boite;
};

<script>
(function(){
"use strict";
var A = window.APP, COURS = window.COURS || [];
var T=A.T, M=A.M, el=A.el, $=A.$, $$=A.$$, S=A.S;

/* fonctions traçables (pas d'eval : compatible avec la politique de sécurité) */
var PLOTS = {
  "x*x-2*x-3": function(x){ return x*x-2*x-3; },
  "x*x-6*x+5": function(x){ return x*x-6*x+5; },
  "Math.exp(x)": function(x){ return Math.exp(x); },
  "Math.cos(x)": function(x){ return Math.cos(x); },
  "Math.sin(x)": function(x){ return Math.sin(x); }
};

/* les chapitres s'affichent dans l'ordre du programme, pas dans l'ordre
   où les fichiers de contenu ont été chargés */
COURS.sort(function(a,b){ return a.n - b.n; });

var route = { page:"accueil", chap:null, onglet:"cours", fiche:null };
var recherche = "";

/* ===================================================================
   Totaux et progression
   =================================================================== */
function totalSections(c){ return c.sections.length; }
function nbLu(c){ return A.chapState(c.id).lu.length; }
function nbExoOk(c){
  var e=A.chapState(c.id).exos, n=0;
  c.exos.forEach(function(x){ if(e[x.id] && e[x.id].ok) n++; });
  return n;
}
function progChap(c){
  var tot = totalSections(c) + c.exos.length;
  return A.pct(nbLu(c) + nbExoOk(c), tot);
}
function progGlobale(){
  var f=0,t=0;
  COURS.forEach(function(c){ t += totalSections(c)+c.exos.length; f += nbLu(c)+nbExoOk(c); });
  return { fait:f, total:t, pct:A.pct(f,t) };
}
/* cartes de révision espacée, résolues en couples chapitre/exercice */
function carteVersExo(c){
  var ch = COURS.filter(function(x){ return x.id===c.chapId; })[0];
  if(!ch){
    var f = (S.perso||[]).filter(function(p){ return "perso:"+p.id===c.chapId; })[0];
    if(!f) return null;
    ch = { id:c.chapId, n:0, titre:f.titre, exos:f.fiche.exercices };
  }
  var ex = ch.exos.filter(function(x){ return x.id===c.exoId; })[0];
  return ex ? { chap:ch, exo:ex, carte:c } : null;
}
function dues(){ return A.srsDues().map(carteVersExo).filter(Boolean); }
function planifiees(){ return A.srsCartes().map(carteVersExo).filter(Boolean); }

/* ===================================================================
   Rendu des blocs de cours
   =================================================================== */
function bloc(b){
  switch(b.t){
    case "p":     return '<p>'+T(b.x)+'</p>';
    case "idee":  return callout("co-idee","L'idée en une phrase",b.x);
    case "piege": return callout("co-piege",b.titre||"Attention",b.x);
    case "astuce":return callout("co-astuce",b.titre||"Astuce",b.x);
    case "formule":
      return '<div class="formula'+(b.code?" fcode":"")+'"><div class="ft">'+T(b.titre||"À retenir")+'</div>'+
             '<div class="mblock">'+T(b.x)+'</div>'+
             (b.note?'<div class="fn2">'+T(b.note)+'</div>':'')+'</div>';
    case "liste":
      return '<ul class="ul">'+b.items.map(function(i){return '<li>'+T(i)+'</li>';}).join("")+'</ul>';
    case "tbl":
      return '<div class="tblWrap"><table class="tbl"><thead><tr>'+
        b.head.map(function(x){return '<th>'+T(x)+'</th>';}).join("")+'</tr></thead><tbody>'+
        b.rows.map(function(r){return '<tr>'+r.map(function(x){return '<td>'+T(x)+'</td>';}).join("")+'</tr>';}).join("")+
        '</tbody></table></div>';
    case "mb":    return '<div class="mblock">'+T(b.x)+'</div>';
    default:      return "";
  }
}
function callout(cls,titre,x){
  return '<div class="callout '+cls+'"><div class="ct">'+T(titre)+'</div><p>'+T(x)+'</p></div>';
}

/* exemple guidé : les étapes se dévoilent une par une */
function demoNode(b){
  var box = el("div","demo");
  box.innerHTML = '<div class="demoHead"><div class="dt">'+T(b.titre||"Exemple guidé")+'</div>'+
                  '<div style="margin-top:4px">'+T(b.enonce)+'</div></div>';
  var body = el("div","demoBody");
  var revealed = 0;
  b.etapes.forEach(function(e,i){
    var st = el("div","step hidden");
    st.innerHTML = '<div class="sn">'+(i+1)+'</div><div><div class="sq">'+T(e.q)+'</div>'+
                   '<div class="sr">'+T(e.r)+'</div></div>';
    body.appendChild(st);
  });
  var act = el("div","row");
  var bNext = el("button","btn pri","Montrer l'étape 1");
  var bAll  = el("button","btn gho","Tout afficher");
  act.appendChild(bNext); act.appendChild(bAll);
  body.appendChild(act);
  function show(n){
    var steps = $$(".step", body);
    for(var i=0;i<n;i++){ steps[i].classList.remove("hidden"); steps[i].classList.add("on"); }
    revealed = n;
    if(revealed >= b.etapes.length){ bNext.remove(); bAll.remove(); }
    else bNext.textContent = "Montrer l'étape "+(revealed+1);
  }
  bNext.onclick=function(){ show(revealed+1); };
  bAll.onclick =function(){ show(b.etapes.length); };
  box.appendChild(body);
  return box;
}

/* mini-question intégrée au cours */
function checkNode(b){
  var box = el("div","card pad");
  box.innerHTML = '<div class="row" style="margin-bottom:8px"><span class="tag b">Vérification rapide</span></div>'+
                  '<div class="enonce">'+T(b.q)+'</div>';
  var ch = el("div","choices");

/* petite courbe tracée au canvas */
function plotNode(b){
  var wrap = el("div","card pad");
  wrap.innerHTML = '<div class="eyebrow" style="margin-bottom:10px">'+T(b.titre||"Courbe")+'</div>';
  var cv = el("canvas","plot");
  var W=460, H=300; cv.width=W*2; cv.height=H*2; cv.style.height=H+"px";
  wrap.appendChild(cv);
  if(b.note) wrap.appendChild(el("div","small muted",'<div style="text-align:center;margin-top:10px">'+T(b.note)+'</div>'));
  var f = PLOTS[b.f];
  if(!f) return wrap;
  var cs = getComputedStyle(document.body);
  var cLine = cs.getPropertyValue("--line2").trim() || "#ccc";
  var cInk  = cs.getPropertyValue("--ink3").trim()  || "#888";
  var cAcc  = cs.getPropertyValue("--bleu").trim()  || "#2B49CF";
  var ctx = cv.getContext("2d"); ctx.scale(2,2);
  var x0=b.xmin, x1=b.xmax, ys=[], i;
  for(i=0;i<=200;i++){ var v=f(x0+(x1-x0)*i/200); if(isFinite(v)) ys.push(v); }
  var y0=Math.min.apply(null,ys), y1=Math.max.apply(null,ys);
  var pad=(y1-y0)*0.15||1; y0-=pad; y1+=pad;
  function px(x){ return 30+(x-x0)/(x1-x0)*(W-45); }
  function py(y){ return H-28-(y-y0)/(y1-y0)*(H-45); }
  ctx.strokeStyle=cLine; ctx.lineWidth=1;
  for(i=Math.ceil(x0);i<=x1;i++){ ctx.beginPath(); ctx.moveTo(px(i),8); ctx.lineTo(px(i),H-20); ctx.stroke(); }
  ctx.strokeStyle=cInk; ctx.lineWidth=1.5;
  if(y0<0&&y1>0){ ctx.beginPath(); ctx.moveTo(px(x0),py(0)); ctx.lineTo(px(x1),py(0)); ctx.stroke(); }
  if(x0<0&&x1>0){ ctx.beginPath(); ctx.moveTo(px(0),py(y0)); ctx.lineTo(px(0),py(y1)); ctx.stroke(); }
  ctx.strokeStyle=cAcc; ctx.lineWidth=2.6; ctx.beginPath();
  for(i=0;i<=300;i++){
    var x=x0+(x1-x0)*i/300, y=f(x);
    if(!isFinite(y)) continue;
    if(i===0) ctx.moveTo(px(x),py(y)); else ctx.lineTo(px(x),py(y));
  }
  ctx.stroke();
  ctx.fillStyle=cInk; ctx.font="11px system-ui";
  ctx.fillText(String(x0), px(x0)-4, H-8); ctx.fillText(String(x1), px(x1)-8, H-8);
  return wrap;
}

/* ===================================================================
   Moteur d'exercices
   =================================================================== */
function diagnostic(exo, saisie){
  // 1. diagnostic précis prévu par le cours
  if(exo.type==="num"){
    var v = A.parseNum(saisie);
    if(isNaN(v)) return "Je n'ai pas réussi à lire ce nombre. Écris-le en chiffres, par exemple <b>3,5</b> ou <b>7/2</b>.";
    if(exo.diag) for(var i=0;i<exo.diag.length;i++){
      if(Math.abs(v - exo.diag[i].v) < (exo.tol||0.0005)) return exo.diag[i].m;
    }
    // 2. diagnostics génériques
    var r = exo.rep;
    if(Math.abs(v + r) < 0.001 && r!==0) return "Ton résultat est le bon nombre, mais avec le mauvais signe. Reprends ton calcul en surveillant chaque « moins » : c'est presque toujours là que ça se joue.";
    if(r!==0 && Math.abs(v - 2*r) < 0.001) return "Ton résultat est exactement le double de la bonne réponse. Tu as probablement oublié une division par 2 quelque part.";
    if(r!==0 && Math.abs(v - r/2) < 0.001) return "Ton résultat est la moitié de la bonne réponse. Il manque un facteur 2 dans ton calcul.";
    if(r!==0 && Math.abs(v - r) < Math.abs(r)*0.05) return "Tu es tout près : l'erreur vient d'un arrondi ou d'une petite imprécision de calcul. Refais la dernière étape sans arrondir en cours de route.";
    return "Ce n'est pas la bonne valeur. Reprends la correction ci-dessous étape par étape et compare avec ton propre calcul : repère la première ligne où vous divergez.";
  }
  if(exo.type==="txt"){
    var n = A.norm(saisie);
    if(exo.diag) for(var j=0;j<exo.diag.length;j++){
      if(n.indexOf(A.norm(exo.diag[j].r))>=0) return exo.diag[j].m;
    }
    return "Ce n'est pas la réponse attendue. Regarde la correction : la formulation exacte compte ici.";
  }
  return "";
}

/* Correction dévoilée étape par étape : on lit une ligne, on la comprend,
   on demande la suivante. Tout afficher d'un coup ne se lit pas. */
function correctionProgressive(exo){
  var boite = el("div","corr");
  boite.innerHTML = '<div class="ct">La méthode, étape par étape</div>';
  var liste = el("ol","corrList");
  boite.appendChild(liste);
  var etapes = exo.corr || [], vues = 0;
  var barre = el("div","row"); barre.style.marginTop="12px";
  var suivante = el("button","btn sm pri","Première étape");
  var tout = el("button","btn sm gho","Tout afficher");
  barre.appendChild(suivante); barre.appendChild(tout);
  boite.appendChild(barre);
  var jauge = el("div","small muted"); jauge.style.marginLeft="auto";
  barre.appendChild(jauge);

  function montrer(n){
    while(vues < n && vues < etapes.length){
      var li = el("li",null,T(etapes[vues]));
      li.style.animation = "pop .25s ease";
      liste.appendChild(li);
      vues++;
    }
    jauge.textContent = vues+" / "+etapes.length;
    if(vues >= etapes.length){
      suivante.remove(); tout.remove();
      jauge.textContent = "";
      var fin = el("div","small muted");
      fin.style.marginTop="6px";
      fin.textContent = "C’est toute la méthode. Reprends ton brouillon et compare ligne à ligne : "+
                        "cherche la première où vous divergez.";
      boite.appendChild(fin);
    } else {
      suivante.textContent = "Étape suivante";
    }
  }
  suivante.onclick = function(){ montrer(vues+1); };
  tout.onclick = function(){ montrer(etapes.length); };
  jauge.textContent = "0 / "+etapes.length;
  return boite;
}

function exoNode(c, exo, onDone, onResult){
  var box = el("div","card pad");
  var st = A.chapState(c.id);
  var etat = st.exos[exo.id] || { ok:false, tries:0 };
  var essais = 0, fini = false;

  var top = el("div","exoTop");
  top.innerHTML = '<span class="tag b">Exercice</span>'+
    '<span class="pill">Niveau '+exo.niveau+'</span>'+
    (etat.ok?'<span class="tag v">✓ Déjà réussi</span>':'');
  box.appendChild(top);
  box.appendChild(el("div","enonce", T(exo.enonce)));

  var zone = el("div");
  box.appendChild(zone);
  var actions = el("div","row"); actions.style.marginTop="14px";
  var bIndice = el("button","btn gho sm","Un indice ?");
  actions.appendChild(bIndice);
  box.appendChild(actions);

  bIndice.onclick = function(){
    if($(".hint",box)) return;
    var hn = el("div","hint");
    hn.innerHTML = '<div class="ct">Indice</div><p>'+T(exo.indice)+'</p>';
    box.insertBefore(hn, actions);
  };

  function fin(ok, message){
    fini = true;
    etat = { ok:ok, tries:essais, ts:A.nowISO() };
    st.exos[exo.id] = etat;
    // Les exercices générés à la volée ne sont pas rejouables : leurs nombres
    // sont tirés au hasard et l'énoncé n'existe plus après coup. Les mettre en
    // révision espacée créerait des cartes impossibles à retrouver.
    if(c.id !== "entrainement") A.srsMaj(c.id, exo.id, ok, { titre:c.titre });
    A.save(); paintRail();
    var fb = el("div","fb "+(ok?"good":"bad"));
    fb.innerHTML = '<div class="fbt">'+(ok ? "✓ Bonne réponse" : "✗ Ce n’est pas ça")+'</div><p>'+T(message)+'</p>';
    box.insertBefore(fb, actions);
    box.insertBefore(correctionProgressive(exo), actions);
    actions.innerHTML="";
    var bRe = el("button","btn sm","Refaire cet exercice");
    bRe.onclick=function(){ var p=box.parentNode, nb=exoNode(c,exo,onDone); p.replaceChild(nb,box); };
    actions.appendChild(bRe);
    if(onDone){ var bN=el("button","btn pri sm","Exercice suivant →"); bN.onclick=onDone; actions.appendChild(bN); }
    // point d'accroche pour la couche IA (présente seulement en version connectée)
    if(window.IA_BOUTON) window.IA_BOUTON(exo, actions, box, ok);
    if(onResult) onResult(ok, actions);
  }

  function faux(msg){
    var fb = el("div","fb bad");
    fb.innerHTML = '<div class="fbt">✗ Regarde de plus près</div><p>'+T(msg)+'</p>'+
      '<p class="small" style="margin-top:8px;opacity:.85">Il te reste un essai. Corrige et retente.</p>';
    box.insertBefore(fb, actions);
    setTimeout(function(){ fb.scrollIntoView({behavior:"smooth", block:"nearest"}); },60);
  }

  if(exo.type==="qcm"){
    var ch = el("div","choices");
    exo.choix.forEach(function(cx,i){
      var btn = el("button","choice");
      btn.innerHTML='<span class="k">'+"ABCD".charAt(i)+'</span><span>'+T(cx)+'</span>';
      btn.onclick=function(){
        if(fini) return;
        essais++;
        if(i===exo.bonne){
          $$(".choice",ch).forEach(function(x){x.disabled=true;});
          btn.dataset.state="good";
          fin(true, essais===1 ? "Du premier coup, et avec la bonne méthode." : "C'est la bonne réponse. Relis la méthode ci-dessous pour la retrouver plus vite la prochaine fois.");
        } else {
          btn.dataset.state="bad"; btn.disabled=true;
          var msg = exo.diag[i] || "Ce choix ne convient pas.";
          if(essais>=2){
            $$(".choice",ch).forEach(function(x){x.disabled=true;});
            $$(".choice",ch)[exo.bonne].dataset.state="good";
            fin(false, msg);
          } else faux(msg);
        }
      };
      ch.appendChild(btn);
    });
    zone.appendChild(ch);
  } else {
    var rowIn = el("div","inputRow");
    var inp = el("input","inp");
    inp.type="text";
    inp.placeholder = exo.type==="num" ? "Ta réponse en chiffres…" : "Ta réponse…";
    inp.setAttribute("aria-label","Ta réponse");
    var bOk = el("button","btn pri","Vérifier");
    rowIn.appendChild(inp); rowIn.appendChild(bOk);
    if(exo.unite) rowIn.appendChild(el("span","muted small",A.esc(exo.unite)));
    zone.appendChild(rowIn);
    function verifier(){
      if(fini) return;
      var val = inp.value.trim();
      if(!val){ inp.focus(); return; }
      essais++;
      var ok;
      if(exo.type==="num"){
        var v=A.parseNum(val);
        ok = !isNaN(v) && Math.abs(v-exo.rep) <= (exo.tol!=null?exo.tol:0.0005);
      } else {
        var n=A.norm(val);
        ok = exo.reps.some(function(r){ return A.norm(r)===n || n.indexOf(A.norm(r))>=0; });
      }
      if(ok){
        inp.className="inp good"; inp.disabled=true; bOk.disabled=true;
        fin(true, essais===1 ? "Exact, du premier coup." : "C'est la bonne réponse.");
      } else {
        inp.className="inp bad";
        var msg = diagnostic(exo, val);
        if(essais>=2){ inp.disabled=true; bOk.disabled=true; fin(false, msg); }
        else faux(msg);
      }
    }
    bOk.onclick=verifier;
    inp.addEventListener("keydown",function(e){ if(e.key==="Enter") verifier(); });
  }
  return box;
}

   Import de cours personnels : texte, PDF, image
   + passerelle vers Claude pour produire une fiche complète
   ===================================================================== */
(function(){
"use strict";
var A = window.APP, T=A.T, el=A.el, $=A.$, S=A.S;

/* ---------- brouillon en cours d'import ---------- */
var draft = { titre:"", source:"texte", texte:"", image:null, qualite:null };

/* ---------- extraction PDF (sans bibliothèque externe) ---------- */
function latin1(u8){
  var s="", CH=8192;
  for(var i=0;i<u8.length;i+=CH) s+=String.fromCharCode.apply(null,u8.subarray(i,i+CH));
  return s;
}
function unesc(s){
  return s.replace(/\\([nrtbf()\\]|[0-7]{1,3})/g,function(m,g){
    if(g==="n") return "\n"; if(g==="r") return "\n"; if(g==="t") return " ";
    if(g==="b"||g==="f") return "";
    if(g==="("||g===")"||g==="\\") return g;
    return String.fromCharCode(parseInt(g,8));
  });
}
function opsToText(s){
  var res="", re=/\[((?:\\.|[^\]\\])*)\]\s*TJ|\(((?:\\.|[^\\()])*)\)\s*Tj|(T\*|Td|TD|ET)/g, m;
  while((m=re.exec(s))!==null){
    if(m[1]!=null){
      var r2=/\(((?:\\.|[^\\()])*)\)|(-?\d+(?:\.\d+)?)/g, m2;
      while((m2=r2.exec(m[1]))!==null){
        if(m2[1]!=null) res+=unesc(m2[1]);
        else if(parseFloat(m2[2]) < -130) res+=" ";
      }
    } else if(m[2]!=null){ res+=unesc(m[2]); }
    else res+="\n";
  }
  return res;
}
function inflate(u8){
  if(typeof DecompressionStream==="undefined") return Promise.reject();
  function go(fmt){
    var ds=new DecompressionStream(fmt);
    return new Response(new Blob([u8]).stream().pipeThrough(ds)).arrayBuffer();
  }
  return go("deflate").catch(function(){ return go("deflate-raw"); })
    .then(function(ab){ return latin1(new Uint8Array(ab)); });
}
function extrairePdf(buf){
  var bytes=new Uint8Array(buf), raw=latin1(bytes);
  var jobs=[], idx=0;
  while(true){
    var s=raw.indexOf("stream", idx); if(s<0) break;
    var e=raw.indexOf("endstream", s); if(e<0) break;
    var st=s+6;
    if(raw.charAt(st)==="\r") st++;
    if(raw.charAt(st)==="\n") st++;
    jobs.push(bytes.subarray(st,e));
    idx=e+9;
    if(jobs.length>900) break;
  }
  return Promise.all(jobs.map(function(sl){
    return inflate(sl).catch(function(){ return latin1(sl); });
  })).then(function(parts){
    var out=[];
    parts.forEach(function(p){
      if(p && (p.indexOf("Tj")>=0 || p.indexOf("TJ")>=0)) out.push(opsToText(p));
    });
    return nettoyer(out.join("\n"));
  });
}
function nettoyer(t){
  var s = String(t);
  s = s.split("").filter(function(ch){
    var c = ch.charCodeAt(0);
    return c > 31 || c === 9 || c === 10 || c === 13;
  }).join("");
  return s.replace(/\r/g,"\n").replace(/[ \t]+/g," ").replace(/\n{3,}/g,"\n\n").trim();
}
/* qualité de l'extraction : lisible ou charabia ? */
function qualite(t){
  if(!t || t.length<40) return "vide";
  var lettres=(t.match(/[a-zA-ZÀ-ÿ]/g)||[]).length;
  var espaces=(t.match(/ /g)||[]).length;
  if(lettres/t.length < 0.45) return "faible";
  if(espaces/t.length < 0.06) return "faible";
  return "ok";
}

/* ---------- résumé automatique local (fonctionne sans IA) ---------- */
var MOTS_CLES = ["definition","théorème","theoreme","propriété","propriete","remarque",
                 "exemple","méthode","methode","formule","démonstration","demonstration","attention"];
function ficheLocale(texte, titre){
  var lignes = texte.split(/\n+/).map(function(l){return l.trim();}).filter(Boolean);
  var sections=[], cur=null;
  lignes.forEach(function(l){
    var court = l.length<70;
    var numerote = /^([IVX]+[\.\)]|\d+[\.\)]|[A-Z][\.\)])\s/.test(l);
    var majuscules = court && l===l.toUpperCase() && /[A-ZÀ-Ý]/.test(l);
    if((court && numerote) || majuscules){
      cur = { titre:l.replace(/^[IVX\d A-Z]+[\.\)]\s*/,"") || l, paras:[] };
      sections.push(cur);
    } else {
      if(!cur){ cur={ titre:"Contenu du cours", paras:[] }; sections.push(cur); }
      cur.paras.push(l);
    }
  });
  if(!sections.length) sections=[{titre:"Contenu du cours", paras:lignes}];
  var pointsCles=[];
  lignes.forEach(function(l){
    var bas=l.toLowerCase();
    for(var i=0;i<MOTS_CLES.length;i++){
      if(bas.indexOf(MOTS_CLES[i])===0 || bas.indexOf(MOTS_CLES[i]+" ")>=0){
        if(l.length>15 && l.length<320 && pointsCles.length<10) pointsCles.push(l);
        break;
      }
    }
  });
  return {
    resume: sections[0].paras.slice(0,2).join(" ").slice(0,420) || "Fiche construite à partir du document importé.",
    prerequis: [],
    auto: true,
    sections: sections.slice(0,12).map(function(s){
      return { titre:s.titre, idee:"", explication:s.paras.join("\n\n").slice(0,2600),
               formules:[], exemple:null, piege:"" };
    }),
    pointsCles: pointsCles,
    exercices: []
  };
}

/* ---------- lecture d'une réponse de Claude ---------- */
function lireReponse(txt){
  var t = String(txt||"").trim();
  t = t.replace(/^```(?:json)?\s*/i,"").replace(/```\s*$/,"").trim();
  var i=t.indexOf("{"), j=t.lastIndexOf("}");
  if(i>=0 && j>i){
    try{
      var o=JSON.parse(t.slice(i,j+1));
      if(o && (o.sections || o.exercices)) return normaliser(o);
    }catch(e){}
  }
  return markdownVersFiche(t);
}
function normaliser(o){
  var f = {
    resume:o.resume||"", prerequis:o.prerequis||[], auto:false,
    sections:(o.sections||[]).map(function(s){
      return { titre:s.titre||"Partie", idee:s.idee||"", explication:s.explication||"",
               formules:s.formules||[], exemple:s.exemple||null, piege:s.piege||"" };
    }),
    exercices:(o.exercices||[]).map(function(x,i){
      var e = {
        id:"p"+i+"_"+Math.random().toString(36).slice(2,6),
        type:x.type==="num"?"num":(x.type==="txt"?"txt":"qcm"),
        niveau:x.niveau||1, enonce:x.enonce||"",
        corr:x.corr||["Reprends l’énoncé et applique la méthode du cours."],
        indice:x.indice||"Relis la partie du cours qui traite de cette notion."
      };
      if(e.type==="qcm"){
        e.choix=x.choix||[]; e.bonne=(typeof x.bonne==="number")?x.bonne:0;
        e.diag=x.diag||e.choix.map(function(){return "Ce choix ne convient pas.";});
      } else if(e.type==="num"){
        e.rep=Number(x.rep); e.tol=(x.tol!=null)?Number(x.tol):0.001; e.diag=x.diag||[];
      } else {
        e.reps=x.reps||[x.rep||""]; e.diag=x.diag||[];
      }
      return e;
    })
  };
  if(o.titre) f.titreSuggere=o.titre;
  return f;
}
function markdownVersFiche(t){
  var secs=[], cur=null;
  t.split(/\n/).forEach(function(l){
    var m=l.match(/^#{1,4}\s+(.*)/);
    if(m){ cur={titre:m[1].trim(), idee:"", explication:"", formules:[], exemple:null, piege:""}; secs.push(cur); }
    else if(cur){ cur.explication += l+"\n"; }
  });
  if(!secs.length) secs=[{titre:"Fiche", idee:"", explication:t, formules:[], exemple:null, piege:""}];
  return { resume:"Fiche importée depuis une réponse en texte libre.", prerequis:[],
           auto:false, sections:secs, exercices:[] };
}

/* ---------- enregistrement ---------- */
function enregistrer(d, fiche){
  var f = {
    id:A.uid(), titre: fiche.titreSuggere || d.titre || "Cours importé",
    source:d.source, texte:d.texte, image:d.image, cree:A.nowISO(), fiche:fiche
  };
  S.perso.unshift(f);
  A.save();
  return f;
}
function supprimer(id){
  S.perso = S.perso.filter(function(f){ return f.id!==id; });
  A.save();
}

/* ---------- presse-papiers ---------- */
function copier(txt, ok){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ A.toast(ok); },
      function(){ A.toast("Copie impossible — sélectionne le texte à la main."); });
  } else A.toast("Copie impossible — sélectionne le texte à la main.");
}

/* ---------- sauvegarde du cahier ---------- */
function exporter(){
  var data = JSON.stringify({ version:1, exporte:A.nowISO(), etat:S }, null, 2);
  if(!window.claude || !window.claude.use){
    copier(data,"Sauvegarde copiée dans le presse-papiers."); return;
  }
  window.claude.use("downloads").then(function(dl){
    if(!dl){ copier(data,"Sauvegarde copiée dans le presse-papiers."); return; }
    return dl.save({ filename:"cahier-premiere-sauvegarde.json", data:data })
      .then(function(){ A.toast("Sauvegarde enregistrée."); })
      .catch(function(err){
        if(err && err.code==="declined") return;
        copier(data,"Sauvegarde copiée dans le presse-papiers.");
      });
  }).catch(function(){ copier(data,"Sauvegarde copiée dans le presse-papiers."); });
}
function importerSauvegarde(txt){
  try{
    var o=JSON.parse(txt);
    var e=o.etat||o;
    if(e.chap)      S.chap=e.chap;
    if(e.perso)     S.perso=e.perso;
    if(e.srs)       S.srs=e.srs;              // révision espacée
    if(e.controles) S.controles=e.controles;  // historique des contrôles
    if(e.entrain)   S.entrain=e.entrain;      // statistiques d'entraînement
    if(e.theme)     S.theme=e.theme;
    A.applyTheme();
    A.save(); A.toast("Sauvegarde restaurée."); window.RENDER();
  }catch(err){ A.toast("Ce fichier n’est pas une sauvegarde valide."); }
}

/* ---------- lecture d'un fichier déposé ---------- */
function lireFichier(file){
  var nom = file.name.toLowerCase();
  if(file.type.indexOf("image")===0){
    var fr=new FileReader();
    fr.onload=function(){ draft.image=fr.result; draft.source="image";
      if(!draft.titre) draft.titre=file.name.replace(/\.[^.]+$/,"");
      window.RENDER(); };
    fr.readAsDataURL(file); return;
  }
  if(nom.slice(-4)===".pdf" || file.type==="application/pdf"){
    A.toast("Lecture du PDF…");
    file.arrayBuffer().then(extrairePdf).then(function(t){
      draft.texte=t; draft.qualite=qualite(t);
      if(!draft.titre) draft.titre=file.name.replace(/\.[^.]+$/,"");
      window.RENDER();
      A.toast(draft.qualite==="ok" ? "PDF lu." : "PDF lu partiellement.");
    }).catch(function(){
      draft.texte=""; draft.qualite="vide"; window.RENDER();
      A.toast("Impossible de lire ce PDF.");
    });
    return;
  }
  var fr2=new FileReader();
  fr2.onload=function(){
    draft.texte=nettoyer(String(fr2.result)); draft.qualite=qualite(draft.texte);
    if(!draft.titre) draft.titre=file.name.replace(/\.[^.]+$/,"");
    window.RENDER();
  };
  fr2.readAsText(file);
}

<script>
/* =====================================================================
   Générateur d'exercices paramétrés
   Chaque générateur tire des nombres au hasard PUIS calcule les
   distracteurs et leur explication : le diagnostic reste juste,
   quels que soient les nombres tirés.
   ===================================================================== */
(function(){
"use strict";
var A = window.APP;

function ri(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }
function nz(a,b){ var v=0; while(v===0) v=ri(a,b); return v; }
function pick(t){ return t[Math.floor(Math.random()*t.length)]; }
function arr(n){ return Math.round(n*1000)/1000; }
function fr(n){ return String(n).replace(".",","); }              // décimale française
function sg(n){ return (n<0 ? " − " : " + ") + fr(Math.abs(n)); } // signe visible
function terme(co, v){                                           // « 3x », « −x », « x »
  if(co===1) return v;
  if(co===-1) return "-"+v;
  return fr(co)+v;
}
function apres(co, v){                                           // « + 3x », « − x »
  if(co===0) return "";
  var s = co<0 ? " − " : " + ";
  var a = Math.abs(co);
  return s + (a===1 ? v : fr(a)+v);
}
function trinome(a,b,c){
  return terme(a,"x^2") + apres(b,"x") + (c ? sg(c) : "");
}

/* --------------------------- SUITES --------------------------- */
var G_SUITES = [
{ id:"su-arith", titre:"Terme d'une suite arithmétique", niveau:1, gen:function(){
    var u0=ri(-9,15), r=nz(-7,9), n=ri(8,30), rep=u0+n*r;
    return { type:"num", niveau:1, rep:rep,
      enonce:"Une suite arithmétique vérifie $u_0 = "+fr(u0)+"$ et sa raison vaut $r = "+fr(r)+"$. Calculer $u_{"+n+"}$.",
      diag:[{v:n*r, m:"Tu as calculé $"+n+" × "+fr(r)+" = "+fr(n*r)+"$ mais tu as oublié d'ajouter le point de départ $u_0 = "+fr(u0)+"$."},
            {v:u0+(n+1)*r, m:"Tu as compté "+(n+1)+" pas au lieu de "+n+". Entre $u_0$ et $u_{"+n+"}$, la raison s'ajoute exactement "+n+" fois."},
            {v:u0+(n-1)*r, m:"Tu as compté un pas de trop en moins : c'est $u_{"+(n-1)+"}$ que tu as trouvé. De $u_0$ à $u_{"+n+"}$ il y a "+n+" pas."},
            {v:u0*r, m:"Tu as multiplié $u_0$ par la raison. Dans une suite **arithmétique** on ajoute la raison ; la multiplication est réservée aux suites géométriques."}],
      corr:["Formule du terme général : $u_n = u_0 + n × r$.",
            "Je remplace : $u_{"+n+"} = "+fr(u0)+" + "+n+" × ("+fr(r)+")$.",
            "$"+n+" × ("+fr(r)+") = "+fr(n*r)+"$.",
            "$"+fr(u0)+" + ("+fr(n*r)+") = "+fr(rep)+"$."],

  }},

{ id:"su-geo", titre:"Terme d'une suite géométrique", niveau:2, gen:function(){
    var u0=pick([2,3,5,10,20,100]), q=pick([2,3,0.5,1.5]), n=ri(3,7);
    var rep=arr(u0*Math.pow(q,n));
    return { type:"num", niveau:2, rep:rep, tol:0.01,
      enonce:"Une suite géométrique vérifie $u_0 = "+fr(u0)+"$ et $q = "+fr(q)+"$. Calculer $u_{"+n+"}$.",
      diag:[{v:arr(u0*q*n), m:"Tu as multiplié par $q × n$. Or la raison s'applique "+n+" fois **d'affilée** : c'est une puissance, $q^{"+n+"}$, pas un produit par $n$."},
            {v:arr(u0*Math.pow(q,n-1)), m:"Il manque une multiplication : tu t'es arrêté à $u_{"+(n-1)+"}$. L'exposant vaut "+n+"."},

            {v:arr(u0+n*q), m:"Tu as ajouté la raison au lieu de multiplier. Ici la suite est géométrique."}],

{ id:"su-pourcent", titre:"Évolution en pourcentage", niveau:2, gen:function(){
    var hausse=Math.random()<0.6, t=pick([2,3,4,5,8,10,15,20]), n=ri(3,8);

            {v:arr(V*q), m:"Tu n'as appliqué l'évolution qu'une seule fois. Elle se répète "+n+" fois : l'exposant vaut "+n+"."},

      corr:[(hausse?"Augmenter":"Diminuer")+" de "+fr(t)+" % revient à multiplier par $"+fr(q)+"$.",
            "Sur "+n+" ans, on multiplie "+n+" fois : $V_n = "+fr(V)+" × "+fr(q)+"^{"+n+"}$.",
            "$"+fr(q)+"^{"+n+"} ≈ "+fr(arr(Math.pow(q,n)))+"$.",

{ id:"su-somme", titre:"Somme des premiers entiers", niveau:2, gen:function(){

            {v:n*(n+1), m:"Tu as calculé $"+n+" × "+(n+1)+" = "+fr(n*(n+1))+"$ mais oublié de diviser par 2."},

{ id:"su-recur", titre:"Suite définie par récurrence", niveau:2, gen:function(){

            {v:a*(u0+b), m:"Ordre des opérations : on multiplie d'abord par $"+fr(a)+"$, **puis** on ajoute $"+fr(b)+"$."}],

{ id:"su-nature", titre:"Reconnaître la nature d'une suite", niveau:1, gen:function(){
    var geo=Math.random()<0.5, u0=ri(2,6), s=[u0];
    var r = geo ? pick([2,3,-2]) : nz(-6,8);
    for(var i=0;i<3;i++) s.push(geo ? s[i]*r : s[i]+r);
    var bon = geo ? "géométrique de raison "+fr(r) : "arithmétique de raison "+fr(r);
    var faux3 = (s[1]===r) ? s[1]+1 : s[1];
    var choix = A.shuffle([bon,
      geo ? "arithmétique de raison "+fr(s[1]-s[0]) : "géométrique de raison "+fr(r),
      (geo?"géométrique":"arithmétique")+" de raison "+fr(faux3),
      "ni arithmétique ni géométrique"]);
    var bonne = choix.indexOf(bon);
    return { type:"qcm", niveau:1, choix:choix, bonne:bonne,
      enonce:"La suite "+s.join(" ; ")+" ; … est :",
      diag:choix.map(function(c,i){
        if(i===bonne) return "";
        if(c.indexOf("ni ")===0) return "Elle suit pourtant une règle très régulière : teste les différences, puis les quotients entre termes consécutifs.";
        if(c.indexOf(geo?"arithmétique":"géométrique")===0)
          return geo ? "Les écarts ne sont pas constants ici : $"+fr(s[1]-s[0])+"$ puis $"+fr(s[2]-s[1])+"$. Ce sont les **quotients** qui le sont."
                     : "Les quotients ne sont pas constants ici. Ce sont les **différences** qui le sont, et elles valent toutes $"+fr(r)+"$.";
        return "La raison est ce par quoi on passe d'un terme au suivant, pas le premier terme de la suite.";
      }),
      corr:["Différences : $"+fr(s[1]-s[0])+"$ puis $"+fr(s[2]-s[1])+"$"+(geo?" → elles changent."  :" → elles sont constantes."),
            "Quotients : $"+fr(arr(s[1]/s[0]))+"$ puis $"+fr(arr(s[2]/s[1]))+"$"+(geo?" → ils sont constants.":" → ils changent."),
            "La suite est donc "+bon+"."],
      indice:"Fais les deux tests : les différences pour l'arithmétique, les quotients pour la géométrique." };
  }}
];

var G_SECOND = [
{ id:"sd-delta", titre:"Calculer un discriminant", niveau:1, gen:function(){
    var a=pick([1,1,1,2,3,-1,-2]), b=nz(-8,8), c=nz(-8,8);

            {v:b*b, m:"Tu t'es arrêté à $b^2 = "+fr(b*b)+"$. La formule complète est $Δ = b^2 - 4ac$ : il reste à traiter $-4 × "+fr(a)+" × "+fr(c)+"$."},
            {v:-b*b-4*a*c, m:"Un carré est toujours positif : $("+fr(b)+")^2 = "+fr(b*b)+"$, jamais $-"+fr(b*b)+"$."},

      corr:["J'identifie : $a = "+fr(a)+"$, $b = "+fr(b)+"$, $c = "+fr(c)+"$.",
            "$Δ = b^2 - 4ac = ("+fr(b)+")^2 - 4 × ("+fr(a)+") × ("+fr(c)+")$.",
            "$("+fr(b)+")^2 = "+fr(b*b)+"$ et $4 × ("+fr(a)+") × ("+fr(c)+") = "+fr(4*a*c)+"$.",
            "$Δ = "+fr(b*b)+" − ("+fr(4*a*c)+") = "+fr(rep)+"$."],
      indice:"$Δ = b^2 - 4ac$. Recopie les trois coefficients avec leur signe avant de calculer." };
  }},

{ id:"sd-racines", titre:"Résoudre une équation du second degré", niveau:2, gen:function(){
    var x1=nz(-6,6), x2=nz(-6,6);
    while(x2===x1) x2=nz(-6,6);
    if(x1>x2){ var t=x1; x1=x2; x2=t; }
    var a=pick([1,1,1,2,-1]);
    var b=-a*(x1+x2), c=a*x1*x2, D=b*b-4*a*c;
    return { type:"num", niveau:2, rep:x2,
      enonce:"Résoudre $"+trinome(a,b,c)+" = 0$ et donner la **plus grande** des deux solutions.",
      diag:[{v:x1, m:"C'est bien une solution, mais c'est la plus petite. On demande la plus grande : $"+fr(x2)+"$."},
            {v:-b/(2*a), m:"Tu as calculé $-@f{b}{2a} = "+fr(arr(-b/(2*a)))+"$ : c'est l'abscisse du sommet, la valeur au **milieu** des deux racines. Il faut encore ajouter $@f{@r{Δ}}{2a}$."},
            {v:-x2, m:"Erreur de signe. La formule commence par $-b$, et ici $b = "+fr(b)+"$, donc $-b = "+fr(-b)+"$."},
            {v:arr(D), m:"Tu as donné le discriminant ($Δ = "+fr(D)+"$), pas une solution. Il faut encore appliquer $@f{-b ± @r{Δ}}{2a}$."}],
      corr:["$a = "+fr(a)+"$, $b = "+fr(b)+"$, $c = "+fr(c)+"$.",
            "$Δ = ("+fr(b)+")^2 - 4 × ("+fr(a)+") × ("+fr(c)+") = "+fr(D)+"$, donc $@r{Δ} = "+fr(arr(Math.sqrt(D)))+"$.",
            "$x = @f{"+fr(-b)+" ± "+fr(arr(Math.sqrt(D)))+"}{"+fr(2*a)+"}$.",
            "Les deux solutions sont $"+fr(x1)+"$ et $"+fr(x2)+"$ ; la plus grande est $"+fr(x2)+"$."],
      indice:"Calcule $Δ$, puis les deux racines avec $@f{-b ± @r{Δ}}{2a}$, et compare-les." };
  }},

{ id:"sd-sommet", titre:"Abscisse du sommet", niveau:2, gen:function(){
    var a=pick([1,2,-1,-2,3]), b=nz(-12,12)*2, c=ri(-6,6);
    var rep=arr(-b/(2*a));
    return { type:"num", niveau:2, rep:rep, tol:0.01,
      enonce:"La parabole d'équation $y = "+trinome(a,b,c)+"$ admet un "+(a>0?"minimum":"maximum")+". En quelle valeur de $x$ est-il atteint ?",
      diag:[{v:arr(b/(2*a)), m:"Erreur de signe : la formule est $α = -@f{b}{2a}$, avec le **moins** devant la fraction. Ici $b = "+fr(b)+"$ donc $α = "+fr(rep)+"$."},
            {v:arr(-b/a), m:"Tu as oublié le 2 du dénominateur. La formule est $-@f{b}{2a}$, pas $-@f{b}{a}$."},
            {v:-b, m:"Tu as oublié de diviser par $2a = "+fr(2*a)+"$."},
            {v:arr(a*rep*rep+b*rep+c), m:"Tu as donné la valeur du "+(a>0?"minimum":"maximum")+" ($β$), pas l'endroit où il est atteint. La question porte sur $x$."}],
      corr:["Le sommet a pour abscisse $α = -@f{b}{2a}$.",
            "Ici $a = "+fr(a)+"$ et $b = "+fr(b)+"$.",
            "$α = -@f{"+fr(b)+"}{"+fr(2*a)+"} = "+fr(rep)+"$."],
      indice:"$α = -@f{b}{2a}$. Attention au signe de $b$ combiné au moins de la formule." };
  }},

{ id:"sd-nbsol", titre:"Nombre de solutions", niveau:1, gen:function(){
    var cas=pick([0,1,2]), a=pick([1,2,-1]), b, c, D;
    if(cas===0){ var r1=nz(-5,5), r2=nz(-5,5); while(r2===r1) r2=nz(-5,5);
                 b=-a*(r1+r2); c=a*r1*r2; }
    else if(cas===1){ var r=nz(-5,5); b=-2*a*r; c=a*r*r; }
    else { b=nz(-4,4); c=Math.abs(b)+ri(3,9); if(a<0) c=-c; }
    D=b*b-4*a*c;
    var bon = D>0 ? "deux solutions distinctes" : (D===0 ? "une solution double" : "aucune solution réelle");
    var choix=["deux solutions distinctes","une solution double","aucune solution réelle","trois solutions"];
    return { type:"qcm", niveau:1, choix:choix, bonne:choix.indexOf(bon),
      enonce:"Combien de solutions l'équation $"+trinome(a,b,c)+" = 0$ admet-elle ?",
      diag:choix.map(function(cx){
        if(cx===bon) return "";
        if(cx==="trois solutions") return "Une équation du second degré ne peut jamais avoir plus de deux solutions : c'est le degré qui fixe cette limite.";
        return "Recalcule le discriminant : $Δ = ("+fr(b)+")^2 - 4 × ("+fr(a)+") × ("+fr(c)+") = "+fr(D)+"$. "+
               (D>0?"Il est strictement positif, donc il y a deux solutions."
                   :(D===0?"Il est exactement nul, donc il y a une solution double."
                          :"Il est strictement négatif, donc il n'y a aucune solution réelle."));
      }),
      corr:["$a = "+fr(a)+"$, $b = "+fr(b)+"$, $c = "+fr(c)+"$.",
            "$Δ = "+fr(b*b)+" − ("+fr(4*a*c)+") = "+fr(D)+"$.",
            "$Δ "+(D>0?"> 0":(D===0?"= 0":"< 0"))+"$ : il y a "+bon+"."],
      indice:"Seul le signe du discriminant compte ici : positif, nul ou négatif." };
  }},

{ id:"sd-signe", titre:"Signe d'un trinôme", niveau:3, gen:function(){
    var x1=nz(-5,5), x2=nz(-5,5); while(x2===x1) x2=nz(-5,5);
    if(x1>x2){ var t=x1; x1=x2; x2=t; }
    var a=pick([1,-1,2,-2]);
    var b=-a*(x1+x2), c=a*x1*x2;
    var cherchePositif = Math.random()<0.5;
    // positif à l'extérieur si a>0
    var exterieur = (a>0) === cherchePositif;
    var sExt = "$x < "+fr(x1)+"$ ou $x > "+fr(x2)+"$";
    var sInt = "$"+fr(x1)+" < x < "+fr(x2)+"$";
    var bon = exterieur ? sExt : sInt;
    var choix=[sExt, sInt, "tous les réels", "aucun réel"];
    return { type:"qcm", niveau:3, choix:choix, bonne:choix.indexOf(bon),
      enonce:"Pour quelles valeurs de $x$ a-t-on $"+trinome(a,b,c)+" "+(cherchePositif?"> 0":"< 0")+"$ ?",
      diag:choix.map(function(cx){
        if(cx===bon) return "";
        if(cx==="tous les réels"||cx==="aucun réel")
          return "Le trinôme change bien de signe : il s'annule en $"+fr(x1)+"$ et $"+fr(x2)+"$, donc il est positif d'un côté et négatif de l'autre.";
        return "Tu as pris "+(exterieur?"l'intérieur":"l'extérieur")+" des racines. Rappel : le trinôme est du **signe de $a$** à l'extérieur des racines, et du signe opposé entre elles. Ici $a = "+fr(a)+"$, donc il est "+(a>0?"positif":"négatif")+" à l'extérieur.";
      }),
      corr:["Les racines sont $"+fr(x1)+"$ et $"+fr(x2)+"$.",
            "Le coefficient $a = "+fr(a)+"$ est "+(a>0?"positif":"négatif")+".",
            "Le trinôme est donc "+(a>0?"positif":"négatif")+" à l'extérieur des racines et "+(a>0?"négatif":"positif")+" entre elles.",
            "On cherche où il est "+(cherchePositif?"positif":"négatif")+" : "+(exterieur?"à l'extérieur":"entre les racines")+", soit "+bon+"."],
      indice:"Trouve les racines, repère le signe de $a$, puis applique : signe de $a$ à l'extérieur." };
  }}
];

{ id:"de-tangente", titre:"Équation d'une tangente", niveau:3, gen:function(){
