<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>
<title>Cahier de Première</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Karla:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400;1,8..60,600&display=swap">
<style>
/* ---------- Jetons ---------- */
:root{
  --paper:#F6F7FB; --surface:#FFFFFF; --surface2:#EEF1F9; --surface3:#E4E9F6;
  --ink:#151A2D; --ink2:#535B78; --ink3:#868DA8;
  --line:#DCE2F0; --line2:#C7D0E6;
  --bleu:#2B49CF; --bleuSoft:#E8ECFC; --bleuLine:#B9C5F5;
  --rouge:#CE3B54; --rougeSoft:#FCECEF; --rougeLine:#F0BDC7;
  --vert:#0B8A63; --vertSoft:#E2F4EE; --vertLine:#A9DCC9;
  --ambre:#B57A05; --ambreSoft:#FDF2D8; --ambreLine:#EFD79A;
  --shadow:0 1px 2px rgba(21,26,45,.05), 0 8px 24px -12px rgba(21,26,45,.16);
  --shadowUp:0 -1px 2px rgba(21,26,45,.05), 0 -8px 24px -12px rgba(21,26,45,.16);
  --r:14px; --r2:10px;
  --f-disp:"Fraunces",Georgia,"Times New Roman",serif;
  --f-body:"Karla","Segoe UI",system-ui,sans-serif;
  --f-math:"Source Serif 4",Cambria,Georgia,serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0D1020; --surface:#151A2C; --surface2:#1D2338; --surface3:#262E48;
    --ink:#E9ECF7; --ink2:#A6AECA; --ink3:#7A8299;
    --line:#2A3150; --line2:#3A4368;
    --bleu:#93A8FF; --bleuSoft:#1A2346; --bleuLine:#334077;
    --rouge:#FF8A9E; --rougeSoft:#361D25; --rougeLine:#5D3040;
    --vert:#4FD5A8; --vertSoft:#0F3128; --vertLine:#245A48;
    --ambre:#F0C065; --ambreSoft:#33290F; --ambreLine:#5B4A1E;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
    --shadowUp:0 -1px 2px rgba(0,0,0,.4), 0 -8px 24px -12px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0D1020; --surface:#151A2C; --surface2:#1D2338; --surface3:#262E48;
  --ink:#E9ECF7; --ink2:#A6AECA; --ink3:#7A8299;
  --line:#2A3150; --line2:#3A4368;
  --bleu:#93A8FF; --bleuSoft:#1A2346; --bleuLine:#334077;
  --rouge:#FF8A9E; --rougeSoft:#361D25; --rougeLine:#5D3040;
  --vert:#4FD5A8; --vertSoft:#0F3128; --vertLine:#245A48;
  --ambre:#F0C065; --ambreSoft:#33290F; --ambreLine:#5B4A1E;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
  --shadowUp:0 -1px 2px rgba(0,0,0,.4), 0 -8px 24px -12px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--f-body); font-size:16px; line-height:1.62;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--f-disp); font-weight:700; line-height:1.18; text-wrap:balance; margin:0}
p{margin:0}
a{color:var(--bleu)}
button{font:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:2.5px solid var(--bleu); outline-offset:2px; border-radius:6px}
::selection{background:var(--ambreSoft); color:var(--ink)}

/* ---------- Coquille ---------- */
.shell{display:grid; grid-template-columns:272px minmax(0,1fr); min-height:100vh}
.rail{
  grid-column:1; border-right:1px solid var(--line); background:var(--surface);
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow:hidden;
}
.railHead{padding:22px 20px 16px; border-bottom:1px solid var(--line)}
.brand{display:flex; align-items:center; gap:11px}
.mark{
  width:38px;height:38px;flex:none;border-radius:11px;background:var(--bleu);
  display:grid;place-items:center;color:#fff;font-family:var(--f-math);font-style:italic;
  font-size:21px;font-weight:600;box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)
}
.brand b{display:block;font-family:var(--f-disp);font-size:17px;letter-spacing:-.01em;line-height:1.15}
.brand span{display:block;font-size:11.5px;color:var(--ink3);letter-spacing:.07em;text-transform:uppercase;font-weight:600}
.railScroll{flex:1; overflow-y:auto; padding:14px 12px 20px}
.railLabel{
  font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);
  font-weight:700;padding:12px 10px 7px
}
.navBtn{
  width:100%;display:flex;align-items:center;gap:10px;text-align:left;background:none;border:0;
  padding:8px 10px;border-radius:var(--r2);color:var(--ink2);font-weight:600;font-size:14.5px;
  transition:background .15s,color .15s
}
.navBtn:hover{background:var(--surface2);color:var(--ink)}
.navBtn[aria-current="true"]{background:var(--bleuSoft);color:var(--bleu)}
.navBtn .ic{width:19px;flex:none;display:grid;place-items:center;opacity:.85}
.chapBtn{
  width:100%;display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center;
  text-align:left;background:none;border:0;padding:7px 10px;border-radius:var(--r2);
  color:var(--ink2);font-size:14.5px;font-weight:500;transition:background .15s,color .15s
}
.chapBtn:hover{background:var(--surface2);color:var(--ink)}
.chapBtn[aria-current="true"]{background:var(--bleuSoft);color:var(--bleu);font-weight:600}
.chapNum{
  font-family:var(--f-math);font-size:12.5px;font-weight:600;color:var(--ink3);
  background:var(--surface2);border-radius:6px;text-align:center;padding:1px 0;
  font-variant-numeric:tabular-nums
}
.chapBtn[aria-current="true"] .chapNum{background:var(--bleu);color:#fff}
.chapBtn .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:99px;background:var(--line2);flex:none}
.dot.part{background:var(--ambre)}
.dot.done{background:var(--vert)}
.railFoot{border-top:1px solid var(--line);padding:12px;display:flex;gap:8px;align-items:center}

.main{grid-column:2;min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:30;background:var(--paper);
  border-bottom:1px solid var(--line);
  padding:10px 26px;display:flex;align-items:center;gap:14px;min-height:57px
}
.burger{display:none}
.crumb{font-size:13px;color:var(--ink3);font-weight:600;letter-spacing:.02em;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb b{color:var(--ink2)}
.spacer{flex:1}
.wrap{padding:34px 26px 96px;width:100%;max-width:848px;margin:0 auto;min-width:0}
.wrap.wide{max-width:1080px}

/* ---------- Éléments ---------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--surface);
  color:var(--ink);padding:8px 14px;border-radius:9px;font-weight:600;font-size:14.5px;
  transition:background .15s,border-color .15s,transform .08s
}
.btn:hover{background:var(--surface2);border-color:var(--ink3)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--bleu);border-color:var(--bleu);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.gho{border-color:transparent;background:transparent;color:var(--ink2)}
.btn.gho:hover{background:var(--surface2);color:var(--ink)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icb{
  border:1px solid var(--line);background:var(--surface);width:36px;height:36px;border-radius:9px;
  display:grid;place-items:center;color:var(--ink2);flex:none
}
.icb:hover{background:var(--surface2);color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:22px}
.grid{display:grid;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tag{
  display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;padding:3px 9px;border-radius:99px;background:var(--surface2);color:var(--ink2)
}
.tag.b{background:var(--bleuSoft);color:var(--bleu)}
.tag.v{background:var(--vertSoft);color:var(--vert)}
.tag.a{background:var(--ambreSoft);color:var(--ambre)}
.tag.r{background:var(--rougeSoft);color:var(--rouge)}
.eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);font-weight:700}
.muted{color:var(--ink2)}
.small{font-size:13.5px}
hr.sep{border:0;border-top:1px solid var(--line);margin:26px 0}

/* ---------- Maths ---------- */
.m{font-family:var(--f-math);font-size:1.045em;white-space:nowrap}
.m .v{font-style:italic}
.m sup,.m sub{font-size:.68em;line-height:0}
.frac{display:inline-flex;flex-direction:column;vertical-align:-.52em;text-align:center;margin:0 .18em}
.frac>span:first-child{border-bottom:1.4px solid currentColor;padding:0 .3em;line-height:1.25}
.frac>span:last-child{padding:0 .3em;line-height:1.25}
.rad{display:inline-flex;align-items:stretch}
.rad>i{font-style:normal}
.rad>span{border-top:1.4px solid currentColor;padding:0 .18em;margin-left:-.04em}
.vec{position:relative;display:inline-block;font-style:italic;padding-top:.1em}
.vec::after{content:"\2192";position:absolute;left:0;right:0;top:-.72em;font-size:.66em;text-align:center;font-style:normal}
.mblock{
  font-family:var(--f-math);font-size:19px;text-align:center;padding:6px 0;
  overflow-x:auto;overflow-y:hidden
}

/* ---------- Blocs de cours ---------- */
.lesson{font-size:16.5px}
.lesson>*+*{margin-top:18px}
.lesson p{max-width:65ch}
.lesson h2{font-size:25px;margin-top:38px;letter-spacing:-.015em}
.secHead{display:flex;gap:12px;align-items:baseline;margin-top:42px}
.secHead .n{
  font-family:var(--f-math);font-weight:600;font-size:15px;color:var(--bleu);
  background:var(--bleuSoft);border-radius:7px;padding:2px 9px;flex:none;font-variant-numeric:tabular-nums
}
.callout{border-radius:var(--r);padding:16px 18px;border:1px solid var(--line);background:var(--surface2)}
.callout .ct{font-family:var(--f-disp);font-weight:700;font-size:15.5px;margin-bottom:5px;display:flex;gap:8px;align-items:center}
.callout p{max-width:none}
.co-idee{background:var(--bleuSoft);border-color:var(--bleuLine)}
.co-idee .ct{color:var(--bleu)}
.co-piege{background:var(--rougeSoft);border-color:var(--rougeLine)}
.co-piege .ct{color:var(--rouge)}
.co-astuce{background:var(--vertSoft);border-color:var(--vertLine)}
.co-astuce .ct{color:var(--vert)}
.formula{
  background:var(--ambreSoft);border:1px solid var(--ambreLine);border-radius:var(--r);
  padding:14px 18px 16px
}
.formula .ft{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ambre);font-weight:700;margin-bottom:2px}
.formula .fn2{font-size:13.5px;color:var(--ink2);margin-top:8px;text-align:center}
.formula.fcode .mblock{
  font-family:ui-monospace,"Cascadia Mono","Consolas","Liberation Mono",monospace;
  font-size:14.5px;line-height:1.75;text-align:left;padding:10px 12px;
  background:var(--surface);border:1px solid var(--ambreLine);border-radius:var(--r2)
}
.formula.fcode .mblock b{font-weight:500;color:var(--ink)}
.ul{margin:0;padding-left:0;list-style:none;display:grid;gap:9px}
.ul li{position:relative;padding-left:24px;max-width:64ch}
.ul li::before{
  content:"";position:absolute;left:6px;top:.66em;width:6px;height:6px;border-radius:2px;
  background:var(--bleu);opacity:.55
}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tblWrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r2);background:var(--surface)}
.tbl th,.tbl td{padding:9px 13px;text-align:left;border-bottom:1px solid var(--line)}
.tbl th{background:var(--surface2);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.tbl tr:last-child td{border-bottom:0}

.demo{border:1px solid var(--bleuLine);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.demoHead{background:var(--bleuSoft);padding:12px 18px;border-bottom:1px solid var(--bleuLine)}
.demoHead .dt{font-family:var(--f-disp);font-weight:700;font-size:15.5px;color:var(--bleu)}
.demoBody{padding:16px 18px;display:grid;gap:12px}
.step{display:grid;grid-template-columns:26px minmax(0,1fr);gap:12px;align-items:start}
.step .sn{
  width:24px;height:24px;border-radius:99px;background:var(--surface2);color:var(--ink2);
  display:grid;place-items:center;font-size:12.5px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums
}
.step.on .sn{background:var(--bleu);color:#fff}
.step .sq{font-weight:600}
.step .sr{margin-top:6px;padding:11px 14px;background:var(--surface2);border-radius:var(--r2);border-left:3px solid var(--bleu)}
.hidden{display:none}
canvas.plot{width:100%;max-width:460px;height:auto;display:block;margin:0 auto;border-radius:var(--r2);border:1px solid var(--line)}

/* ---------- Moteur d'exercices ---------- */
.exoTop{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.pill{
  font-family:var(--f-math);font-size:13px;font-weight:600;color:var(--ink2);background:var(--surface2);
  padding:3px 10px;border-radius:99px;font-variant-numeric:tabular-nums
}
.enonce{font-size:17.5px;line-height:1.6}
.choices{display:grid;gap:9px;margin-top:16px}
.choice{
  display:grid;grid-template-columns:28px minmax(0,1fr);gap:11px;align-items:start;text-align:left;
  border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r2);padding:12px 14px;
  transition:border-color .15s,background .15s;color:var(--ink)
}
.choice:hover:not(:disabled){border-color:var(--bleu);background:var(--bleuSoft)}
.choice .k{
  width:26px;height:26px;border-radius:8px;background:var(--surface2);display:grid;place-items:center;
  font-size:13px;font-weight:700;color:var(--ink2)
}
.choice[data-state="pick"]{border-color:var(--bleu);background:var(--bleuSoft)}
.choice[data-state="pick"] .k{background:var(--bleu);color:#fff}
.choice[data-state="bad"]{border-color:var(--rougeLine);background:var(--rougeSoft)}
.choice[data-state="bad"] .k{background:var(--rouge);color:#fff}
.choice[data-state="good"]{border-color:var(--vertLine);background:var(--vertSoft)}
.choice[data-state="good"] .k{background:var(--vert);color:#fff}
.choice:disabled{cursor:default}
.inputRow{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.inp{
  flex:1;min-width:190px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:var(--r2);padding:11px 14px;font-family:var(--f-math);font-size:17px
}
.inp:focus{border-color:var(--bleu);outline:none}
.inp.bad{border-color:var(--rouge)}
.inp.good{border-color:var(--vert)}
textarea.inp{font-family:var(--f-body);font-size:15px;line-height:1.55;resize:vertical;min-height:120px;white-space:pre-wrap;width:100%}
.fb{border-radius:var(--r);padding:16px 18px;margin-top:16px;border:1px solid var(--line);animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fb.good{background:var(--vertSoft);border-color:var(--vertLine)}
.fb.bad{background:var(--rougeSoft);border-color:var(--rougeLine)}
.fb .fbt{font-family:var(--f-disp);font-weight:700;font-size:16px;display:flex;gap:8px;align-items:center;margin-bottom:6px}
.fb.good .fbt{color:var(--vert)}
.fb.bad .fbt{color:var(--rouge)}
.corr{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:14px 16px}
.corr .ct{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:700;margin-bottom:8px}
.corr ol{margin:0;padding-left:20px;display:grid;gap:8px}
.corr li::marker{font-weight:700;color:var(--bleu)}
.hint{background:var(--ambreSoft);border:1px solid var(--ambreLine);border-radius:var(--r2);padding:12px 15px;margin-top:14px}
.hint .ct{font-weight:700;color:var(--ambre);font-size:13.5px;margin-bottom:3px}

/* ---------- Progression ---------- */
.bar{height:7px;border-radius:99px;background:var(--surface3);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--bleu);border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.3,1)}
.bar.v>i{background:var(--vert)}
.stat{display:grid;gap:2px}
.stat .n{font-family:var(--f-disp);font-size:29px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.stat .l{font-size:12.5px;color:var(--ink3);font-weight:600;letter-spacing:.03em}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:14px}
.chapCard{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;
  text-align:left;display:grid;gap:11px;align-content:start;
  transition:border-color .15s,transform .12s,box-shadow .15s
}
.chapCard:hover{border-color:var(--bleuLine);transform:translateY(-2px);box-shadow:var(--shadow)}
.chapCard h3{font-size:17.5px;letter-spacing:-.01em}
.chapCard .d{font-size:13.8px;color:var(--ink2);line-height:1.5}
.kbd{
  font-family:var(--f-math);font-size:12px;border:1px solid var(--line2);border-bottom-width:2px;
  border-radius:5px;padding:1px 6px;background:var(--surface2);color:var(--ink2)
}
.empty{text-align:center;padding:56px 24px;color:var(--ink2)}
.empty .big{font-family:var(--f-disp);font-size:21px;color:var(--ink);margin-bottom:6px}

/* ---------- Import ---------- */
.drop{
  border:2px dashed var(--line2);border-radius:var(--r);padding:34px 22px;text-align:center;
  background:var(--surface);transition:border-color .15s,background .15s
}
.drop.over{border-color:var(--bleu);background:var(--bleuSoft)}
.seg{display:inline-flex;background:var(--surface2);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:none;padding:6px 13px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.pre{
  font-family:var(--f-math);font-size:13.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word;
  background:var(--surface2);border:1px solid var(--line);border-radius:var(--r2);padding:14px;
  max-height:280px;overflow:auto
}
.imgPrev{max-width:100%;border-radius:var(--r2);border:1px solid var(--line);display:block}
.st4{display:grid;grid-template-columns:30px minmax(0,1fr);gap:14px;padding-bottom:20px;position:relative}
.st4::before{content:"";position:absolute;left:14px;top:32px;bottom:0;width:1.5px;background:var(--line)}
.st4:last-child::before{display:none}
.st4 .n{
  width:29px;height:29px;border-radius:99px;background:var(--surface);border:1.5px solid var(--line2);
  display:grid;place-items:center;font-weight:700;font-size:13.5px;color:var(--ink2);z-index:1
}
.st4.ok .n{background:var(--vert);border-color:var(--vert);color:#fff}
.st4 h4{font-size:15.5px;margin-bottom:5px}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:10px;font-weight:600;
  font-size:14.5px;z-index:200;box-shadow:var(--shadowUp);animation:up .3s ease
}
@keyframes up{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%)}}

/* ---------- Responsive ---------- */
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .rail{
    position:fixed;z-index:60;width:280px;left:0;top:0;transform:translateX(-102%);
    transition:transform .25s cubic-bezier(.2,.8,.3,1);box-shadow:var(--shadow)
  }
  body.nav .rail{transform:none}
  .main{grid-column:1}
  .burger{display:grid}
  .wrap{padding:24px 17px 90px}
  .topbar{padding:9px 15px}
  .scrim{position:fixed;inset:0;background:rgba(10,14,28,.45);z-index:55}
  .lesson{font-size:16px}
  .secHead{margin-top:34px}
}
@media (prefers-reduced-motion:reduce){

<script>
/* =====================================================================
   1. Rendu mathématique léger
   Notation utilisée dans les contenus :
     @f{a}{b}   fraction        @r{x}   racine carrée
     @v{AB}     vecteur         ^{...}  exposant     _{...}  indice
   Dans le texte courant, les maths sont encadrées par des $ .
   ===================================================================== */
(function(){
"use strict";

var FN = ["cos","sin","tan","ln","exp","log","lim","max","min",
          "de","du","et","ou","si","la","le","un","en","au","ce","on","il","ne"];

function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function mathCore(s){
  // fractions (deux passes pour tolérer une imbrication simple)
  for(var i=0;i<2;i++){
    s = s.replace(/@f\{([^{}]*)\}\{([^{}]*)\}/g,
      '<span class="frac"><span>$1</span><span>$2</span></span>');
  }
  s = s.replace(/@r\{([^{}]*)\}/g,'<span class="rad"><i>√</i><span>$1</span></span>');
  s = s.replace(/@v\{([^{}]*)\}/g,'<span class="vec">$1</span>');
  s = s.replace(/\^\{([^{}]*)\}/g,'<sup>$1</sup>');
  s = s.replace(/_\{([^{}]*)\}/g,'<sub>$1</sub>');
  s = s.replace(/\^(-?[0-9A-Za-z])/g,'<sup>$1</sup>');
  s = s.replace(/_(-?[0-9A-Za-z])/g,'<sub>$1</sub>');
  // variables en italique (une seule lettre), en sautant les balises
  s = s.replace(/&[a-zA-Z]+;|&#\d+;|<[^>]*>|[A-Za-zα-ωΑ-Ω]+/g,function(m){
    if(m.charAt(0)==="<" || m.charAt(0)==="&") return m;   // balises et entités intactes
    if(m.length>2 || FN.indexOf(m.toLowerCase())>=0) return m;   // cos, sin, ln, mots
    return "<em>"+m+"</em>";                           // a, x, ac, bx, uv…
  });
  return s;
}
// $ maths $  →  math ; **gras** ; texte échappé
function T(s){
  if(s==null) return "";
  var parts = esc(s).split("$"), out = "";
  for(var i=0;i<parts.length;i++){
    out += (i%2===1) ? '<span class="m">'+mathCore(parts[i])+"</span>" : parts[i];
  }
  out = out.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
  // on ré-autorise une poignée de balises de mise en forme, et rien d'autre
  return out.replace(/&lt;br\s*\/?&gt;/g,"<br>")
            .replace(/&lt;(\/?)b&gt;/g,"<$1b>")
            .replace(/&amp;(nbsp|lt|gt);/g,"&$1;");
}
// maths seules (pas de $)
function M(s){ return '<span class="m">'+mathCore(esc(s))+"</span>"; }
function MB(s){ return '<div class="mblock">'+mathCore(esc(s))+"</div>"; }

/* =====================================================================
   2. Petits utilitaires
   ===================================================================== */
function el(tag,cls,html){
  var e=document.createElement(tag);
  if(cls) e.className=cls;
  if(html!=null) e.innerHTML=html;
  return e;
}
function h(str){ var d=document.createElement("div"); d.innerHTML=str.trim(); return d.firstChild; }
function $(sel,root){ return (root||document).querySelector(sel); }
function $$(sel,root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
function toast(msg){
  var t=el("div","toast",T(msg));
  $("#toasts").appendChild(t);
  setTimeout(function(){ t.style.transition="opacity .3s"; t.style.opacity="0";
    setTimeout(function(){ t.remove(); },320); },2300);
}
function nowISO(){ return new Date().toISOString(); }
function uid(){ return "x"+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }
function pct(a,b){ return b>0 ? Math.round(100*a/b) : 0; }
function plural(n,s,p){ return n+" "+(n>1?(p||s+"s"):s); }

/* nombres : accepte 3,5  3.5  7/2  -√2 approché … */
function parseNum(str){
  if(str==null) return NaN;
  var s=String(str).trim().replace(/\s/g,"").replace(",",".")
        .replace(/^\+/,"").replace(/−/g,"-");
  if(s==="") return NaN;
  var frac=s.match(/^(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/);
  if(frac) return parseFloat(frac[1])/parseFloat(frac[2]);
  if(/^-?\d+(\.\d+)?$/.test(s)) return parseFloat(s);
  return NaN;
}
/* normalisation de texte pour comparer des réponses écrites */
function norm(s){
  return String(s||"").toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/\s+/g," ").replace(/[.;!?]+$/,"").trim();
}

/* =====================================================================
   3. Mémoire locale (progression, révisions, cours importés)
   ===================================================================== */
var KEY="cahier-premiere.v1";
var S = { chap:{}, perso:[], srs:{}, controles:[], entrain:{}, theme:null };
function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){ var o=JSON.parse(raw); for(var k in o) S[k]=o[k]; }
  }catch(e){}
}
function save(silencieux){
  // Une sauvegarde silencieuse enregistre un état reçu du serveur : elle ne
  // doit pas prétendre être une modification, sinon l'horodatage adopté est perdu.
  if(!silencieux) S.maj = Date.now();
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
  // en version connectée, la couche IA renvoie l'état au serveur
  if(!silencieux && window.APRES_SAVE) window.APRES_SAVE();
}
function chapState(id){
  if(!S.chap[id]) S.chap[id]={ lu:[], exos:{} };
  if(!S.chap[id].lu) S.chap[id].lu=[];
  if(!S.chap[id].exos) S.chap[id].exos={};
  return S.chap[id];
}
load();
if(!S.srs) S.srs={};
if(!S.controles) S.controles=[];
if(!S.entrain) S.entrain={};

/* =====================================================================
   3 bis. Révision espacée
   Chaque exercice raté devient une carte. À chaque réussite la carte
   monte d'un cran et revient plus tard ; à chaque échec elle retombe
   au premier cran et revient tout de suite.
   ===================================================================== */
var PALIERS = [0, 1, 3, 7, 16, 35, 70];   // en jours
var JOUR = 86400000;
function srsCle(chapId, exoId){ return chapId+"::"+exoId; }
function srsMaj(chapId, exoId, ok, meta){
  var k = srsCle(chapId, exoId);
  var c = S.srs[k];
  if(!ok){
    S.srs[k] = { palier:0, du:Date.now(), vu:Date.now(), ratages:((c&&c.ratages)||0)+1,
                 chapId:chapId, exoId:exoId, titre:(meta&&meta.titre)||(c&&c.titre)||"" };
  } else if(c){
    var p = Math.min(c.palier+1, PALIERS.length-1);
    c.palier = p; c.vu = Date.now(); c.du = Date.now() + PALIERS[p]*JOUR;
    if(p >= PALIERS.length-1) delete S.srs[k];   // acquis : on retire la carte
  }
  save();
}
function srsCartes(){
  var out=[];
  for(var k in S.srs){ var c=S.srs[k]; c.cle=k; out.push(c); }
  return out.sort(function(a,b){ return a.du-b.du; });
}
function srsDues(){
  var t=Date.now();
  return srsCartes().filter(function(c){ return c.du<=t; });
}
function srsQuand(c){
  var d = Math.ceil((c.du - Date.now())/JOUR);
  if(d<=0) return "à réviser maintenant";
  if(d===1) return "demain";
  if(d<14) return "dans "+d+" jours";
  var sem = Math.round(d/7);
  return "dans "+sem+" semaine"+(sem>1?"s":"");
}
function shuffle(a){
  a=a.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function duree(ms){
  var s=Math.max(0,Math.round(ms/1000));
  return Math.floor(s/60)+" min "+String(s%60).padStart(2,"0")+" s";
}
function chrono(ms){
  var s=Math.max(0,Math.round(ms/1000));
  return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
}

/* =====================================================================
   4. Thème
   ===================================================================== */
function applyTheme(){
  if(S.theme) document.documentElement.setAttribute("data-theme",S.theme);
  else document.documentElement.removeAttribute("data-theme");
}
applyTheme();

/* exposé au reste de l'application */
window.APP = {
  esc:esc, T:T, M:M, MB:MB, el:el, h:h, $:$, $$:$$, toast:toast,
  uid:uid, pct:pct, plural:plural, parseNum:parseNum, norm:norm, nowISO:nowISO,
  S:S, save:save, chapState:chapState, applyTheme:applyTheme,
  srsMaj:srsMaj, srsCartes:srsCartes, srsDues:srsDues, srsQuand:srsQuand,
  shuffle:shuffle, duree:duree, chrono:chrono, PALIERS:PALIERS
};
})();
</script>

 {id:"su5", niveau:2, type:"qcm", enonce:"Soit la suite définie par $u_0 = 4$ et $u_{n+1} = 3u_n - 2$. Combien vaut $u_2$ ?",

 {id:"su6", niveau:2, type:"txt", enonce:"Une suite arithmétique a pour raison $r = -5$. Est-elle croissante ou décroissante ? (réponds par un mot)",

 {id:"su8", niveau:3, type:"num", enonce:"Une suite géométrique vérifie $u_0 = 5$ et $q = 2$. Calculer la somme $u_0 + u_1 + … + u_6$.",

/* ========================= 2. SECOND DEGRÉ ========================= */
{
id:"second", n:2, titre:"Second degré",
sous:"La parabole et son discriminant",
desc:"Trinôme, discriminant, racines, forme factorisée, signe et inéquations.",
duree:40,
sections:[
 {titre:"Le trinôme et sa courbe", blocs:[
  {t:"idee", x:"Un **trinôme du second degré**, c'est une expression de la forme $ax^2 + bx + c$ avec $a ≠ 0$. Sa courbe s'appelle une **parabole**."},
  {t:"p", x:"Les trois coefficients ont chacun un rôle. Le plus important est $a$ : c'est lui qui décide de la forme générale."},
  {t:"liste", items:[
   "Si $a > 0$, la parabole est tournée vers le haut (comme un sourire). Elle a un **minimum**.",
   "Si $a < 0$, la parabole est tournée vers le bas (comme une moue). Elle a un **maximum**.",
   "Plus $|a|$ est grand, plus la parabole est resserrée."
  ]},
  {t:"plot", f:"x*x-2*x-3", xmin:-3, xmax:5, titre:"Courbe de $f(x) = x^2 - 2x - 3$", note:"Elle coupe l'axe des abscisses en $-1$ et $3$ : ce sont les racines."},
  {t:"p", x:"Le point le plus bas (ou le plus haut) s'appelle le **sommet**. La parabole est symétrique par rapport à la droite verticale qui passe par ce sommet."},
  {t:"formule", titre:"Coordonnées du sommet", x:"$α = -@f{b}{2a}$ &nbsp;&nbsp;et&nbsp;&nbsp; $β = f(α)$", note:"On calcule d'abord $α$, puis on remplace dans la fonction pour trouver $β$."}
 ]},

 {titre:"Le discriminant : combien de solutions ?", blocs:[
  {t:"idee", x:"Le **discriminant** est un nombre qui répond à une seule question : combien de fois la parabole coupe-t-elle l'axe des abscisses ?"},
  {t:"formule", titre:"Discriminant", x:"$Δ = b^2 - 4ac$", note:"Δ est la lettre grecque « delta ». On la calcule toujours en premier."},
  {t:"tbl", head:["Valeur de $Δ$","Nombre de solutions","Ce qu'on voit"], rows:[
   ["$Δ > 0$","2 solutions","La parabole traverse l'axe en deux points"],
   ["$Δ = 0$","1 solution (double)","La parabole touche l'axe sans le traverser"],
   ["$Δ < 0$","aucune solution","La parabole ne touche jamais l'axe"]
  ]},
  {t:"formule", titre:"Les racines quand $Δ > 0$", x:"$x_1 = @f{-b - @r{Δ}}{2a}$ &nbsp;&nbsp;et&nbsp;&nbsp; $x_2 = @f{-b + @r{Δ}}{2a}$", note:"Quand $Δ = 0$, il y a une seule racine : $x_0 = -@f{b}{2a}$."},
  {t:"exemple", titre:"Exemple guidé — résoudre une équation", enonce:"Résoudre $x^2 - 2x - 3 = 0$.", etapes:[
   {q:"Identifier $a$, $b$ et $c$", r:"$a = 1$ (le coefficient devant $x^2$), $b = -2$, $c = -3$. Attention : le signe fait partie du coefficient."},
   {q:"Calculer $Δ$", r:"$Δ = b^2 - 4ac = (-2)^2 - 4 × 1 × (-3) = 4 + 12 = 16$."},
   {q:"Conclure sur le nombre de solutions", r:"$Δ = 16 > 0$ : il y a deux solutions distinctes."},
   {q:"Calculer les racines", r:"$@r{16} = 4$. Donc $x_1 = @f{2 - 4}{2} = @f{-2}{2} = -1$ et $x_2 = @f{2 + 4}{2} = @f{6}{2} = 3$."},
   {q:"Vérifier", r:"On remplace : $(-1)^2 - 2×(-1) - 3 = 1 + 2 - 3 = 0$. ✓ Et $3^2 - 2×3 - 3 = 9 - 6 - 3 = 0$. ✓"}
  ]},
  {t:"piege", titre:"Les deux erreurs de signe les plus fréquentes", x:"1. Oublier que $-4ac$ devient **plus** quand $c$ est négatif : $-4 × 1 × (-3) = +12$.<br>2. Écrire $x = @f{b ± @r{Δ}}{2a}$ au lieu de $-b$. La formule commence par **moins** $b$."},
  {t:"check", q:"Pour $2x^2 + 3x - 5$, quel est le discriminant ?",
   choix:["49","−31","9","19"], bonne:0,
   expl:["Exact : $3^2 - 4 × 2 × (-5) = 9 + 40 = 49$.",
         "Tu as calculé $9 - 40$. Mais $c = -5$ est négatif, donc $-4ac = -4 × 2 × (-5) = +40$. Deux signes moins donnent un plus.",
         "Tu as calculé $b^2$ et t'es arrêté. Il reste à retirer $4ac$.",
         "Tu as oublié le facteur $a = 2$ dans $4ac$ : $4 × 2 × 5 = 40$, pas 20."]}
 ]},

 {titre:"Factoriser et lire les racines", blocs:[
  {t:"p", x:"Une fois les racines trouvées, on peut réécrire le trinôme sous une forme beaucoup plus lisible."},
  {t:"formule", titre:"Forme factorisée (si $Δ ≥ 0$)", x:"$ax^2 + bx + c = a(x - x_1)(x - x_2)$", note:"Si $Δ = 0$ : $a(x - x_0)^2$. Si $Δ < 0$ : pas de factorisation possible."},
  {t:"p", x:"Exemple : $x^2 - 2x - 3$ a pour racines $-1$ et $3$, donc il se factorise en $(x + 1)(x - 3)$. Remarque le changement de signe : la racine $-1$ donne le facteur $(x - (-1)) = (x + 1)$."},
  {t:"piege", titre:"L'erreur de signe dans la factorisation", x:"Une racine **négative** donne un facteur avec un **plus**. Si $x_1 = -4$, le facteur est $(x + 4)$, pas $(x - 4)$. Pour vérifier : remplace $x$ par la racine, chaque facteur doit s'annuler."},
  {t:"formule", titre:"Forme canonique", x:"$ax^2 + bx + c = a(x - α)^2 + β$", note:"Avec $α$ et $β$ les coordonnées du sommet. Utile pour lire directement le minimum ou le maximum."}
 ]},

 {titre:"Le signe du trinôme", blocs:[
  {t:"idee", x:"Question typique : pour quelles valeurs de $x$ l'expression est-elle positive ? La réponse tient en une phrase à retenir par cœur."},
  {t:"formule", titre:"La règle d'or", x:"Le trinôme est **du signe de $a$**, sauf entre les racines.", note:"« Signe de a partout, signe contraire à l'intérieur. »"},
  {t:"tbl", head:["Cas","Signe de $ax^2+bx+c$"], rows:[
   ["$Δ < 0$","Toujours du signe de $a$, jamais nul"],
   ["$Δ = 0$","Toujours du signe de $a$, sauf en $x_0$ où il vaut 0"],
   ["$Δ > 0$","Signe de $a$ à l'extérieur des racines, signe opposé entre les deux"]
  ]},
  {t:"exemple", titre:"Exemple guidé — une inéquation", enonce:"Résoudre $x^2 - 2x - 3 < 0$.", etapes:[
   {q:"Trouver les racines", r:"On l'a déjà fait : $x_1 = -1$ et $x_2 = 3$."},
   {q:"Repérer le signe de $a$", r:"$a = 1 > 0$. Donc le trinôme est positif à l'extérieur, négatif entre les racines."},
   {q:"Répondre à la question posée", r:"On cherche là où l'expression est **négative** : c'est entre les racines."},
   {q:"Écrire la solution", r:"$S = ]-1 ; 3[$. Les crochets sont ouverts car l'inégalité est stricte ($<$ et non $≤$)."}
  ]},
  {t:"astuce", titre:"Le réflexe qui sauve", x:"En cas de doute, teste une valeur. Ici $x = 0$ donne $0 - 0 - 3 = -3 < 0$ : le zéro est bien entre $-1$ et $3$, donc c'est cohérent."}
 ]},

 {titre:"Somme et produit des racines", blocs:[
  {t:"idee", x:"Il existe un raccourci : sans calculer les racines, on connaît déjà **leur somme et leur produit**. C'est très pratique pour vérifier un résultat ou deviner des racines simples."},
  {t:"formule", titre:"Les deux relations", x:"$x_1 + x_2 = -@f{b}{a}$ &nbsp;&nbsp;et&nbsp;&nbsp; $x_1 × x_2 = @f{c}{a}$", note:"Valables dès que $Δ ≥ 0$. La somme porte un signe moins, le produit non."},
  {t:"p", x:"Reprenons $x^2 - 2x - 3$, dont les racines sont $-1$ et $3$. La somme vaut $-1 + 3 = 2$, et effectivement $-@f{b}{a} = -@f{-2}{1} = 2$. Le produit vaut $-1 × 3 = -3$, et $@f{c}{a} = -3$. ✓"},
  {t:"astuce", titre:"Deviner les racines de tête", x:"Quand $a = 1$, cherche deux nombres dont la **somme vaut $-b$** et le **produit vaut $c$**. Pour $x^2 - 7x + 12$ : somme 7, produit 12 → 3 et 4. Trouvé en trois secondes, sans discriminant."},
  {t:"exemple", titre:"Exemple guidé — retrouver une racine cachée", enonce:"On sait que $2x^2 - 10x + c = 0$ admet 1 comme racine. Trouver l'autre racine, puis $c$.", etapes:[
   {q:"Utiliser la somme", r:"$x_1 + x_2 = -@f{b}{a} = -@f{-10}{2} = 5$."},
   {q:"En déduire l'autre racine", r:"Comme $x_1 = 1$, on a $1 + x_2 = 5$, donc $x_2 = 4$."},
   {q:"Utiliser le produit", r:"$x_1 × x_2 = @f{c}{a}$, soit $1 × 4 = @f{c}{2}$."},
   {q:"Conclure", r:"$@f{c}{2} = 4$, donc $c = 8$. Le trinôme est $2x^2 - 10x + 8$."},
   {q:"Vérification", r:"$2 × 1 - 10 + 8 = 0$ ✓ et $2 × 16 - 40 + 8 = 0$ ✓."}
  ]},
  {t:"piege", titre:"Le signe de la somme", x:"C'est $-@f{b}{a}$, avec un moins. Pour $x^2 - 5x + 6$, la somme des racines vaut $+5$ et non $-5$ : les racines sont 2 et 3."}
 ]}
],
exos:[
 {id:"sd1", niveau:1, type:"num", enonce:"Calculer le discriminant de $x^2 - 5x + 6$.",
  rep:1,
  diag:[{v:49, m:"Tu as calculé $25 + 24$. Mais ici $c = +6$ est positif, donc $-4ac = -4 × 1 × 6 = -24$. On **retire** 24."},
        {v:-1, m:"Erreur de signe : $b^2$ vaut toujours un nombre positif. $(-5)^2 = +25$, pas $-25$. Un carré ne peut pas être négatif."},
        {v:25, m:"Tu t'es arrêté à $b^2$. La formule complète est $Δ = b^2 - 4ac$ : il reste à retirer $4 × 1 × 6 = 24$."}],
  corr:["J'identifie : $a = 1$, $b = -5$, $c = 6$.","$Δ = b^2 - 4ac = (-5)^2 - 4 × 1 × 6$.","$(-5)^2 = 25$ et $4 × 1 × 6 = 24$.","$Δ = 25 - 24 = 1$."],
  indice:"$Δ = b^2 - 4ac$. Fais bien attention : $(-5)^2$ est positif."},

 {id:"sd2", niveau:1, type:"qcm", enonce:"L'équation $x^2 + x + 3 = 0$ admet :",
  choix:["aucune solution réelle","deux solutions","une solution double","trois solutions"], bonne:0,
  diag:["", "Le discriminant vaut $1 - 12 = -11$, il est **négatif** : la parabole ne coupe jamais l'axe des abscisses, donc pas de solution.",
        "Une solution double correspondrait à $Δ = 0$. Ici $Δ = -11 ≠ 0$.",
        "Une équation du second degré ne peut jamais avoir plus de deux solutions : c'est le degré qui limite le nombre de racines."],
  corr:["$a = 1$, $b = 1$, $c = 3$.","$Δ = 1^2 - 4 × 1 × 3 = 1 - 12 = -11$.","$Δ < 0$ : l'équation n'a aucune solution dans les réels."],
  indice:"Calcule $Δ$ et regarde uniquement son signe."},

 {id:"sd3", niveau:2, type:"qcm", enonce:"Les racines de $x^2 - 2x - 3$ sont $-1$ et $3$. Sa forme factorisée est :",
  choix:["$(x + 1)(x - 3)$","$(x - 1)(x + 3)$","$(x - 1)(x - 3)$","$(x + 1)(x + 3)$"], bonne:0,
  diag:["", "Tu as inversé les signes. La formule est $a(x - x_1)(x - x_2)$ : avec $x_1 = -1$ cela donne $(x - (-1)) = (x + 1)$.",
        "Tu as recopié les racines telles quelles. Mais la racine $-1$ donne le facteur $(x + 1)$, car $x - (-1) = x + 1$.",
        "Vérifie en remplaçant $x$ par 3 : $(3+1)(3+3) = 24 ≠ 0$. Or 3 est une racine, donc le produit devrait s'annuler."],
  corr:["Forme factorisée : $a(x - x_1)(x - x_2)$ avec $a = 1$.","Pour $x_1 = -1$ : le facteur est $x - (-1) = x + 1$.","Pour $x_2 = 3$ : le facteur est $x - 3$.","Donc $x^2 - 2x - 3 = (x + 1)(x - 3)$."],
  indice:"Chaque facteur doit s'annuler quand on remplace $x$ par la racine correspondante. Teste ta réponse !"},

 {id:"sd4", niveau:2, type:"num", enonce:"Quelle est la plus grande racine de $2x^2 - 7x + 3 = 0$ ?",
  rep:3,
  diag:[{v:0.5, m:"C'est bien une racine, mais c'est la **plus petite**. La question demande la plus grande : $x = 3$."},
        {v:1.75, m:"Tu as calculé $@f{7}{4} = -@f{b}{2a}$ : c'est l'abscisse du sommet, pas une racine. Il faut ajouter et retirer $@r{Δ}$."},
        {v:-3, m:"Erreur de signe : la formule commence par $-b$, et ici $b = -7$, donc $-b = +7$."}],
  corr:["$a = 2$, $b = -7$, $c = 3$.","$Δ = 49 - 4 × 2 × 3 = 49 - 24 = 25$, donc $@r{Δ} = 5$.","$x_1 = @f{7 - 5}{4} = @f{2}{4} = 0{,}5$ et $x_2 = @f{7 + 5}{4} = @f{12}{4} = 3$.","La plus grande racine est 3."],
  indice:"Calcule les deux racines avec $@f{-b ± @r{Δ}}{2a}$, puis compare-les."},

 {id:"sd5", niveau:2, type:"qcm", enonce:"Pour quelles valeurs de $x$ a-t-on $x^2 - 4 > 0$ ?",
  choix:["$x < -2$ ou $x > 2$","$-2 < x < 2$","$x > 2$ seulement","tous les réels"], bonne:0,
  diag:["", "Tu as pris l'intérieur. Comme $a = 1 > 0$, le trinôme est **positif à l'extérieur** des racines et négatif entre elles. Tu as décrit l'ensemble où l'expression est négative.",
        "Tu as oublié la moitié gauche. Pour $x = -3$ : $9 - 4 = 5 > 0$, donc $-3$ convient aussi. La parabole remonte des deux côtés.",
        "Pour $x = 0$ : $0 - 4 = -4$, qui n'est pas positif. Donc tous les réels ne conviennent pas."],
  corr:["$x^2 - 4 = 0$ donne $x^2 = 4$, donc $x = -2$ ou $x = 2$.","Ici $a = 1 > 0$ : le trinôme est positif à l'extérieur des racines.","$S = ]-∞ ; -2[ ∪ ]2 ; +∞[$."],
  indice:"Trouve d'abord les racines, puis applique : signe de $a$ à l'extérieur, signe contraire à l'intérieur."},

 {id:"sd6", niveau:3, type:"num", enonce:"La fonction $f(x) = x^2 - 6x + 5$ admet un minimum. Pour quelle valeur de $x$ est-il atteint ?",
  rep:3,
  diag:[{v:-3, m:"Erreur de signe : $α = -@f{b}{2a}$ avec $b = -6$, donc $α = -@f{-6}{2} = +3$. Le moins de la formule annule le moins de $b$."},
        {v:-4, m:"Tu as donné la valeur du minimum ($β = f(3) = -4$), pas l'endroit où il est atteint. La question porte sur $x$."},
        {v:6, m:"Tu as oublié de diviser par $2a$. La formule est $α = -@f{b}{2a}$, donc ici $@f{6}{2} = 3$."}],
  corr:["Le minimum est atteint au sommet, en $α = -@f{b}{2a}$.","$a = 1$ et $b = -6$.","$α = -@f{-6}{2 × 1} = @f{6}{2} = 3$.","Le minimum est atteint en $x = 3$ (et il vaut $f(3) = 9 - 18 + 5 = -4$)."],
  indice:"L'abscisse du sommet vaut $-@f{b}{2a}$. Attention au double signe moins."},

 {id:"sd7", niveau:3, type:"num", enonce:"Un rectangle a un périmètre de 20 cm. Quelle est son aire maximale, en cm² ?",
  rep:25, unite:"cm²",
  diag:[{v:100, m:"Tu as pris un côté de 10 cm. Mais si le périmètre vaut 20, alors longueur + largeur $= 10$, et non chaque côté $= 10$."},
        {v:24, m:"Tu es proche : $6 × 4 = 24$. Mais l'aire maximale est atteinte pour le **carré**, donc $5 × 5 = 25$."},
        {v:20, m:"Tu as repris le périmètre. L'aire est un produit de deux longueurs, pas la somme des quatre côtés."}],
  corr:["Si $x$ est la largeur, la longueur vaut $10 - x$ (car $2(x + L) = 20$).","L'aire est $A(x) = x(10 - x) = -x^2 + 10x$.","Ici $a = -1 < 0$ : la parabole a un maximum, atteint en $α = -@f{10}{-2} = 5$.","$A(5) = 5 × 5 = 25$ cm². C'est un carré de côté 5."],
  indice:"Appelle $x$ la largeur, exprime la longueur en fonction de $x$, puis écris l'aire. Tu obtiendras un trinôme."},

 {id:"sd8", niveau:3, type:"qcm", enonce:"Une parabole a pour équation $y = -2x^2 + 5x + 1$. Que peut-on affirmer ?",
  choix:["Elle est tournée vers le bas et admet un maximum","Elle est tournée vers le haut et admet un minimum","Elle ne coupe jamais l'axe des abscisses","Son sommet est en $x = 5$"], bonne:0,
  diag:["", "Le coefficient $a$ vaut $-2$, il est **négatif** : la parabole est tournée vers le bas. C'est toujours le signe de $a$ qui décide.",
        "$Δ = 25 - 4 × (-2) × 1 = 25 + 8 = 33 > 0$ : elle coupe l'axe en deux points.",
        "Le sommet est en $α = -@f{b}{2a} = -@f{5}{-4} = 1{,}25$. Le 5 est le coefficient $b$, pas l'abscisse du sommet."],
  corr:["Le sens d'ouverture ne dépend que de $a$.","Ici $a = -2 < 0$.","La parabole est donc tournée vers le bas, et son sommet est un maximum."],
  indice:"Un seul coefficient décide de l'orientation de la parabole. Lequel ?"},

 {id:"sd9", niveau:2, type:"num", enonce:"Les racines de $x^2 - 9x + 20$ sont deux entiers. Quelle est leur somme ?",
  rep:9,
  diag:[{v:-9, m:"Erreur de signe : la somme vaut $-@f{b}{a}$, et ici $b = -9$, donc $-@f{-9}{1} = +9$."},
        {v:20, m:"20 est le **produit** des racines ($@f{c}{a}$), pas leur somme."},
        {v:4, m:"4 est une des deux racines. La question demande leur somme, soit $4 + 5 = 9$."}],
  corr:["Relation : $x_1 + x_2 = -@f{b}{a}$.","Ici $a = 1$ et $b = -9$.","$-@f{-9}{1} = 9$.","(Les racines sont d'ailleurs 4 et 5, dont le produit vaut bien 20.)"],
  indice:"Pas besoin de calculer les racines : la somme se lit directement sur $a$ et $b$."},

 {id:"sd10", niveau:3, type:"num", enonce:"L'équation $3x^2 + bx - 12 = 0$ admet 2 comme racine. Quelle est l'autre racine ?",
  rep:-2,
  diag:[{v:2, m:"Ce serait une racine double, mais alors le produit vaudrait 4, or il vaut $@f{-12}{3} = -4$. L'autre racine est donc négative."},
        {v:-4, m:"Tu as pris directement le produit $-4$ comme réponse. Or le produit vaut $x_1 × x_2 = -4$ avec $x_1 = 2$, donc $x_2 = @f{-4}{2} = -2$."},
        {v:-6, m:"Tu as sans doute divisé $-12$ par 2. Il faut d'abord ramener le produit à $@f{c}{a} = @f{-12}{3} = -4$."}],
  corr:["Relation du produit : $x_1 × x_2 = @f{c}{a} = @f{-12}{3} = -4$.","On sait que $x_1 = 2$.","$2 × x_2 = -4$.","$x_2 = -2$."],
  indice:"Le produit des racines vaut $@f{c}{a}$. Une des deux racines est connue."}
]
}
]);
</script>
<script>
window.COURS = (window.COURS || []).concat([

/* =========================== 3. DÉRIVATION =========================== */
{
id:"derivee", n:3, titre:"Dérivation",
sous:"Mesurer la pente en un point",
desc:"Nombre dérivé, tangente, formules de dérivation et étude des variations.",
duree:45,
sections:[
 {titre:"L'idée : mesurer une pente", blocs:[
  {t:"idee", x:"La dérivée répond à une question simple : **à quelle vitesse la courbe monte-t-elle à cet endroit précis ?**"},
  {t:"p", x:"Sur une route, une pente de 10 % veut dire : quand j'avance de 100 m, je monte de 10 m. En maths, c'est pareil : on compare ce que $f(x)$ gagne en hauteur à ce que $x$ parcourt en largeur."},
  {t:"formule", titre:"Taux de variation entre deux points", x:"$@f{f(b) - f(a)}{b - a}$", note:"C'est la pente moyenne de la courbe entre $a$ et $b$."},
  {t:"p", x:"Le problème : cette pente est une **moyenne** sur un intervalle. Pour connaître la pente en un point précis, on rapproche $b$ de $a$ jusqu'à ce qu'ils se touchent presque. Le nombre vers lequel on tend s'appelle le **nombre dérivé**, noté $f'(a)$."},
  {t:"formule", titre:"Nombre dérivé", x:"$f'(a) = lim_{h → 0} @f{f(a + h) - f(a)}{h}$", note:"Autrement dit : la pente moyenne entre $a$ et un point tout proche, quand ce point se colle à $a$. En pratique on n'utilise presque jamais cette limite : on applique les formules du tableau plus bas."},
  {t:"astuce", titre:"Traduction en français", x:"$f'(a)$ est un nombre. C'est la pente de la courbe au point d'abscisse $a$. Positif = ça monte. Négatif = ça descend. Nul = c'est plat (sommet ou creux)."}
 ]},

 {titre:"La tangente", blocs:[
  {t:"p", x:"La **tangente** en un point est la droite qui « épouse » la courbe à cet endroit. Sa pente (son coefficient directeur) est exactement $f'(a)$."},
  {t:"formule", titre:"Équation de la tangente au point d'abscisse $a$", x:"$y = f'(a)(x - a) + f(a)$", note:"Trois ingrédients : le nombre dérivé $f'(a)$, l'abscisse $a$, et l'ordonnée $f(a)$."},
  {t:"exemple", titre:"Exemple guidé — écrire une tangente", enonce:"Soit $f(x) = x^2$. Déterminer l'équation de la tangente à la courbe au point d'abscisse $a = 3$.", etapes:[
   {q:"Calculer $f(a)$", r:"$f(3) = 3^2 = 9$. Le point de contact est donc $(3 ; 9)$."},
   {q:"Calculer la dérivée", r:"La dérivée de $x^2$ est $2x$, donc $f'(x) = 2x$."},
   {q:"Calculer $f'(a)$", r:"$f'(3) = 2 × 3 = 6$. La pente de la tangente vaut 6."},
   {q:"Assembler", r:"$y = 6(x - 3) + 9$, soit $y = 6x - 18 + 9 = 6x - 9$."},
   {q:"Contrôle", r:"Pour $x = 3$ : $y = 18 - 9 = 9$. La droite passe bien par le point de contact. ✓"}
  ]},
  {t:"piege", titre:"Ne pas confondre", x:"$f(a)$ est la **hauteur** de la courbe. $f'(a)$ est sa **pente**. Ce sont deux nombres différents, calculés avec deux expressions différentes. Beaucoup d'élèves remplacent $a$ dans la mauvaise formule."}
 ]},

 {titre:"Le tableau des dérivées à connaître", blocs:[
  {t:"tbl", head:["Fonction $f(x)$","Dérivée $f'(x)$","Exemple"], rows:[
   ["$k$ (un nombre)","$0$","$f(x)=7$ → $f'(x)=0$"],
   ["$x$","$1$","—"],
   ["$x^2$","$2x$","—"],
   ["$x^3$","$3x^2$","—"],
   ["$x^n$","$n x^{n-1}$","$x^5$ → $5x^4$"],
   ["$@f{1}{x}$","$-@f{1}{x^2}$","défini pour $x ≠ 0$"],
   ["$@r{x}$","$@f{1}{2@r{x}}$","défini pour $x > 0$"]
  ]},
  {t:"astuce", titre:"La règle de la puissance en une phrase", x:"L'exposant descend en facteur devant, et il diminue de 1. Exemple : $x^7$ → $7x^6$."},
  {t:"formule", titre:"Les opérations", x:"$(u + v)' = u' + v'$<br>$(k u)' = k u'$<br>$(uv)' = u'v + uv'$<br>$(@f{u}{v})' = @f{u'v - uv'}{v^2}$", note:"Le produit et le quotient sont au programme ; leur forme se retient par répétition."},
  {t:"exemple", titre:"Exemple guidé — dériver un polynôme", enonce:"Dériver $f(x) = 3x^3 - 5x^2 + 4x - 7$.", etapes:[
   {q:"Traiter chaque morceau séparément", r:"La dérivée d'une somme est la somme des dérivées : je dérive terme par terme."},
   {q:"$3x^3$", r:"L'exposant 3 descend : $3 × 3x^{2} = 9x^2$."},
   {q:"$-5x^2$", r:"$-5 × 2x = -10x$. Le signe moins reste."},
   {q:"$4x$", r:"La dérivée de $x$ est 1, donc celle de $4x$ est 4."},
   {q:"$-7$", r:"C'est une constante : sa dérivée est 0. Une constante ne fait pas varier la pente."},
   {q:"Réponse", r:"$f'(x) = 9x^2 - 10x + 4$."}
  ]},
  {t:"piege", titre:"L'erreur la plus fréquente", x:"Oublier que la dérivée d'un nombre seul est **zéro**, et recopier le $-7$ dans la réponse. Une constante décale la courbe vers le haut ou vers le bas sans jamais changer sa pente."},
  {t:"check", q:"Quelle est la dérivée de $f(x) = 4x^2 + 9$ ?",
   choix:["$8x$","$8x + 9$","$4x + 9$","$8x^2$"], bonne:0,
   expl:["Exact : $4 × 2x = 8x$, et la dérivée de 9 vaut 0.",
         "Tu as recopié le $+9$. Mais 9 est une constante, sa dérivée est 0 : elle disparaît.",
         "Tu as oublié de faire descendre l'exposant. La dérivée de $x^2$ est $2x$, donc celle de $4x^2$ est $8x$.",
         "Tu as multiplié le coefficient sans baisser l'exposant. Il doit passer de 2 à 1."]}
 ]},

 {titre:"Du signe de la dérivée aux variations", blocs:[
  {t:"idee", x:"C'est ici que la dérivée devient vraiment utile : **le signe de $f'$ donne les variations de $f$**, sans avoir besoin de tracer la courbe."},
  {t:"formule", titre:"Le lien fondamental", x:"$f' > 0$ sur un intervalle → $f$ est **croissante**<br>$f' < 0$ sur un intervalle → $f$ est **décroissante**<br>$f'$ s'annule en changeant de signe → **extremum** (max ou min)"},
  {t:"exemple", titre:"Exemple guidé — étude complète", enonce:"Étudier les variations de $f(x) = x^2 - 6x + 5$ sur ℝ.", etapes:[
   {q:"Dériver", r:"$f'(x) = 2x - 6$."},
   {q:"Chercher où la dérivée s'annule", r:"$2x - 6 = 0$ donne $2x = 6$, donc $x = 3$."},
   {q:"Étudier le signe de $f'$", r:"$2x - 6$ est une fonction affine croissante : elle est négative avant 3, positive après 3."},
   {q:"Traduire en variations", r:"$f$ est décroissante sur $]-∞ ; 3]$, puis croissante sur $[3 ; +∞[$."},
   {q:"Conclure", r:"$f$ admet un minimum en $x = 3$, qui vaut $f(3) = 9 - 18 + 5 = -4$."}
  ]},
  {t:"astuce", titre:"Méthode en 4 temps, toujours la même", x:"1. Je dérive. 2. Je résous $f'(x) = 0$. 3. J'étudie le signe de $f'$. 4. J'en déduis le tableau de variations. Cette suite d'étapes marche pour n'importe quelle fonction du programme."},
  {t:"plot", f:"x*x-6*x+5", xmin:-1, xmax:7, titre:"Courbe de $f(x) = x^2 - 6x + 5$", note:"Le creux se situe bien en $x = 3$, là où la dérivée s'annule."}
 ]},

 {titre:"Produits, quotients, inverses et racines", blocs:[
  {t:"p", x:"Jusqu'ici on n'a dérivé que des sommes. Voici les trois autres situations du programme, dans l'ordre où elles reviennent en contrôle."},
  {t:"formule", titre:"Produit", x:"$(uv)' = u'v + uv'$", note:"On dérive le premier en gardant le second, **plus** le premier en dérivant le second."},
  {t:"formule", titre:"Quotient", x:"$@f{u}{v}$ a pour dérivée $@f{u'v - uv'}{v^2}$", note:"Attention : un **moins** au numérateur, et l'ordre compte. Le dénominateur est mis au carré."},
  {t:"formule", titre:"Inverse et racine", x:"$@f{1}{x}$ → $-@f{1}{x^2}$ &nbsp;&nbsp;·&nbsp;&nbsp; $@r{x}$ → $@f{1}{2@r{x}}$", note:"L'inverse est défini pour $x ≠ 0$, la racine pour $x > 0$ (et sa dérivée pour $x > 0$ strictement)."},
  {t:"astuce", titre:"Retenir le quotient", x:"Le numérateur commence par $u'v$, comme le produit. Puis on **soustrait** $uv'$. Une phrase qui marche : « dérivée du haut fois le bas, moins le haut fois dérivée du bas, le tout sur le bas au carré »."},
  {t:"exemple", titre:"Exemple guidé — dériver un produit", enonce:"Dériver $f(x) = (3x + 1)(x^2 - 2)$.", etapes:[
   {q:"Nommer les deux morceaux", r:"$u = 3x + 1$ et $v = x^2 - 2$."},
   {q:"Dériver chacun", r:"$u' = 3$ et $v' = 2x$."},
   {q:"Appliquer la formule", r:"$f' = u'v + uv' = 3(x^2 - 2) + (3x + 1)(2x)$."},
   {q:"Développer", r:"$3x^2 - 6 + 6x^2 + 2x = 9x^2 + 2x - 6$."},
   {q:"Contrôle", r:"En développant d'abord : $f(x) = 3x^3 + x^2 - 6x - 2$, dont la dérivée est $9x^2 + 2x - 6$. Identique. ✓"}
  ]},
  {t:"exemple", titre:"Exemple guidé — dériver un quotient", enonce:"Dériver $f(x) = @f{2x + 1}{x - 3}$ sur $]3 ; +∞[$.", etapes:[
   {q:"Nommer", r:"$u = 2x + 1$ et $v = x - 3$."},
   {q:"Dériver", r:"$u' = 2$ et $v' = 1$."},
   {q:"Appliquer", r:"$f' = @f{u'v - uv'}{v^2} = @f{2(x - 3) - (2x + 1) × 1}{(x - 3)^2}$."},
   {q:"Développer le numérateur", r:"$2x - 6 - 2x - 1 = -7$. Attention au signe moins qui se distribue sur **tout** $(2x + 1)$."},
   {q:"Résultat", r:"$f'(x) = @f{-7}{(x - 3)^2}$. Le numérateur est négatif et le dénominateur toujours positif : la fonction est décroissante."}
  ]},
  {t:"piege", titre:"Le piège du signe dans le quotient", x:"Le moins porte sur le produit $uv'$ **en entier**. Écrire $2x - 6 - 2x + 1$ au lieu de $2x - 6 - 2x - 1$ est l'erreur la plus fréquente du chapitre. Mets des parenthèses avant de développer."},
  {t:"check", q:"Quelle est la dérivée de $f(x) = @f{1}{x}$ ?",
   choix:["$-@f{1}{x^2}$","$@f{1}{x^2}$","$-@f{1}{2x}$","$1$"], bonne:0,
   expl:["Exact. La fonction inverse est décroissante sur chaque intervalle, donc sa dérivée est bien négative.",
         "Il manque le signe moins. La courbe de $@f{1}{x}$ descend partout : sa dérivée ne peut pas être positive.",
         "Tu as confondu avec la dérivée de $@r{x}$, qui vaut $@f{1}{2@r{x}}$.",
         "La dérivée d'une constante vaut 1 ? Non : c'est la dérivée de $x$. Ici la variable est au dénominateur."]}
 ]}
],
exos:[
 {id:"de1", niveau:1, type:"qcm", enonce:"Quelle est la dérivée de $f(x) = 5x^3$ ?",
  choix:["$15x^2$","$5x^2$","$15x^3$","$3x^2$"], bonne:0,
  diag:["", "Tu as bien baissé l'exposant mais oublié de multiplier par 3 : le 3 descend devant, ce qui donne $5 × 3 = 15$.",
        "Tu as multiplié par 3 mais gardé l'exposant 3. L'exposant doit diminuer de 1, donc passer à 2.",
        "Tu as oublié le coefficient 5 de départ. Il reste en facteur : $5 × 3x^2$."],
  corr:["Règle : la dérivée de $x^n$ est $n x^{n-1}$.","Ici $n = 3$, donc la dérivée de $x^3$ est $3x^2$.","Le coefficient 5 reste multiplicateur : $f'(x) = 5 × 3x^2 = 15x^2$."],
  indice:"L'exposant descend devant et diminue de 1. Le coefficient devant reste."},

 {id:"de2", niveau:1, type:"num", enonce:"Soit $f(x) = x^2 - 4x$. Calculer $f'(1)$.",
  rep:-2,
  diag:[{v:2, m:"Erreur de signe. $f'(x) = 2x - 4$, donc $f'(1) = 2 - 4 = -2$. Le résultat est négatif : à cet endroit, la courbe descend."},
        {v:-3, m:"Tu as calculé $f(1) = 1 - 4 = -3$, la **hauteur** de la courbe, pas sa pente. Il faut d'abord dériver, puis remplacer."},
        {v:-4, m:"Tu as oublié le terme $2x$ de la dérivée. $f'(x) = 2x - 4$, il ne reste pas seulement $-4$."}],
  corr:["Je dérive : $f'(x) = 2x - 4$.","Je remplace $x$ par 1 : $f'(1) = 2 × 1 - 4$.","$2 - 4 = -2$."],
  indice:"Deux étapes dans l'ordre : dériver l'expression, **puis** remplacer $x$ par 1."},

 {id:"de3", niveau:2, type:"qcm", enonce:"La tangente à la courbe de $f$ au point d'abscisse 2 a pour équation $y = 3x - 1$. Que vaut $f'(2)$ ?",
  choix:["3","−1","5","2"], bonne:0,
  diag:["", "$-1$ est l'ordonnée à l'origine de la droite, pas sa pente. Le nombre dérivé est le **coefficient directeur**, c'est-à-dire le nombre devant $x$.",
        "5 est la valeur de $f(2)$ : $3 × 2 - 1 = 5$. C'est la hauteur du point de contact, pas la pente.",
        "2 est l'abscisse du point, donnée dans l'énoncé. On te demande la pente à cet endroit."],
  corr:["Le nombre dérivé $f'(a)$ est le coefficient directeur de la tangente en $a$.","La tangente s'écrit $y = 3x - 1$ : son coefficient directeur est 3.","Donc $f'(2) = 3$."],
  indice:"Dans $y = mx + p$, lequel des deux nombres représente la pente ?"},

 {id:"de4", niveau:2, type:"num", enonce:"Soit $f(x) = x^2$. La tangente au point d'abscisse 4 s'écrit $y = mx + p$. Que vaut $p$ ?",
  rep:-16,
  diag:[{v:16, m:"Erreur de signe. On a $y = 8(x - 4) + 16 = 8x - 32 + 16 = 8x - 16$. Le $-32$ l'emporte sur le $+16$."},
        {v:8, m:"8 est la valeur de $m$ (la pente), pas de $p$. La question porte sur l'ordonnée à l'origine."},
        {v:-32, m:"Tu as développé $8(x-4) = 8x - 32$ mais oublié d'ajouter $f(4) = 16$. La formule est $y = f'(a)(x-a) + f(a)$."}],
  corr:["$f(4) = 16$ et $f'(x) = 2x$ donc $f'(4) = 8$.","Tangente : $y = f'(4)(x - 4) + f(4) = 8(x - 4) + 16$.","Je développe : $8x - 32 + 16 = 8x - 16$.","Donc $m = 8$ et $p = -16$."],
  indice:"Écris d'abord la tangente sous la forme $f'(a)(x-a) + f(a)$, puis développe entièrement."},

 {id:"de5", niveau:2, type:"qcm", enonce:"On sait que $f'(x) < 0$ pour tout $x$ de l'intervalle $[0 ; 5]$. Que peut-on dire de $f$ sur cet intervalle ?",
  choix:["$f$ est décroissante","$f$ est croissante","$f$ est négative","$f$ est nulle"], bonne:0,
  diag:["", "Attention : c'est le signe de $f'$ qui donne le sens de variation, et un signe **négatif** correspond à une descente.",
        "Le signe de $f'$ ne dit rien du signe de $f$. Une fonction peut descendre tout en restant très au-dessus de zéro, par exemple de 100 à 50.",
        "Rien n'indique que $f$ vaut zéro. Une dérivée nulle donnerait une fonction constante, mais ici $f'$ est strictement négative."],
  corr:["Le lien : $f' < 0$ sur un intervalle signifie que la pente est négative partout.","Une pente négative correspond à une courbe qui descend.","Donc $f$ est décroissante sur $[0 ; 5]$."],
  indice:"Le signe de la dérivée donne le sens de variation, pas le signe de la fonction."},

 {id:"de6", niveau:3, type:"num", enonce:"Soit $f(x) = x^2 - 8x + 3$. En quelle valeur de $x$ la fonction atteint-elle son minimum ?",
  rep:4,
  diag:[{v:-4, m:"Erreur de signe en résolvant. $2x - 8 = 0$ donne $2x = 8$, donc $x = +4$."},
        {v:8, m:"Tu as oublié de diviser par 2. De $2x - 8 = 0$ on tire $2x = 8$, puis $x = 4$."},
        {v:-13, m:"Tu as donné la valeur du minimum, $f(4) = 16 - 32 + 3 = -13$. La question demande où il est atteint, donc un $x$."}],
  corr:["Je dérive : $f'(x) = 2x - 8$.","Je résous $f'(x) = 0$ : $2x = 8$, donc $x = 4$.","$f'$ est négative avant 4 et positive après : la fonction descend puis remonte.","Le minimum est donc atteint en $x = 4$."],
  indice:"Le minimum se trouve là où la dérivée s'annule. Résous $f'(x) = 0$."},

 {id:"de7", niveau:3, type:"qcm", enonce:"Quelle est la dérivée de $f(x) = (2x + 1)(x - 3)$ ?",
  choix:["$4x - 5$","$2$","$2x - 5$","$4x + 5$"], bonne:0,
  diag:["", "Tu as dérivé chaque facteur séparément et multiplié les dérivées. Cela ne fonctionne pas : la formule du produit est $u'v + uv'$, pas $u'v'$.",
        "Tu as oublié un terme. En développant, $f(x) = 2x^2 - 5x - 3$, donc $f'(x) = 4x - 5$.",
        "Erreur de signe : en développant, $-6x + x = -5x$, ce qui donne bien $-5$ et non $+5$."],
  corr:["Méthode la plus sûre : développer d'abord.","$(2x+1)(x-3) = 2x^2 - 6x + x - 3 = 2x^2 - 5x - 3$.","Je dérive : $f'(x) = 4x - 5$.","(On retrouve la même chose avec $u'v + uv' = 2(x-3) + (2x+1) = 4x - 5$.)"],
  indice:"Deux voies possibles : développer puis dériver, ou appliquer $(uv)' = u'v + uv'$. La première est moins risquée."},

 {id:"de8", niveau:3, type:"num", enonce:"Le bénéfice d'une entreprise, en milliers d'euros, est $B(x) = -x^2 + 40x - 100$ où $x$ est le nombre d'articles produits. Combien faut-il en produire pour un bénéfice maximal ?",
  rep:20, unite:"articles",
  diag:[{v:40, m:"Tu as oublié de diviser par 2. De $-2x + 40 = 0$ on tire $2x = 40$, donc $x = 20$."},
        {v:300, m:"Tu as donné le bénéfice maximal ($B(20) = 300$), pas la quantité à produire. Relis ce qui est demandé."},
        {v:-20, m:"Erreur de signe : $-2x + 40 = 0$ donne $-2x = -40$, puis $x = 20$. Une quantité produite ne peut pas être négative, c'est un bon signal d'alerte."}],
  corr:["Je dérive : $B'(x) = -2x + 40$.","Je résous $B'(x) = 0$ : $-2x = -40$, donc $x = 20$.","Le coefficient de $x^2$ est négatif : la parabole est tournée vers le bas, donc c'est bien un maximum.","Il faut produire 20 articles (le bénéfice vaut alors 300 milliers d'euros)."],
  indice:"Un maximum se trouve là où la dérivée s'annule. Dérive $B$ puis résous $B'(x) = 0$."},

 {id:"de9", niveau:2, type:"qcm", enonce:"Quelle est la dérivée de $f(x) = @f{1}{x}$ ?",
  choix:["$-@f{1}{x^2}$","$@f{1}{x^2}$","$-@f{1}{x}$","$@f{1}{2@r{x}}$"], bonne:0,
  diag:["", "Il manque le signe moins. Regarde la courbe de la fonction inverse : elle descend sur chaque intervalle, donc sa dérivée est négative partout.",

  corr:["C'est une dérivée usuelle à connaître par cœur.","$@f{1}{x}$ a pour dérivée $-@f{1}{x^2}$, pour $x ≠ 0$.","Le signe moins traduit le fait que la fonction inverse est décroissante."],
  indice:"La fonction inverse monte-t-elle ou descend-elle ? Le signe de la dérivée doit le refléter."},

 {id:"de10", niveau:3, type:"qcm", enonce:"Quelle est la dérivée de $f(x) = @f{x + 2}{x - 1}$ sur $]1 ; +∞[$ ?",
  choix:["$@f{-3}{(x-1)^2}$","$@f{3}{(x-1)^2}$","$@f{2x+1}{(x-1)^2}$","$1$"], bonne:0,
  diag:["", "Erreur de signe au numérateur : $1 × (x-1) - (x+2) × 1 = x - 1 - x - 2 = -3$. Le moins se distribue sur **tout** $(x + 2)$.",
        "Tu as additionné au lieu de soustraire. La formule est $@f{u'v - uv'}{v^2}$, avec un moins.",
        "Tu as dérivé le haut et le bas séparément, puis divisé. Cela ne fonctionne pas : $@f{u}{v}$ ne se dérive pas en $@f{u'}{v'}$."],
  corr:["$u = x + 2$ et $v = x - 1$, donc $u' = 1$ et $v' = 1$.","$f' = @f{u'v - uv'}{v^2} = @f{1 × (x-1) - (x+2) × 1}{(x-1)^2}$.","Numérateur : $x - 1 - x - 2 = -3$.","$f'(x) = @f{-3}{(x-1)^2}$ : négative, donc $f$ est décroissante."],
  indice:"Mets $(x + 2)$ entre parenthèses avant de distribuer le signe moins."},

 {id:"de11", niveau:3, type:"num", enonce:"Soit $f(x) = (2x - 1)(x + 3)$. Calculer $f'(1)$.",
  rep:9,
  diag:[{v:2, m:"Tu as dérivé chaque facteur puis multiplié les dérivées : $2 × 1 = 2$. La formule du produit est $u'v + uv'$, pas $u'v'$."},
        {v:4, m:"Tu as calculé $f(1) = 1 × 4 = 4$, la valeur de la fonction, pas sa pente."},
        {v:8, m:"Tu as oublié un des deux termes. $f'(x) = 2(x+3) + (2x-1) × 1$, donc $f'(1) = 8 + 1 = 9$."}],
  corr:["$u = 2x - 1$, $v = x + 3$, donc $u' = 2$ et $v' = 1$.","$f'(x) = 2(x + 3) + (2x - 1) × 1 = 2x + 6 + 2x - 1 = 4x + 5$.","$f'(1) = 4 + 5 = 9$.","(En développant d'abord : $f(x) = 2x^2 + 5x - 3$, donc $f'(x) = 4x + 5$. Même résultat.)"],
  indice:"Deux voies : développer puis dériver, ou appliquer $(uv)' = u'v + uv'$. Les deux doivent donner la même chose."}
]
},

/* ====================== 4. FONCTION EXPONENTIELLE ====================== */
{
id:"expo", n:4, titre:"Fonction exponentielle",
sous:"La croissance qui s'emballe",
desc:"Définition, propriétés algébriques, dérivée, variations et équations.",
duree:35,
sections:[
 {titre:"D'où vient cette fonction ?", blocs:[
  {t:"idee", x:"L'exponentielle, c'est la fonction qui **grandit proportionnellement à ce qu'elle vaut déjà**. Plus elle est grande, plus elle grandit vite."},
  {t:"p", x:"On la note $exp(x)$ ou, bien plus souvent, $e^{x}$. Le nombre $e$ vaut environ $2{,}718$. C'est une constante, comme $π$."},
  {t:"p", x:"Elle sert à décrire tout ce qui croît (ou décroît) par multiplication : une population de bactéries, un capital placé, la radioactivité qui diminue, la propagation d'une rumeur."},
  {t:"formule", titre:"Les valeurs à connaître par cœur", x:"$e^{0} = 1$ &nbsp;&nbsp;·&nbsp;&nbsp; $e^{1} = e ≈ 2{,}718$ &nbsp;&nbsp;·&nbsp;&nbsp; $e^{x} > 0$ pour tout $x$", note:"Le dernier point est capital : l'exponentielle n'est JAMAIS négative ni nulle."},
  {t:"piege", titre:"Le piège du $e^0$", x:"Beaucoup écrivent $e^{0} = 0$. C'est faux : **tout nombre élevé à la puissance 0 vaut 1**. Donc $e^{0} = 1$."},
  {t:"plot", f:"Math.exp(x)", xmin:-3, xmax:3, titre:"Courbe de $f(x) = e^{x}$", note:"Elle reste toujours au-dessus de l'axe des abscisses et s'envole très vite vers la droite."}
 ]},

 {titre:"Les règles de calcul", blocs:[
  {t:"p", x:"L'exponentielle transforme les additions en multiplications. C'est sa propriété centrale, et toutes les autres en découlent."},
  {t:"formule", titre:"Les quatre règles", x:"$e^{a} × e^{b} = e^{a+b}$<br>$@f{e^{a}}{e^{b}} = e^{a-b}$<br>$(e^{a})^{n} = e^{a n}$<br>$e^{-a} = @f{1}{e^{a}}$", note:"Somme en haut ↔ produit en bas. C'est le fil conducteur."},
  {t:"exemple", titre:"Exemple guidé — simplifier", enonce:"Simplifier $A = @f{e^{5} × e^{-2}}{e^{4}}$.", etapes:[
   {q:"Traiter le numérateur", r:"Un produit d'exponentielles : on additionne les exposants. $e^{5} × e^{-2} = e^{5 + (-2)} = e^{3}$."},
   {q:"Traiter la division", r:"Un quotient : on soustrait les exposants. $@f{e^{3}}{e^{4}} = e^{3 - 4} = e^{-1}$."},
   {q:"Écrire autrement si besoin", r:"$e^{-1} = @f{1}{e} ≈ 0{,}368$."},
   {q:"Le réflexe", r:"On ne calcule jamais les valeurs numériques en cours de route : on manipule uniquement les exposants."}
  ]},
  {t:"piege", titre:"Deux confusions à éviter", x:"$e^{a} × e^{b}$ ne vaut **pas** $e^{ab}$ : on additionne les exposants, on ne les multiplie pas.<br>$e^{a} + e^{b}$ ne se simplifie **pas** du tout. Une somme d'exponentielles reste une somme."},
  {t:"check", q:"Que vaut $e^{3} × e^{2}$ ?",
   choix:["$e^{5}$","$e^{6}$","$2e^{5}$","$e^{9}$"], bonne:0,
   expl:["Exact : quand on multiplie, on additionne les exposants, donc $3 + 2 = 5$.",
         "Tu as multiplié les exposants. La règle du produit dit d'**additionner** : $3 + 2 = 5$.",
         "Le coefficient 2 n'a pas lieu d'être : il n'y a pas de facteur devant, seulement des exposants à additionner.",
         "Tu as élevé au carré. La règle $(e^{a})^{n} = e^{an}$ concerne une puissance de puissance, pas un produit."]}
 ]},

 {titre:"Dérivée et variations", blocs:[
  {t:"idee", x:"L'exponentielle a une propriété unique : **elle est sa propre dérivée**. C'est même la définition qu'on en donne parfois."},
  {t:"formule", titre:"Dérivées à connaître", x:"$(e^{x})' = e^{x}$<br>$(e^{kx})' = k e^{kx}$<br>$(e^{u})' = u' e^{u}$", note:"Le facteur qui sort devant est la dérivée de l'exposant."},
  {t:"p", x:"Comme $e^{x} > 0$ pour tout $x$, la dérivée de $e^{x}$ est toujours strictement positive. Conclusion : **la fonction exponentielle est strictement croissante sur ℝ**, sans aucune exception."},
  {t:"exemple", titre:"Exemple guidé — dériver un produit avec exponentielle", enonce:"Dériver $f(x) = 3e^{2x}$.", etapes:[
   {q:"Repérer la forme", r:"C'est $3 × e^{u}$ avec $u = 2x$."},
   {q:"Dériver l'exposant", r:"$u' = 2$."},
   {q:"Appliquer la formule", r:"$(e^{u})' = u' e^{u} = 2e^{2x}$."},
   {q:"Ne pas oublier le coefficient", r:"$f'(x) = 3 × 2e^{2x} = 6e^{2x}$."}
  ]},
  {t:"piege", titre:"L'oubli du facteur", x:"Écrire $(e^{2x})' = e^{2x}$ est l'erreur numéro un. Il manque le 2 : la dérivée de l'exposant sort toujours en facteur."}
 ]},

 {titre:"Résoudre avec des exponentielles", blocs:[
  {t:"p", x:"L'exponentielle est strictement croissante, donc elle ne prend jamais deux fois la même valeur. Cela permet de « retirer » les exponentielles des deux côtés d'une égalité."},
  {t:"formule", titre:"Les deux règles de résolution", x:"$e^{A} = e^{B}$ &nbsp;⇔&nbsp; $A = B$<br>$e^{A} < e^{B}$ &nbsp;⇔&nbsp; $A < B$", note:"Le sens de l'inégalité est conservé, car la fonction est croissante."},
  {t:"exemple", titre:"Exemple guidé — une équation", enonce:"Résoudre $e^{2x - 1} = e^{x + 4}$.", etapes:[
   {q:"Comparer les exposants", r:"Les deux membres sont des exponentielles, donc on peut identifier les exposants : $2x - 1 = x + 4$."},
   {q:"Résoudre l'équation obtenue", r:"$2x - x = 4 + 1$, donc $x = 5$."},
   {q:"Conclure", r:"$S = {5}$."},
   {q:"Vérifier", r:"$2 × 5 - 1 = 9$ et $5 + 4 = 9$. Les deux exposants coïncident. ✓"}
  ]},
  {t:"astuce", titre:"Un cas qui revient souvent", x:"Une équation comme $e^{x} = -3$ n'a **aucune solution** : l'exponentielle est toujours strictement positive, elle ne peut jamais valoir un nombre négatif. Repérer cela fait gagner du temps et des points."}
 ]}
],
exos:[
 {id:"ex1", niveau:1, type:"qcm", enonce:"Que vaut $e^{0}$ ?",

  diag:["", "Tu as multiplié les exposants. Quand on **multiplie** deux exponentielles, on **additionne** les exposants : $4 + 3 = 7$.",

  corr:["Forme $e^{u}$ avec $u = 5x$.","$u' = 5$.","$(e^{u})' = u'e^{u} = 5e^{5x}$."],

]
}

{

sections:[

  {t:"p", x:"Pourquoi changer de degrés ? Parce qu'en radians, les formules de dérivation deviennent simples. C'est une convention de confort, pas une complication gratuite."},
  {t:"tbl", head:["Degrés","0°","30°","45°","60°","90°","180°","360°"], rows:[

  {t:"formule", titre:"Conversion", x:"degrés → radians : multiplier par $@f{π}{180}$<br>radians → degrés : multiplier par $@f{180}{π}$", note:"Repère fixe : $180° = π$ radians. Tout le reste se déduit par proportionnalité."},
  {t:"astuce", titre:"Mémoriser sans effort", x:"$π$ = un demi-tour. Donc $@f{π}{2}$ = un quart de tour (90°), $@f{π}{4}$ = un huitième de tour (45°). Le dénominateur indique en combien de parts on découpe le demi-tour."}
 ]},

 {titre:"Le cercle trigonométrique", blocs:[

  {t:"formule", titre:"Définition de cos et sin", x:"Si on tourne d'un angle $x$, on arrive au point de coordonnées $(cos x ; sin x)$", note:"Le cosinus est l'abscisse, le sinus est l'ordonnée. C'est tout."},
  {t:"astuce", titre:"Ne plus jamais les confondre", x:"**Cos** comme **c**ouché → horizontal → abscisse. **Sin** monte vers le ciel → vertical → ordonnée."},
  {t:"tbl", head:["$x$","0","$@f{π}{6}$","$@f{π}{4}$","$@f{π}{3}$","$@f{π}{2}$","$π$"], rows:[
   ["$cos x$","1","$@f{@r{3}}{2}$","$@f{@r{2}}{2}$","$@f{1}{2}$","0","−1"],
   ["$sin x$","0","$@f{1}{2}$","$@f{@r{2}}{2}$","$@f{@r{3}}{2}$","1","0"]
  ]},
  {t:"astuce", titre:"Astuce pour retenir ce tableau", x:"Écris sous la racine : 0, 1, 2, 3, 4 pour le sinus (dans l'ordre croissant), et divise par 2. Cela donne $@f{@r{0}}{2}, @f{@r{1}}{2}, @f{@r{2}}{2}, @f{@r{3}}{2}, @f{@r{4}}{2}$, soit $0, @f{1}{2}, @f{@r{2}}{2}, @f{@r{3}}{2}, 1$. Pour le cosinus, c'est la même chose à l'envers."},
  {t:"formule", titre:"La relation fondamentale", x:"$cos^2 x + sin^2 x = 1$", note:"C'est le théorème de Pythagore appliqué au cercle de rayon 1. Elle sert à retrouver l'un connaissant l'autre."},
  {t:"formule", titre:"Encadrement à connaître", x:"$-1 ≤ cos x ≤ 1$ &nbsp;&nbsp;et&nbsp;&nbsp; $-1 ≤ sin x ≤ 1$", note:"Une équation comme $cos x = 2$ n'a donc aucune solution."}
 ]},

 {titre:"Les angles associés", blocs:[

  {t:"formule", titre:"Les quatre symétries utiles", x:"$cos(-x) = cos x$ &nbsp;·&nbsp; $sin(-x) = -sin x$<br>$cos(π - x) = -cos x$ &nbsp;·&nbsp; $sin(π - x) = sin x$<br>$cos(π + x) = -cos x$ &nbsp;·&nbsp; $sin(π + x) = -sin x$", note:"Le cosinus est pair, le sinus est impair."},
  {t:"exemple", titre:"Exemple guidé — ramener à un angle connu", enonce:"Calculer $cos@f{2π}{3}$.", etapes:[

 ]},

 {titre:"Résoudre des équations trigonométriques", blocs:[
