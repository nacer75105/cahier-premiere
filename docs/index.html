      enonce:"Soit $f(x) = "+terme(a,"x^2")+"$. La tangente à la courbe au point d'abscisse $"+fr(k)+"$ s'écrit $y = mx + p$. Que vaut $p$ ?",
      diag:[{v:m, m:"$"+fr(m)+"$ est la valeur de $m$, le coefficient directeur. On demande $p$, l'ordonnée à l'origine."},
            {v:a*k*k, m:"Erreur de signe. On a $y = "+fr(m)+"(x − "+fr(k)+") + "+fr(a*k*k)+" = "+fr(m)+"x − "+fr(m*k)+" + "+fr(a*k*k)+"$, et $-"+fr(m*k)+" + "+fr(a*k*k)+" = "+fr(p)+"$."},
            {v:-m*k, m:"Tu as développé $"+fr(m)+"(x − "+fr(k)+")$ mais oublié d'ajouter $f("+fr(k)+") = "+fr(a*k*k)+"$. La formule est $y = f'(a)(x-a) + f(a)$."},
            {v:k, m:"$"+fr(k)+"$ est l'abscisse du point de contact, donnée dans l'énoncé, pas l'ordonnée à l'origine de la tangente."}],
      corr:["$f("+fr(k)+") = "+fr(a)+" × ("+fr(k)+")^2 = "+fr(a*k*k)+"$.",
            "$f'(x) = "+terme(2*a,"x")+"$, donc $f'("+fr(k)+") = "+fr(m)+"$.",
            "Tangente : $y = "+fr(m)+"(x − ("+fr(k)+")) + "+fr(a*k*k)+"$.",
            "Je développe : $y = "+fr(m)+"x − "+fr(m*k)+" + "+fr(a*k*k)+" = "+fr(m)+"x"+sg(p)+"$, donc $p = "+fr(p)+"$."],
      indice:"Écris $y = f'(a)(x - a) + f(a)$, puis développe complètement pour lire $p$." };
  }}
];

/* outils partagés avec le second jeu de générateurs (p6b) */
function shuffleUnique(t){
  var vu={}, out=[];
  t.forEach(function(x){ if(!vu[x]){ vu[x]=1; out.push(x); } });
  return A.shuffle(out);
}
window.GEN_OUTILS = { ri:ri, nz:nz, pick:pick, arr:arr, fr:fr, sg:sg,
                      terme:terme, apres:apres, trinome:trinome,
                      shuffleUnique:shuffleUnique };

/* le chapitre d'origine de chaque générateur du premier jeu */
G_SUITES.forEach(function(g){ g.chap = "suites"; });
G_SECOND.forEach(function(g){ g.chap = "second"; });
G_DERIV .forEach(function(g){ g.chap = "derivee"; });

var FAMILLES = [
  { id:"suites",  titre:"Suites numériques", gens:G_SUITES },
  { id:"second",  titre:"Second degré",      gens:G_SECOND },
  { id:"derivee", titre:"Dérivation",        gens:G_DERIV  }
];
function tousGens(){
  return G_SUITES.concat(G_SECOND).concat(G_DERIV).concat(window.GEN_SUP || []);
}
/* les générateurs rattachés à un chapitre donné */
function pourChapitre(id){
  return tousGens().filter(function(g){ return g.chap === id; });
}
function fabriquer(famId, niveauMax){
  var fam = FAMILLES.filter(function(f){return f.id===famId;})[0];
  var pool = famId==="mix" ? tousGens() : (fam ? fam.gens : pourChapitre(famId));
  if(!pool || !pool.length) pool = tousGens();
  if(niveauMax) {
    var f2 = pool.filter(function(g){ return g.niveau<=niveauMax; });
    if(f2.length) pool = f2;
  }
  var g = pick(pool);
  var e = g.gen();
  e.id = "gen-"+g.id+"-"+Math.random().toString(36).slice(2,8);
  e.source = g.titre;
  if(e.tol==null && e.type==="num") e.tol = 0.0005;
  // Selon les nombres tirés, un distracteur peut tomber pile sur la bonne
  // réponse (ex. b² − 4c = b² − 4ac quand a = 1). On l'écarte, ainsi que
  // les doublons, pour ne jamais qualifier d'erreur une réponse juste.
  if(e.type==="num" && e.diag){
    var vus=[];
    e.diag = e.diag.filter(function(d){
      if(!isFinite(d.v)) return false;
      if(Math.abs(d.v - e.rep) <= e.tol) return false;
      for(var i=0;i<vus.length;i++) if(Math.abs(d.v-vus[i]) <= e.tol) return false;
      vus.push(d.v); return true;
    });
  }
  return e;
}
window.GEN = { fabriquer:fabriquer, FAMILLES:FAMILLES,
               pourChapitre:pourChapitre, tous:tousGens };

/* =====================================================================
   Vue « Entraînement illimité »
   ===================================================================== */
var ee = A.S.entrain || {};
var ent = { famille:"suites", niveau:3, serie:0, exo:null,
            meilleure:ee.meilleure||0, faits:ee.faits||0, reussis:ee.reussis||0 };

window.VUE_ENTRAINEMENT = function(){
  var el=A.el, w=window.WRAPDIV();
  w.innerHTML =
    '<div class="eyebrow">Entraînement</div>'+
    '<h1 style="font-size:31px;margin:8px 0 8px">Exercices générés à la volée</h1>'+
    '<p class="muted" style="max-width:62ch">Les nombres changent à chaque tirage, mais les explications d\'erreur sont recalculées avec eux : tu auras toujours un diagnostic juste, pas un message générique.</p>';

  var reglages = el("div","card pad"); reglages.style.marginTop="22px";
  var r1 = el("div","row");
  r1.appendChild(el("span","small muted","Thème"));
  var seg = el("div","seg");
  window.GEN.FAMILLES.concat([{id:"mix",titre:"Mélange"}]).forEach(function(f){
    var b=el("button",null,f.titre);
    b.setAttribute("aria-pressed", ent.famille===f.id);
    b.onclick=function(){ ent.famille=f.id; ent.exo=null; window.RENDER(); };
    seg.appendChild(b);
  });
  r1.appendChild(seg);
  reglages.appendChild(r1);

  var r2 = el("div","row"); r2.style.marginTop="12px";
  r2.appendChild(el("span","small muted","Difficulté"));
  var seg2 = el("div","seg");
  [[1,"Bases"],[2,"Standard"],[3,"Tout"]].forEach(function(o){
    var b=el("button",null,o[1]);
    b.setAttribute("aria-pressed", ent.niveau===o[0]);
    b.onclick=function(){ ent.niveau=o[0]; ent.exo=null; window.RENDER(); };
    seg2.appendChild(b);
  });
  r2.appendChild(seg2);
  reglages.appendChild(r2);
  w.appendChild(reglages);

  var score = el("div","card pad"); score.style.marginTop="14px";
  score.innerHTML =
    '<div class="row" style="justify-content:space-between;align-items:flex-end">'+
      '<div class="stat"><div class="n">'+ent.serie+'</div><div class="l">Série en cours</div></div>'+
      '<div class="stat"><div class="n">'+ent.meilleure+'</div><div class="l">Meilleure série</div></div>'+
      '<div class="stat"><div class="n">'+(ent.faits?A.pct(ent.reussis,ent.faits):0)+'%</div><div class="l">Réussite ('+ent.faits+' faits)</div></div>'+
    '</div>';
  w.appendChild(score);

  if(!ent.exo) ent.exo = fabriquer(ent.famille, ent.niveau);
  var zone = el("div"); zone.style.marginTop="18px";
  zone.appendChild(bloc(ent.exo));
  w.appendChild(zone);

  function bloc(exo){
    var faux = { id:"entrainement", titre:"Entraînement", n:0, exos:[exo] };
    var holder = el("div");
    var lbl = el("div","row"); lbl.style.marginBottom="8px";
    lbl.innerHTML='<span class="tag b">'+A.esc(exo.source)+'</span>';
    holder.appendChild(lbl);
    holder.appendChild(window.EXONODE(faux, exo, null, function(ok, actions){
      ent.faits++;
      if(ok){ ent.reussis++; ent.serie++; if(ent.serie>ent.meilleure) ent.meilleure=ent.serie; }
      else ent.serie = 0;
      A.S.entrain = { meilleure:ent.meilleure, faits:ent.faits, reussis:ent.reussis };
      A.save();
      var suiv = el("button","btn pri sm","Exercice suivant →");
      suiv.onclick=function(){ ent.exo=fabriquer(ent.famille, ent.niveau); window.RENDER(); };
      actions.appendChild(suiv);
      var sc = document.querySelectorAll("#view .stat .n");
      if(sc[0]) sc[0].textContent=ent.serie;
      if(sc[1]) sc[1].textContent=ent.meilleure;
      if(sc[2]) sc[2].textContent=(ent.faits?A.pct(ent.reussis,ent.faits):0)+"%";
    }));
    return holder;
  }

  var passer = el("button","btn gho","Passer à un autre exercice");
  passer.style.marginTop="14px";
  passer.onclick=function(){ ent.serie=0; ent.exo=fabriquer(ent.famille, ent.niveau); window.RENDER(); };
  w.appendChild(passer);
  return w;
};
})();
</script>
<script>
/* =====================================================================
   Générateurs supplémentaires — un jeu par chapitre du programme.
   Même contrat que les premiers : les distracteurs et leurs explications
   sont recalculés avec les nombres tirés.
   ===================================================================== */
(function(){
"use strict";
var A = window.APP;
var H = window.GEN_OUTILS;   // helpers exposés par le premier fichier

var ri=H.ri, nz=H.nz, pick=H.pick, arr=H.arr, fr=H.fr, sg=H.sg, terme=H.terme, apres=H.apres;

/* ------------------------ EXPONENTIELLE ------------------------ */
var G_EXPO = [
{ id:"ex-simplifier", chap:"expo", titre:"Simplifier une expression", niveau:1, gen:function(){
    var a=ri(2,9), b=ri(2,9), c=ri(1,6), rep=a+b-c;
    var choix=H.shuffleUnique(["$e^{"+rep+"}$","$e^{"+(a+b+c)+"}$","$e^{"+(a*b-c)+"}$","$e^{"+(a-b+c)+"}$"]);
    var bonne=choix.indexOf("$e^{"+rep+"}$");
    return { type:"qcm", niveau:1, choix:choix, bonne:bonne,
      enonce:"Simplifier $@f{e^{"+a+"} × e^{"+b+"}}{e^{"+c+"}}$.",
      diag:choix.map(function(s,i){
        if(i===bonne) return "";
        if(s==="$e^{"+(a+b+c)+"}$") return "Tu as additionné les trois exposants. Le $e^{"+c+"}$ est au **dénominateur** : il faut le retrancher, pas l'ajouter.";
        if(s==="$e^{"+(a*b-c)+"}$") return "Tu as multiplié $"+a+"$ et $"+b+"$. Un **produit** d'exponentielles fait s'additionner les exposants, il ne les multiplie pas.";
        return "Erreur de signe dans le regroupement : c'est $"+a+" + "+b+" - "+c+"$, dans cet ordre.";
      }),
      corr:["**Numérateur d'abord.** $e^{"+a+"} × e^{"+b+"} = e^{"+a+"+"+b+"} = e^{"+(a+b)+"}$ : un produit additionne les exposants.",
            "**Puis la division.** $@f{e^{"+(a+b)+"}}{e^{"+c+"}} = e^{"+(a+b)+" - "+c+"}$ : un quotient les soustrait.",
            "**Calcul final.** $"+(a+b)+" - "+c+" = "+rep+"$, donc le résultat est $e^{"+rep+"}$.",
            "**À retenir.** On n'a jamais calculé la moindre valeur numérique : tout se joue sur les exposants."],
      indice:"Traite le numérateur en premier, puis applique la règle du quotient." };
  }},

{ id:"ex-derivee", chap:"expo", titre:"Dériver une exponentielle", niveau:2, gen:function(){
    var k=nz(-6,7), c=pick([1,2,3,5]);
    var enonce = "$f(x) = "+(c===1?"":fr(c))+"e^{"+terme(k,"x")+"}$";
    var rep = c*k;
    var choix=H.shuffleUnique([
      "$"+fr(rep)+"e^{"+terme(k,"x")+"}$",
      "$"+(c===1?"":fr(c))+"e^{"+terme(k,"x")+"}$",
      "$"+fr(c*k)+"x e^{"+terme(k,"x")+"}$",
      "$"+fr(c)+"e^{"+fr(k)+"}$"]);
    var bonne=choix.indexOf("$"+fr(rep)+"e^{"+terme(k,"x")+"}$");
    return { type:"qcm", niveau:2, choix:choix, bonne:bonne,
      enonce:"Dériver "+enonce+".",
      diag:choix.map(function(s,i){
        if(i===bonne) return "";
        if(s.indexOf("x e^")>=0) return "Tu as fait sortir $"+terme(k,"x")+"$ au lieu de sa dérivée. La règle est $(e^{u})' = u' e^{u}$ : c'est $u' = "+fr(k)+"$ qui sort, pas $u$.";
        if(s.indexOf("e^{"+fr(k)+"}")>=0) return "L'exposant ne devient pas une constante : il reste $"+terme(k,"x")+"$, avec le $x$.";
        return "Il manque le facteur $"+fr(k)+"$. En dérivant $e^{"+terme(k,"x")+"}$, la dérivée de l'exposant sort devant.";
      }),
      corr:["**Repérer la forme.** C'est $"+(c===1?"":fr(c))+"e^{u}$ avec $u = "+terme(k,"x")+"$.",
            "**Dériver l'exposant.** $u' = "+fr(k)+"$.",
            "**Appliquer $(e^{u})' = u' e^{u}$.** On obtient $"+fr(k)+"e^{"+terme(k,"x")+"}$.",
            "**Ne pas perdre le coefficient de départ.** $"+(c===1?"":fr(c)+" × ")+fr(k)+" = "+fr(rep)+"$, d'où $f'(x) = "+fr(rep)+"e^{"+terme(k,"x")+"}$."],
      indice:"La dérivée de l'exposant vient se placer en facteur devant l'exponentielle." };
  }},

{ id:"ex-equation", chap:"expo", titre:"Résoudre une équation", niveau:2, gen:function(){
    var a=pick([2,3,4,5]), b=nz(-8,8), c=nz(-9,9);
    // a x + b = c  ->  x = (c-b)/a, on force un entier
    var x=nz(-6,7); c = a*x + b;
    return { type:"num", niveau:2, rep:x,
      enonce:"Résoudre $e^{"+terme(a,"x")+sg(b)+"} = e^{"+fr(c)+"}$.",
      diag:[{v:c, m:"Tu t'es arrêté trop tôt. Après avoir identifié les exposants, il reste l'équation $"+terme(a,"x")+sg(b)+" = "+fr(c)+"$ à résoudre."},
            {v:arr((c+b)/a), m:"Erreur de signe : on retranche $"+fr(b)+"$ des deux côtés, on ne l'ajoute pas."},
            {v:arr(c-b), m:"Tu as oublié de diviser par $"+fr(a)+"$, le coefficient devant $x$."}],
      corr:["**Les deux membres sont des exponentielles.** Comme la fonction est strictement croissante, elle ne prend jamais deux fois la même valeur : on peut identifier les exposants.",
            "**Écrire l'équation obtenue.** $"+terme(a,"x")+sg(b)+" = "+fr(c)+"$.",
            "**Isoler le terme en $x$.** $"+terme(a,"x")+" = "+fr(c)+" - ("+fr(b)+") = "+fr(c-b)+"$.",
            "**Diviser.** $x = @f{"+fr(c-b)+"}{"+fr(a)+"} = "+fr(x)+"$.",
            "**Vérifier.** $"+fr(a)+" × "+fr(x)+sg(b)+" = "+fr(c)+"$ ✓ — les deux exposants coïncident."],
      indice:"$e^{A} = e^{B}$ équivaut à $A = B$. Écris l'équation sur les exposants, puis résous-la." };
  }}
];

/* ------------------------ TRIGONOMÉTRIE ------------------------ */
var VALEURS = [
  { a:"0",        cos:"1",            sin:"0" },
  { a:"@f{π}{6}", cos:"@f{@r{3}}{2}", sin:"@f{1}{2}" },
  { a:"@f{π}{4}", cos:"@f{@r{2}}{2}", sin:"@f{@r{2}}{2}" },
  { a:"@f{π}{3}", cos:"@f{1}{2}",     sin:"@f{@r{3}}{2}" },
  { a:"@f{π}{2}", cos:"0",            sin:"1" }
];
var G_TRIGO = [
{ id:"tr-valeur", chap:"trigo", titre:"Valeur remarquable", niveau:1, gen:function(){
    var v=pick(VALEURS.slice(1,4)), estCos=Math.random()<0.5;
    var bon = estCos ? v.cos : v.sin, autre = estCos ? v.sin : v.cos;
    var choix=H.shuffleUnique(["$"+bon+"$","$"+autre+"$","$-"+bon+"$","$@f{1}{@r{2}}$"]);
    var bonne=choix.indexOf("$"+bon+"$");
    var nom = estCos ? "cos" : "sin";
    return { type:"qcm", niveau:1, choix:choix, bonne:bonne,
      enonce:"Combien vaut $"+nom+" "+v.a+"$ ?",
      diag:choix.map(function(s,i){
        if(i===bonne) return "";
        if(s==="$"+autre+"$") return "Tu as lu l'autre ligne du tableau : c'est la valeur de $"+(estCos?"sin":"cos")+" "+v.a+"$. Rappel : **cos** comme **c**ouché, il se lit horizontalement.";
        if(s==="$-"+bon+"$") return "La valeur est bonne mais le signe est faux. L'angle $"+v.a+"$ est dans le **premier quart** du cercle : le cosinus et le sinus y sont tous deux positifs.";
        return "Cette écriture ne figure pas dans le tableau des valeurs remarquables.";
      }),
      corr:["**Situer l'angle.** $"+v.a+"$ appartient au premier quart du cercle, entre 0 et $@f{π}{2}$. Les deux coordonnées y sont positives.",
            "**Lire la bonne ligne.** Le "+nom+" se lit "+(estCos?"sur l'axe horizontal (abscisse)":"sur l'axe vertical (ordonnée)")+".",
            "**Résultat.** $"+nom+" "+v.a+" = "+bon+"$.",
            "**Repère de mémorisation.** Pour le sinus, les valeurs se suivent : $0$, $@f{1}{2}$, $@f{@r{2}}{2}$, $@f{@r{3}}{2}$, $1$. Pour le cosinus, c'est la même liste à l'envers."],
      indice:"Place l'angle sur le cercle : dans le premier quart, tout est positif." };
  }},

{ id:"tr-associe", chap:"trigo", titre:"Angle associé", niveau:2, gen:function(){
    var v=pick(VALEURS.slice(1,4)), estCos=Math.random()<0.5;
    var forme=pick(["pi-moins","pi-plus","moins"]);
    var base = estCos ? v.cos : v.sin;
    var signe;   // le signe du résultat
    if(forme==="moins")      signe = estCos ? 1 : -1;
    else if(forme==="pi-moins") signe = estCos ? -1 : 1;
    else                     signe = -1;
    var ecrit = forme==="moins" ? "-"+v.a : (forme==="pi-moins" ? "π - "+v.a : "π + "+v.a);
    var bon = (signe<0 ? "-" : "")+base;
    var choix=H.shuffleUnique(["$"+bon+"$","$"+(signe<0?"":"-")+base+"$",
      "$"+(estCos?v.sin:v.cos)+"$","$-"+(estCos?v.sin:v.cos)+"$"]);
    var bonne=choix.indexOf("$"+bon+"$");
    var nom = estCos?"cos":"sin";
    var expl = forme==="moins"
      ? "Le point $-x$ est le **reflet par rapport à l'axe horizontal** : l'abscisse (le cosinus) ne change pas, l'ordonnée (le sinus) change de signe."
      : (forme==="pi-moins"
        ? "Le point $π - x$ est le **reflet par rapport à l'axe vertical** : l'ordonnée (le sinus) ne change pas, l'abscisse (le cosinus) change de signe."
        : "Le point $π + x$ est le **point diamétralement opposé** : les deux coordonnées changent de signe.");
    return { type:"qcm", niveau:2, choix:choix, bonne:bonne,
      enonce:"Combien vaut $"+nom+"("+ecrit+")$, sachant que $"+nom+" "+v.a+" = "+base+"$ ?",
      diag:choix.map(function(s,i){
        if(i===bonne) return "";
        if(s==="$"+(signe<0?"":"-")+base+"$") return "La valeur est bonne, le signe est faux. "+expl;
        return "Tu as changé de fonction en route : la question porte sur le "+nom+", pas sur "+(estCos?"le sinus":"le cosinus")+".";
      }),
      corr:["**Placer les deux points sur le cercle.** Celui d'angle $"+v.a+"$, et celui d'angle $"+ecrit+"$.",
            "**Identifier la symétrie.** "+expl,
            "**En déduire le signe.** Le "+nom+" "+(signe<0?"change de signe":"est conservé")+" par cette symétrie.",
            "**Résultat.** $"+nom+"("+ecrit+") = "+bon+"$.",
            "**Méthode fiable.** Plutôt que de retenir six formules, trace le cercle et regarde dans quel quart tombe l'angle : les signes se lisent directement."],
      indice:"Dessine le cercle et place les deux points. La symétrie donne le signe." };
  }},

{ id:"tr-nbsol", chap:"trigo", titre:"Nombre de solutions", niveau:2, gen:function(){
    var cas=pick(["deux","aucune","une"]);
    var val = cas==="deux" ? pick(["@f{1}{2}","@f{@r{2}}{2}","-@f{1}{2}","0,8"])
            : (cas==="aucune" ? pick(["2","-1,5","3"]) : pick(["1","-1"]));
    var nom = pick(["cos","sin"]);
    var bon = cas==="deux" ? "Deux solutions" : (cas==="aucune" ? "Aucune solution" : "Une seule solution");
    var choix=["Deux solutions","Une seule solution","Aucune solution","Une infinité de solutions"];
    return { type:"qcm", niveau:2, choix:choix, bonne:choix.indexOf(bon),
      enonce:"Combien de solutions l'équation $"+nom+" x = "+val+"$ admet-elle sur $[0 ; 2π[$ ?",
      diag:choix.map(function(c){
        if(c===bon) return "";
        if(c==="Une infinité de solutions") return "Sur **un seul tour**, il ne peut pas y en avoir une infinité. C'est sur ℝ entier qu'il y en aurait une infinité, en ajoutant des tours.";
        if(cas==="aucune") return "Vérifie d'abord si la valeur est atteignable : le "+nom+" reste toujours entre $-1$ et $1$, et $"+val+"$ sort de cet intervalle.";
        if(cas==="une") return "C'est un cas limite : la valeur $"+val+"$ est atteinte en un **seul** point du cercle, là où la droite est tangente au cercle au lieu de le traverser.";
        return "Trace la droite correspondant à $"+val+"$ : elle traverse le cercle en deux points distincts, donc deux solutions.";
      }),
      corr:["**Vérifier que la valeur est atteignable.** Le "+nom+" est toujours compris entre $-1$ et $1$."+
              (cas==="aucune" ? " Or $"+val+"$ est en dehors : c'est déjà terminé, il n'y a aucune solution." : " Ici $"+val+"$ convient."),
            cas==="aucune" ? "**Conclusion.** $S = ∅$."
              : "**Tracer la droite.** "+(nom==="cos"?"Une verticale d'abscisse":"Une horizontale d'ordonnée")+" $"+val+"$.",
            cas==="aucune" ? "**À retenir.** Ce contrôle prend deux secondes et évite tout un calcul inutile."
              : "**Compter les intersections avec le cercle.** "+(cas==="une"
                  ? "La valeur est un extrême : la droite touche le cercle en un seul point, il y a une solution unique."
                  : "La droite traverse le cercle en deux points, donc deux solutions."),
            "**Le réflexe général.** Avant de chercher les valeurs, compte les points d'intersection sur un croquis. C'est ce qui évite l'oubli de la seconde solution."],
      indice:"Commence par vérifier que la valeur est bien entre $-1$ et $1$, puis compte les intersections." };
  }}
];

/* ------------------- PRODUIT SCALAIRE / REPÈRE ------------------- */
var G_GEO = [
{ id:"ps-calcul", chap:"scalaire", titre:"Produit scalaire en coordonnées", niveau:1, gen:function(){
    var x=nz(-6,7), y=nz(-6,7), x2=nz(-6,7), y2=nz(-6,7);
    var rep=x*x2+y*y2;
    return { type:"num", niveau:1, rep:rep,
      enonce:"Soit $@v{u}("+fr(x)+" ; "+fr(y)+")$ et $@v{v}("+fr(x2)+" ; "+fr(y2)+")$. Calculer $@v{u} · @v{v}$.",
      diag:[{v:x*x2, m:"Tu n'as fait que le produit des abscisses. Il faut aussi celui des ordonnées, $"+fr(y)+" × "+fr(y2)+" = "+fr(y*y2)+"$, puis additionner."},
            {v:x*x2-y*y2, m:"Tu as soustrait au lieu d'additionner. La formule est $x x' \\, + \\, y y'$ ; c'est le **déterminant** qui utilise une soustraction."},
            {v:x*y2+y*x2, m:"Tu as croisé les coordonnées. Le produit scalaire multiplie les abscisses **entre elles**, puis les ordonnées entre elles."},
            {v:x+y+x2+y2, m:"Tu as additionné les quatre nombres. La formule comporte deux multiplications avant l'addition."}],
      corr:["**Écrire la formule.** $@v{u} · @v{v} = x x' + y y'$.",
            "**Remplacer avec les parenthèses.** $("+fr(x)+") × ("+fr(x2)+") + ("+fr(y)+") × ("+fr(y2)+")$. Les parenthèses ne sont pas décoratives : elles protègent les signes.",
            "**Les deux produits.** $"+fr(x*x2)+"$ et $"+fr(y*y2)+"$.",
            "**Additionner.** $"+fr(x*x2)+sg(y*y2)+" = "+fr(rep)+"$.",
            "**Interpréter.** Le résultat est "+(rep>0?"positif : l'angle entre les vecteurs est aigu.":(rep<0?"négatif : l'angle est obtus.":"nul : les vecteurs sont perpendiculaires."))],
      indice:"Abscisses entre elles, ordonnées entre elles, puis on additionne les deux produits." };
  }},

{ id:"ps-ortho", chap:"scalaire", titre:"Trouver la valeur qui rend orthogonal", niveau:2, gen:function(){
    var a=nz(-6,7), b=nz(-6,7), c=nz(-6,7);
    // a*c + b*m = 0  ->  m = -a*c/b
    var m = arr(-a*c/b);
    return { type:"num", niveau:2, rep:m, tol:0.001,
      enonce:"Pour quelle valeur de $m$ les vecteurs $@v{u}("+fr(a)+" ; "+fr(b)+")$ et $@v{v}("+fr(c)+" ; m)$ sont-ils orthogonaux ?",
      diag:[{v:arr(a*c/b), m:"Erreur de signe. De $"+fr(a*c)+" + "+fr(b)+"m = 0$ on tire $"+fr(b)+"m = "+fr(-a*c)+"$, donc $m = "+fr(m)+"$."},
            {v:arr(-a*c), m:"Tu as oublié de diviser par $"+fr(b)+"$, le coefficient qui multiplie $m$."},
            {v:arr(-b/(a*c)), m:"Tu as divisé à l'envers. L'équation est $"+fr(b)+"m = "+fr(-a*c)+"$ : on divise le second membre par $"+fr(b)+"$."}],
      corr:["**Traduire « orthogonaux ».** Deux vecteurs sont orthogonaux exactement quand leur produit scalaire est nul.",
            "**Écrire le produit scalaire avec la lettre.** $("+fr(a)+") × ("+fr(c)+") + ("+fr(b)+") × m = "+fr(a*c)+sg(b)+"m$. La lettre se manipule comme un nombre.",
            "**Poser l'équation.** $"+fr(a*c)+sg(b)+"m = 0$.",
            "**Résoudre.** $"+fr(b)+"m = "+fr(-a*c)+"$, donc $m = @f{"+fr(-a*c)+"}{"+fr(b)+"} = "+fr(m)+"$.",
            "**Vérifier — toujours.** $("+fr(a)+")("+fr(c)+") + ("+fr(b)+")("+fr(m)+") = "+fr(a*c)+" + "+fr(arr(b*m))+" = 0$ ✓"],
      indice:"Écris le produit scalaire en laissant $m$, puis résous l'équation « = 0 »." };
  }},

{ id:"ps-longueur", chap:"scalaire", titre:"Longueur d'un segment", niveau:1, gen:function(){
    var trio=pick([[3,4,5],[6,8,10],[5,12,13],[8,15,17],[9,12,15],[7,24,25]]);
    var xa=ri(-4,4), ya=ri(-4,4);
    var sx=pick([1,-1]), sy=pick([1,-1]);
    var xb=xa+sx*trio[0], yb=ya+sy*trio[1];
    return { type:"num", niveau:1, rep:trio[2],
      enonce:"Soit $A("+fr(xa)+" ; "+fr(ya)+")$ et $B("+fr(xb)+" ; "+fr(yb)+")$. Calculer la longueur $AB$.",
      diag:[{v:trio[0]+trio[1], m:"Tu as additionné les deux écarts. La longueur n'est pas la somme des déplacements : il faut Pythagore, car le trajet direct est plus court que le trajet en deux temps."},
            {v:trio[2]*trio[2], m:"Tu t'es arrêté avant la racine carrée. $"+trio[0]+"^2 + "+trio[1]+"^2 = "+(trio[2]*trio[2])+"$, et $@r{"+(trio[2]*trio[2])+"} = "+trio[2]+"$."},
            {v:trio[0]*trio[1], m:"Tu as multiplié les écarts. La formule additionne leurs **carrés**, sous une racine."}],
      corr:["**Coordonnées du vecteur.** $@v{AB}("+fr(xb)+" - ("+fr(xa)+") ; "+fr(yb)+" - ("+fr(ya)+"))$, soit $("+fr(sx*trio[0])+" ; "+fr(sy*trio[1])+")$.",
            "**Appliquer la formule.** $AB = @r{x^2 + y^2}$ — c'est Pythagore : le déplacement horizontal, le vertical et le trajet direct forment un triangle rectangle.",
            "**Les carrés.** $("+fr(sx*trio[0])+")^2 = "+(trio[0]*trio[0])+"$ et $("+fr(sy*trio[1])+")^2 = "+(trio[1]*trio[1])+"$. Un carré est toujours positif, les signes disparaissent.",
            "**Somme puis racine.** $"+(trio[0]*trio[0])+" + "+(trio[1]*trio[1])+" = "+(trio[2]*trio[2])+"$, donc $AB = @r{"+(trio[2]*trio[2])+"} = "+trio[2]+"$.",
            "**Contrôle.** La longueur doit être plus grande que chaque écart pris seul ("+trio[0]+" et "+trio[1]+") et plus petite que leur somme ("+(trio[0]+trio[1])+"). ✓"],
      indice:"Trouve d'abord les coordonnées du vecteur, puis applique $@r{x^2 + y^2}$." };
  }},

{ id:"gr-normal", chap:"repere", titre:"Vecteur normal et directeur", niveau:1, gen:function(){
    var a=nz(-6,7), b=nz(-6,7), c=nz(-9,9);
    var demandeNormal = Math.random()<0.5;
    var bon = demandeNormal ? "$@v{n}("+fr(a)+" ; "+fr(b)+")$" : "$@v{u}("+fr(-b)+" ; "+fr(a)+")$";
    var choix=H.shuffleUnique([bon,
      demandeNormal ? "$@v{n}("+fr(-b)+" ; "+fr(a)+")$" : "$@v{u}("+fr(a)+" ; "+fr(b)+")$",
      "$("+fr(b)+" ; "+fr(a)+")$", "$("+fr(a)+" ; "+fr(c)+")$"]);
    var bonne=choix.indexOf(bon);
    return { type:"qcm", niveau:1, choix:choix, bonne:bonne,
      enonce:"Donner un vecteur "+(demandeNormal?"**normal**":"**directeur**")+" de la droite $"+terme(a,"x")+apres(b,"y")+sg(c)+" = 0$.",
      diag:choix.map(function(s,i){
        if(i===bonne) return "";
        if(s.indexOf(fr(c))>=0) return "Le $"+fr(c)+"$ est la constante de l'équation : elle place la droite, elle ne décrit pas sa direction. Seuls les coefficients de $x$ et $y$ entrent en jeu.";
        if(s==="$("+fr(b)+" ; "+fr(a)+")$") return "Tu as échangé les coefficients sans changer de signe. Il faut faire les deux : $(-b ; a)$.";
        return demandeNormal
          ? "C'est le vecteur **directeur**. Le normal, lui, se lit tel quel dans l'équation : $(a ; b)$, dans l'ordre."
          : "C'est le vecteur **normal**, celui qui se lit tel quel. Le directeur demande d'échanger et de changer un signe.";
      }),
      corr:["**Lire l'équation.** Elle est de la forme $ax + by + c = 0$ avec $a = "+fr(a)+"$, $b = "+fr(b)+"$.",
            "**Le vecteur normal se lit directement.** $@v{n}("+fr(a)+" ; "+fr(b)+")$ — les coefficients de $x$ et $y$, dans l'ordre. C'est le cadeau de l'équation cartésienne.",
            "**Le directeur demande une manipulation.** On échange les deux coordonnées et on change un signe : $@v{u}("+fr(-b)+" ; "+fr(a)+")$.",
            "**Vérifier qu'ils sont bien perpendiculaires.** $("+fr(a)+")("+fr(-b)+") + ("+fr(b)+")("+fr(a)+") = "+fr(-a*b)+" + "+fr(a*b)+" = 0$ ✓",
            "**Réponse : "+bon+"**. N'importe quel vecteur proportionnel conviendrait aussi."],
      indice:"Le normal se recopie tel quel. Le directeur : échange les deux nombres et change un signe." };
  }},

{ id:"gr-cercle", chap:"repere", titre:"Centre et rayon d'un cercle", niveau:2, gen:function(){
    var a=nz(-6,6), b=nz(-6,6), R=pick([2,3,4,5,6,7]);
    var demandeRayon = Math.random()<0.5;
    var rep = demandeRayon ? R : a;
    return { type:"num", niveau:2, rep:rep,
      enonce:"Le cercle a pour équation $(x "+(a<0?"+ "+fr(-a):"- "+fr(a))+")^2 + (y "+(b<0?"+ "+fr(-b):"- "+fr(b))+")^2 = "+fr(R*R)+"$. "+
             (demandeRayon ? "Quel est son **rayon** ?" : "Quelle est l'**abscisse de son centre** ?"),
      diag: demandeRayon
        ? [{v:R*R, m:"Tu as donné $R^2$. Le nombre à droite de l'égalité est le **carré** du rayon : il faut prendre la racine, $@r{"+fr(R*R)+"} = "+fr(R)+"$."},
           {v:arr(R*R/2), m:"Tu as divisé par 2. On passe de $R^2$ à $R$ par une racine carrée, pas par une division."}]
        : [{v:-a, m:"Erreur de signe. L'équation contient $(x "+(a<0?"+ "+fr(-a):"- "+fr(a))+")^2$, qu'on lit $(x - a)^2$ : le centre est ce qu'on **retranche**, donc $"+fr(a)+"$."},
           {v:b, m:"Tu as donné l'ordonnée du centre. La question porte sur l'abscisse, qui se lit dans la première parenthèse."},
           {v:R*R, m:"$"+fr(R*R)+"$ est le carré du rayon, pas une coordonnée du centre."}],
      corr:["**Forme de référence.** $(x - a)^2 + (y - b)^2 = R^2$, avec centre $Ω(a ; b)$ et rayon $R$.",
            "**Lire le centre.** On identifie ce qui est **retranché** : ici $(x "+(a<0?"+ "+fr(-a):"- "+fr(a))+")^2$ s'écrit $(x - ("+fr(a)+"))^2$, donc l'abscisse du centre vaut $"+fr(a)+"$. De même l'ordonnée vaut $"+fr(b)+"$.",
            "**Lire le rayon.** Le membre de droite vaut $R^2 = "+fr(R*R)+"$, donc $R = @r{"+fr(R*R)+"} = "+fr(R)+"$.",
            "**Réponse : "+fr(rep)+".**",
            "**Le piège des signes.** Un $+$ dans la parenthèse signale une coordonnée **négative**, et inversement. C'est l'erreur la plus fréquente sur les cercles."],
      indice: demandeRayon ? "Le nombre à droite est le carré du rayon." : "Le centre est ce qu'on retranche : attention aux signes." };
  }}
];

/* --------------------- PROBABILITÉS / VARIABLES --------------------- */
var G_PROBA = [
{ id:"pr-cond", chap:"proba", titre:"Probabilité conditionnelle", niveau:1, gen:function(){
    var pa=pick([0.2,0.25,0.4,0.5,0.6,0.8]);
    var pab=arr(pa*pick([0.25,0.5,0.75]));
    var rep=arr(pab/pa);
    return { type:"num", niveau:1, rep:rep, tol:0.005,
      enonce:"On donne $P(A) = "+fr(pa)+"$ et $P(A ∩ B) = "+fr(pab)+"$. Calculer $P_A(B)$.",
      diag:[{v:arr(pa/pab), m:"Tu as divisé à l'envers. Ce qu'on **sait déjà** — ici $A$ — va toujours au dénominateur."},
            {v:arr(pa*pab), m:"Tu as multiplié. La probabilité conditionnelle est un **quotient** : $@f{P(A ∩ B)}{P(A)}$."},
            {v:arr(pa-pab), m:"Tu as soustrait. C'est un rapport, pas une différence."}],
      corr:["**Écrire la formule.** $P_A(B) = @f{P(A ∩ B)}{P(A)}$.",
            "**Comprendre les deux étages.** En haut, les cas où **les deux** se produisent. En bas, le nouvel univers : ce dont on est déjà sûr.",
            "**Remplacer.** $@f{"+fr(pab)+"}{"+fr(pa)+"}$.",
            "**Calculer.** $P_A(B) = "+fr(rep)+"$.",
            "**Contrôle.** Le résultat doit être entre 0 et 1, et **plus grand** que $P(A ∩ B)$ — puisqu'on compte dans un univers plus petit. Ici "+fr(rep)+" > "+fr(pab)+" ✓"],
      indice:"L'événement écrit en indice est celui qu'on sait déjà : il passe au dénominateur." };
  }},

{ id:"pr-totales", chap:"proba", titre:"Probabilités totales", niveau:2, gen:function(){
    var pa=pick([0.3,0.4,0.6,0.7,0.75]);
    var p1=pick([0.02,0.05,0.1,0.2]), p2=pick([0.01,0.03,0.08,0.15]);
    var rep=arr(pa*p1+(1-pa)*p2);
    return { type:"num", niveau:2, rep:rep, tol:0.002,
      enonce:"Une usine fait fabriquer "+fr(pa*100)+" % de ses pièces par la machine A, le reste par B. "+
             fr(p1*100)+" % des pièces de A sont défectueuses, contre "+fr(p2*100)+" % de celles de B. "+
             "Quelle est la probabilité qu'une pièce prise au hasard soit défectueuse ?",
      diag:[{v:p1, m:"Tu as donné $P_A(D)$, la probabilité qu'une pièce **de A** soit défectueuse. La question porte sur l'ensemble de la production, les deux machines confondues."},
            {v:arr(pa*p1), m:"Tu n'as gardé que le chemin passant par A. Il faut aussi ajouter celui passant par B : $"+fr(arr(1-pa))+" × "+fr(p2)+"$."},
            {v:arr(p1+p2), m:"Tu as additionné les deux taux sans les pondérer. Chaque chemin doit d'abord être multiplié par la probabilité de la machine dont il part."}],
      corr:["**Nommer.** $A$ : la pièce vient de A. $B$ : elle vient de B. $D$ : elle est défectueuse.",
            "**Traduire l'énoncé.** $P(A) = "+fr(pa)+"$ et $P(B) = "+fr(arr(1-pa))+"$ (le reste). Puis $P_A(D) = "+fr(p1)+"$ et $P_B(D) = "+fr(p2)+"$ — ce sont des conditionnelles, car elles portent sur les pièces **de** chaque machine.",
            "**Premier chemin.** On multiplie le long de la branche : $"+fr(pa)+" × "+fr(p1)+" = "+fr(arr(pa*p1))+"$.",
            "**Second chemin.** $"+fr(arr(1-pa))+" × "+fr(p2)+" = "+fr(arr((1-pa)*p2))+"$.",
            "**Additionner les chemins.** Une pièce défectueuse vient soit de A, soit de B : $P(D) = "+fr(arr(pa*p1))+" + "+fr(arr((1-pa)*p2))+" = "+fr(rep)+"$.",
            "**Contrôle de bon sens.** Le résultat doit tomber entre les deux taux ("+fr(p2)+" et "+fr(p1)+"), plus proche de celui de la machine majoritaire. ✓"],
      indice:"Deux chemins mènent à une pièce défectueuse. Multiplie le long de chacun, puis additionne." };
  }},

{ id:"va-esperance", chap:"variable", titre:"Espérance", niveau:1, gen:function(){
    var v1=nz(-10,12), v2=nz(-10,12);
    while(v2===v1) v2=nz(-10,12);
    var p=pick([0.2,0.25,0.3,0.4,0.5,0.6,0.75,0.8]);
    var rep=arr(v1*p+v2*(1-p));
    return { type:"num", niveau:1, rep:rep, tol:0.005,
      enonce:"Une variable $X$ prend la valeur $"+fr(v1)+"$ avec une probabilité de $"+fr(p)+"$, et la valeur $"+fr(v2)+"$ avec une probabilité de $"+fr(arr(1-p))+"$. Calculer $E(X)$.",
      diag:[{v:arr((v1+v2)/2), m:"Tu as fait la moyenne simple des deux valeurs. L'espérance **pondère** chaque valeur par sa probabilité : celle qui arrive le plus souvent pèse plus lourd."},
            {v:v1+v2, m:"Tu as additionné les valeurs sans les pondérer. Chacune doit d'abord être multipliée par sa probabilité."},
            {v:1, m:"Tu as additionné les probabilités. Leur somme vaut toujours 1 : c'est un contrôle, pas le résultat."}],
      corr:["**Écrire la formule.** $E(X) = x_1 P(X = x_1) + x_2 P(X = x_2)$ : chaque valeur multipliée par son poids.",
            "**Remplacer.** $E(X) = "+fr(v1)+" × "+fr(p)+" + "+fr(v2)+" × "+fr(arr(1-p))+"$.",
            "**Les deux produits.** $"+fr(arr(v1*p))+"$ et $"+fr(arr(v2*(1-p)))+"$.",
            "**Additionner.** $E(X) = "+fr(rep)+"$.",
            "**Interpréter.** Sur un très grand nombre de répétitions, on obtient en moyenne $"+fr(rep)+"$ par tirage. Ce n'est pas une valeur atteignable — c'est un point d'équilibre."],
      indice:"Multiplie chaque valeur par sa probabilité, puis additionne les résultats." };
  }},

{ id:"va-manquante", chap:"variable", titre:"Probabilité manquante", niveau:1, gen:function(){
    var p1=pick([0.1,0.15,0.2,0.25,0.3]), p2=pick([0.2,0.3,0.35,0.4]);
    var rep=arr(1-p1-p2);
    return { type:"num", niveau:1, rep:rep, tol:0.005,
      enonce:"Une variable prend trois valeurs, avec les probabilités $"+fr(p1)+"$, $"+fr(p2)+"$ et $p$. Que vaut $p$ ?",
      diag:[{v:arr(1-p1), m:"Tu n'as retiré qu'une seule des deux probabilités connues. Il faut soustraire les deux."},
            {v:arr(p1+p2), m:"Tu as additionné les deux probabilités connues. Il faut retirer cette somme de 1 : $1 - "+fr(arr(p1+p2))+"$."},
            {v:1, m:"1 est la somme totale de toutes les probabilités, pas la valeur manquante."}],
      corr:["**La règle.** Dans une loi de probabilité, la somme de **toutes** les probabilités vaut exactement 1. C'est la traduction de « il se passe forcément quelque chose ».",
            "**Poser l'équation.** $"+fr(p1)+" + "+fr(p2)+" + p = 1$.",
            "**Regrouper le connu.** $"+fr(arr(p1+p2))+" + p = 1$.",
            "**Isoler.** $p = 1 - "+fr(arr(p1+p2))+" = "+fr(rep)+"$.",
            "**Contrôle.** La probabilité trouvée doit être entre 0 et 1. Ici $"+fr(rep)+"$ ✓ — une valeur négative aurait signalé une erreur de lecture de l'énoncé."],
      indice:"La somme de toute la ligne des probabilités vaut 1." };
  }}
];

/* -------------------------- ALGORITHMIQUE -------------------------- */
var G_ALGO = [
{ id:"al-for", chap:"algo", titre:"Suivre une boucle for", niveau:1, gen:function(){
    var u=ri(1,9), n=ri(2,5), op=pick(["+","*"]), k=op==="+" ? nz(-7,9) : pick([2,3]);
    var v=u, suite=[u];
    for(var i=0;i<n;i++){ v = op==="+" ? v+k : v*k; suite.push(v); }
    return { type:"num", niveau:1, rep:v,
      enonce:"Que vaut $u$ à la fin ?<br><b>u = "+u+"</b><br><b>for i in range("+n+"):</b><br>&nbsp;&nbsp;&nbsp;&nbsp;<b>u = u "+op+" "+k+"</b>",
      diag:[{v:suite[n-1], m:"Tu as fait "+(n-1)+" tours au lieu de "+n+". range("+n+") produit "+n+" valeurs : 0, 1, … , "+(n-1)+"."},
            {v:op==="+" ? u+k : u*k, m:"Tu n'as fait qu'un seul tour. La boucle en fait "+n+" : il faut répéter l'opération autant de fois."},
            {v:op==="+" ? u+k*(n+1) : u*Math.pow(k,n+1), m:"Tu as fait un tour de trop. range("+n+") s'arrête à "+(n-1)+", ce qui fait "+n+" passages."}],
      corr:["**Compter les tours.** range("+n+") produit "+n+" valeurs (0 à "+(n-1)+"), donc la boucle s'exécute **"+n+" fois**.",
            "**Dresser le tableau d'exécution.** C'est la méthode fiable : une ligne par tour."]
        .concat(suite.slice(1).map(function(val,i){
          return "Tour "+(i+1)+" : $u = "+fr(suite[i])+" "+(op==="+"?"+":"×")+" "+fr(k)+" = "+fr(val)+"$.";
        }))
        .concat(["**Résultat.** À la fin, $u$ vaut $"+fr(v)+"$.",
                 "**Lien avec le cours.** Cette boucle construit une suite "+(op==="+"?"arithmétique de raison "+fr(k):"géométrique de raison "+fr(k))+" : on retrouve $u_{"+n+"} = "+
                 (op==="+" ? fr(u)+" + "+n+" × "+fr(k) : fr(u)+" × "+fr(k)+"^{"+n+"}")+" = "+fr(v)+"$."]),
      indice:"Compte d'abord le nombre de tours, puis déroule-les un par un dans un tableau." };
  }},

{ id:"al-while", chap:"algo", titre:"Recherche de seuil", niveau:2, gen:function(){
    var u=pick([100,200,50,500,1000]), q=pick([2,3,1.5]), seuil=u*pick([5,8,10,20]);
    var v=u, n=0;
    while(v < seuil && n < 40){ v = v*q; n++; }
    return { type:"num", niveau:2, rep:n,
      enonce:"Que vaut $n$ à la fin ?<br><b>u = "+u+"</b><br><b>n = 0</b><br><b>while u &lt; "+seuil+":</b><br>"+
             "&nbsp;&nbsp;&nbsp;&nbsp;<b>u = u * "+fr(q)+"</b><br>&nbsp;&nbsp;&nbsp;&nbsp;<b>n = n + 1</b>",
      diag:[{v:n-1, m:"Tu t'es arrêté un tour trop tôt. La boucle continue **tant que** $u$ est strictement inférieur à "+seuil+" : il faut un tour de plus pour franchir le seuil."},
            {v:n+1, m:"Tu as fait un tour de trop. Dès que $u$ atteint ou dépasse "+seuil+", le test devient faux et on sort sans refaire de tour."},
            {v:arr(u*Math.pow(q,n)), m:"Tu as donné la valeur finale de $u$, pas celle de $n$. Le compteur $n$ compte les tours."}],
      corr:["**Comprendre ce que compte $n$.** Une seule ligne le modifie : $n = n + 1$, à l'intérieur de la boucle. Il compte donc les passages.",
            "**Comprendre la condition.** On répète **tant que** $u$ est strictement inférieur à "+seuil+". On teste avant chaque tour.",
            "**Dresser le tableau d'exécution.** Départ : $u = "+u+"$, $n = 0$."]
        .concat((function(){
          var l=[], vv=u, i;
          for(i=1;i<=n;i++){ vv=arr(vv*q); l.push("Tour "+i+" : $u = "+fr(vv)+"$, $n = "+i+"$"+(vv<seuil ? " — encore inférieur à "+seuil+", on continue." : " — **atteint ou dépasse "+seuil+"**, on sort.")); }
          return l;
        })())
        .concat(["**Résultat.** $n = "+n+"$.",
                 "**Attention au dernier tour.** À la sortie, $u$ a **déjà dépassé** le seuil. C'est normal : la boucle teste avant, agit, puis re-teste. La réponse est le premier rang où le dépassement a lieu."]),
      indice:"Fais un tableau à deux colonnes, $u$ et $n$, et arrête-toi dès que la condition devient fausse." };
  }}
];

/* ---------------- enregistrement auprès du moteur ---------------- */
window.GEN_SUP = G_EXPO.concat(G_TRIGO).concat(G_GEO).concat(G_PROBA).concat(G_ALGO);
})();
</script>
<script>
/* =====================================================================
   Mode contrôle : devoir chronométré, sans correction en direct,
   noté sur 20, avec bilan détaillé et alimentation des révisions.
   ===================================================================== */
(function(){
"use strict";
var A = window.APP, T=A.T, el=A.el, S=A.S;
var COURS = window.LES_COURS || [];

var ctl = {
  phase:"reglage",              // reglage | epreuve | bilan
  chapitres:[], nb:10, minutes:20, generes:true,
  questions:[], reponses:[], index:0,
  debut:0, fin:0, restant:0, tick:null, bilan:null
};

/* ---------------- constitution du sujet ---------------- */
function tirerSujet(){
  var pool = [];
  var choisis = ctl.chapitres.length ? ctl.chapitres : COURS.map(function(c){ return c.id; });
  COURS.forEach(function(c){
    if(choisis.indexOf(c.id)<0) return;
    c.exos.forEach(function(x){ pool.push({ chap:c, exo:x }); });
  });
  pool = A.shuffle(pool);
  var q = pool.slice(0, ctl.nb);
  // si le vivier ne suffit pas, on complète avec des exercices générés
  if(ctl.generes && window.GEN){
    var fams = ["suites","second","derivee"], i=0;
    while(q.length < ctl.nb){
      var e = window.GEN.fabriquer(fams[i++ % fams.length], 3);
      q.push({ chap:{ id:"controle", titre:e.source, n:0 }, exo:e });
    }
  }
  return A.shuffle(q).slice(0, ctl.nb);
}

/* ---------------- champ de réponse, sans verdict ---------------- */
function champ(item, idx){
  var exo = item.exo, box = el("div");
  if(exo.type==="qcm"){
    var ch = el("div","choices");
    exo.choix.forEach(function(c,i){
      var b = el("button","choice");
      b.innerHTML='<span class="k">'+"ABCD".charAt(i)+'</span><span>'+T(c)+'</span>';
      if(ctl.reponses[idx]===i) b.dataset.state="pick";
      b.onclick=function(){
        ctl.reponses[idx]=i;
        Array.prototype.forEach.call(ch.children,function(x){ delete x.dataset.state; });
        b.dataset.state="pick";
        majPastilles();
      };
      ch.appendChild(b);
    });
    box.appendChild(ch);
  } else {
    var row = el("div","inputRow");
    var inp = el("input","inp"); inp.type="text";
    inp.placeholder = exo.type==="num" ? "Ta réponse en chiffres…" : "Ta réponse…";
    inp.value = ctl.reponses[idx]==null ? "" : ctl.reponses[idx];
    inp.oninput=function(){ ctl.reponses[idx]=inp.value; majPastilles(); };
    row.appendChild(inp);
    if(exo.unite) row.appendChild(el("span","muted small",A.esc(exo.unite)));
    box.appendChild(row);
  }
  return box;
}
function repondu(i){
  var r = ctl.reponses[i];
  return !(r==null || (typeof r==="string" && !r.trim()));
}
function majPastilles(){
  var p = document.querySelectorAll(".qdot");
  Array.prototype.forEach.call(p,function(d,i){
    d.className = "qdot"+(i===ctl.index?" now":"")+(repondu(i)?" done":"");
  });
  var n = document.getElementById("nbRep");
  if(n) n.textContent = ctl.reponses.filter(function(_,i){ return repondu(i); }).length;
}

/* ---------------- correction ---------------- */
function corriger(){
  var res = ctl.questions.map(function(item,i){
    var exo=item.exo, r=ctl.reponses[i], ok=false, donne="—", diag="";
    if(!repondu(i)){
      diag = "Tu n'as pas répondu à cette question. Dans un devoir, mieux vaut toujours proposer quelque chose : une réponse fausse ne coûte pas plus qu'une case vide.";
    } else if(exo.type==="qcm"){
      donne = String(exo.choix[r]).replace(/\$/g,"");
      ok = (r===exo.bonne);
      if(!ok) diag = exo.diag[r] || "Ce choix ne convient pas.";
    } else if(exo.type==="num"){
      donne = String(r);
      var v=A.parseNum(r);
      ok = !isNaN(v) && Math.abs(v-exo.rep) <= (exo.tol!=null?exo.tol:0.0005);
      if(!ok) diag = window.DIAGNOSTIC(exo, r);
    } else {
      donne = String(r);
      var n=A.norm(r);
      ok = exo.reps.some(function(x){ return A.norm(x)===n || n.indexOf(A.norm(x))>=0; });
      if(!ok) diag = window.DIAGNOSTIC(exo, r);
    }
    if(item.chap.id!=="controle") A.srsMaj(item.chap.id, exo.id, ok, { titre:item.chap.titre });
    return { item:item, ok:ok, donne:donne, diag:diag, repondu:repondu(i) };
  });
  var justes = res.filter(function(r){ return r.ok; }).length;
  var note = Math.round(20*justes/res.length*2)/2;   // au demi-point
  var temps = Date.now()-ctl.debut;
  S.controles.unshift({ date:A.nowISO(), score:justes, total:res.length,
                        note:note, temps:temps,
                        chapitres:ctl.chapitres.slice() });
  S.controles = S.controles.slice(0,25);
  A.save();
  ctl.bilan = { res:res, justes:justes, note:note, temps:temps };
  ctl.phase = "bilan";
  if(ctl.tick){ clearInterval(ctl.tick); ctl.tick=null; }
  window.RENDER();
}

/* ---------------- chronomètre ---------------- */
function lancerChrono(){
  if(ctl.tick) clearInterval(ctl.tick);
  ctl.tick = setInterval(function(){
    ctl.restant = ctl.fin - Date.now();
    var e = document.getElementById("chrono");
    if(e){
      e.textContent = A.chrono(ctl.restant);
      e.className = "chronoBox"+(ctl.restant < 120000 ? " urgent" : "");
    }
    if(ctl.restant<=0){ clearInterval(ctl.tick); ctl.tick=null; A.toast("Temps écoulé."); corriger(); }
  },1000);
}

/* =====================================================================
   Vue
   ===================================================================== */
window.VUE_CONTROLE = function(){
  if(ctl.phase==="epreuve") return vueEpreuve();
  if(ctl.phase==="bilan")   return vueBilan();
  return vueReglage();
};

function vueReglage(){
  var w = window.WRAPDIV();
  w.innerHTML =
    '<div class="eyebrow">Mode contrôle</div>'+
    '<h1 style="font-size:31px;margin:8px 0 8px">Se mettre en conditions de devoir</h1>'+
    '<p class="muted" style="max-width:62ch">Pas de correction en direct, pas d\'indice, un chronomètre qui tourne. Tu peux naviguer entre les questions et revenir sur tes réponses. La correction complète arrive à la fin, question par question.</p>';

  var c1 = el("div","card pad"); c1.style.marginTop="22px";
  c1.innerHTML = '<div class="eyebrow" style="margin-bottom:12px">Sur quoi porte le contrôle ?</div>';
  var chips = el("div","row");
  COURS.forEach(function(c){
    var on = ctl.chapitres.indexOf(c.id)>=0;
    var b = el("button","btn sm"+(on?" pri":""), c.n+". "+c.titre);
    b.onclick=function(){
      var i=ctl.chapitres.indexOf(c.id);
      if(i>=0) ctl.chapitres.splice(i,1); else ctl.chapitres.push(c.id);
      window.RENDER();
    };
    chips.appendChild(b);
  });
  c1.appendChild(chips);
  c1.appendChild(el("p","small muted",
    ctl.chapitres.length ? "" : "Aucun chapitre sélectionné : le contrôle piochera dans tout le programme."));
  w.appendChild(c1);

  var c2 = el("div","card pad"); c2.style.marginTop="14px";
  var r1 = el("div","row");
  r1.appendChild(el("span","small muted","Nombre de questions"));
  var s1 = el("div","seg");
  [8,10,15,20].forEach(function(n){
    var b=el("button",null,String(n));
    b.setAttribute("aria-pressed", ctl.nb===n);
    b.onclick=function(){ ctl.nb=n; window.RENDER(); };
    s1.appendChild(b);
  });
  r1.appendChild(s1); c2.appendChild(r1);

  var r2 = el("div","row"); r2.style.marginTop="12px";
  r2.appendChild(el("span","small muted","Durée"));
  var s2 = el("div","seg");
  [10,20,30,45].forEach(function(n){
    var b=el("button",null,n+" min");
    b.setAttribute("aria-pressed", ctl.minutes===n);
    b.onclick=function(){ ctl.minutes=n; window.RENDER(); };
    s2.appendChild(b);
  });
  r2.appendChild(s2); c2.appendChild(r2);

  var r3 = el("div","row"); r3.style.marginTop="14px";
  var bg = el("button","btn sm"+(ctl.generes?" pri":""), ctl.generes?"✓ Compléter avec des questions générées":"Compléter avec des questions générées");
  bg.onclick=function(){ ctl.generes=!ctl.generes; window.RENDER(); };
  r3.appendChild(bg);
  c2.appendChild(r3);
  w.appendChild(c2);

  var go = el("button","btn pri","Commencer le contrôle");
  go.style.cssText="margin-top:20px;font-size:16px;padding:12px 22px";
  go.onclick=function(){
    ctl.questions = tirerSujet();
    if(!ctl.questions.length){ A.toast("Aucune question disponible avec ces réglages."); return; }
    ctl.reponses = ctl.questions.map(function(){ return null; });
    ctl.index=0; ctl.phase="epreuve";
    ctl.debut=Date.now(); ctl.fin=ctl.debut+ctl.minutes*60000; ctl.restant=ctl.minutes*60000;
    window.RENDER(); lancerChrono();
  };
  w.appendChild(go);

  if(S.controles && S.controles.length){
    var h=el("div","secHead");
    h.innerHTML='<span class="n">◷</span><h2>Tes contrôles précédents</h2>';
    w.appendChild(h);
    var g=el("div","grid"); g.style.marginTop="16px";
    S.controles.slice(0,8).forEach(function(c){
      var d=new Date(c.date);
      var row=el("div","row");
      row.style.cssText="justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:10px 14px";
      row.innerHTML='<div><div style="font-weight:600">'+c.note+' / 20</div>'+
        '<div class="small muted">'+c.score+' bonnes réponses sur '+c.total+' · '+A.duree(c.temps)+'</div></div>'+
        '<span class="pill">'+d.toLocaleDateString("fr-FR")+'</span>';
      g.appendChild(row);
    });
    w.appendChild(g);
  }
  return w;
}

function vueEpreuve(){
  var w = window.WRAPDIV();
  var item = ctl.questions[ctl.index];

  /* bandeau : chrono + avancement */
  var bar = el("div","card pad");
  bar.style.cssText="position:sticky;top:66px;z-index:20;margin-bottom:18px";
  var top = el("div","row"); top.style.justifyContent="space-between";
  top.innerHTML =
    '<div><div class="eyebrow">Question '+(ctl.index+1)+' sur '+ctl.questions.length+'</div>'+
    '<div class="small muted"><span id="nbRep">0</span> réponse(s) donnée(s)</div></div>'+
    '<div id="chrono" class="chronoBox">'+A.chrono(ctl.restant)+'</div>';
  bar.appendChild(top);
  var dots = el("div","qdots");
  ctl.questions.forEach(function(_,i){
    var d = el("button","qdot"+(i===ctl.index?" now":"")+(repondu(i)?" done":""));
    d.textContent = i+1;
    d.setAttribute("aria-label","Aller à la question "+(i+1));
    d.onclick=function(){ ctl.index=i; window.RENDER(); };
    dots.appendChild(d);
  });
  bar.appendChild(dots);
  w.appendChild(bar);

  var card = el("div","card pad");
  var tag = el("div","exoTop");
  tag.innerHTML = '<span class="tag b">'+A.esc(item.chap.titre)+'</span>'+
                  '<span class="pill">Niveau '+(item.exo.niveau||1)+'</span>';
  card.appendChild(tag);
  card.appendChild(el("div","enonce", T(item.exo.enonce)));
  card.appendChild(champ(item, ctl.index));
  w.appendChild(card);

  var nav = el("div","row"); nav.style.marginTop="18px";
  var prev = el("button","btn","← Précédente");
  prev.disabled = ctl.index===0;
  prev.onclick=function(){ ctl.index--; window.RENDER(); };
  var next = el("button","btn pri","Suivante →");
  next.disabled = ctl.index===ctl.questions.length-1;
  next.onclick=function(){ ctl.index++; window.RENDER(); };
  nav.appendChild(prev); nav.appendChild(next);
  var sp = el("div"); sp.style.flex="1"; nav.appendChild(sp);
  var fin = el("button","btn","Terminer et corriger");
  var prevenu = false;
  fin.onclick=function(){
    var manquantes = ctl.questions.filter(function(_,i){ return !repondu(i); }).length;
    if(manquantes && !prevenu){
      prevenu = true;
      fin.className = "btn pri";
      fin.textContent = "Terminer quand même";
      A.toast(A.plural(manquantes,"question")+" sans réponse. Reclique pour valider.");
      return;
    }
    corriger();
  };
  nav.appendChild(fin);
  w.appendChild(nav);

  setTimeout(majPastilles,0);
  return w;
}

function vueBilan(){
  var w = window.WRAPDIV();
  var b = ctl.bilan;
  var mention = b.note>=16?"Très bien":(b.note>=14?"Bien":(b.note>=12?"Assez bien":(b.note>=10?"Passable":"À retravailler")));
  var classe = b.note>=12?"v":(b.note>=10?"a":"r");

  w.innerHTML = '<div class="eyebrow">Contrôle terminé</div>'+
    '<h1 style="font-size:31px;margin:8px 0 14px">Ton bilan</h1>';

  var res = el("div","card pad");
  res.innerHTML =
    '<div class="row" style="justify-content:space-between;align-items:flex-end">'+
      '<div class="stat"><div class="n">'+b.note+' <span style="font-size:19px;color:var(--ink3)">/ 20</span></div>'+
        '<div class="l">'+mention+'</div></div>'+
      '<div class="stat"><div class="n">'+b.justes+' <span style="font-size:17px;color:var(--ink3)">/ '+b.res.length+'</span></div><div class="l">Bonnes réponses</div></div>'+
      '<div class="stat"><div class="n" style="font-size:22px">'+A.duree(b.temps)+'</div><div class="l">Temps utilisé</div></div>'+
    '</div>'+
    '<div class="bar '+(classe==="v"?"v":"")+'" style="margin-top:16px"><i style="width:'+(b.note/20*100)+'%"></i></div>';
  w.appendChild(res);

  var rates = b.res.filter(function(r){ return !r.ok && r.item.chap.id!=="controle"; }).length;
  if(rates){
    w.appendChild(el("div","callout co-idee",
      '<div class="ct">Ajouté à tes révisions</div><p>'+
      A.plural(rates,"question")+' sont parties dans <b>À revoir</b>. Elles te reviendront demain, puis de plus en plus espacées à chaque réussite.</p>'));
  }

  var h=el("div","secHead");
  h.innerHTML='<span class="n">→</span><h2>Question par question</h2>';
  w.appendChild(h);

  var g = el("div","grid"); g.style.marginTop="18px";
  b.res.forEach(function(r,i){
    var exo=r.item.exo;
    var card = el("div","card pad");
    var head = el("div","exoTop");
    head.innerHTML = '<span class="pill">Question '+(i+1)+'</span>'+
      (r.ok?'<span class="tag v">✓ juste</span>'
           :(r.repondu?'<span class="tag r">✗ faux</span>':'<span class="tag a">sans réponse</span>'))+
      '<span class="small muted">'+A.esc(r.item.chap.titre)+'</span>';
    card.appendChild(head);
    card.appendChild(el("div","enonce", T(exo.enonce)));

    var bonne = exo.type==="qcm" ? String(exo.choix[exo.bonne])
              : (exo.type==="num" ? String(exo.rep).replace(".",",") : String(exo.reps[0]));
    var rep = el("div","row"); rep.style.marginTop="14px";
    rep.innerHTML =
      '<div style="flex:1;min-width:150px"><div class="eyebrow">Ta réponse</div>'+
        '<div class="m" style="font-size:17px;color:var(--'+(r.ok?"vert":"rouge")+')">'+A.esc(r.donne)+'</div></div>'+
      '<div style="flex:1;min-width:150px"><div class="eyebrow">Attendu</div>'+
        '<div class="m" style="font-size:17px">'+T("$"+bonne.replace(/\$/g,"")+"$")+'</div></div>';
    card.appendChild(rep);

    if(!r.ok){
      var fb = el("div","fb bad");
      fb.innerHTML='<div class="fbt">Ce qui s’est passé</div><p>'+T(r.diag)+'</p>';
      card.appendChild(fb);
      var corr = el("div","corr");
      corr.innerHTML='<div class="ct">La méthode, étape par étape</div><ol>'+
        exo.corr.map(function(s){ return '<li>'+T(s)+'</li>'; }).join("")+'</ol>';
      card.appendChild(corr);
    }
    g.appendChild(card);
  });
  w.appendChild(g);

  var act = el("div","row"); act.style.marginTop="24px";
  var re = el("button","btn pri","Refaire un contrôle");
  re.onclick=function(){ ctl.phase="reglage"; ctl.bilan=null; window.RENDER(); };
  var rev = el("button","btn","Aller réviser les ratés");
  rev.onclick=function(){ ctl.phase="reglage"; ctl.bilan=null; window.GOTO({page:"revoir"}); };
  act.appendChild(re); act.appendChild(rev);
  w.appendChild(act);
  return w;
}
})();
</script>

<script>
/* =====================================================================
   Tableau de bord — ce que les données déjà enregistrées permettent de
   dire, sans rien ajouter au suivi : progression par chapitre, activité
   des trente derniers jours, réussite du premier coup, contrôles passés.
   ===================================================================== */
(function(){
"use strict";
var A = window.APP, el = A.el, S = A.S;

function chapitres(){ return window.LES_COURS || []; }

/* --- statistiques d'un chapitre --- */
function bilanChapitre(c){
  var st = A.chapState(c.id), e = st.exos || {};
  var tentes = 0, reussis = 0, premierCoup = 0;
  c.exos.forEach(function(x){
    var r = e[x.id];
    if(!r) return;
    tentes++;
    if(r.ok){ reussis++; if(r.tries === 1) premierCoup++; }
  });
  var cartes = 0;
  for(var k in S.srs) if(S.srs[k].chapId === c.id) cartes++;
  return {
    lu: st.lu.length, sections: c.sections.length,
    tentes: tentes, total: c.exos.length,
    reussis: reussis, premierCoup: premierCoup,
    taux: tentes ? Math.round(100*reussis/tentes) : null,
    cartes: cartes,
    pct: A.pct(st.lu.length + reussis, c.sections.length + c.exos.length)
  };
}

/* --- toutes les tentatives horodatées, tous chapitres confondus --- */
function tentatives(){
  var out = [];
  chapitres().forEach(function(c){
    var e = A.chapState(c.id).exos || {};
    c.exos.forEach(function(x){
      var r = e[x.id];
      if(r && r.ts) out.push({ quand:new Date(r.ts), ok:r.ok, essais:r.tries,
                               niveau:x.niveau || 1, chap:c.titre });
    });
  });
  return out.sort(function(a,b){ return a.quand - b.quand; });
}

/* --- petit graphique en barres, en HTML pur --- */
function barres(valeurs, etiquettes, couleur){
  var max = Math.max.apply(null, valeurs.concat([1]));
  var g = el("div","statBarres");
  valeurs.forEach(function(v,i){
    var col = el("div","statCol");
    var b = el("div","statBar");
    b.style.height = Math.max(2, Math.round(100*v/max)) + "%";
    b.style.background = "var(--"+(v ? (couleur||"bleu") : "line2")+")";
    b.title = etiquettes[i] + " : " + v;
    col.appendChild(b);
    if(etiquettes[i]) col.appendChild(el("div","statEtiq", etiquettes[i]));
    g.appendChild(col);
  });
  return g;
}

window.VUE_STATS = function(){
  var w = window.WRAPDIV();
  var cs = chapitres();
  var tent = tentatives();

  w.innerHTML =
    '<div class="eyebrow">Suivi</div>'+
    '<h1 style="font-size:31px;margin:8px 0 8px">Où tu en es</h1>'+
    '<p class="muted" style="max-width:62ch">Tout ce qui suit est calculé à partir de ton travail réel. '+
    'Rien n\'est estimé : si une case est vide, c\'est que le chapitre n\'a pas encore été abordé.</p>';

  /* ---------- vue d'ensemble ---------- */
  var fait = 0, total = 0, reussis = 0, tentes = 0, premier = 0;
  cs.forEach(function(c){
    var b = bilanChapitre(c);
    fait += b.lu + b.reussis; total += b.sections + b.total;
    reussis += b.reussis; tentes += b.tentes; premier += b.premierCoup;
  });
  var entr = S.entrain || {};
  var res = el("div","card pad"); res.style.marginTop="22px";
  res.innerHTML =
    '<div class="row" style="justify-content:space-between;align-items:flex-end">'+
      '<div class="stat"><div class="n">'+A.pct(fait,total)+'%</div><div class="l">Programme parcouru</div></div>'+
      '<div class="stat"><div class="n">'+reussis+'</div><div class="l">Exercices réussis</div></div>'+
      '<div class="stat"><div class="n">'+(tentes ? Math.round(100*reussis/tentes) : 0)+'%</div><div class="l">Taux de réussite</div></div>'+
      '<div class="stat"><div class="n">'+(entr.faits||0)+'</div><div class="l">Exercices générés faits</div></div>'+
    '</div><div class="bar" style="margin-top:16px"><i style="width:'+A.pct(fait,total)+'%"></i></div>';
  w.appendChild(res);

  if(!tentes && !(entr.faits||0) && !(S.controles||[]).length){
    var vide = el("div","empty"); vide.style.marginTop="20px";
    vide.innerHTML = '<div class="big">Rien à afficher pour l\'instant</div>'+
      '<p>Fais quelques exercices : ce tableau se remplira tout seul.</p>';
    w.appendChild(vide);
    return w;
  }

  /* ---------- chapitre par chapitre ---------- */
  var h1 = el("div","secHead");
  h1.innerHTML = '<span class="n">1</span><h2>Chapitre par chapitre</h2>';
  w.appendChild(h1);
  var grille = el("div","grid"); grille.style.marginTop="16px";
  cs.forEach(function(c){
    var b = bilanChapitre(c);
    var ligne = el("button","statLigne");
    var couleur = b.taux === null ? "line2" : (b.taux >= 70 ? "vert" : (b.taux >= 40 ? "ambre" : "rouge"));
    ligne.innerHTML =
      '<div class="statNum">'+c.n+'</div>'+
      '<div class="statCorps">'+
        '<div class="statTitre">'+A.esc(c.titre)+'</div>'+
        '<div class="statDetail">'+
          b.lu+' / '+b.sections+' parties lues &nbsp;·&nbsp; '+
          b.reussis+' / '+b.total+' exercices réussis'+
          (b.premierCoup ? ' &nbsp;·&nbsp; '+b.premierCoup+' du premier coup' : '')+
          (b.cartes ? ' &nbsp;·&nbsp; <span style="color:var(--rouge)">'+A.plural(b.cartes,"carte")+' à revoir</span>' : '')+
        '</div>'+
        '<div class="bar" style="margin-top:8px"><i style="width:'+b.pct+'%"></i></div>'+
      '</div>'+
      '<div class="statTaux" style="color:var(--'+couleur+')">'+
        (b.taux === null ? '—' : b.taux+'%')+
        '<div class="statTauxL">réussite</div></div>';
    ligne.onclick = function(){ window.GOTO({page:"chap", chap:c.id, onglet:"cours"}); };
    grille.appendChild(ligne);
  });
  w.appendChild(grille);
  w.appendChild(el("p","small muted",
    "Le taux de réussite ne compte que les exercices déjà tentés. Un tiret signifie que le chapitre n'a pas encore été travaillé."));

  /* ---------- activité récente ---------- */
  if(tent.length){
    var h2 = el("div","secHead");
    h2.innerHTML = '<span class="n">2</span><h2>Ces trois dernières semaines</h2>';
    w.appendChild(h2);
    var jours = [], etiq = [], i, d, n;
    for(i = 20; i >= 0; i--){
      d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() - i);
      var fin = new Date(d); fin.setDate(fin.getDate() + 1);
      n = tent.filter(function(t){ return t.quand >= d && t.quand < fin; }).length;
      jours.push(n);
      etiq.push(i === 0 ? "auj." : (i === 20 || i === 10 ? d.getDate()+"/"+(d.getMonth()+1) : ""));
    }
    var carte = el("div","card pad"); carte.style.marginTop="16px";
    carte.appendChild(barres(jours, etiq, "bleu"));
    var actifs = jours.filter(function(x){ return x > 0; }).length;
    carte.appendChild(el("div","small muted",
      actifs ? "Tu as travaillé <b>"+actifs+" jour"+(actifs>1?"s":"")+"</b> sur les 21 derniers. "+
               "La régularité compte davantage que la durée des séances."
             : "Aucune activité enregistrée sur cette période."));
    w.appendChild(carte);
  }

  /* ---------- réussite du premier coup ---------- */
  if(tentes){
    var h3 = el("div","secHead");
    h3.innerHTML = '<span class="n">3</span><h2>Du premier coup, ou après réflexion ?</h2>';
    w.appendChild(h3);
    var deuxieme = reussis - premier, rates = tentes - reussis;
    var c3 = el("div","card pad"); c3.style.marginTop="16px";
    c3.appendChild(el("div","statPart",
      '<span style="flex:'+Math.max(premier,0.01)+';background:var(--vert)"></span>'+
      '<span style="flex:'+Math.max(deuxieme,0.01)+';background:var(--ambre)"></span>'+
      '<span style="flex:'+Math.max(rates,0.01)+';background:var(--rouge)"></span>'));
    c3.appendChild(el("div","statLegende",
      '<span><i style="background:var(--vert)"></i>'+premier+' du premier coup</span>'+
      '<span><i style="background:var(--ambre)"></i>'+deuxieme+' au second essai</span>'+
      '<span><i style="background:var(--rouge)"></i>'+rates+' non réussis</span>'));
    c3.appendChild(el("div","small muted",
      premier >= reussis*0.7 && reussis > 3
        ? "La plupart de tes réussites sont immédiates : les notions sont acquises. Tu peux passer à des chapitres plus difficiles."
        : (rates > reussis
            ? "Beaucoup d'exercices restent à reprendre. La page <b>À revoir</b> te les ressert au bon moment — c'est là qu'il faut passer du temps."
            : "Tu réussis souvent au second essai : c'est bon signe, tu comprends l'erreur quand elle t'est expliquée. Vise maintenant le premier coup.")));
    w.appendChild(c3);
  }

  /* ---------- contrôles passés ---------- */
  var ctl = S.controles || [];
  if(ctl.length){
    var h4 = el("div","secHead");
    h4.innerHTML = '<span class="n">4</span><h2>Tes contrôles</h2>';
    w.appendChild(h4);
    var c4 = el("div","card pad"); c4.style.marginTop="16px";
    var notes = ctl.slice(0, 12).reverse();
    c4.appendChild(barres(
      notes.map(function(x){ return x.note; }),
      notes.map(function(x){ return new Date(x.date).getDate()+"/"+(new Date(x.date).getMonth()+1); }),
      "ambre"));
    var moy = Math.round(10*notes.reduce(function(a,x){ return a+x.note; },0)/notes.length)/10;
    var tendance = notes.length >= 3
      ? (notes[notes.length-1].note > notes[0].note ? "en progression" : (notes[notes.length-1].note < notes[0].note ? "en baisse" : "stable"))
      : null;
    c4.appendChild(el("div","small muted",
      "Moyenne : <b>"+String(moy).replace(".",",")+" / 20</b> sur "+A.plural(notes.length,"contrôle")+
      (tendance ? " &nbsp;·&nbsp; tendance "+tendance : "")+". Chaque barre est un contrôle, de gauche à droite dans l'ordre."));
    w.appendChild(c4);
  }
  return w;
};
})();
</script>

<script>
/* =====================================================================
   Couche IA — active uniquement quand la page est servie par le serveur
   local (voir serveur/server.js). En Artifact, /api/ping échoue et
   l'application reste strictement déterministe et hors-ligne.
   ===================================================================== */
(function(){
"use strict";
var A = window.APP, T=A.T, el=A.el;

var CODE_KEY = "cahier-premiere.code";
function code(){ try{ return localStorage.getItem(CODE_KEY)||""; }catch(e){ return ""; } }
function setCode(c){ try{ localStorage.setItem(CODE_KEY,c); }catch(e){} }

function api(route, corps){
  return fetch(route, {
    method:"POST",
    headers:{ "Content-Type":"application/json", "X-Code": code() },
    body: JSON.stringify(corps)
  }).then(function(r){
    return r.json().then(function(j){
      if(!r.ok) throw new Error(j && j.erreur ? j.erreur : ("erreur "+r.status));
      return j;
    }, function(){ throw new Error("réponse illisible du serveur"); });
  });
}

/* ---------------------------------------------------------------
   Détection : le serveur est-il là ?
   --------------------------------------------------------------- */
function sonder(){
  return fetch("/api/ping", { headers:{ "X-Code": code() } })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){
      if(!j || !j.ok) return;
      window.IA_MODELE = j.modele || "";
      if(j.codeRequis && !j.codeOk){
        window.IA_ACTIVE = false;
        demanderCode(!!code());     // code absent, ou code refusé
        return;
      }
      window.IA_ACTIVE = true;
      if(window.RENDER) window.RENDER();
      verifierStockage();           // prévient si la progression n'est pas durable
      return charger();             // le serveur détient la progression de référence
    })
    .catch(function(){ /* mode hors-ligne : rien à faire */ });
}
sonder();

/* Auto-vérification du stockage : l'élève doit savoir si son travail est
   réellement conservé. Le résultat est affiché dans « Mes cours ». */
window.IA_STOCKAGE = null;
function verifierStockage(){
  return fetch("/api/diag", { headers:{ "X-Code": code() } })
    .then(function(r){ return r.json(); })
    .then(function(j){
      window.IA_STOCKAGE = j;
      if(j && j.erreur){
        A.toast("Attention : ta progression n’est pas enregistrée sur le serveur.");
      } else if(j && /fichier/.test(j.stockage||"")){
        A.toast("Attention : progression en fichier local, elle peut être perdue.");
      }
      var z = document.getElementById("etatStockage");
      if(z) z.innerHTML = texteStockage();
      return j;
    })
    .catch(function(){ window.IA_STOCKAGE = { erreur:"vérification impossible" }; });
}
window.texteStockage = texteStockage;
function texteStockage(){
  var j = window.IA_STOCKAGE;
  if(!j) return '<span class="muted">vérification en cours…</span>';
  if(j.erreur)
    return '<span style="color:var(--rouge)">✗ La progression n’est pas enregistrée sur le serveur — '+
           A.esc(j.erreur)+'</span>';
  if(/fichier/.test(j.stockage||""))
    return '<span style="color:var(--ambre)">⚠ Progression dans un fichier sur le serveur : '+
           'elle sera perdue si l’hébergeur redémarre. Renseigne les deux variables Upstash.</span>';
  return '<span style="color:var(--vert)">✓ Progression conservée dans l’entrepôt, '+
         'synchronisée entre tes appareils.</span>';
}
window.IA_DIAG = verifierStockage;

/* Écran de saisie du code, affiché seulement si le serveur en exige un */
function demanderCode(refuse){
  if(document.getElementById("volet-code")) return;
  var volet = el("div");
  volet.id = "volet-code";
  volet.style.cssText = "position:fixed;inset:0;z-index:300;background:var(--paper);"+
    "display:grid;place-items:center;padding:24px";
  var carte = el("div","card pad");
  carte.style.cssText = "max-width:420px;width:100%";
  carte.innerHTML =
    '<div class="eyebrow" style="margin-bottom:8px">Cahier de Première</div>'+
    '<div style="font-family:var(--f-disp);font-weight:700;font-size:20px;margin-bottom:6px">'+
      (refuse ? "Ce code ne convient pas" : "Code d’accès")+'</div>'+
    '<p class="small muted">'+
      (refuse ? "Vérifie le code et réessaie."
              : "Entre le code d’accès pour activer l’aide de Claude. Il n’est demandé qu’une fois sur cet appareil.")+
    '</p>';
  var champ = el("input","inp");
  champ.type = "password";
  champ.autocomplete = "off";
  champ.placeholder = "Code d’accès";
  champ.style.cssText = "width:100%;margin-top:14px;font-family:var(--f-body);font-size:16px";
  var msg = el("div","small"); msg.style.cssText="color:var(--rouge);margin-top:8px;min-height:18px";
  var rangee = el("div","row"); rangee.style.marginTop="12px";
  var valider = el("button","btn pri","Valider");
  var sans = el("button","btn gho","Continuer sans l’IA");
  rangee.appendChild(valider); rangee.appendChild(sans);

  function essayer(){
    var v = champ.value.trim();
    if(!v){ champ.focus(); return; }
    valider.disabled = true; valider.textContent = "Vérification…";
    setCode(v);
    fetch("/api/ping", { headers:{ "X-Code": v } })
      .then(function(r){ return r.json(); })
      .then(function(j){
        if(j && j.codeOk){
          volet.remove();
          window.IA_ACTIVE = true;
          if(window.RENDER) window.RENDER();
          verifierStockage();
          charger();
          A.toast("Aide de Claude activée.");
        } else {
          setCode("");
          msg.textContent = "Code refusé.";
          valider.disabled = false; valider.textContent = "Valider";
          champ.value = ""; champ.focus();
        }
      })
      .catch(function(){
        msg.textContent = "Serveur injoignable.";
        valider.disabled = false; valider.textContent = "Valider";
      });
  }
  valider.onclick = essayer;
  champ.addEventListener("keydown", function(e){ if(e.key==="Enter") essayer(); });
  sans.onclick = function(){ volet.remove(); };

  carte.appendChild(champ); carte.appendChild(msg); carte.appendChild(rangee);
  volet.appendChild(carte);
  document.body.appendChild(volet);
  setTimeout(function(){ champ.focus(); }, 50);
}

/* ---------------------------------------------------------------
   Progression partagée entre les appareils
   Le serveur garde un seul cahier. Au démarrage on adopte sa version
   si elle est plus récente ; ensuite chaque changement y est renvoyé.
   --------------------------------------------------------------- */
var minuteur = null, adoption = false, dernierEchec = false;

function charger(){
  return fetch("/api/etat", { headers:{ "X-Code": code() } })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){
      if(!j || !j.etat) return pousser();          // serveur vide : on l'amorce
      if(!(j.maj > (A.S.maj || 0))) return pousser(); // le local est plus récent
      adopter(j);
    })
    .catch(function(){});
}

function adopter(j){
  adoption = true;
  for(var k in j.etat) A.S[k] = j.etat[k];
  A.S.maj = j.maj;
  A.save(true);                 // enregistre sans renvoyer au serveur
  A.applyTheme();
  adoption = false;
  if(window.RENDER) window.RENDER();
}

function pousser(){
  if(!window.IA_ACTIVE) return;
  return fetch("/api/etat", {
    method:"PUT",
    headers:{ "Content-Type":"application/json", "X-Code": code() },
    body: JSON.stringify({ maj: A.S.maj || Date.now(), etat: A.S })
  }).then(function(r){
    if(r.status === 409){                 // un autre appareil a fait mieux
      return r.json().then(adopter);
    }
    if(!r.ok) throw new Error("sync");
    if(dernierEchec){ dernierEchec = false; A.toast("Progression synchronisée."); }
  }).catch(function(){
    if(!dernierEchec){
      dernierEchec = true;
      A.toast("Progression enregistrée sur cet appareil seulement.");
    }
  });
}

/* appelé par A.save() à chaque changement, regroupé pour éviter le pilonnage */
window.APRES_SAVE = function(){
  if(adoption || !window.IA_ACTIVE) return;
  clearTimeout(minuteur);
  minuteur = setTimeout(pousser, 1500);
};

/* on n'attend pas 1,5 s si la page se ferme ou passe en arrière-plan */
document.addEventListener("visibilitychange", function(){
  if(document.visibilityState === "hidden" && minuteur){
    clearTimeout(minuteur); minuteur = null; pousser();
  }
});

/* ---------------------------------------------------------------
   1. « Expliquer autrement » sous chaque exercice corrigé
   --------------------------------------------------------------- */
window.IA_BOUTON = function(exo, actions, box, ok){
  if(!window.IA_ACTIVE) return;
  var b = el("button","btn sm", ok ? "Approfondir" : "Expliquer autrement");
  b.onclick = function(){
    b.disabled = true; b.textContent = "Claude réfléchit…";
    var zone = el("div","fb"); zone.style.background="var(--surface2)";
    zone.innerHTML = '<div class="fbt" style="color:var(--ink2)">Explication de Claude</div>'+
                     '<p class="muted">Rédaction en cours…</p>';
    box.insertBefore(zone, actions);
    api("/api/expliquer", {
      enonce: exo.enonce,
      correction: exo.corr,
      reussi: !!ok,
      question: ok ? "Explique pourquoi cette méthode marche, et dans quels autres cas elle s'applique."
                   : "Je n'ai pas compris la correction. Reprends-la autrement, plus lentement, avec une image ou un exemple différent."
    }).then(function(j){
      zone.innerHTML = '<div class="fbt" style="color:var(--ink2)">Explication de Claude</div>'+
                       corpsTexte(j.texte);
      b.remove();
    }).catch(function(e){
      zone.className = "fb bad";
      zone.innerHTML = '<div class="fbt">Explication indisponible</div><p>'+A.esc(e.message)+'</p>';
      b.disabled=false; b.textContent="Réessayer";
    });
  };
  actions.appendChild(b);
};

/* rendu d'une réponse texte : paragraphes + notation maths du cahier */
function corpsTexte(t){
  return String(t||"").split(/\n{2,}/).map(function(p){
    p = p.trim(); if(!p) return "";
    if(/^[-•*]\s/.test(p)){
      return '<ul class="ul">'+p.split(/\n/).map(function(l){
        return '<li>'+T(l.replace(/^[-•*]\s*/,""))+'</li>';
      }).join("")+'</ul>';
    }
    return '<p style="margin-top:8px">'+T(p)+'</p>';
  }).join("");
}

/* ---------------------------------------------------------------
   2. Génération directe d'une fiche à partir d'un cours importé
   --------------------------------------------------------------- */
window.IA_GENERER_FICHE = function(draft, cb){
  api("/api/fiche", { titre:draft.titre, texte:draft.texte, image:draft.image })
    .then(function(j){ cb(null, j.fiche); })
    .catch(function(e){ cb(e.message); });
};

/* ---------------------------------------------------------------
   3. Page « Corriger une photo »
   --------------------------------------------------------------- */
var photo = { image:null, question:"", reponse:null, enCours:false };

window.VUE_PHOTO = function(){
  var w = window.WRAPDIV();
  w.innerHTML =
    '<div class="eyebrow">Correction de ton travail</div>'+
    '<h1 style="font-size:31px;margin:8px 0 8px">Photographie ton exercice</h1>'+
    '<p class="muted" style="max-width:62ch">Prends en photo ce que tu as écrit sur ton cahier — même raturé, même incomplet. Claude lit ton raisonnement et te dit <b>à quelle ligne</b> ça dérape, sans donner la réponse tout de suite.</p>';

  var c1 = el("div","card pad"); c1.style.marginTop="22px";
  if(!photo.image){
    var drop = el("div","drop");
    drop.innerHTML = '<div style="font-family:var(--f-disp);font-weight:700;font-size:17px">Dépose une photo, ou clique pour la choisir</div>'+
      '<p class="small muted" style="margin-top:6px">Sur téléphone, cela ouvre directement l’appareil photo.</p>';
    var fi = el("input"); fi.type="file"; fi.accept="image/*";
    fi.setAttribute("capture","environment"); fi.className="hidden";
    drop.appendChild(fi);
    drop.onclick=function(){ fi.click(); };
    drop.addEventListener("dragover",function(e){ e.preventDefault(); drop.classList.add("over"); });
    drop.addEventListener("dragleave",function(){ drop.classList.remove("over"); });
    drop.addEventListener("drop",function(e){
      e.preventDefault(); drop.classList.remove("over");
      if(e.dataTransfer.files[0]) charger(e.dataTransfer.files[0]);
    });
    fi.onchange=function(){ if(fi.files[0]) charger(fi.files[0]); };
    c1.appendChild(drop);
  } else {
    var im = el("img","imgPrev"); im.src=photo.image; im.alt="Ton exercice";
    c1.appendChild(im);
    var rr = el("div","row"); rr.style.marginTop="12px";
    var bc = el("button","btn sm","Changer de photo");
    bc.onclick=function(){ photo.image=null; photo.reponse=null; window.RENDER(); };
    rr.appendChild(bc);
    c1.appendChild(rr);
  }
  w.appendChild(c1);

  if(photo.image){
    var c2 = el("div","card pad"); c2.style.marginTop="14px";
    c2.innerHTML = '<div class="eyebrow" style="margin-bottom:8px">Ta question (facultatif)</div>';
    var ta = el("textarea","inp");
    ta.style.minHeight="80px";
    ta.placeholder="Ex. : je ne comprends pas pourquoi je ne trouve pas le bon discriminant.";
    ta.value = photo.question;
    ta.oninput=function(){ photo.question=ta.value; };
    c2.appendChild(ta);
    var bEnv = el("button","btn pri","Envoyer à Claude");
    bEnv.style.marginTop="12px";
    bEnv.disabled = photo.enCours;
    bEnv.onclick=function(){
      photo.enCours = true; bEnv.disabled=true; bEnv.textContent="Claude lit ta copie…";
      api("/api/photo", { image:photo.image, question:photo.question })
        .then(function(j){ photo.reponse=j.texte; photo.enCours=false; window.RENDER(); })
        .catch(function(e){ photo.enCours=false; photo.reponse="ERREUR:"+e.message; window.RENDER(); });
    };
    c2.appendChild(bEnv);
    w.appendChild(c2);
  }

  if(photo.reponse){
    var err = photo.reponse.indexOf("ERREUR:")===0;
    var c3 = el("div", err ? "fb bad" : "card pad");
    c3.style.marginTop="14px";
    if(err){
      c3.innerHTML = '<div class="fbt">Correction indisponible</div><p>'+
        A.esc(photo.reponse.slice(7))+'</p>';
    } else {
      c3.innerHTML = '<div class="row" style="margin-bottom:10px"><span class="tag b">Correction</span></div>'+
        '<div class="lesson">'+corpsTexte(photo.reponse)+'</div>';
    }
    w.appendChild(c3);
  }

  w.appendChild(el("div","callout co-piege",
    '<div class="ct">À garder en tête</div><p>Cette correction est rédigée par un modèle de langage : elle est très utile pour comprendre, mais elle peut se tromper sur un calcul. '+
    'Les '+(window.COURS||[]).reduce(function(n,c){ return n+c.exos.length; },0)+
    ' exercices des chapitres, eux, sont vérifiés. En cas de désaccord entre les deux, c’est le cahier qui a raison.</p>'));

  function charger(file){
    if(file.size > 6*1024*1024){ A.toast("Photo trop lourde (6 Mo maximum)."); return; }
    var fr = new FileReader();
    fr.onload=function(){ photo.image=fr.result; photo.reponse=null; window.RENDER(); };
    fr.readAsDataURL(file);
  }
  return w;
};

   4. Saisie du code d'accès si le serveur le refuse
   --------------------------------------------------------------- */
window.IA_CODE = function(){ demanderCode(false); };
})();
