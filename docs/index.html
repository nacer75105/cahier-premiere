    {t:"texte", x:1.5, y:0.69, txt:"E(X) = 0,5", couleur:"rouge"}
   ],
   note:"Deux barres de hauteur 0,5. L'espérance (trait rouge) est le **point d'équilibre** : elle tombe pile au milieu."},
  {t:"p", x:"Cette image donne une intuition qu'aucune formule ne donne : **l'espérance est un point d'équilibre**. Imagine les deux barres comme deux poids posés sur une règle. L'endroit où la règle tient en équilibre, c'est $E(X)$. Ici les poids sont égaux, l'équilibre est au milieu ; si l'une des barres était plus haute, l'équilibre se déplacerait de son côté."},
  {t:"p", x:"Cela explique du même coup pourquoi l'espérance n'est pas forcément une valeur atteignable. Ici elle vaut $0{,}5$, alors que le gain ne peut être que $-1$ ou $2$. Le point d'équilibre d'une balançoire n'est pas l'endroit où l'on s'assoit."},
  {t:"piege", titre:"Le contrôle qui sauve", x:"Si la somme des probabilités ne fait pas 1, il y a forcément une erreur quelque part. Prends dix secondes pour additionner la ligne du bas avant de continuer."}
 ]},

 {titre:"L'espérance : le gain moyen à long terme", blocs:[
  {t:"idee", x:"L'espérance répond à : **si je répétais l'expérience des milliers de fois, combien gagnerais-je en moyenne par partie ?**"},
  {t:"formule", titre:"Espérance", x:"$E(X) = x_1 P(X = x_1) + x_2 P(X = x_2) + … + x_n P(X = x_n)$", note:"Chaque valeur est pondérée par sa probabilité. C'est une moyenne, mais pondérée."},
  {t:"p", x:"Le mot important est **pondérée**. Une moyenne ordinaire traite toutes les valeurs à égalité : la moyenne de 10 et 0 vaut 5. Mais si le 10 n'arrive qu'une fois sur dix et le 0 neuf fois sur dix, dire « en moyenne 5 » serait absurde — on obtient presque toujours 0. La bonne réponse est $10 × 0{,}1 + 0 × 0{,}9 = 1$."},
  {t:"p", x:"D'où la formule : chaque valeur est multipliée par **son poids**, c'est-à-dire par la fréquence à laquelle elle apparaît. Les valeurs rares comptent peu, les valeurs fréquentes comptent beaucoup. Si tu comprends ça, tu n'auras jamais besoin de mémoriser la formule : elle se réécrit toute seule."},
  {t:"astuce", titre:"L'espérance n'est pas une valeur possible", x:"Une espérance de $0{,}17$ € au jeu du dé ne veut pas dire qu'on gagne 17 centimes : on gagne 6 € ou on perd 1 €, jamais 17 centimes. C'est un **niveau moyen à long terme**, pas un résultat de partie.<br><br>C'est comme les « 1,8 enfant par famille » : aucune famille n'a 1,8 enfant. L'espérance est un indicateur, pas une prédiction."},
  {t:"exemple", titre:"Exemple guidé — ce jeu est-il rentable ?", enonce:"Une loterie coûte 2 € le ticket. On gagne 50 € avec une probabilité de 0,01, 5 € avec une probabilité de 0,1, et rien sinon. Le jeu est-il favorable au joueur ?", etapes:[
   {q:"Définir la variable", r:"Soit $X$ le gain **net**, c'est-à-dire après déduction des 2 € du ticket. Les valeurs possibles sont $48$, $3$ et $-2$."},
   {q:"Écrire la loi", r:"$P(X = 48) = 0{,}01$, $P(X = 3) = 0{,}1$, et $P(X = -2) = 1 - 0{,}01 - 0{,}1 = 0{,}89$."},
   {q:"Calculer l'espérance", r:"$E(X) = 48 × 0{,}01 + 3 × 0{,}1 + (-2) × 0{,}89$."},
   {q:"Détail du calcul", r:"$0{,}48 + 0{,}3 - 1{,}78 = -1$."},
   {q:"Conclure", r:"$E(X) = -1$ € : en moyenne, le joueur perd 1 € par ticket. Le jeu est défavorable au joueur."}
  ]},
  {t:"formule", titre:"Vocabulaire", x:"$E(X) = 0$ → jeu **équitable**<br>$E(X) > 0$ → favorable au joueur<br>$E(X) < 0$ → défavorable au joueur"},
  {t:"piege", titre:"Ne pas oublier la mise", x:"Si l'énoncé parle de gain **net**, il faut retrancher le prix du ticket à chaque valeur — y compris aux gains. Beaucoup d'élèves l'oublient sur la valeur maximale."},
  {t:"check", q:"Une variable $X$ vaut 10 avec une probabilité de 0,3 et 0 avec une probabilité de 0,7. Que vaut $E(X)$ ?",
   choix:["3","5","10","0,3"], bonne:0,
   expl:["Exact : $10 × 0{,}3 + 0 × 0{,}7 = 3$.",
         "5 serait la moyenne simple entre 10 et 0. Mais l'espérance **pondère** par les probabilités, qui ne sont pas égales ici.",
         "10 est la valeur maximale, atteinte seulement 3 fois sur 10.",
         "0,3 est la probabilité, pas le gain moyen. Il faut la multiplier par la valeur associée."]}
 ]},

 {titre:"Variance et écart-type : mesurer le risque", blocs:[
  {t:"idee", x:"Deux jeux peuvent avoir la même espérance mais être très différents : l'un régulier, l'autre très risqué. L'écart-type mesure cette **dispersion**."},
  {t:"p", x:"Voici pourquoi l'espérance seule ne suffit pas. Deux jeux, même mise, même gain moyen de 0 € :<br>— **Jeu A** : on gagne ou on perd 1 € à chaque partie.<br>— **Jeu B** : une fois sur mille on gagne 1000 €, sinon on perd 1 €.<br>Les deux ont une espérance nulle, donc « équitables » au sens du cours. Mais les vivre n'a rien à voir : le premier est ennuyeux et sans danger, le second peut ruiner avant le premier gain."},
  {t:"fig", titre:"Même espérance, dispersions opposées",
   vue:[-1,-0.15,10,1.25], w:400, h:280, grille:false, graduations:false,
   objets:[
    {t:"seg", de:[-0.6,0], a:[9.6,0], couleur:"ink3"},
    {t:"poly", pts:[[1.6,0],[2.4,0],[2.4,0.9],[1.6,0.9]], couleur:"vert", remplir:true},
    {t:"poly", pts:[[2.6,0],[3.4,0],[3.4,0.9],[2.6,0.9]], couleur:"vert", remplir:true},
    {t:"poly", pts:[[0.1,0],[0.5,0],[0.5,0.28],[0.1,0.28]], couleur:"rouge", remplir:true},
    {t:"poly", pts:[[8.6,0],[9,0],[9,0.28],[8.6,0.28]], couleur:"rouge", remplir:true},
    {t:"seg", de:[2.5,0], a:[2.5,1.08], couleur:"ink", pointille:true},
    {t:"texte", x:2.5, y:1.16, txt:"même E(X)", couleur:"ink2"},
    {t:"texte", x:2.5, y:-0.11, txt:"resserré : σ petit", couleur:"vert"},
    {t:"texte", x:7.6, y:-0.11, txt:"étalé : σ grand", couleur:"rouge"}
   ],
   note:"Les barres vertes sont serrées autour de la moyenne ; les rouges sont loin de part et d'autre. Même centre, risques opposés."},
  {t:"p", x:"L'écart-type met un nombre sur cet étalement. Petit écart-type : les résultats se serrent autour de la moyenne, on sait à peu près à quoi s'attendre. Grand écart-type : ils partent loin des deux côtés, la moyenne devient une information peu utile pour prévoir une partie."},
  {t:"formule", titre:"Variance", x:"$V(X) = x_1^2 P(X = x_1) + … + x_n^2 P(X = x_n) - [E(X)]^2$", note:"Traduction : moyenne des carrés, moins le carré de la moyenne."},
  {t:"formule", titre:"Écart-type", x:"$σ(X) = @r{V(X)}$", note:"On revient ainsi à l'unité de départ (des euros, des points…). C'est ce qu'on interprète."},
  {t:"exemple", titre:"Exemple guidé — calculer un écart-type", enonce:"Soit $X$ prenant la valeur 0 avec une probabilité de 0,5 et la valeur 4 avec une probabilité de 0,5. Calculer $E(X)$, $V(X)$ et $σ(X)$.", etapes:[
   {q:"Espérance", r:"$E(X) = 0 × 0{,}5 + 4 × 0{,}5 = 2$."},
   {q:"Moyenne des carrés", r:"$0^2 × 0{,}5 + 4^2 × 0{,}5 = 0 + 8 = 8$."},
   {q:"Variance", r:"$V(X) = 8 - 2^2 = 8 - 4 = 4$."},
   {q:"Écart-type", r:"$σ(X) = @r{4} = 2$."},
   {q:"Interprétation", r:"En moyenne on obtient 2, avec un écart typique de 2 par rapport à cette moyenne. C'est énorme relativement : la variable ne prend jamais la valeur 2 elle-même."}
  ]},
  {t:"piege", titre:"L'erreur d'ordre", x:"Il faut élever les **valeurs** au carré, pas les probabilités. Et on retranche $[E(X)]^2$ tout à la fin, une seule fois — pas à chaque terme."},
  {t:"astuce", titre:"Contrôle rapide", x:"La variance ne peut jamais être négative. Si tu trouves un nombre négatif, c'est qu'une étape est fausse : le plus souvent, le carré de l'espérance a été soustrait trop tôt."}
 ]},

 {titre:"Échantillonnage : de la théorie à l'expérience", blocs:[
  {t:"idee", x:"L'espérance dit ce qui se passe **en moyenne, sur un très grand nombre de répétitions**. Sur quelques essais, le résultat observé peut en être très loin — et c'est normal."},
  {t:"p", x:"Un **échantillon de taille $n$** est le résultat de $n$ répétitions indépendantes de la même expérience. La moyenne obtenue sur cet échantillon s'appelle la **moyenne observée** ; elle change d'un échantillon à l'autre. C'est ce qu'on appelle la **fluctuation d'échantillonnage**."},
  {t:"exemple", titre:"Exemple guidé — pile ou face", enonce:"On lance une pièce équilibrée 10 fois, puis 1000 fois. Que peut-on attendre de la proportion de « pile » ?", etapes:[
   {q:"Ce que dit la théorie", r:"La probabilité d'obtenir pile est $0{,}5$. C'est la valeur vers laquelle on tend."},
   {q:"Sur 10 lancers", r:"Obtenir 3 piles sur 10 (soit $0{,}3$) n'a rien d'anormal. L'écart à $0{,}5$ peut être important."},
   {q:"Sur 1000 lancers", r:"On observera presque toujours une proportion entre $0{,}45$ et $0{,}55$. L'écart se resserre nettement."},
   {q:"Ce qu'il faut en retenir", r:"Plus l'échantillon est grand, plus la moyenne observée se rapproche de l'espérance, et plus elle est stable d'un échantillon à l'autre."}
  ]},
  {t:"formule", titre:"La règle à retenir", x:"Quand $n$ grandit, la moyenne observée sur un échantillon de taille $n$ se rapproche de $E(X)$.", note:"C'est ce qui justifie qu'on estime une probabilité par une fréquence observée — et donc qu'on puisse la simuler."},
  {t:"p", x:"C'est exactement ce que fait le programme de simulation du chapitre 10 : lancer un dé 6000 fois et compter les 6 donne une fréquence proche de $@f{1}{6}$. Sur 10 lancers seulement, la fréquence obtenue serait bien trop instable pour conclure quoi que ce soit."},
  {t:"piege", titre:"Ce que l'espérance ne promet pas", x:"Une espérance de gain de $-1$ € ne veut pas dire qu'on perdra 1 € à chaque partie. On peut gagner gros une fois. Elle dit qu'**à la longue**, la perte moyenne par partie s'approchera de 1 €. C'est précisément là-dessus que reposent les casinos et les assurances."},
  {t:"astuce", titre:"Comment lire un énoncé d'échantillonnage", x:"Repère toujours la taille $n$. Si $n$ est petit (moins de 30), méfie-toi des conclusions tirées de la moyenne observée. Si $n$ est grand (plusieurs milliers), la moyenne observée est un bon estimateur."}
 ]},

 {titre:"Récapitulatif : trois nombres pour résumer le hasard", blocs:[
  {t:"idee", x:"Une variable aléatoire se résume par trois nombres : **l'espérance** dit où l'on se situe en moyenne, **la variance** et **l'écart-type** disent à quel point on s'en écarte."},
  {t:"p", x:"Ces trois nombres répondent à deux questions différentes, et il faut bien les séparer. « Combien vais-je gagner en moyenne ? » — c'est l'espérance. « Est-ce que ça va être régulier ou plein de surprises ? » — c'est l'écart-type. Deux jeux peuvent avoir la même espérance et être radicalement différents à vivre."},
  {t:"tbl", head:["Ce qu'on demande","Ce qu'il faut calculer"], rows:[
   ["« Établir la loi de probabilité »","Le tableau valeurs / probabilités, dont la somme fait 1"],
   ["« Gain moyen », « à long terme »","$E(X)$"],
   ["« Le jeu est-il équitable ? »","$E(X)$, puis comparer à 0"],
   ["« Dispersion », « régularité », « risque »","$V(X)$ puis $σ(X) = @r{V(X)}$"],
   ["Une valeur manquante dans la loi","La somme des probabilités vaut 1"],
   ["Un gain **net**","Retrancher la mise à **toutes** les valeurs, gains compris"]
  ]},
  {t:"formule", titre:"L'ordre des opérations, à ne pas inverser", x:"1. $E(X)$ &nbsp;→&nbsp; 2. moyenne des carrés &nbsp;→&nbsp; 3. $V(X)$ = (2) − $[E(X)]^2$ &nbsp;→&nbsp; 4. $σ = @r{V}$", note:"On retranche le carré de l'espérance **une seule fois**, à la fin."},
  {t:"piege", titre:"Les trois erreurs les plus fréquentes", x:"**1. La moyenne simple au lieu de la moyenne pondérée.** Chaque valeur doit être multipliée par sa probabilité.<br>**2. La mise oubliée.** Si l'énoncé parle de gain net, un billet à 3 € qui rapporte 100 € donne un gain net de 97 €, pas 100 — et $-3$ € en cas de perte.<br>**3. La variance calculée dans le désordre.** On élève les **valeurs** au carré, pas les probabilités, et on retire $[E(X)]^2$ tout à la fin."},
  {t:"astuce", titre:"Deux contrôles imparables", x:"**La somme des probabilités doit valoir exactement 1.** Si ce n'est pas le cas, inutile de continuer : la loi est fausse.<br><br>**La variance ne peut jamais être négative.** Un résultat négatif signale toujours une erreur — le plus souvent le carré de l'espérance soustrait trop tôt."},
  {t:"p", x:"Un dernier mot sur le sens de tout ça. Ce chapitre est celui des assurances, des casinos et des paris. Tous reposent sur la même idée : à court terme, tout peut arriver ; à long terme, l'espérance finit par l'emporter. C'est pour cette raison qu'un casino avec une espérance légèrement défavorable au joueur gagne à coup sûr — non pas à chaque partie, mais sur des millions de parties."}
 ]}
],
exos:[
 {id:"va1", niveau:1, type:"num", enonce:"Une variable $X$ prend la valeur 5 avec une probabilité de 0,4 et la valeur 10 avec une probabilité de 0,6. Calculer $E(X)$.",
  rep:8, tol:0.001,
  diag:[{v:7.5, m:"Tu as fait la moyenne simple de 5 et 10. L'espérance pondère chaque valeur par sa probabilité : les 10 pèsent plus lourd ici."},
        {v:15, m:"Tu as additionné les valeurs sans les pondérer. Chaque valeur doit être multipliée par sa probabilité."},
        {v:1, m:"Tu as sans doute additionné les probabilités. La somme $0{,}4 + 0{,}6 = 1$ sert seulement de vérification."}],
  corr:["$E(X) = 5 × 0{,}4 + 10 × 0{,}6$.","$= 2 + 6$.","$E(X) = 8$."],
  indice:"Multiplie chaque valeur par sa probabilité, puis additionne le tout."},

 {id:"va2", niveau:1, type:"num", enonce:"Une variable prend les valeurs 1, 2 et 3 avec les probabilités 0,2 ; 0,5 et $p$. Que vaut $p$ ?",
  rep:0.3, tol:0.001,
  diag:[{v:0.7, m:"Tu as oublié de retirer l'une des deux probabilités. Il faut faire $1 - 0{,}2 - 0{,}5$."},
        {v:0.8, m:"Tu n'as retiré que 0,2. Les deux probabilités connues doivent être soustraites."},
        {v:1, m:"1 est la somme totale, pas la valeur manquante."}],
  corr:["La somme des probabilités d'une loi vaut toujours 1.","$0{,}2 + 0{,}5 + p = 1$.","$0{,}7 + p = 1$.","$p = 0{,}3$."],
  indice:"Quelle doit être la somme de toute la ligne des probabilités ?"},

 {id:"va3", niveau:2, type:"num", enonce:"On lance un dé équilibré. On gagne 6 € si on obtient un 6, sinon on perd 1 €. Quelle est l'espérance de gain, en euros ?",
  rep:0.1667, tol:0.005,
  diag:[{v:5, m:"Tu as calculé $6 - 1$ sans pondérer. Le gain de 6 € n'arrive qu'une fois sur six, alors que la perte arrive cinq fois sur six."},
        {v:2.5, m:"Tu as pris une moyenne simple. Les deux issues n'ont pas la même probabilité : $@f{1}{6}$ contre $@f{5}{6}$."},
        {v:-0.1667, m:"Erreur de signe. $@f{6}{6} = 1$ et $@f{5}{6} ≈ 0{,}833$ ; la différence $1 - 0{,}833$ est **positive**."}],
  corr:["$P(X = 6) = @f{1}{6}$ et $P(X = -1) = @f{5}{6}$.","$E(X) = 6 × @f{1}{6} + (-1) × @f{5}{6}$.","$= 1 - @f{5}{6} = @f{1}{6}$.","$E(X) ≈ 0{,}17$ € : le jeu est légèrement favorable au joueur."],
  indice:"Cinq faces sur six font perdre. Pondère chaque gain par sa probabilité."},

 {id:"va4", niveau:2, type:"qcm", enonce:"Un jeu a une espérance de gain nulle. Comment le qualifie-t-on ?",
  choix:["Équitable","Favorable au joueur","Défavorable au joueur","Impossible"], bonne:0,
  diag:["", "Un jeu favorable correspond à une espérance strictement positive.",
        "Un jeu défavorable correspond à une espérance strictement négative. Ici elle est nulle.",
        "Une espérance nulle est parfaitement possible : c'est le cas idéal d'un jeu sans avantage pour personne."],
  corr:["$E(X) = 0$ signifie qu'à long terme, ni le joueur ni l'organisateur ne gagnent d'argent.","On dit que le jeu est équitable."],
  indice:"Que se passe-t-il à long terme si le gain moyen par partie vaut exactement zéro ?"},

 {id:"va5", niveau:2, type:"num", enonce:"Soit $X$ valant 0 avec une probabilité de 0,5 et 2 avec une probabilité de 0,5. Calculer la variance $V(X)$.",
  rep:1, tol:0.001,
  diag:[{v:2, m:"Tu as sans doute oublié de retrancher $[E(X)]^2$. La moyenne des carrés vaut 2, mais il faut ensuite retirer $1^2 = 1$."},
        {v:0, m:"Tu as peut-être soustrait le carré de l'espérance à chaque terme. On ne le retire qu'une seule fois, à la fin."},
        {v:4, m:"Tu as oublié de pondérer par les probabilités : $2^2 × 0{,}5 = 2$, et non 4."}],
  corr:["$E(X) = 0 × 0{,}5 + 2 × 0{,}5 = 1$.","Moyenne des carrés : $0^2 × 0{,}5 + 2^2 × 0{,}5 = 2$.","$V(X) = 2 - 1^2$.","$V(X) = 1$."],
  indice:"Calcule d'abord l'espérance, puis la moyenne des carrés, et retranche le carré de l'espérance à la fin."},

 {id:"va6", niveau:3, type:"num", enonce:"La variance d'une variable aléatoire vaut 9. Quel est son écart-type ?",
  rep:3, tol:0.001,
  diag:[{v:81, m:"Tu as élevé au carré. L'écart-type est la **racine carrée** de la variance, pas son carré."},
        {v:4.5, m:"Tu as divisé par 2. La racine carrée de 9 vaut 3, car $3 × 3 = 9$."},
        {v:9, m:"Tu as recopié la variance. L'écart-type s'en déduit par une racine carrée."}],
  corr:["$σ(X) = @r{V(X)}$.","$= @r{9}$.","$σ(X) = 3$."],
  indice:"Quelle opération fait passer de la variance à l'écart-type ?"},

 {id:"va7", niveau:3, type:"num", enonce:"Un billet de tombola coûte 3 €. On gagne 100 € avec une probabilité de 0,02, et rien sinon. Quelle est l'espérance de gain **net**, en euros ?",
  rep:-1, tol:0.001,
  diag:[{v:2, m:"Tu as calculé $100 × 0{,}02 = 2$ mais oublié de retirer le prix du billet. Le gain net vaut $100 - 3 = 97$ en cas de victoire, et $-3$ sinon."},
        {v:1.94, m:"Tu as bien retiré 3 € au gain, mais tu as oublié que les 98 % de perdants perdent aussi leurs 3 €."},
        {v:97, m:"C'est le gain net en cas de victoire, pas l'espérance. Il faut encore pondérer par les probabilités."}],
  corr:["Gain net : $97$ € si on gagne, $-3$ € sinon.","$P(X = 97) = 0{,}02$ et $P(X = -3) = 0{,}98$.","$E(X) = 97 × 0{,}02 + (-3) × 0{,}98$.","$= 1{,}94 - 2{,}94 = -1$ € : on perd en moyenne 1 € par billet."],
  indice:"Le prix du billet est perdu dans tous les cas, y compris quand on gagne."},

 {id:"va8", niveau:3, type:"qcm", enonce:"Deux jeux ont la même espérance, mais le jeu A a un écart-type de 2 et le jeu B un écart-type de 20. Que peut-on dire ?",
  choix:["Le jeu B est beaucoup plus risqué","Le jeu B rapporte davantage","Le jeu A est plus rentable","Les deux jeux sont identiques"], bonne:0,
  diag:["", "Ce qu'on gagne en moyenne est donné par l'espérance, et elle est la même pour les deux. L'écart-type mesure l'irrégularité, pas le gain.",
        "La rentabilité moyenne est identique puisque les espérances sont égales. Seule la dispersion diffère.",
        "Ils ont le même gain moyen mais des comportements très différents : l'un est régulier, l'autre très irrégulier."],
  corr:["L'espérance mesure le gain moyen ; ici elle est identique.","L'écart-type mesure la dispersion autour de cette moyenne.","Un écart-type de 20 signifie des résultats très éloignés de la moyenne : gros gains, grosses pertes.","Le jeu B est donc bien plus risqué, à gain moyen égal."],
  indice:"Que mesure exactement l'écart-type : le niveau moyen, ou l'irrégularité autour de ce niveau ?"},

 {id:"va9", niveau:2, type:"qcm", enonce:"On lance une pièce équilibrée 10 fois et on obtient 7 piles. Que peut-on en conclure ?",
  choix:["Rien d'anormal : sur 10 lancers, l'écart à 50 % est courant",
         "La pièce est truquée",
         "La probabilité d'obtenir pile est de 0,7",
         "Il faut relancer jusqu'à obtenir exactement 5 piles"], bonne:0,
  diag:["", "Sur un échantillon aussi petit, 7 piles sur 10 arrive régulièrement avec une pièce parfaitement équilibrée. Il faudrait beaucoup plus de lancers pour soupçonner un truquage.",
        "0,7 est la **fréquence observée** sur cet échantillon, pas la probabilité. La probabilité est une valeur théorique, que la fréquence approche seulement quand $n$ devient grand.",
        "Le hasard ne se corrige pas. Rien ne garantit qu'on obtienne 5 piles, et les lancers suivants ne « rattrapent » pas les précédents."],
  corr:["La probabilité théorique vaut $0{,}5$.","Sur un échantillon de taille 10, la fluctuation d'échantillonnage est importante : la fréquence observée peut s'écarter nettement de $0{,}5$.","Obtenir 7 piles sur 10 est donc parfaitement banal.","Sur 1000 lancers, en revanche, une fréquence de $0{,}7$ serait très suspecte."],
  indice:"La taille de l'échantillon est-elle grande ou petite ? Qu'est-ce que cela change ?"},

 {id:"va10", niveau:3, type:"qcm", enonce:"Une simulation lance un dé $n$ fois et affiche la fréquence des 6. Pour quelle valeur de $n$ le résultat sera-t-il le plus proche de $@f{1}{6}$ ?",
  choix:["$n = 100000$","$n = 6$","$n = 60$","La taille de $n$ ne change rien"], bonne:0,
  diag:["", "Sur 6 lancers, on peut très bien obtenir zéro 6 (fréquence 0) ou trois 6 (fréquence 0,5). L'échantillon est bien trop petit.",
        "60 lancers, c'est déjà mieux que 6, mais la fréquence fluctuera encore sensiblement autour de $0{,}167$.",
        "C'est justement le point central du chapitre : plus l'échantillon est grand, plus la fréquence observée se rapproche de la probabilité théorique et se stabilise."],
  corr:["La fréquence observée s'approche de la probabilité théorique quand la taille de l'échantillon augmente.","Avec $n = 6$, la fluctuation est énorme.","Avec $n = 100000$, la fréquence sera presque toujours très proche de $0{,}167$.","C'est ce qui rend les simulations informatiques utiles : on peut prendre $n$ très grand."],
  indice:"Repense au programme du chapitre 10 : pourquoi lançait-il le dé 6000 fois plutôt que 10 ?"}
]
}
]);

<script>
window.COURS = (window.COURS || []).concat([

/* ====================== 7. GÉOMÉTRIE REPÉRÉE ====================== */
{
id:"repere", n:7, titre:"Géométrie repérée",
sous:"Traduire des figures en équations",
desc:"Vecteur directeur, équation cartésienne de droite, parallélisme, perpendicularité et cercles.",
duree:40,
sections:[
 {titre:"Pourquoi mettre la géométrie dans un repère", blocs:[
  {t:"idee", x:"Poser un repère sur une figure, c'est **remplacer le dessin par des nombres** — et donc remplacer le raisonnement géométrique par du calcul."},
  {t:"p", x:"Au collège, pour montrer que deux droites sont perpendiculaires, il fallait un raisonnement : des angles alternes-internes, des propriétés du triangle, parfois une construction. Ça marche, mais il faut avoir l'idée. Dans un repère, la même question devient une multiplication et une addition. On n'a plus besoin d'avoir l'idée : on applique."},
  {t:"p", x:"C'est le grand basculement de ce chapitre, et il vaut la peine d'être compris pour ce qu'il est. Descartes, au XVIIᵉ siècle, s'est aperçu qu'en numérotant les points du plan, **tout problème de géométrie devient un problème d'algèbre**. Une droite n'est plus un trait, c'est une équation. Un cercle n'est plus une forme, c'est une égalité. Se couper en un point, c'est résoudre un système."},
  {t:"tbl", head:["Objet géométrique","Sa traduction en nombres"], rows:[
   ["Un point","un couple $(x ; y)$"],
   ["Un déplacement","un vecteur $(x ; y)$"],
   ["Une droite","une équation $ax + by + c = 0$"],
   ["Un cercle","une équation $(x-a)^2 + (y-b)^2 = R^2$"],
   ["« Ce point est sur cette droite »","ses coordonnées vérifient l'équation"],
   ["« Ces deux droites se coupent »","le système a une solution"]
  ]},
  {t:"p", x:"Garde cette table en tête pendant tout le chapitre : chaque fois qu'un énoncé parle en géométrie, ton travail consiste d'abord à **traduire** dans la colonne de droite. Une fois la traduction faite, le reste n'est que du calcul."}
 ]},

 {titre:"Deux façons de décrire une droite", blocs:[
  {t:"idee", x:"Une droite peut se décrire de deux manières : par **la direction qu'elle suit** (vecteur directeur) ou par **la direction qu'elle fuit** (vecteur normal, perpendiculaire à elle)."},
  {t:"p", x:"Pourquoi deux descriptions ? Parce qu'elles répondent à deux questions différentes. Le **directeur** dit « dans quel sens la droite s'en va » : si tu marches sur la droite, c'est la direction de tes pas. Le **normal** dit « de quel côté on sort de la droite » : c'est la direction perpendiculaire, celle qui t'en éloigne le plus vite. Les deux décrivent la même droite, comme on peut décrire une route soit par son axe, soit par le sens qui la traverse."},
  {t:"fig", titre:"Les deux vecteurs d'une même droite",
   vue:[-1,-1,6,5], w:400, h:320,
   objets:[
    {t:"droite", de:[0.5,0.7], a:[3,2.3], couleur:"line2"},
    {t:"vec", de:[2,1.6], a:[4.5,3.2], couleur:"bleu", nom:"u"},
    {t:"vec", de:[2,1.6], a:[0.4,4.1], couleur:"rouge", nom:"n"},
    {t:"angle", en:[2,1.6], de:[4.5,3.2], a:[0.4,4.1], droit:true},
    {t:"texte", x:4.6, y:1.1, txt:"la droite", couleur:"ink3"}
   ],
   note:"Le vecteur **directeur** (bleu) glisse le long de la droite. Le vecteur **normal** (rouge) en sort perpendiculairement."},
  {t:"formule", titre:"Équation cartésienne", x:"Toute droite s'écrit $ax + by + c = 0$, avec $a$ et $b$ non tous les deux nuls.", note:"Un point appartient à la droite si et seulement si ses coordonnées vérifient l'égalité."},
  {t:"p", x:"Que dit vraiment cette équation ? Elle joue le rôle d'un **filtre**. Tu lui présentes un point : si le calcul donne 0, il est sur la droite ; sinon, il est ailleurs. La droite n'est rien d'autre que l'ensemble des points qui passent ce test. C'est pour ça qu'on écrit « $= 0$ » : le zéro est la condition d'appartenance."},
  {t:"formule", titre:"Lire les deux vecteurs sur l'équation", x:"Pour $ax + by + c = 0$ :<br>vecteur **normal** $@v{n}(a ; b)$ &nbsp;&nbsp;·&nbsp;&nbsp; vecteur **directeur** $@v{u}(-b ; a)$", note:"Le directeur s'obtient en échangeant les deux coefficients et en changeant un signe."},
  {t:"p", x:"Le normal se lit **tel quel** : les coefficients de $x$ et $y$, dans l'ordre. C'est le cadeau de l'équation cartésienne, et la raison pour laquelle on l'utilise autant. Le directeur, lui, demande une petite manipulation : échanger les deux nombres et changer un signe."},
  {t:"p", x:"Pourquoi cette manipulation donne-t-elle bien un vecteur perpendiculaire ? Fais le produit scalaire de $@v{n}(a ; b)$ et $@v{u}(-b ; a)$ : $a × (-b) + b × a = -ab + ab = 0$. Nul, donc perpendiculaires. Ce n'est pas une recette magique, c'est le critère d'orthogonalité du chapitre précédent qui fonctionne pour n'importe quels $a$ et $b$."},
  {t:"p", x:"Exemple : la droite $2x - 5y + 7 = 0$ a pour vecteur normal $@v{n}(2 ; -5)$ et pour vecteur directeur $@v{u}(5 ; 2)$. On vérifie : $2 × 5 + (-5) × 2 = 10 - 10 = 0$. ✓"},
  {t:"astuce", titre:"Comment ne plus les confondre", x:"Le **normal** se lit tel quel dans l'équation : $(a ; b)$, dans l'ordre. Le **directeur** demande une manipulation : on échange et on change un signe. Si tu n'as rien manipulé, tu tiens le normal."},
  {t:"piege", titre:"Un directeur, pas le directeur", x:"$@v{u}(5 ; 2)$ est **un** vecteur directeur, pas le seul. $(10 ; 4)$, $(-5 ; -2)$ ou $(2{,}5 ; 1)$ conviennent tout aussi bien : ils pointent tous dans la même direction. Deux réponses différentes peuvent donc être justes toutes les deux, du moment qu'elles sont proportionnelles. Même remarque pour le normal."},
  {t:"p", x:"Le cas le plus fréquent en contrôle : on te donne deux points et on demande l'équation de la droite qui les relie. La démarche est toujours la même, quatre étapes, et elle mérite d'être apprise comme une recette."},
  {t:"fig", titre:"La droite passant par A et B",
   vue:[-0.5,-0.5,5.5,9], w:380, h:340,
   objets:[
    {t:"droite", de:[1,2], a:[4,8], couleur:"bleu"},
    {t:"vec", de:[1,2], a:[4,8], couleur:"vert", nom:"AB"},
    {t:"point", x:1, y:2, nom:"A", dessous:true},
    {t:"point", x:4, y:8, nom:"B"}
   ],
   note:"Le vecteur $@v{AB}$ donne la **direction** de la droite. Il ne reste qu'à traduire cette direction en équation."},
  {t:"exemple", titre:"Exemple guidé — droite passant par deux points", enonce:"Déterminer une équation cartésienne de la droite passant par $A(1 ; 2)$ et $B(4 ; 8)$.", etapes:[
   {q:"Étape 1 — un vecteur directeur", r:"Deux points sur la droite donnent immédiatement sa direction : $@v{AB}(4 - 1 ; 8 - 2) = (3 ; 6)$. Je peux le simplifier en $(1 ; 2)$ — diviser par 3 ne change pas la direction, et allège tous les calculs suivants. Prends ce réflexe : simplifier tôt évite les gros nombres."},
   {q:"Étape 2 — le vecteur normal", r:"L'équation cartésienne se construit sur le **normal**, pas sur le directeur. J'échange les deux coordonnées et je change un signe : de $@v{u}(1 ; 2)$ je passe à $@v{n}(-2 ; 1)$. Contrôle immédiat : $1 × (-2) + 2 × 1 = 0$ ✓."},
   {q:"Étape 3 — la forme de l'équation", r:"Le normal fournit directement les coefficients de $x$ et $y$ : l'équation est $-2x + 1y + c = 0$, soit $-2x + y + c = 0$. À ce stade, la **direction** est bonne mais la droite peut encore être n'importe où : $c$ est ce qui va la placer."},
   {q:"Étape 4 — placer la droite avec un point", r:"$A(1 ; 2)$ est dessus, donc ses coordonnées doivent vérifier l'équation : $-2 × 1 + 2 + c = 0$, soit $c = 0$. J'aurais pu prendre $B$ à la place, le résultat serait le même."},
   {q:"Conclure", r:"L'équation est $-2x + y = 0$. On peut aussi l'écrire $y = 2x$, ce qui se lit plus facilement : une droite qui passe par l'origine avec un coefficient directeur de 2."},
   {q:"Vérifier — avec l'autre point", r:"Le point qui n'a pas servi au calcul est le meilleur vérificateur. $B(4 ; 8)$ : $-2 × 4 + 8 = -8 + 8 = 0$ ✓. Si ça ne tombait pas sur 0, il y aurait une erreur quelque part."}
  ]},
  {t:"astuce", titre:"La recette en quatre lignes", x:"1. Vecteur directeur $@v{AB}$ (arrivée moins départ), simplifié si possible.<br>2. Vecteur normal : échanger, changer un signe.<br>3. Écrire $ax + by + c = 0$ avec les coordonnées du normal.<br>4. Remplacer par un point connu pour trouver $c$, puis vérifier avec l'autre.<br><br>Ces quatre lignes couvrent tous les exercices « droite passant par deux points » du programme."},
  {t:"piege", titre:"Une équation, plusieurs écritures", x:"$-2x + y = 0$, $2x - y = 0$ et $-4x + 2y = 0$ décrivent **la même droite**. Multiplier toute l'équation par un nombre non nul ne change rien : le filtre reste le même, les points qui donnaient 0 continuent de donner 0. Deux réponses d'aspect différent peuvent donc être toutes les deux justes — vérifie en divisant l'une par l'autre plutôt qu'en les comparant terme à terme."},
  {t:"check", q:"Quelle est l'équation d'une droite de vecteur normal $@v{n}(3 ; -1)$ passant par l'origine ?",
   choix:["$3x - y = 0$","$-x + 3y = 0$","$3x - y + 1 = 0$","$x + 3y = 0$"], bonne:0,
   expl:["Exact : le normal donne les coefficients, et passer par $(0 ; 0)$ impose $c = 0$.",
         "Tu as utilisé le vecteur **directeur** comme s'il était normal. Le normal se recopie tel quel dans l'équation.",
         "Les coefficients sont bons, mais avec $c = 1$ la droite ne passe pas par l'origine : $3×0 - 0 + 1 = 1 ≠ 0$.",
         "Les coefficients ne correspondent pas au normal donné. Il faut $3$ devant $x$ et $-1$ devant $y$."]}
 ]},

 {titre:"Parallèles ou perpendiculaires ?", blocs:[
  {t:"p", x:"Deux questions reviennent sans arrêt : ces droites se coupent-elles, et si oui à angle droit ? Les deux se tranchent avec les vecteurs, et il n'y a que deux calculs possibles — mais il faut savoir lequel appliquer."},
  {t:"formule", titre:"Les deux critères", x:"**Parallèles** : leurs vecteurs directeurs sont colinéaires, soit $x y' - y x' = 0$<br>**Perpendiculaires** : leurs vecteurs directeurs sont orthogonaux, soit $x x' + y y' = 0$", note:"Le premier test est un déterminant (produit en croix), le second un produit scalaire. Ne les mélange pas."},
  {t:"fig", titre:"Deux droites perpendiculaires et leurs directeurs",
   vue:[-3.5,-3.5,3.5,3.5], w:360, h:330,
   objets:[
    {t:"droite", de:[0,0], a:[3,2], couleur:"bleu"},
    {t:"droite", de:[0,0], a:[-2,3], couleur:"vert"},
    {t:"vec", de:[0,0], a:[3,2], couleur:"bleu", nom:"u"},
    {t:"vec", de:[0,0], a:[-2,3], couleur:"vert", nom:"u'"},
    {t:"angle", en:[0,0], de:[3,2], a:[-2,3], droit:true}
   ],
   note:"$@v{u}(3 ; 2)$ et $@v{u'}(-2 ; 3)$ : produit scalaire $3×(-2) + 2×3 = 0$. Les droites se coupent à angle droit."},
  {t:"p", x:"Prends le temps de distinguer les deux calculs, parce qu'ils se ressemblent dangereusement — mêmes nombres, opérations différentes. Le **produit en croix** $x y' - y x'$ fait intervenir une soustraction et croise les indices. Le **produit scalaire** $x x' + y y'$ additionne et garde les indices alignés. Un signe et un croisement les séparent."},
  {t:"p", x:"Pourquoi le produit en croix détecte-t-il le parallélisme ? Deux vecteurs sont parallèles quand l'un est un multiple de l'autre : $(2 ; 3)$ et $(4 ; 6)$, par exemple, où tout a été doublé. Dans ce cas les deux « pentes » $@f{y}{x}$ et $@f{y'}{x'}$ sont égales, et en chassant les dénominateurs on obtient exactement $x y' - y x' = 0$. Le test n'est qu'une façon de comparer deux pentes sans risquer de diviser par zéro."},
  {t:"astuce", titre:"Retenir lequel est lequel", x:"Le produit **en croix** teste le parallélisme (les vecteurs pointent dans la même direction). Le produit **scalaire** teste la perpendicularité (il vaut zéro quand l'angle est droit).<br><br>Moyen mnémotechnique : perpendi<b>c</b>ulaire et s<b>c</b>alaire vont ensemble ; parallèle et produit en croix, qui « croise » comme deux rails qu'on compare."},
  {t:"piege", titre:"Parallèles ne veut pas dire confondues", x:"Le test des directeurs ne distingue pas deux droites parallèles distinctes d'une droite avec elle-même. Après avoir trouvé « parallèles », il reste une question : sont-elles **confondues** ? Réponse : oui si l'une des équations est un multiple exact de l'autre, constante comprise. $x - 2y + 3 = 0$ et $2x - 4y + 6 = 0$ sont la même droite ; $2x - 4y - 1 = 0$ en est une autre, parallèle."},
  {t:"exemple", titre:"Exemple guidé — position relative de deux droites", enonce:"Les droites $d : 2x - 3y + 1 = 0$ et $d' : 3x + 2y - 5 = 0$ sont-elles parallèles, perpendiculaires, ou ni l'un ni l'autre ?", etapes:[
   {q:"Vecteurs directeurs", r:"Pour $d$ : $@v{u}(3 ; 2)$. Pour $d'$ : $@v{u'}(-2 ; 3)$."},
   {q:"Test du parallélisme", r:"$3 × 3 - 2 × (-2) = 9 + 4 = 13 ≠ 0$. Elles ne sont pas parallèles : elles se coupent."},
   {q:"Test de la perpendicularité", r:"$3 × (-2) + 2 × 3 = -6 + 6 = 0$."},
   {q:"Conclure", r:"Le produit scalaire est nul : les droites sont **perpendiculaires**."},
   {q:"Contrôle rapide", r:"On pouvait aussi comparer les normales $(2 ; -3)$ et $(3 ; 2)$ : leur produit scalaire vaut $6 - 6 = 0$. Même conclusion."}
  ]},
  {t:"formule", titre:"Point d'intersection", x:"On résout le système formé par les deux équations.", note:"Si le système n'a pas de solution, les droites sont strictement parallèles. S'il en a une infinité, elles sont confondues."}
 ]},

 {titre:"Les cercles", blocs:[
  {t:"idee", x:"Un cercle, c'est **l'ensemble des points situés à une distance fixe d'un centre**. Toute son équation découle de cette seule phrase."},
  {t:"formule", titre:"Équation d'un cercle", x:"Centre $Ω(a ; b)$, rayon $R$ : $(x - a)^2 + (y - b)^2 = R^2$", note:"Cette équation dit simplement : « la distance de $M(x ; y)$ au centre vaut $R$ »."},
  {t:"fig", titre:"D'où vient l'équation du cercle",
   vue:[-0.5,-0.5,7,6], w:390, h:330,
   objets:[
    {t:"cercle", c:[3,2.5], r:2, couleur:"bleu"},
    {t:"seg", de:[3,2.5], a:[4.7,3.55], couleur:"rouge", epais:2.6},
    {t:"seg", de:[3,2.5], a:[4.7,2.5], couleur:"vert", pointille:true},
    {t:"seg", de:[4.7,2.5], a:[4.7,3.55], couleur:"ambre", pointille:true},
    {t:"angle", en:[4.7,2.5], de:[3,2.5], a:[4.7,3.55], droit:true},
    {t:"point", x:3, y:2.5, nom:"Ω", dessous:true},
    {t:"point", x:4.7, y:3.55, nom:"M"},
    {t:"texte", x:3.85, y:2.15, txt:"x − a", couleur:"vert"},
    {t:"texte", x:5.6, y:3.05, txt:"y − b", couleur:"ambre"},
    {t:"texte", x:3.5, y:3.35, txt:"R", couleur:"rouge", taille:15}
   ],
   note:"Le rayon est l'hypoténuse d'un triangle rectangle dont les côtés valent $x - a$ et $y - b$. Pythagore donne l'équation."},
  {t:"p", x:"Regarde la figure : c'est du **Pythagore déguisé**, rien de plus. Le point $M$ est sur le cercle. Pour aller du centre $Ω$ jusqu'à $M$, on se déplace horizontalement de $x - a$ (en vert), puis verticalement de $y - b$ (en orange). Ces deux déplacements et le rayon forment un triangle rectangle, dont l'angle droit est marqué."},
  {t:"p", x:"Pythagore dit alors : $(x-a)^2 + (y-b)^2 = R^2$. C'est exactement l'équation du cercle. Elle n'est donc pas à apprendre comme une formule tombée du ciel — elle se **retrouve** en trente secondes si on se souvient du triangle rectangle."},
  {t:"p", x:"Et pourquoi écrit-on $R^2$ à droite plutôt que $R$ ? Parce que le carré évite la racine carrée. La distance vaut $@r{(x-a)^2 + (y-b)^2}$ ; plutôt que de traîner ce radical, on élève les deux membres au carré une bonne fois pour toutes. C'est du confort de calcul, mais c'est la source d'une erreur classique : le nombre écrit à droite est le **carré** du rayon."},
  {t:"piege", titre:"Les deux signes à surveiller", x:"Le centre est ce qu'on **retranche** : $(x + 3)^2$ correspond à une abscisse de centre égale à $-3$. Et le membre de droite est $R^2$, pas $R$ : si l'équation finit par $= 16$, le rayon vaut 4."},
  {t:"exemple", titre:"Exemple guidé — cercle de diamètre donné", enonce:"Déterminer l'équation du cercle de diamètre $[AB]$ avec $A(1 ; 3)$ et $B(5 ; 1)$.", etapes:[
   {q:"Le centre est le milieu", r:"$Ω(@f{1+5}{2} ; @f{3+1}{2}) = (3 ; 2)$."},
   {q:"Le rayon est la moitié du diamètre", r:"$AB = @r{(5-1)^2 + (1-3)^2} = @r{16 + 4} = @r{20}$, donc $R = @f{@r{20}}{2}$."},
   {q:"Calculer $R^2$ directement", r:"Plus malin : $R^2 = (@f{@r{20}}{2})^2 = @f{20}{4} = 5$. On évite ainsi la racine."},
   {q:"Écrire l'équation", r:"$(x - 3)^2 + (y - 2)^2 = 5$."},
   {q:"Vérifier avec $A$", r:"$(1-3)^2 + (3-2)^2 = 4 + 1 = 5$ ✓. Le point $A$ est bien sur le cercle."}
  ]},
  {t:"astuce", titre:"Tester si un point est sur un cercle", x:"Remplace $x$ et $y$ par les coordonnées du point. Si tu obtiens exactement $R^2$, il est sur le cercle ; si tu obtiens moins, il est à l'intérieur ; si tu obtiens plus, il est à l'extérieur.<br><br>Là encore, l'équation joue le rôle de **filtre** : elle mesure le carré de la distance au centre, et il ne reste qu'à le comparer à $R^2$."}
 ]},

 {titre:"Récapitulatif : traduire, puis calculer", blocs:[
  {t:"idee", x:"Dans ce chapitre, la difficulté n'est jamais le calcul — c'est la **traduction**. Une fois l'énoncé transformé en équations et en vecteurs, tout devient mécanique."},
  {t:"tbl", head:["La question ressemble à…","Ce qu'il faut faire"], rows:[
   ["« Le point $A$ est-il sur la droite ? »","Remplacer $x$ et $y$ dans l'équation, comparer à 0"],
   ["« Équation de la droite $(AB)$ »","$@v{AB}$ → normal → $ax+by+c=0$ → placer avec un point"],
   ["« Droite passant par $A$, perpendiculaire à $d$ »","Le **directeur** de $d$ devient le **normal** de la nouvelle"],
   ["« Droite passant par $A$, parallèle à $d$ »","Mêmes coefficients $a$ et $b$, seul $c$ change"],
   ["« Ces droites sont-elles parallèles ? »","Produit en croix des directeurs : $xy' - yx'$"],
   ["« … perpendiculaires ? »","Produit scalaire des directeurs : $xx' + yy'$"],
   ["« Point d'intersection »","Résoudre le système des deux équations"],
   ["« Centre et rayon du cercle »","Lire $(x-a)^2+(y-b)^2=R^2$ : signes inversés, et $@r{}$ à droite"]
  ]},
  {t:"astuce", titre:"Les deux réflexes qui font gagner le plus", x:"**Fais un croquis, même approximatif.** Deux minutes de dessin à main levée révèlent immédiatement une réponse absurde : une droite du mauvais côté, un rayon trop grand, un point qui devrait être à l'intérieur.<br><br>**Vérifie toujours avec un point.** Une équation de droite se contrôle en y remplaçant un point connu : si tu ne trouves pas 0, l'erreur est en amont. Ce contrôle prend dix secondes et rattrape presque toutes les fautes de signe."},
  {t:"piege", titre:"Les trois pièges de ce chapitre", x:"**1. Le normal et le directeur inversés.** Le normal se recopie tel quel depuis l'équation ; le directeur demande d'échanger et de changer un signe.<br>**2. Le signe du centre.** $(x + 3)^2$ correspond à une abscisse de centre égale à $-3$, pas $+3$. On lit ce qu'on **retranche**.<br>**3. Le rayon confondu avec son carré.** Une équation qui finit par $= 25$ décrit un cercle de rayon 5."},
  {t:"p", x:"Un mot sur la façon de réviser ce chapitre. Il ne se retient pas en relisant : il se retient en **refaisant deux exercices complets** avec la figure tracée à côté. C'est en voyant la droite et son vecteur normal côte à côte que le lien entre l'équation et le dessin finit par devenir automatique."}
 ]}
],
exos:[
 {id:"gr1", niveau:1, type:"qcm", enonce:"Quel est un vecteur directeur de la droite d'équation $3x + 4y - 1 = 0$ ?",
  choix:["$@v{u}(-4 ; 3)$","$@v{u}(3 ; 4)$","$@v{u}(4 ; 3)$","$@v{u}(3 ; -4)$"], bonne:0,
  diag:["", "$(3 ; 4)$ est le vecteur **normal** : il se lit tel quel dans l'équation, mais il est perpendiculaire à la droite, pas parallèle.",
        "Tu as échangé les coefficients sans changer de signe. Il faut faire les deux : $(-b ; a)$, soit $(-4 ; 3)$.",
        "Tu as changé un signe sans échanger les coefficients. Vérifie : $3 × 3 + 4 × (-4) = 9 - 16 = -7 ≠ 0$, donc ce vecteur n'est pas orthogonal au normal."],
  corr:["**Ce qu'on cherche.** Un vecteur **directeur** : il indique la direction que suit la droite. À ne pas confondre avec le normal, qui lui est perpendiculaire.",
        "**Ce que l'équation donne directement.** Dans $ax + by + c = 0$, les coefficients de $x$ et $y$ forment le vecteur **normal** : ici $@v{n}(3 ; 4)$. C'est cadeau, mais ce n'est pas ce qu'on demande.",
        "**Passer du normal au directeur.** On échange les deux coordonnées, et on change le signe de l'une : $@v{u}(-b ; a) = (-4 ; 3)$.",
        "**Vérifier que c'est bien perpendiculaire au normal.** $@v{n} · @v{u} = 3 × (-4) + 4 × 3 = -12 + 12 = 0$ ✓. Un directeur est toujours orthogonal au normal : ce contrôle prend cinq secondes et confirme la manipulation.",
        "**Remarque.** $(4 ; -3)$, $(-8 ; 6)$ ou $(8 ; -6)$ auraient aussi été acceptés : tous ces vecteurs sont proportionnels et pointent dans la même direction."],
  indice:"Le normal se lit tel quel. Pour le directeur : échange les coefficients **et** change un signe."},

 {id:"gr2", niveau:1, type:"qcm", enonce:"Le point $A(2 ; -1)$ appartient-il à la droite $x + 3y + 1 = 0$ ?",
  choix:["Oui","Non, on obtient 6","Non, on obtient 4","On ne peut pas savoir"], bonne:0,
  diag:["", "Refais le calcul en respectant le signe de $y$ : $2 + 3 × (-1) + 1 = 2 - 3 + 1 = 0$. Le résultat est bien nul.",
        "Tu as sans doute oublié le signe moins de $y = -1$ : $3 × (-1)$ vaut $-3$, pas $+3$.",
        "Il suffit de remplacer $x$ et $y$ par les coordonnées du point : c'est un test immédiat."],
  corr:["Je remplace $x$ par 2 et $y$ par $-1$ dans l'équation.","$2 + 3 × (-1) + 1 = 2 - 3 + 1$.","$= 0$.","Le résultat est nul : le point appartient à la droite."],
  indice:"Remplace les coordonnées dans l'équation. Si tu tombes sur 0, le point est dessus."},

 {id:"gr3", niveau:2, type:"qcm", enonce:"Les droites $d : x - 2y + 3 = 0$ et $d' : 2x - 4y - 1 = 0$ sont :",
  choix:["strictement parallèles","perpendiculaires","confondues","sécantes en un seul point"], bonne:0,
  diag:["", "Teste le produit scalaire des directeurs : $@v{u}(2 ; 1)$ et $@v{u'}(4 ; 2)$ donnent $8 + 2 = 10 ≠ 0$. Elles ne sont pas perpendiculaires.",
        "Les coefficients de $d'$ sont bien le double de ceux de $d$… sauf la constante : $2 × 3 = 6 ≠ -1$. Les droites sont donc parallèles mais distinctes.",
        "Leurs directions sont identiques : $@v{u}(2 ; 1)$ et $@v{u'}(4 ; 2)$ sont colinéaires. Elles ne peuvent pas se couper."],
  corr:["**Première question : même direction ?** Je lis les vecteurs directeurs. Pour $d : x - 2y + 3 = 0$, le normal est $(1 ; -2)$, donc le directeur est $@v{u}(2 ; 1)$. Pour $d' : 2x - 4y - 1 = 0$, le normal est $(2 ; -4)$, donc le directeur est $@v{u'}(4 ; 2)$.",
        "**Test du parallélisme — produit en croix.** $2 × 2 - 1 × 4 = 4 - 4 = 0$. Nul, donc les deux directeurs sont colinéaires : les droites ont bien la même direction. (On le voyait déjà : $(4 ; 2)$ est le double de $(2 ; 1)$.)",
        "**Seconde question : parallèles ou confondues ?** Avoir la même direction ne suffit pas — deux droites confondues ont aussi la même direction. Il faut trancher.",
        "**Le test des multiples.** Si les deux équations décrivent la même droite, l'une doit être un multiple exact de l'autre, **constante comprise**. Je multiplie $d$ par 2 : $2x - 4y + 6 = 0$.",
        "**Comparaison.** Les termes en $x$ et $y$ coïncident bien avec $d'$, mais la constante vaut $+6$ d'un côté et $-1$ de l'autre. Elles ne sont donc pas confondues.",
        "**Conclusion.** Même direction, mais positions différentes : les droites sont **strictement parallèles**. Elles ne se coupent jamais."],
  indice:"Compare d'abord les directions, puis regarde si l'une des équations est un multiple exact de l'autre."},

 {id:"gr4", niveau:2, type:"num", enonce:"La droite $d$ passe par $A(0 ; 3)$ et $B(2 ; 7)$. Son équation réduite s'écrit $y = mx + p$. Que vaut $m$ ?",
  rep:2,
  diag:[{v:3, m:"3 est l'ordonnée à l'origine ($p$), lisible directement puisque $A$ a une abscisse nulle. On demande le coefficient directeur."},
        {v:0.5, m:"Tu as divisé à l'envers. Le coefficient directeur est $@f{y_B - y_A}{x_B - x_A}$ : l'écart des **ordonnées** au numérateur."},
        {v:4, m:"Tu t'es arrêté à l'écart des ordonnées ($7 - 3 = 4$). Il reste à diviser par l'écart des abscisses ($2 - 0 = 2$)."},
        {v:7, m:"Tu as recopié une coordonnée de $B$. Le coefficient directeur se calcule à partir des deux points."}],
  corr:["$m = @f{y_B - y_A}{x_B - x_A}$.","$= @f{7 - 3}{2 - 0} = @f{4}{2}$.","$m = 2$.","(Et comme $A$ a pour abscisse 0, on lit directement $p = 3$ : la droite est $y = 2x + 3$.)"],
  indice:"Le coefficient directeur mesure la montée divisée par l'avancée."},

 {id:"gr5", niveau:2, type:"qcm", enonce:"Quel est le rayon du cercle d'équation $(x + 1)^2 + (y - 4)^2 = 36$ ?",
  choix:["6","36","18","$@r{6}$"], bonne:0,
  diag:["", "36 est $R^2$, pas $R$. Le membre de droite est toujours le **carré** du rayon : il faut prendre la racine.",
        "Tu as divisé par 2. Le rayon s'obtient par une racine carrée, pas par une division.",
        "Tu as pris la racine une fois de trop. $R^2 = 36$ donne $R = @r{36} = 6$, un nombre entier."],
  corr:["Forme générale : $(x - a)^2 + (y - b)^2 = R^2$.","Ici $R^2 = 36$.","$R = @r{36} = 6$.","(Le centre est $(-1 ; 4)$, avec les signes inversés.)"],
  indice:"Le nombre à droite de l'égalité est le carré du rayon."},

 {id:"gr6", niveau:3, type:"num", enonce:"Le cercle de centre $Ω(2 ; -1)$ passe par le point $A(5 ; 3)$. Quel est son rayon ?",
  rep:5,
  diag:[{v:25, m:"Tu t'es arrêté à $R^2 = 25$. Il reste la racine carrée : $R = 5$."},
        {v:7, m:"Tu as additionné les écarts ($3 + 4$). Il faut appliquer Pythagore : $@r{3^2 + 4^2}$, pas une somme."},
        {v:12, m:"Tu as multiplié les écarts. La formule fait intervenir la somme des carrés, sous une racine."}],
  corr:["Le rayon est la distance $ΩA$.","$@v{ΩA}(5 - 2 ; 3 - (-1)) = (3 ; 4)$.","$ΩA = @r{3^2 + 4^2} = @r{9 + 16} = @r{25}$.","$R = 5$."],
  indice:"Le rayon est la distance entre le centre et un point du cercle. Attention au $-(-1)$."},

 {id:"gr7", niveau:3, type:"qcm", enonce:"Quelle droite est perpendiculaire à $d : 2x + y - 3 = 0$ et passe par l'origine ?",
  choix:["$x - 2y = 0$","$2x + y = 0$","$x + 2y = 0$","$2x - y = 0$"], bonne:0,
  diag:["", "Cette droite est **parallèle** à $d$ (mêmes coefficients devant $x$ et $y$), pas perpendiculaire.",
        "Vérifie avec les directeurs : $d$ a pour directeur $(-1 ; 2)$, et $x + 2y = 0$ a pour directeur $(-2 ; 1)$. Leur produit scalaire vaut $2 + 2 = 4 ≠ 0$.",
        "Directeur de cette droite : $(1 ; 2)$. Produit scalaire avec $(-1 ; 2)$ : $-1 + 4 = 3 ≠ 0$. Pas perpendiculaire."],
  corr:["**Traduire la contrainte de perpendicularité.** Il y a un raccourci qui évite tout calcul : si une droite doit être perpendiculaire à $d$, alors **le directeur de $d$ devient le normal de la nouvelle droite**. Les deux notions échangent leur rôle.",
        "**Lire les vecteurs de $d : 2x + y - 3 = 0$.** Son normal est $(2 ; 1)$, donc son directeur est $@v{u}(-1 ; 2)$.",
        "**Construire la nouvelle équation.** Ce directeur $(-1 ; 2)$ devient le normal cherché, ce qui donne la forme $-x + 2y + c = 0$. On peut multiplier toute l'équation par $-1$ pour rendre les signes plus agréables : $x - 2y - c = 0$, qu'on réécrit $x - 2y + c' = 0$.",
        "**Placer la droite avec le point donné.** Elle passe par l'origine $(0 ; 0)$ : $0 - 2×0 + c' = 0$, donc $c' = 0$.",
        "**Conclusion.** L'équation est $x - 2y = 0$.",
        "**Vérification.** Directeur de cette droite : normal $(1 ; -2)$ → directeur $(2 ; 1)$. Produit scalaire avec le directeur de $d$, $(-1 ; 2)$ : $2×(-1) + 1×2 = 0$ ✓. Et l'origine vérifie bien $0 - 0 = 0$ ✓."],
  indice:"Cherche la droite dont le vecteur directeur est orthogonal à celui de $d$, puis impose le passage par $(0 ; 0)$."},

 {id:"gr8", niveau:3, type:"qcm", enonce:"Le point $B(1 ; 1)$ et le cercle d'équation $(x - 2)^2 + (y - 3)^2 = 16$. Où se situe $B$ ?",
  choix:["À l'intérieur du cercle","Sur le cercle","À l'extérieur du cercle","Au centre du cercle"], bonne:0,
  diag:["", "En remplaçant, on obtient 5, alors que le cercle correspond à 16. Ce n'est pas égal, donc $B$ n'est pas dessus.",
        "On obtient 5, qui est **inférieur** à 16 : $B$ est plus près du centre que le rayon, donc à l'intérieur.",
        "Le centre est $(2 ; 3)$, pas $(1 ; 1)$. Au centre, le calcul donnerait 0."],
  corr:["Je remplace $x$ par 1 et $y$ par 1 : $(1 - 2)^2 + (1 - 3)^2$.","$= (-1)^2 + (-2)^2 = 1 + 4 = 5$.","Or le cercle correspond à $R^2 = 16$.","$5 < 16$ : le point est plus proche du centre que le rayon, il est donc à l'intérieur."],
  indice:"Remplace les coordonnées et compare le résultat à $R^2$ : plus petit, égal ou plus grand ?"}
]
},

/* ================== 10. ALGORITHMIQUE ET PYTHON ================== */
{
id:"algo", n:10, titre:"Algorithmique et Python",
sous:"Faire calculer la machine",
desc:"Variables, boucles, fonctions, recherche de seuil sur les suites et simulation en probabilités.",
duree:35,
sections:[
 {titre:"Ce que fait un programme", blocs:[
  {t:"idee", x:"Un programme, c'est une **recette exécutée dans l'ordre**, ligne après ligne. Rien de magique : la machine fait exactement ce qui est écrit, y compris les erreurs."},
  {t:"p", x:"En Première, Python sert d'outil : on l'utilise pour explorer des suites, chercher un seuil, ou simuler une expérience aléatoire des milliers de fois. Il n'y a pas d'examen de programmation, mais des questions de lecture et de complétion de code."},
  {t:"formule", titre:"Une variable, c'est une boîte étiquetée", code:true, x:"<b>u = 5</b> range la valeur 5 dans la boîte nommée <b>u</b><br><b>u = u + 3</b> lit le contenu (5), ajoute 3, et range 8 à la place", note:"Le signe = n'est pas une égalité mathématique : c'est un ordre de rangement."},
  {t:"piege", titre:"Le piège du signe égal", x:"En maths, $u = u + 3$ est une équation impossible. En Python, c'est parfaitement normal : cela veut dire « prends la valeur actuelle de u, ajoute 3, et remets le résultat dans u ». La ligne se lit **de droite à gauche**."},
  {t:"exemple", titre:"Exemple guidé — suivre l'exécution", enonce:"Que contient la variable $u$ à la fin de ce programme ?<br><b>u = 2</b><br><b>u = u * 3</b><br><b>u = u + 1</b>", etapes:[
   {q:"Ligne 1", r:"On range 2 dans $u$. Donc $u$ vaut 2."},
   {q:"Ligne 2", r:"On lit $u$ (soit 2), on multiplie par 3, on obtient 6, et on le range dans $u$. Donc $u$ vaut 6."},
   {q:"Ligne 3", r:"On lit $u$ (soit 6), on ajoute 1, on obtient 7, et on le range dans $u$."},
   {q:"Résultat", r:"À la fin, $u$ vaut 7. La méthode sûre : dessine un tableau avec une colonne par variable, et une ligne par instruction."}
  ]}
 ]},

 {titre:"Les boucles : répéter sans se répéter", blocs:[
  {t:"p", x:"Deux boucles suffisent pour tout le programme de Première. La première répète un nombre de fois **connu à l'avance**, la seconde répète **tant qu'une condition est vraie**."},
  {t:"formule", titre:"Boucle « pour » — nombre de tours connu", code:true, x:"<b>for i in range(5):</b><br>&nbsp;&nbsp;&nbsp;&nbsp;<b>u = u + 3</b>", note:"range(5) donne 0, 1, 2, 3, 4 : cinq tours, mais le compteur s'arrête à 4."},
  {t:"formule", titre:"Boucle « tant que » — condition d'arrêt", code:true, x:"<b>while u &lt; 100:</b><br>&nbsp;&nbsp;&nbsp;&nbsp;<b>u = u * 2</b><br>&nbsp;&nbsp;&nbsp;&nbsp;<b>n = n + 1</b>", note:"On répète tant que la condition est vraie. Elle doit finir par devenir fausse, sinon le programme tourne indéfiniment."},
  {t:"p", x:"Comment choisir entre les deux ? Une seule question suffit : **est-ce que je sais à l'avance combien de fois répéter ?**"},
  {t:"tbl", head:["La situation","La boucle à prendre"], rows:[
   ["« Calculer les 20 premiers termes »","<b>for</b> — le nombre de tours est connu"],
   ["« Calculer $u_{15}$ »","<b>for</b> — 15 tours, connus d'avance"],
   ["« À partir de quelle année dépasse-t-on 5000 ? »","<b>while</b> — on ignore quand ça s'arrête"],
   ["« Combien de fois faut-il doubler pour… »","<b>while</b> — c'est justement la question"],
   ["« Répéter la simulation 10 000 fois »","<b>for</b> — le nombre est donné"]
  ]},
  {t:"p", x:"La règle se déduit toujours de la même chose : si le nombre de répétitions **figure dans l'énoncé**, c'est <b>for</b> ; s'il est **ce qu'on cherche**, c'est <b>while</b>. Les exercices de seuil sont donc systématiquement des <b>while</b>."},
  {t:"fig", titre:"Ce que fait une boucle « tant que »",
   vue:[0,0,10.5,6.5], w:400, h:265, grille:false, axes:false, graduations:false,
   objets:[
    {t:"poly", pts:[[0.3,4.6],[2.9,4.6],[2.9,5.8],[0.3,5.8]], couleur:"line2"},
    {t:"poly", pts:[[3.8,3.2],[7.0,3.2],[7.0,4.4],[3.8,4.4]], couleur:"ambre", remplir:true},
    {t:"poly", pts:[[3.8,1.0],[7.0,1.0],[7.0,2.2],[3.8,2.2]], couleur:"bleu", remplir:true},
    {t:"poly", pts:[[8.2,3.2],[10.1,3.2],[10.1,4.4],[8.2,4.4]], couleur:"vert", remplir:true},
    {t:"seg", de:[1.6,4.6], a:[1.6,3.8], couleur:"ink3"},
    {t:"seg", de:[1.6,3.8], a:[3.8,3.8], couleur:"ink3"},
    {t:"seg", de:[5.4,3.2], a:[5.4,2.2], couleur:"ink3"},
    {t:"seg", de:[7.0,3.8], a:[8.2,3.8], couleur:"ink3"},
    {t:"seg", de:[7.0,1.6], a:[7.6,1.6], couleur:"ink3"},
    {t:"seg", de:[7.6,1.6], a:[7.6,3.55], couleur:"ink3"},
    {t:"seg", de:[7.6,3.55], a:[3.8,3.55], couleur:"ink3", pointille:true},
    {t:"texte", x:1.6, y:5.1, txt:"départ", couleur:"ink2", taille:14},
    {t:"texte", x:5.4, y:3.7, txt:"condition vraie ?", couleur:"ambre", taille:13},
    {t:"texte", x:5.4, y:1.5, txt:"faire un tour", couleur:"bleu", taille:13},
    {t:"texte", x:9.15, y:3.7, txt:"sortie", couleur:"vert", taille:14},
    {t:"texte", x:7.6, y:4.6, txt:"non", couleur:"ink3", taille:12},
    {t:"texte", x:5.95, y:2.6, txt:"oui", couleur:"ink3", taille:12}
   ],
   note:"On teste **avant** chaque tour, et on revient tester après. Dès que la condition devient fausse, on sort."},
  {t:"p", x:"Ce schéma explique ce qui déroute le plus : **à la sortie, la valeur a déjà dépassé le seuil**. La boucle teste, entre, fait son tour, revient tester — et le dernier tour effectué est justement celui qui fait franchir la limite. Quand la question est « à partir de quelle année dépasse-t-on 5000 € ? », c'est bien la valeur de $n$ à la sortie qu'il faut donner : c'est le premier moment où le dépassement a lieu."},
  {t:"piege", titre:"range(5) ne va pas jusqu'à 5", x:"<b>range(5)</b> produit 0, 1, 2, 3, 4 : cinq valeurs, mais la dernière est 4. Pour aller de 1 à 5 inclus, il faut écrire <b>range(1, 6)</b>. C'est la source d'erreur numéro un en lecture de code."},
  {t:"piege", titre:"L'indentation fait partie du code", x:"Les lignes décalées vers la droite sont **à l'intérieur** de la boucle : elles se répètent. Une ligne revenue à gauche s'exécute une seule fois, après la boucle. En Python, ce décalage n'est pas de la décoration."},
  {t:"exemple", titre:"Exemple guidé — une suite arithmétique en Python", enonce:"Que vaut $u$ après ce programme ?<br><b>u = 7</b><br><b>for i in range(4):</b><br>&nbsp;&nbsp;&nbsp;&nbsp;<b>u = u + 3</b>", etapes:[
   {q:"Combien de tours ?", r:"range(4) donne 0, 1, 2, 3 : la boucle tourne **4 fois**."},
   {q:"Que fait chaque tour ?", r:"Il ajoute 3 à $u$. C'est exactement une suite arithmétique de raison 3."},
   {q:"Dérouler", r:"7 → 10 → 13 → 16 → 19."},
   {q:"Résultat", r:"$u$ vaut 19. On le retrouve avec la formule du cours : $u_4 = 7 + 4 × 3 = 19$. ✓"}
  ]}
 ]},

 {titre:"Chercher un seuil", blocs:[
  {t:"idee", x:"C'est **l'exercice type** du programme : « à partir de quelle année la population dépasse-t-elle un million ? ». On ne connaît pas le nombre de tours à l'avance, donc on utilise une boucle « tant que »."},
  {t:"formule", titre:"Le squelette à connaître", code:true, x:"<b>u = 1000</b><br><b>n = 0</b><br><b>while u &lt; 5000:</b><br>&nbsp;&nbsp;&nbsp;&nbsp;<b>u = u * 1.1</b><br>&nbsp;&nbsp;&nbsp;&nbsp;<b>n = n + 1</b><br><b>print(n)</b>", note:"Deux variables : $u$ suit la valeur, $n$ compte les étapes. La réponse est dans $n$."},
  {t:"exemple", titre:"Exemple guidé — comprendre la sortie de boucle", enonce:"Un capital de 1000 € augmente de 10 % par an. Le programme ci-dessus affiche 17. Que signifie ce nombre ?", etapes:[
   {q:"Que compte $n$ ?", r:"Il augmente de 1 à chaque passage dans la boucle, donc il compte le nombre d'années écoulées."},
   {q:"Quand la boucle s'arrête-t-elle ?", r:"Dès que la condition $u < 5000$ devient fausse, c'est-à-dire dès que $u$ atteint ou dépasse 5000."},
   {q:"Interpréter", r:"Il faut 17 ans pour que le capital dépasse 5000 €."},
   {q:"Le point délicat", r:"À la sortie de la boucle, $u$ a **déjà dépassé** le seuil. La valeur affichée est la première année où le dépassement a lieu, pas la dernière année en dessous."}
  ]},
  {t:"piege", titre:"L'oubli du compteur", x:"Si tu oublies la ligne <b>n = n + 1</b> à l'intérieur de la boucle, le programme calcule bien mais n'a rien à afficher. Et si tu la places **en dehors** (non indentée), elle ne s'exécute qu'une fois : $n$ vaudra 1 quel que soit le résultat."},
  {t:"astuce", titre:"Vérifier un seuil sans ordinateur", x:"Fais tourner le programme à la main sur 2 ou 3 tours seulement, dans un tableau. Si les premières valeurs sont bonnes, la logique l'est aussi."}
 ]},

 {titre:"Fonctions et simulation", blocs:[
  {t:"p", x:"Une **fonction** en Python est un bloc de code réutilisable, à qui on donne des valeurs d'entrée et qui renvoie un résultat. C'est la même idée qu'une fonction mathématique."},
  {t:"formule", titre:"Définir et utiliser une fonction", code:true, x:"<b>def terme(u0, r, n):</b><br>&nbsp;&nbsp;&nbsp;&nbsp;<b>return u0 + n * r</b><br><br><b>terme(7, 3, 10)</b> renvoie <b>37</b>", note:"<b>def</b> définit, <b>return</b> renvoie la valeur. Sans return, la fonction ne rend rien."},
  {t:"piege", titre:"print n'est pas return", x:"<b>print</b> affiche une valeur à l'écran ; <b>return</b> la renvoie pour qu'on puisse la réutiliser dans un autre calcul. Une fonction qui fait seulement <b>print</b> ne peut pas être utilisée dans une expression."},
  {t:"formule", titre:"Simuler le hasard", code:true, x:"<b>from random import randint</b><br><b>randint(1, 6)</b> tire un entier au hasard entre 1 et 6 **inclus**", note:"Contrairement à range, randint inclut les deux bornes."},
  {t:"exemple", titre:"Exemple guidé — estimer une probabilité", enonce:"Que fait ce programme ?<br><b>s = 0</b><br><b>for i in range(10000):</b><br>&nbsp;&nbsp;&nbsp;&nbsp;<b>if randint(1, 6) == 6:</b><br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<b>s = s + 1</b><br><b>print(s / 10000)</b>", etapes:[
   {q:"Que fait la boucle ?", r:"Elle lance un dé 10 000 fois."},
   {q:"Que compte $s$ ?", r:"Le double signe <b>==</b> teste l'égalité. À chaque fois que le dé tombe sur 6, $s$ augmente de 1. Donc $s$ compte les 6 obtenus."},
   {q:"Que vaut l'affichage ?", r:"$s ÷ 10000$ est la **fréquence** d'apparition du 6."},
   {q:"Résultat attendu", r:"Environ 0,167, c'est-à-dire $@f{1}{6}$. Le programme estime la probabilité par l'expérience."},
   {q:"À retenir", r:"Une fréquence observée s'approche de la probabilité théorique quand le nombre d'essais est grand. C'est ce qui justifie les simulations."}
  ]},
  {t:"piege", titre:"Un seul égal ou deux ?", x:"<b>=</b> range une valeur dans une variable. <b>==</b> pose une question : « est-ce égal ? ». Dans un test <b>if</b>, il en faut toujours **deux**."}
 ]},

 {titre:"Récapitulatif : lire un programme sans l'exécuter", blocs:[
  {t:"idee", x:"En contrôle, on ne te demandera presque jamais d'écrire un programme entier. On te demandera de **prédire ce qu'il affiche**, ou de compléter une ligne manquante. C'est une compétence de lecture, pas d'écriture."},
  {t:"p", x:"Et pour lire un programme, il n'existe qu'une méthode fiable : **le tableau d'exécution**. On dessine une colonne par variable, une ligne par passage, et on remplit à la main. C'est lent, un peu bête, et c'est exactement pour ça que ça marche : on ne peut pas se tromper si on ne saute aucune étape."},
  {t:"tbl", head:["Tour","$u$","$n$","condition $u < 500$ ?"], rows:[
   ["départ","100","0","vraie → on entre"],
   ["1","200","1","vraie → on continue"],
   ["2","400","2","vraie → on continue"],
   ["3","800","3","**fausse** → on sort"]
  ]},
  {t:"p", x:"Voilà le tableau du programme de recherche de seuil vu plus haut. Trois colonnes, quatre lignes, et la réponse apparaît toute seule : à la sortie, $n$ vaut 3. Remarque bien la dernière ligne — **on effectue le tour, puis on teste**. C'est pour cela que $u$ finit à 800, au-delà du seuil : la boucle ne s'arrête pas au moment où la condition devient fausse, mais au test suivant."},
  {t:"tbl", head:["Ce qu'on te demande","Comment s'y prendre"], rows:[
